<title>Nail Finishing Programme</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f4fa;--card:#fff;--ink:#1f1b2e;--mute:#6f6a80;--line:#e6e3ef;--p:#6b4fd8;--p2:#efeafe;--ok:#1f9d6b;--bad:#d4583b}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
#app{height:100dvh;display:flex;flex-direction:column;padding:14px 16px}
header{display:flex;align-items:center;gap:12px;margin-bottom:10px}
header .t{font-weight:700;font-size:17px}
header .s{font-size:13px;color:var(--mute)}
header .sp{flex:1}
#save{font-size:12px;color:var(--mute)}
#menuBtn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font:600 13px Inter;color:var(--p)}
#bar{height:5px;background:var(--line);border-radius:4px;margin-bottom:12px;overflow:hidden}
#bar i{display:block;height:100%;background:var(--p);width:0;transition:width .3s}
main{flex:1;min-height:0;display:flex}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;flex:1;min-height:0;display:flex;flex-direction:column;overflow:auto}
.sec{font-size:12px;font-weight:600;color:var(--p);text-transform:uppercase;letter-spacing:.06em}
h1{font-size:22px;margin:4px 0 4px}
.lead{color:var(--mute);font-size:14px;margin-bottom:12px}
.cols{display:flex;gap:18px;flex:1;min-height:0}
.cols>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.q{display:flex;flex-direction:column;gap:5px}
.q label{font-size:13.5px;font-weight:500}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between}
.row label{flex:1}
textarea,input[type=text],input[type=number],input[type=date]{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:14px Inter;color:var(--ink);background:#fbfaff;resize:none}
textarea{height:46px}
input[type=number]{width:90px}
textarea:focus,input:focus{outline:2px solid var(--p2);border-color:var(--p)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font:500 13px Inter;color:var(--ink)}
.chip.on{background:var(--p);border-color:var(--p);color:#fff}
.tick{display:flex;align-items:center;gap:10px;font-size:14px;padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;text-align:left;font-family:Inter;color:var(--ink)}
.tick b{width:20px;height:20px;border-radius:6px;border:2px solid var(--p);display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:13px;flex:none}
.tick.on b{background:var(--p)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
td,th{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--mute);font-weight:600}
.photo{flex:1;min-height:160px;border:2px dashed #cfc7f3;border-radius:14px;background:var(--p2);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;color:var(--p);font-weight:600;font-size:14px;position:relative;overflow:hidden}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#page img{cursor:zoom-in}
.photo input{position:absolute;inset:0;opacity:0}
.photo .ch{position:absolute;bottom:8px;right:8px;background:#fff;color:var(--p);padding:4px 10px;border-radius:999px;font-size:12px;z-index:2;pointer-events:none}
.ref{display:flex;gap:10px;height:160px}
.ref img{height:100%;flex:1;min-width:0;object-fit:cover;border-radius:12px}
.fin{display:flex;gap:14px;flex:1;min-height:0}
.fin figure{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;margin:0}
.fin img{flex:1;min-height:0;width:100%;object-fit:contain;background:#faf9fd;border-radius:12px}
.fin figcaption{font-size:13.5px;font-weight:600;text-align:center}
.cmp{display:flex;gap:10px;height:250px;flex:none}
.cmp div{flex:1;border-radius:10px;background:var(--p2);overflow:hidden;position:relative;font-size:11px;color:var(--p);display:flex;align-items:flex-end;justify-content:center;padding:4px}
.cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#f3f1f8}
.cmp span{position:relative;background:#fff;border-radius:6px;padding:3px 8px;font-size:12px;font-weight:600}
.bsb{font-size:11px;font-weight:600;color:#fff;background:var(--ink);border-radius:6px;padding:2px 6px;margin-left:6px}
.sig{border:1px solid var(--line);border-radius:12px;background:#fbfaff;height:110px;width:100%;touch-action:none}
.steps li{font-size:14px;margin:0 0 6px 18px}
.note{font-size:13px;color:var(--mute)}
footer{display:flex;gap:10px;margin-top:12px}
footer button{flex:1;border:0;border-radius:12px;padding:14px;font:600 15px Inter}
#back{background:#fff;border:1px solid var(--line);color:var(--ink)}
#next{background:var(--p);color:#fff}
#menu{position:fixed;inset:0;background:rgba(31,27,46,.35);display:none;align-items:center;justify-content:center;padding:20px;z-index:9}
#menu .box{background:#fff;border-radius:16px;padding:18px;max-width:760px;width:100%;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
#menu button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px;font:500 13px Inter;text-align:left;color:var(--ink)}
#menu button.cur{border-color:var(--p);color:var(--p)}

.of{background:#FAFAF8;color:#4A443C;font-family:Inter,sans-serif;font-weight:300}
.of h1,.of h2,.of h3{font-family:"Cormorant Garamond",Georgia,serif;font-weight:400;color:#4A443C;margin:0}
.of h1{font-size:34px}.of h2{font-size:30px;margin:2px 0 8px}.of h3{font-size:21px}
.of .eb{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#8A6D4A}
.of .mk{font-family:"Cormorant Garamond",serif;letter-spacing:.32em;text-transform:uppercase;color:#A88862}
.of em{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:1.15em;color:#8A6D4A}
.of .mu{color:#7A6F61}
.of .pc{background:#F8F5F0;border:1px solid rgba(168,136,98,.18);border-radius:6px;padding:16px 18px;display:grid;gap:8px}
.of .ch2{border:1px solid rgba(168,136,98,.25);background:#FDFCFA;border-radius:999px;padding:6px 14px;font-size:13px}
.of ul.sd{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.of ul.sd li{display:flex;gap:10px;align-items:baseline;font-size:14.5px}
.of ul.sd li::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:#A88862;transform:translateY(-2px)}
.of table td,.of table th{border-bottom:1px solid rgba(168,136,98,.18)}
.info{display:flex;align-items:center;gap:10px;font-size:14px;padding:7px 10px;border-radius:10px;background:#f7f6fb;color:var(--ink)}
.info b{width:18px;height:18px;border-radius:50%;background:var(--p2);color:var(--p);display:inline-flex;align-items:center;justify-content:center;font-size:16px;flex:none;line-height:1}
.okbar{margin-top:auto;padding-top:12px;display:flex;justify-content:flex-end}
.okbar .tick{border:2px dashed var(--p);background:#fff;font-weight:600;padding:10px 14px}
.okbar .tick.on{border-style:solid;background:#e5f4e4;border-color:#1f9d6b;color:#1f6b4a}
.okbar .tick.on b{background:#1f9d6b;border-color:#1f9d6b}
.chap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;border-radius:14px;margin:-6px}
.lock{opacity:.85}
.pg{flex:1;min-height:0;display:flex;flex-direction:column}
.cmp div::after{content:'\1F50D Tap';position:absolute;top:6px;right:6px;background:rgba(255,255,255,.92);color:var(--p);border-radius:999px;padding:3px 8px;font:600 11px Inter}
.zm{position:absolute;right:6px;bottom:6px;background:rgba(255,255,255,.92);color:var(--p);border-radius:999px;padding:3px 8px;font:600 11px Inter;pointer-events:none;z-index:2}
.tap{font-size:12px;color:var(--mute);margin:4px 0 0}
.pg :disabled{opacity:.8;cursor:default}
.pg .chip.on:disabled{opacity:1}
@media (max-width:820px) and (orientation:portrait){.cols{flex-direction:column}}
</style>
</head>
<body>
<div id="app">
  <header><div><div class="t">Nail Finishing Programme</div><div class="s">BSB Academy · <span id="nmh">Kiana</span> · Level 1: Essential Manicure · Trainer: Anukis</div></div><div class="sp"></div><div id="save"></div><button id="menuBtn">Pages</button></header>

</div>

<div id="lb" style="position:fixed;inset:0;background:rgba(20,16,30,.94);display:none;align-items:center;justify-content:center;z-index:20;padding:20px;overflow:hidden;touch-action:none"><img id="lbimg" draggable="false" style="max-width:100%;max-height:100%;border-radius:12px;object-fit:contain;transform-origin:center center;user-select:none;-webkit-user-select:none;touch-action:none"><button id="lbx" style="position:absolute;top:16px;right:16px;border:0;border-radius:999px;background:#fff;padding:10px 16px;font:600 15px Inter">Close</button><div style="position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center"><button id="zout" style="border:0;border-radius:999px;background:#fff;width:52px;height:52px;font:700 26px Inter">−</button><span id="zlev" style="color:#fff;font:600 15px Inter;min-width:56px;text-align:center">100%</span><button id="zin" style="border:0;border-radius:999px;background:#fff;width:52px;height:52px;font:700 26px Inter">+</button><button id="zreset" style="border:0;border-radius:999px;background:rgba(255,255,255,.18);color:#fff;padding:0 16px;height:52px;font:600 14px Inter">Fit</button></div></div>
<script>
const SB='https://qwumncqcyurojhuyazuj.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF3dW1uY3FjeXVyb2podXlhenVqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwODExNDksImV4cCI6MjA5MzY1NzE0OX0.6R1KWpPvXD_aaM2EFEV7saJNLb4xR8sR5J3QBpEwBs0';
const QS0=new URLSearchParams(location.search);const RID=QS0.get('r');let OFR=null;const OT=(k,d)=>esc((OFR&&OFR.offer_text&&OFR.offer_text[k])||d);const fmtStart=d=>{try{return new Date(d+'T12:00:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})}catch(e){return d}};const TR=(QS0.get('t')||'kiana').toLowerCase();const NM=QS0.get('n')||(TR.charAt(0).toUpperCase()+TR.slice(1));const FULL=QS0.get('full')||(TR==='kiana'?'Kiana Violet Palmer Cameron':NM);
const H={apikey:KEY,Authorization:'Bearer '+KEY};

 {n:4,d:'Tue 20 Oct',sub:'2 models',p:['Michelle · 12:35','Maguyr Puerta · 15:30'],tl:[['p','10:00','12:00','Practice'],['b','12:00','12:30','Lunch'],['m','12:35','14:00','Model: Michelle'],['p','14:00','15:30','Practice'],['m','15:30','17:00','Model: Maguyr Puerta']]},
 {n:5,d:'Wed 21 Oct',sub:'4 models',p:['Hannah Bryant · 11:00','Nerina · 12:20','Tash · 15:00','Kritika · 17:20'],tl:[['m','11:00','12:20','Model: Hannah Bryant'],['m','12:20','13:20','Model: Nerina'],['b','13:30','14:00','Lunch'],['p','14:00','15:00','Practice'],['m','15:00','16:00','Model: Tash'],['p','16:00','17:20','Practice'],['m','17:20','18:20','Model: Kritika']]},
 {n:6,d:'Thu 22 Oct',sub:'4 models',p:['Kate · 12:00','Mel · 15:00','Josy · 16:30','Léonie · 17:30'],tl:[['m','12:00','13:00','Model: Kate'],['b','13:00','13:30','Lunch'],['p','13:30','15:00','Practice'],['m','15:00','16:00','Model: Mel'],['p','16:00','16:30','Practice'],['m','16:30','17:30','Model: Josy'],['m','17:30','18:30','Model: Léonie']]}
];
const mins=t=>{const[a,b]=t.split(':');return +a*60+ +b};
const fmtH=m=>`${Math.floor(m/60)}h${String(m%60).padStart(2,'0')}`;
const spanT=D=>mins(D.tl[D.tl.length-1][2])-mins(D.tl[0][1]);
const sumT=(D,t)=>D.tl.filter(x=>x[0]===t).reduce((s,x)=>s+mins(x[2])-mins(x[1]),0);
const TLC={p:['var(--p2)','var(--p)'],m:['#e5f4e4','#1f9d6b'],b:['#f0efec','#6f6a80']};
const timeline=D=>`<div style="display:flex;flex-direction:column;gap:6px">${D.tl.map(x=>`<div style="display:flex;gap:10px;align-items:center;background:${TLC[x[0]][0]};border-left:4px solid ${TLC[x[0]][1]};border-radius:8px;padding:7px 10px"><b style="font-size:13px;min-width:96px">${x[1]} to ${x[2]}</b><span style="flex:1;font-size:14px">${x[3]}</span><span class="note">${fmtH(mins(x[2])-mins(x[1]))}</span></div>`).join('')}</div><div style="display:flex;gap:18px;margin-top:10px">${[['Time in the salon',fmtH(spanT(D))],['Practice time',fmtH(sumT(D,'p'))],['Models',D.p.filter(x=>!/hand/.test(x)).length]].map(x=>`<div><div class="note">${x[0]}</div><div style="font-weight:700;font-size:18px">${x[1]}</div></div>`).join('')}</div>`;
const TAUGHT=['Cut and file','Push back the cuticle and buffing','Contour finish around the cuticle','Prep: clean nail, no residue','Thin base, clean contour, not touching the cuticle','Thin colour coats, no marks, clean contour','Cap the edge','Cure, oil and photo'];
const STEPS=[
 ['1 · Cut and file','Cut and file every nail into the same shape'],
 ['2 · Push back','Push back the cuticle gently. We never cut the cuticle'],
 ['3 · Buffing','Buff the nail around the cuticle'],
 ['4 · Contour finish','Finish the contour around the cuticle, clean on every nail'],
 ['5 · Prep','Prepare the nail very well, with no residue, so the colour holds'],
 ['6 · Base','A thin base, with one perfect contour line, never touching the cuticle'],
 ['7 · Colour','Thin coats, no marks in the gel, a perfect contour'],
 ['8 · Cap','Finish the edge of the nail'],
 ['9 · Cure and oil','Cure each layer, then oil'],
 ['10 · Photo','Take a photo of the finished nails']
];
const HRS={1:5,2:5,3:6,4:4,5:5,6:5};

const SLOTS=()=>{const o=[];DAYS.forEach(D=>{D.p.forEach(pp=>o.push([`d${D.n}_${slug(pp)}`,`L${D.n} · ${D.d.slice(4)} · ${pp}`]));o.push(['day_d'+D.n,`L${D.n} · ${D.d.slice(4)} · lesson photos`])});return o};
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-');

/* ---------- field helpers ---------- */
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const txt=(k,l)=>`<div class="q"><label>${l}</label><textarea data-k="${k}">${esc(A[k])}</textarea></div>`;
const num=(k,l,u='minutes')=>`<div class="row"><label style="font-size:13.5px;font-weight:500">${l}</label><input type="number" inputmode="numeric" data-k="${k}" value="${esc(A[k])}"><span class="note">${u}</span></div>`;
const chips=(k,l,opts)=>`<div class="q"><label>${l}</label><div class="chips" data-chips="${k}">${opts.map(o=>`<button class="chip${A[k]===o?' on':''}" data-v="${esc(o)}">${o}</button>`).join('')}</div></div>`;
const chipRow=(k,l,opts)=>`<div class="row"><label style="font-size:13.5px">${l}</label><div class="chips" data-chips="${k}">${opts.map(o=>`<button class="chip${A[k]===o?' on':''}" data-v="${esc(o)}">${o}</button>`).join('')}</div></div>`;
const tick=(k,l)=>`<button class="tick${A[k]?' on':''}" data-tick="${k}"><b>${A[k]?'✓':''}</b>${l}</button>`;
const gal=k=>[...(A['photo_'+k]?[A['photo_'+k]]:[]),...(A['g_'+k]||[])];
const photo=(k,l)=>{const g=gal(k);return `<div class="photo" style="${g.length?'display:grid;grid-template-columns:repeat(2,1fr);gap:6px;padding:6px;align-items:stretch;justify-items:stretch':''}">${g.length?g.slice(0,4).map((u,i)=>`<div style="position:relative;border-radius:10px;overflow:hidden;background:#fff"><img src="${u}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover"></div>`).join('')+`<label style="position:relative;display:flex;align-items:center;justify-content:center;border:2px dashed #cfc7f3;border-radius:10px;min-height:80px">+ Add<input type="file" accept="image/*" multiple data-photo="${k}" style="position:absolute;inset:0;opacity:0"></label>`:`<span style="font-size:28px">+</span><span>Add photos</span><span class="note">${l}</span><input type="file" accept="image/*" multiple data-photo="${k}">`}</div>`};

const head=(sec,t,lead)=>`<div class="sec">${sec}</div><h1>${t}</h1>${lead?`<div class="lead">${lead}</div>`:''}`;

/* ---------- pages ---------- */
const P=[];
P.push({m:'Chapter 0 · Our message',c:'of',r:()=>`<div class="chap" style="background:#F8F5F0"><div class="eb">Chapter 0</div><h1>Our message to you</h1><p class="mu">After your trial, this is what we sent you.</p></div>`});

function fit(){const c=$('#page'),g=c.querySelector('.pg');if(!g||c.querySelector('canvas'))return;let z=1.6;for(;z>1;z=Math.round((z-0.05)*100)/100){g.style.zoom=z;const ov=[g,...g.querySelectorAll('.cols,.cols>div')].some(e=>e.scrollHeight>e.clientHeight+1||e.scrollWidth>e.clientWidth+1);if(!ov&&c.scrollHeight<=c.clientHeight+1)break}if(z<=1)g.style.zoom=1}

function setSave(t){$('#save').textContent=t}
function queue(){setSave('Saving…');clearTimeout(timer);timer=setTimeout(save,700)}
async function save(){
 try{const r=await fetch(`${SB}/rest/v1/bsb_training_journal?on_conflict=trainee`,{method:'POST',headers:{...H,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates'},body:JSON.stringify({trainee:TR,answers:A,updated_at:new Date().toISOString()})});
 setSave(r.ok?'Saved':'Not saved, check internet')}catch(e){setSave('Not saved, check internet')}
}
function bind(){
 document.querySelectorAll('[data-k]').forEach(el=>el.addEventListener('input',()=>{A[el.dataset.k]=el.value;queue()}));
 document.querySelectorAll('[data-chips]').forEach(g=>g.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{const k=g.dataset.chips;if(ONCE.includes(k)&&A[k])return;A[k]=A[k]===b.dataset.v?'':b.dataset.v;g.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',A[k]===x.dataset.v));queue()}));
 document.querySelectorAll('[data-tick]').forEach(b=>b.onclick=()=>{const k=b.dataset.tick;if(k.startsWith('ok_')&&A[k])return;A[k]=!A[k];if(k.startsWith('ok_')){const keys=[...new Set([...(P[cur].req||[]),...[...document.querySelectorAll('#page [data-k],#page [data-chips]')].map(e=>e.dataset.k||e.dataset.chips)])];const miss=keys.filter(x=>!String(A[x]??'').trim());document.querySelectorAll('#page [data-k],#page [data-chips]').forEach(e=>{e.style.outline='';});if(A[k]&&miss.length){A[k]=false;setSave(miss.length===1?'1 answer missing. Please answer every question':miss.length+' answers missing. Please answer every question');miss.forEach(x=>{const e=document.querySelector(`[data-k="${x}"],[data-chips="${x}"]`);if(e){e.style.outline='2px solid #d4583b';e.style.borderRadius='10px'}});return}A[k+'_at']=A[k]?new Date().toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'';queue();render();return}b.classList.toggle('on',A[k]);b.querySelector('b').textContent=A[k]?'✓':'';queue()});
 document.querySelectorAll('[data-photo]').forEach(inp=>inp.onchange=async()=>{const k=inp.dataset.photo;const fs=[...inp.files];if(!fs.length)return;try{for(let i=0;i<fs.length;i++){setSave(`Uploading photo ${i+1} of ${fs.length}…`);await addPhoto(k,fs[i])}await save();render()}catch(e){setSave('Photo not saved, try again')}});
 document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=e=>{e.preventDefault();e.stopPropagation();const k=b.dataset.rm,i=+b.dataset.i;const g=gal(k);g.splice(i,1);A['photo_'+k]='';A['g_'+k]=g;queue();render()});
 const bulk=document.querySelector('#bulk');if(bulk)bulk.onchange=()=>bulkAdd([...bulk.files]);
 document.querySelectorAll('select[data-mv]').forEach(sel=>sel.onchange=()=>{const u=sel.dataset.mv,fr=sel.dataset.from;A['g_'+fr]=(A['g_'+fr]||[]).filter(x=>x!==u);if(sel.value!=='__rm')A['g_'+sel.value]=[...(A['g_'+sel.value]||[]),u];queue();render()});
 document.querySelectorAll('canvas[data-sig]').forEach(drawable);
 document.querySelectorAll('[data-sigsave]').forEach(b=>b.onclick=async()=>{const k=b.dataset.sigsave;const c=document.querySelector(`canvas[data-sig="${k}"]`);if(!c.dataset.drawn){setSave('Please sign first');return}setSave('Saving…');const blob=await new Promise(r=>c.toBlob(r,'image/png'));A[k]=await upload(blob,k+'-'+Date.now()+'.png','image/png');A[k+'_date']=new Date().toLocaleDateString('en-GB');await save();render()});
 document.querySelectorAll('[data-clear]').forEach(b=>b.onclick=()=>{A[b.dataset.clear]='';queue();render()});
}
function drawable(c){const x=c.getContext('2d');let d=false;
 const fitc=()=>{const r=c.getBoundingClientRect();const w=Math.round(r.width*2),h=Math.round(r.height*2);if(w&&(c.width!==w||c.height!==h)){c.width=w;c.height=h}x.setTransform(2,0,0,2,0,0);x.lineWidth=2.4;x.lineCap='round';x.lineJoin='round';x.strokeStyle='#1f1b2e'};
 requestAnimationFrame(fitc);
 const pos=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*(c.width/2)/r.width,(e.clientY-r.top)*(c.height/2)/r.height]};
 c.addEventListener('pointerdown',e=>{e.preventDefault();if(!c.dataset.drawn&&c.width!==Math.round(c.getBoundingClientRect().width*2))fitc();try{c.setPointerCapture(e.pointerId)}catch(_){}d=true;x.beginPath();x.moveTo(...pos(e));x.lineTo(...pos(e));x.stroke();c.dataset.drawn=1});
 c.addEventListener('pointermove',e=>{if(!d)return;e.preventDefault();x.lineTo(...pos(e));x.stroke()});
 const up=()=>{d=false};c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up);
 c.addEventListener('touchstart',e=>e.preventDefault(),{passive:false});c.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
}
async function shrink(f){const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(f)});const m=2400,s=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=img.width*s;c.height=img.height*s;c.getContext('2d').drawImage(img,0,0,c.width,c.height);return new Promise(r=>c.toBlob(r,'image/jpeg',.9))}
async function upload(blob,name,type){const path=`${TR}/${name}`;const r=await fetch(`${SB}/storage/v1/object/bsb-training/${path}`,{method:'POST',headers:{...H,'Content-Type':type,'x-upsert':'true'},body:blob});if(!r.ok)throw new Error('upload');return `${SB}/storage/v1/object/public/bsb-training/${path}`}

async function addPhoto(k,f){const blob=await shrink(f);const url=await upload(blob,k+'-'+Date.now()+'-'+Math.random().toString(36).slice(2,6)+'.jpg','image/jpeg');A['g_'+k]=[...(A['g_'+k]||[]),url];return url}
async function exifDate(f){try{const b=new DataView(await f.slice(0,131072).arrayBuffer());if(b.getUint16(0)!==0xFFD8)return null;let o=2;while(o<b.byteLength-4){const m=b.getUint16(o),len=b.getUint16(o+2);if(m===0xFFE1&&b.getUint32(o+4)===0x45786966){const t=o+10,le=b.getUint16(t)===0x4949;const u16=x=>b.getUint16(x,le),u32=x=>b.getUint32(x,le);const ifd=(off)=>{const n=u16(t+off),r={};for(let i=0;i<n;i++){const e=t+off+2+i*12;r[u16(e)]={c:u32(e+4),v:u32(e+8)}}return r};const i0=ifd(u32(t+4));const ex=i0[0x8769]?ifd(i0[0x8769].v):{};const d=ex[0x9003]||i0[0x132];if(!d)return null;let str='';for(let i=0;i<19;i++)str+=String.fromCharCode(b.getUint8(t+d.v+i));const q=str.match(/(\d{4}):(\d\d):(\d\d) (\d\d):(\d\d)/);return q?{date:`${q[1]}-${q[2]}-${q[3]}`,min:+q[4]*60+ +q[5]}:null}o+=2+len}}catch(e){}return null}
const ISO={'Tue 13 Oct':'2026-10-13','Wed 14 Oct':'2026-10-14','Thu 15 Oct':'2026-10-15','Tue 20 Oct':'2026-10-20','Wed 21 Oct':'2026-10-21','Thu 22 Oct':'2026-10-22'};
function slotFor(dt){const D=DAYS.find(x=>ISO[x.d]===dt.date);if(!D)return null;const dk='d'+D.n;let best=null;D.p.forEach(pp=>{const m=pp.match(/(\d\d):(\d\d)/);if(m){const st=+m[1]*60+ +m[2];if(st<=dt.min+10&&(!best||st>best.st))best={st,k:`${dk}_${slug(pp)}`,name:pp.split(' · ')[0]}}});return best?{k:best.k,label:`Lesson ${D.n} · ${best.name}`}:{k:'day_'+dk,label:`Lesson ${D.n} · lesson photos`}}
async function bulkAdd(fs){for(let i=0;i<fs.length;i++){const f=fs[i];const dt=await exifDate(f);const s=dt?slotFor(dt):null;setSave(`Uploading photo ${i+1} of ${fs.length}…`);try{await addPhoto(s?s.k:'unsorted',f)}catch(e){setSave('Photo not saved, try again')}}await save();render()}
const ONCE=['nd_more'];
function lock(){const p=P[cur];const g=$('#page .pg');if(!g)return;g.querySelectorAll('[data-chips]').forEach(c=>{if(ONCE.includes(c.dataset.chips)&&A[c.dataset.chips])c.querySelectorAll('.chip').forEach(b=>b.disabled=true)});if(!A['ok_'+slug(p.m)])return;g.querySelectorAll('textarea,input,.chip,[data-tick],[data-sigsave],[data-clear]').forEach(e=>{if(!(e.dataset.tick||'').startsWith('ok_'))e.disabled=true});g.querySelectorAll('canvas').forEach(c=>c.style.pointerEvents='none')}
const vis=i=>!P[i].show||P[i].show();
const step=d=>{let i=cur+d;while(i>=0&&i<P.length&&!vis(i))i+=d;return i};
const ADM=new URLSearchParams(location.search).has('ligia');
const okd=i=>ADM||i===0||!!A['ok_'+slug(P[i].m)];
const firstOpen=()=>{for(let i=0;i<P.length;i++)if(vis(i)&&!okd(i))return i;return P.length};
$('#next').onclick=()=>{if(!okd(cur)){setSave('Please tap the box at the bottom first');const b=document.querySelector('.okbar .tick');if(b){b.style.borderColor='#d4583b';b.style.background='#fbe6e1'}return}const i=step(1);if(i<P.length){cur=i;render()}};
$('#back').onclick=()=>{const i=step(-1);if(i>=0){cur=i;render()}};
$('#menuBtn').onclick=()=>{$('#menuBox').innerHTML=P.map((p,i)=>!vis(i)?'':`<button class="${i===cur?'cur':''}" data-go="${i}" ${i>firstOpen()?'disabled style="opacity:.45"':''}>${i>firstOpen()?'\u{1F512} ':''}${i+1} · ${p.m}</button>`).join('');$('#menu').style.display='flex';document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{cur=+b.dataset.go;$('#menu').style.display='none';render()})};
$('#menu').onclick=e=>{if(e.target.id==='menu')$('#menu').style.display='none'};
/* photo zoom: pinch, double tap, + / -, drag to move */
const Z={s:1,x:0,y:0,pts:new Map(),d0:0,s0:1,lx:0,ly:0,tap:0};
const zApply=()=>{$('#lbimg').style.transform=`translate(${Z.x}px,${Z.y}px) scale(${Z.s})`;$('#zlev').textContent=Math.round(Z.s*100)+'%'};
const zSet=s=>{Z.s=Math.min(6,Math.max(1,s));if(Z.s===1){Z.x=0;Z.y=0}zApply()};
const lbClose=()=>{$('#lb').style.display='none';Z.pts.clear()};
$('#page').addEventListener('click',e=>{const im=e.target.closest('img');if(!im||im.closest('.sig'))return;e.preventDefault();$('#lbimg').src=im.src;Z.s=1;Z.x=0;Z.y=0;zApply();$('#lb').style.display='flex'});
$('#lbx').onclick=e=>{e.stopPropagation();lbClose()};
$('#zin').onclick=e=>{e.stopPropagation();zSet(Z.s*1.5)};
$('#zout').onclick=e=>{e.stopPropagation();zSet(Z.s/1.5)};
$('#zreset').onclick=e=>{e.stopPropagation();zSet(1)};
$('#lb').onclick=e=>{if(e.target.id==='lb'&&Z.s===1)lbClose()};
$('#lb').addEventListener('wheel',e=>{e.preventDefault();zSet(Z.s*(e.deltaY<0?1.15:1/1.15))},{passive:false});
const im$=$('#lbimg');
im$.addEventListener('pointerdown',e=>{e.preventDefault();im$.setPointerCapture(e.pointerId);Z.pts.set(e.pointerId,[e.clientX,e.clientY]);
 if(Z.pts.size===2){const[a,b]=[...Z.pts.values()];Z.d0=Math.hypot(a[0]-b[0],a[1]-b[1]);Z.s0=Z.s}
 else{Z.lx=e.clientX;Z.ly=e.clientY;const now=Date.now();if(now-Z.tap<300){zSet(Z.s>1?1:2.5)}Z.tap=now}});
im$.addEventListener('pointermove',e=>{if(!Z.pts.has(e.pointerId))return;Z.pts.set(e.pointerId,[e.clientX,e.clientY]);
 if(Z.pts.size===2){const[a,b]=[...Z.pts.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(Z.d0)zSet(Z.s0*d/Z.d0)}
 else if(Z.s>1){Z.x+=e.clientX-Z.lx;Z.y+=e.clientY-Z.ly;Z.lx=e.clientX;Z.ly=e.clientY;zApply()}});
const zUp=e=>{Z.pts.delete(e.pointerId);if(Z.pts.size<2)Z.d0=0;if(Z.pts.size===1){const[p]=[...Z.pts.values()];Z.lx=p[0];Z.ly=p[1]}};
im$.addEventListener('pointerup',zUp);im$.addEventListener('pointercancel',zUp);

(async()=>{setSave('Loading…');try{if(RID){try{const o=await fetch(`${SB}/rest/v1/bsb_route_people?id=eq.${encodeURIComponent(RID)}&select=offer_role,offer_start,offer_pay,offer_text,offer_reply,offer_reply_note,offer_reply_at`,{headers:H});OFR=(await o.json())[0]||null}catch(e){}}const r=await fetch(`${SB}/rest/v1/bsb_training_journal?trainee=eq.${encodeURIComponent(TR)}&select=answers`,{headers:H});const j=await r.json();A=(j[0]&&j[0].answers)||{};setSave('')}catch(e){setSave('Offline')}cur=ADM?0:Math.min(firstOpen(),P.length-1);render()})();
