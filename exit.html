P.push(function(){return pg('white','<div class="k mut">1 · Where it all began</div><h2>12 August 2022</h2><p>You arrived at BSB knowing how to do a basic manicure.</p><p><b>Look at you now.</b></p><p class="mut">Step by step, treatment after treatment, you learnt new things, practised and became more confident in your work.</p><div class="card" style="margin-top:auto"><div class="big">1,169</div><p><b>Brazilian Soul Manicures</b></p><p class="mut">That’s 1,169 times you’ve had the opportunity to make someone feel cared for.</p></div><p class="em">I hope you can see how far you’ve come. Because I can.</p>')});

P.push(function(){return pg('cream','<div class="k mut">7 · In their words</div><blockquote>“She had a calm and kind aura and made me feel very comfortable.”<cite>Client review · August 2025</cite></blockquote><blockquote>“From start to finish, the experience felt genuinely personal, calm, and thoughtfully done.”<cite>Client review · January 2026</cite></blockquote><blockquote>“So knowledgeable… I wasn’t made to feel like I was a bother.”<cite>Client review · August 2025</cite></blockquote>')});
