<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Your BSB story</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:Inter,sans-serif;color:#1E1A2B;background:#F6F3FC}
#app{height:100dvh;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 16px) 18px calc(env(safe-area-inset-bottom) + 16px);max-width:820px;margin:0 auto;gap:14px}
.dots{display:flex;gap:4px}.dots i{flex:1;height:4px;border-radius:4px;background:#E2DCF1}.dots i.on{background:#5B3BE0}
.pg{flex:1;min-height:0;border-radius:30px;padding:clamp(24px,5vw,48px);display:flex;flex-direction:column;gap:16px;overflow:hidden;animation:in .5s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.hero{background:linear-gradient(135deg,#FF9F6E 0%,#E2557A 45%,#7A3FD1 100%);color:#fff;justify-content:center}
.dark{background:#1E1A2B;color:#fff}.white{background:#fff}
.k{font-size:13px;font-weight:700;letter-spacing:3px;text-transform:uppercase;opacity:.75}
h1,h2{font-family:'Playfair Display',serif;font-style:italic;font-weight:600;margin:0;line-height:1.05}
h1{font-size:clamp(54px,12vw,104px)}h2{font-size:clamp(34px,7vw,58px)}
p{margin:0;font-size:clamp(17px,2.6vw,22px);line-height:1.45}
.big{font-size:clamp(56px,13vw,110px);font-weight:800;letter-spacing:-3px;line-height:1}
.mut{color:#5E5872}.dark .mut{color:#CFC9DE}
.tl{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.tl div{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:baseline;font-size:clamp(16px,2.4vw,20px)}
.tl b{color:#5B3BE0;font-size:14px;letter-spacing:1px;text-transform:uppercase}
.bars{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:end;min-height:0;max-height:300px}
.bars div{display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end}
.bars s{display:block;width:100%;border-radius:14px 14px 6px 6px;background:#D9CFF7;text-decoration:none}.bars .on s{background:#5B3BE0}
.bars em{font-style:normal;font-weight:800;font-size:24px}.bars small{font-weight:700;color:#5E5872}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{background:#F6F3FC;border-radius:22px;padding:20px}
.lv{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.lv div{border-radius:18px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:clamp(17px,2.6vw,22px);background:#F6F4FA;color:#8C86A0}
.lv .done{background:#EFEAFB;color:#5B3BE0}.lv .here{background:#5B3BE0;color:#fff}.lv .next{background:#FFF6E3;color:#8A6200;box-shadow:inset 0 0 0 3px #C9962E}
.lv span{font-size:14px;font-weight:700}
textarea{flex:1;min-height:0;width:100%;border:2px solid #E2DCF1;border-radius:20px;padding:18px;font:500 clamp(17px,2.6vw,21px)/1.5 Inter,sans-serif;color:#1E1A2B;resize:none;outline:none;background:#FBFAFE}
textarea:focus{border-color:#5B3BE0}
.q{font-size:clamp(24px,4.4vw,36px);font-weight:700;line-height:1.25}
.nav{display:flex;gap:12px}.nav button{flex:1;min-height:56px;border:0;border-radius:18px;font:700 18px Inter,sans-serif;cursor:pointer}
.back{background:#fff;color:#5E5872;box-shadow:inset 0 0 0 1px #E2DCF1}.go{background:#5B3BE0;color:#fff}.back[disabled]{visibility:hidden}
.sv{font-size:13px;color:#5E5872;text-align:right;min-height:16px}
.gold{color:#C9962E}
.adm{flex:1;overflow:auto;display:flex;flex-direction:column;gap:12px}.adm .card b{display:block;margin-bottom:6px}.adm .card p{white-space:pre-wrap}
</style></head><body><div id="app"></div>
<script>
var B='https://qwumncqcyurojhuyazuj.supabase.co/rest/v1/',K='sb_publishable_7Oa5ZKlo09avfl-ZwZ876w_dgVwlO4R',T=new URLSearchParams(location.search).get('t')||'',VIEW=new URLSearchParams(location.search).has('v');
function rpc(f,b){return fetch(B+'rpc/'+f,{method:'POST',headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'},body:JSON.stringify(b)}).then(function(r){return r.json()})}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var Q=["What did you learn here that you will take with you?",
"When did you feel most supported at BSB? When did you miss support?",
"How have you grown since your first day? What would you tell the Anukis of 2022?",
"What did BSB offer you that made a real difference in your life?",
"What makes the BSB experience special for a client? What made it hard to deliver?",
"How was it working with the team? What would make us stronger together?",
"If you ran the salon tomorrow, what is the first thing you would change?",
"What would it take for you to come back one day and teach the BSB standard?",
"Your message to us. What would you like to leave for the BSB team?"];
var A={},i=0,P=[];
P.push(function(){return '<div class="pg hero"><div class="k">Brazilian Soul Beauty · 2022 to 2026</div><h1>Anukis</h1><p style="opacity:.92">This is your story with us. Take your time.</p></div>'});
P.push(function(){return '<div class="pg white"><div class="k mut">Chapter 1 · The beginning</div><h2>12 August 2022</h2><p>Your very first day at BSB. You started with the classics:</p><div class="tl"><div><b>Day one</b>Brazilian Soul Manicure</div><div><b>Week one</b>Essential Soul Pedicure</div><div><b>Week two</b>Gel Express Pedicure and your first Cat Eye</div></div><p class="mut" style="margin-top:auto">Everything that came after started here.</p></div>'});
P.push(function(){return '<div class="pg white"><div class="k mut">Chapter 2 · Growing your craft</div><h2>What you learned</h2><div class="tl"><div><b>Oct 2022</b>Chrome finishes and intricate nail art</div><div><b>Feb 2023</b>BIAB and IBX Nail Revival</div><div><b>Mar 2023</b>Brazilian Soul Pedicure</div><div><b>Sep 2023</b>Apres Gel-X extensions</div><div><b>Oct 2023</b>Footlogix callus care</div><div><b>May 2024</b>Luxury Soul Pedicure</div><div><b>Mar 2025</b>Classic French</div></div><div class="card" style="margin-top:auto"><p><b>Your signature:</b> the Brazilian Soul Manicure, <b>1,169 times</b>.</p></div></div>'});
P.push(function(){return '<div class="pg dark"><div class="k gold">Chapter 3 · The moment</div><h2>Best Nail Salon</h2><p class="mut">When the award client came in, it was you who looked after her.</p><p style="margin-top:auto;font-size:clamp(20px,3.2vw,28px);font-weight:600">Part of that trophy is yours.</p></div>'});
P.push(function(){return '<div class="pg white"><div class="k mut">Chapter 4 · Clients who choose you</div><div class="big">9 in 10</div><p>of your clients in October had been with us before. <span class="mut">87% returning clients.</span></p><div class="big gold" style="margin-top:12px">97%</div><p>five-star reviews. <span class="mut">145 of 149 since January 2025.</span></p></div>'});
P.push(function(){var b=[['Jul',32],['Aug',36],['Sep',38],['Oct',44]];return '<div class="pg white"><div class="k mut">Chapter 5 · These last months</div><h2>Up every month</h2><p class="mut">Clients who left with their next visit already booked.</p><div class="bars">'+b.map(function(x,k){return '<div class="'+(k===3?'on':'')+'"><em>'+x[1]+'%</em><s style="height:'+(x[1]*5)+'px"></s><small>'+x[0]+'</small></div>'}).join('')+'</div></div>'});
P.push(function(){var L=['Soul','Soul+','Senior Soul','Soul Lead','Soul Manager'],h=3;return '<div class="pg white"><div class="k mut">Chapter 6 · Your Soul Path</div><h2>Where you are</h2><div class="lv">'+L.map(function(n,k){var c=k+1<h?'done':k+1===h?'here':k+1===h+1?'next':'';return '<div class="'+c+'">'+n+'<span>'+(c==='done'?'Done':c==='here'?'You are here':c==='next'?'Your next step':'')+'</span></div>'}).join('')+'</div></div>'});
P.push(function(){return '<div class="pg dark"><div class="k gold">Chapter 7 · Your next step</div><h2>Soul Trainer</h2><p class="mut">Teaching the new girls the BSB standard. The way you do it.</p><div class="two" style="margin-top:auto"><div class="card" style="background:#2A2538"><div class="k mut">October</div><div style="font-size:34px;font-weight:800;margin-top:6px">£2,917</div><p class="mut" style="font-size:15px">£2,735 salary at £14 + £182 tips</p></div><div class="card" style="background:#2A2538;box-shadow:inset 0 0 0 2px #C9962E"><div class="k gold">As Soul Trainer</div><div style="font-size:34px;font-weight:800;margin-top:6px">£16<small style="font-size:18px">/h</small></div><p class="mut" style="font-size:15px">Same hours: £3,126 + tips</p></div></div></div>'});
P.push(function(){return '<div class="pg hero"><div class="k">Before you go</div><h2>Now it is your turn</h2><p style="opacity:.92">8 short questions and a message for us. Write as much or as little as you like. Everything saves as you go.</p></div>'});
Q.forEach(function(q,k){P.push(function(){return '<div class="pg '+(k===8?'dark':'white')+'"><div class="k '+(k===8?'gold':'mut')+'">'+(k===8?'Your message':'Question '+(k+1)+' of 8')+'</div><div class="q">'+esc(q)+'</div><textarea id="ta" data-q="'+(k+1)+'" placeholder="Write here...">'+esc(A[k+1]||'')+'</textarea><div class="sv" id="sv"></div></div>'})});
P.push(function(){return '<div class="pg hero"><div class="k">Thank you</div><h1>Obrigada, Anukis</h1><p style="opacity:.92">Your answers are saved. Ligia will read every word.</p></div>'});
var tmr=null;
function save(){var t=document.getElementById('ta');if(!t)return Promise.resolve();var q=+t.getAttribute('data-q'),v=t.value;if((A[q]||'')===v)return Promise.resolve();A[q]=v;var s=document.getElementById('sv');if(s)s.textContent='Saving...';
  return rpc('exit_save',{p_token:T,p_q:q,p_question:Q[q-1],p_answer:v}).then(function(ok){var s=document.getElementById('sv');if(s)s.textContent=ok?'Saved':'Not saved, check the link'}).catch(function(){var s=document.getElementById('sv');if(s)s.textContent='Not saved, check the connection'})}
function draw(){var d='<div class="dots">'+P.map(function(_,k){return '<i class="'+(k<=i?'on':'')+'"></i>'}).join('')+'</div>'+P[i]()+'<div class="nav"><button class="back" '+(i===0?'disabled':'')+' onclick="go(-1)">Back</button>'+(i<P.length-1?'<button class="go" onclick="go(1)">'+(i===0?'Begin':'Next')+'</button>':'')+'</div>';
  document.getElementById('app').innerHTML=d;var t=document.getElementById('ta');if(t){t.addEventListener('input',function(){clearTimeout(tmr);tmr=setTimeout(save,1200)})}}
function go(n){clearTimeout(tmr);save().then(function(){i=Math.max(0,Math.min(P.length-1,i+n));draw()})}
function admin(){rpc('exit_get',{p_token:T}).then(function(r){if(!r){document.getElementById('app').innerHTML='<div class="pg white"><h2>Link not valid</h2></div>';return}
  var by={};(r.answers||[]).forEach(function(x){by[x.q]=x});
  document.getElementById('app').innerHTML='<div class="pg white" style="flex:1"><div class="k mut">Live answers · '+esc(r.person)+'</div><div class="adm">'+Q.map(function(q,k){var x=by[k+1];return '<div class="card"><b>'+(k+1)+'. '+esc(q)+'</b><p class="'+(x&&x.a?'':'mut')+'">'+(x&&x.a?esc(x.a):'Not answered yet')+'</p></div>'}).join('')+'</div></div>'}).catch(function(){})}
if(VIEW){admin();setInterval(admin,5000)}else{rpc('exit_get',{p_token:T}).then(function(r){(r&&r.answers||[]).forEach(function(x){A[x.q]=x.a||''});draw()}).catch(draw)}
</script></body></html>
