<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:Inter,sans-serif;color:#1E1A2B;background:#F6F3FC}

.lv .done{background:#EFEAFB;color:#5B3BE0}.lv .here{background:#5B3BE0;color:#fff}.lv .next{background:#FFF6E3;color:#8A6200;box-shadow:inset 0 0 0 3px #C9962E}
.lv span{font-size:14px;font-weight:700}
textarea{flex:1;min-height:0;width:100%;border:2px solid #E2DCF1;border-radius:20px;padding:18px;font:500 clamp(17px,2.6vw,21px)/1.5 Inter,sans-serif;color:#1E1A2B;resize:none;outline:none;background:#FBFAFE}
textarea:focus{border-color:#5B3BE0}
.q{font-size:clamp(24px,4.4vw,36px);font-weight:700;line-height:1.25}
.nav{display:flex;gap:12px}.nav button{flex:1;min-height:56px;border:0;border-radius:18px;font:700 18px Inter,sans-serif;cursor:pointer}
.back{background:#fff;color:#5E5872;box-shadow:inset 0 0 0 1px #E2DCF1}.go{background:#5B3BE0;color:#fff}.back[disabled]{visibility:hidden}
.sv{font-size:13px;color:#5E5872;text-align:right;min-height:16px}
.gold{color:#C9962E}
.qp .q{margin-top:8px}.qp textarea{background:#fff;border-color:#EEEAF6}
.stp{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-between;margin-top:4px}
.stp div{display:grid;grid-template-columns:22px 64px 1fr;gap:12px;align-items:center;font-size:clamp(17px,2.6vw,22px);font-weight:700}
.stp i{width:18px;height:18px;border-radius:50%;background:#5B3BE0}.stp b{font-size:13px;letter-spacing:1px;color:#5B3BE0}
.stp .s2 i{background:#C9962E;box-shadow:0 0 0 5px #FFF1CF}.stp .s2 b{color:#8A6200}.stp em{font-style:normal;font-size:13px;background:#FFF1CF;color:#8A6200;border-radius:99px;padding:3px 10px;margin-left:6px}
.stp .s0 i{background:#fff;border:2px dashed #C9C3D9}.stp .s0{color:#A49FB4}.stp .s0 b{color:#A49FB4}
.adm{flex:1;overflow:auto;display:flex;flex-direction:column;gap:12px}.adm .card b{display:block;margin-bottom:6px}.adm .card p{white-space:pre-wrap}
</style></head><body><div id="app"></div>
<script>
var B='https://qwumncqcyurojhuyazuj.supabase.co/rest/v1/',K='sb_publishable_7Oa5ZKlo09avfl-ZwZ876w_dgVwlO4R',T=new URLSearchParams(location.search).get('t')||'',VIEW=new URLSearchParams(location.search).has('v');

P.push(function(){return '<div class="pg hero"><div class="k">Brazilian Soul Beauty · 2022 to 2026</div><h1>Anukis</h1><p style="opacity:.92">This is your story with us. Take your time.</p></div>'});

P.push(function(){var S=[['2022','Basic manicure',1],['2022','Cuticle manicure',1],['2022','Brazilian cuticle',1],['2023','Extensions',1],['2024','BIAB',1],['2025','Footlogix',1],['2026','Waxing',2],['Next','Lash lift',0],['Next','Brows',0],['Next','Brow lamination',0]];
  return '<div class="pg white"><div class="k mut">Chapter 2 · Growing your craft</div><h2>Your path, step by step</h2><div class="stp">'+S.map(function(x){return '<div class="s'+x[2]+'"><i></i><b>'+x[0]+'</b><span>'+x[1]+(x[2]===2?' <em>learning now</em>':'')+'</span></div>'}).join('')+'</div></div>'});
P.push(function(){return '<div class="pg dark"><div class="k gold">Chapter 3 · The moment</div><h2>Best Nail Salon</h2><p class="mut">When the award client came in, it was you who looked after her.</p><p style="margin-top:auto;font-size:clamp(20px,3.2vw,28px);font-weight:600">Part of that trophy is yours.</p></div>'});
P.push(function(){var b=[['Jul',79],['Aug',83],['Sep',88],['Oct',87]];return '<div class="pg white"><div class="k mut">Chapter 4 · Clients who come back</div><h2>Almost 9 in 10</h2><p class="mut">of your clients in the last months were coming back to us. And it kept growing.</p><div class="bars">'+b.map(function(x,k){return '<div class="'+(k>=2?'on':'')+'"><em>'+x[1]+'%</em><s style="height:'+((x[1]-50)*7)+'px"></s><small>'+x[0]+'</small></div>'}).join('')+'</div></div>'});
P.push(function(){return '<div class="pg white"><div class="k mut">Chapter 5 · You started teaching</div><h2>From doing to teaching</h2><div class="tl"><div><b>Trials</b>You assessed new girls at their trials</div><div><b>Training</b>You gave your first training</div><div><b>Insights</b>You saw what makes a great BSB therapist, and you shared it</div></div><p class="mut" style="margin-top:auto">This is how every Soul Lead begins.</p></div>'});
P.push(function(){var L=['Soul','Soul+','Senior Soul','Soul Lead','Soul Manager'],h=3;return '<div class="pg white"><div class="k mut">Chapter 6 · Your Soul Path</div><h2>Where you are</h2><div class="lv">'+L.map(function(n,k){var c=k+1<h?'done':k+1===h?'here':k+1===h+1?'next':'';return '<div class="'+c+'">'+n+'<span>'+(c==='done'?'Done':c==='here'?'You are here':c==='next'?'Your next step':'')+'</span></div>'}).join('')+'</div></div>'});
P.push(function(){return '<div class="pg dark"><div class="k gold">Chapter 7 · Your next step</div><h2>Soul Trainer</h2><p class="mut">Teaching the new girls the BSB standard. The way you do it.</p><div class="two" style="margin-top:auto"><div class="card" style="background:#2A2538"><div class="k mut">Today</div><div style="font-size:clamp(28px,6.6vw,52px);font-weight:800;margin-top:6px">£15.14<small style="font-size:18px">/h</small></div><p class="mut" style="font-size:15px">£14 + £1.14 tips</p></div><div class="card" style="background:#2A2538;box-shadow:inset 0 0 0 2px #C9962E"><div class="k gold">As Soul Trainer</div><div style="font-size:clamp(28px,6.6vw,52px);font-weight:800;margin-top:6px">£17.14<small style="font-size:18px">/h</small></div><p class="mut" style="font-size:15px">£16 + £1.14 tips</p></div></div><div class="card" style="background:#2A2538;text-align:center"><p style="font-size:clamp(17px,2.6vw,21px)">4 days a week: <b class="gold">about £2,380 a month</b> with tips</p><p class="mut" style="font-size:15px">£277 more every month</p></div></div>'});
P.push(function(){return '<div class="pg hero"><div class="k">Before you go</div><h2>Now it is your turn</h2><p style="opacity:.92">A few questions, one at a time. There are no right answers. Everything saves as you go.</p></div>'});
var Q0=P.length;Q.forEach(function(q,k){P.push(function(){return '<div class="pg qp '+(k===8?'dark':'white')+'"><div class="k '+(k===8?'gold':'mut')+'">'+(k===8?'Your message to us':'&nbsp;')+'</div><div class="q">'+esc(q)+'</div><textarea id="ta" data-q="'+(k+1)+'" placeholder="Write here...">'+esc(A[k+1]||'')+'</textarea><div class="sv" id="sv"></div></div>'})});
P.push(function(){return '<div class="pg hero"><div class="k">Thank you</div><h1>Obrigada, Anukis</h1><p style="opacity:.92">Your answers are saved. Ligia will read every word.</p></div>'});
var tmr=null;
function save(){var t=document.getElementById('ta');if(!t)return Promise.resolve();var q=+t.getAttribute('data-q'),v=t.value;if((A[q]||'')===v)return Promise.resolve();A[q]=v;var s=document.getElementById('sv');if(s)s.textContent='Saving...';
  return rpc('exit_save',{p_token:T,p_q:q,p_question:Q[q-1],p_answer:v}).then(function(ok){var s=document.getElementById('sv');if(s)s.textContent=ok?'Saved':'Not saved, check the link'}).catch(function(){var s=document.getElementById('sv');if(s)s.textContent='Not saved, check the connection'})}
function draw(){var nQ=P.length-1,d=(i>=Q0&&i<nQ?'<div class="dots" style="visibility:hidden"><i></i></div>':'<div class="dots">'+P.slice(0,Q0).map(function(_,k){return '<i class="'+(k<=i?'on':'')+'"></i>'}).join('')+'</div>')+P[i]()+'<div class="nav"><button class="back" '+(i===0?'disabled':'')+' onclick="go(-1)">Back</button>'+(i<P.length-1?'<button class="go" onclick="go(1)">'+(i===0?'Begin':'Next')+'</button>':'')+'</div>';
  document.getElementById('app').innerHTML=d;var t=document.getElementById('ta');if(t){t.addEventListener('input',function(){clearTimeout(tmr);tmr=setTimeout(save,1200)})}}
function go(n){clearTimeout(tmr);save().then(function(){i=Math.max(0,Math.min(P.length-1,i+n));draw()})}
function admin(){rpc('exit_get',{p_token:T}).then(function(r){if(!r){document.getElementById('app').innerHTML='<div class="pg white"><h2>Link not valid</h2></div>';return}
  var by={};(r.answers||[]).forEach(function(x){by[x.q]=x});

if(VIEW){admin();setInterval(admin,5000)}else{rpc('exit_get',{p_token:T}).then(function(r){(r&&r.answers||[]).forEach(function(x){A[x.q]=x.a||''});draw()}).catch(draw)}
</script></body></html>
