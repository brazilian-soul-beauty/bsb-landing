<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My password · BSB</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--ivory:#FAF8F5;--ink:#33302C;--ink3:#6F685F;--line:#DCD4C9;--bronze:#75644F;--sand:#D8CAB8;--ok:#5E7A45;--bad:#A8584A}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--ivory);color:var(--ink);font-family:Inter,sans-serif;font-weight:300;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.box{width:100%;max-width:380px;display:flex;flex-direction:column;gap:16px}
.num{font-family:'Cormorant Garamond',serif;font-size:14px;letter-spacing:.3em;text-transform:uppercase;color:var(--bronze)}
h1{font-family:'Cormorant Garamond',serif;font-weight:400;font-size:40px;line-height:1.05}
h1 em{font-style:italic}
label{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink3);display:block;margin-bottom:6px}
input{width:100%;padding:12px 14px;border:1px solid var(--line);background:#fff;font:inherit;font-size:16px;color:var(--ink);outline:none;border-radius:0}
input:focus{border-color:var(--bronze)}
button{background:var(--sand);color:var(--ink);border:0;padding:14px 22px;font:inherit;font-size:13px;letter-spacing:.22em;text-transform:uppercase;cursor:pointer;align-self:flex-start}
button:disabled{opacity:.5}
.msg{font-size:14px;min-height:20px;color:var(--bad)}
.msg.ok{color:var(--ok)}
.hide{display:none}
</style></head><body>
<div class="box">
  <div class="num">Brazilian Soul Beauty</div>
  <h1 id="h">My <em>password</em></h1>
  <div id="f">
    <div id="oldw" style="margin-bottom:14px"><label>Current password</label><input type="password" id="old" autocomplete="current-password"></div>
    <div style="margin-bottom:14px"><label>New password</label><input type="password" id="n1" autocomplete="new-password"></div>
    <div><label>New password again</label><input type="password" id="n2" autocomplete="new-password"></div>
  </div>
  <div class="msg" id="m"></div>
  <button id="go">Save</button>
</div>
<script>
const Q=new URLSearchParams(location.search),P=(Q.get('p')||'').trim(),T=(Q.get('t')||'').trim();
const K='sb_publishable_7Oa5ZKlo09avfl-ZwZ876w_dgVwlO4R',U='https://qwumncqcyurojhuyazuj.supabase.co/rest/v1/rpc/hub_set_pw';
const $=id=>document.getElementById(id);
if(!P){$('h').innerHTML='Please use your <em>link</em>';$('f').classList.add('hide');$('go').classList.add('hide')}
else{$('h').innerHTML=P+',<br>your <em>password</em>';if(T)$('oldw').classList.add('hide')}
$('go').onclick=async()=>{const a=$('n1').value,b=$('n2').value;$('m').className='msg';
 if(a.length<6){$('m').textContent='At least 6 characters.';return}
 if(a!==b){$('m').textContent='The two passwords are different.';return}
 if(!T&&!$('old').value){$('m').textContent='Write your current password.';return}
 $('go').disabled=true;
 try{const r=await fetch(U,{method:'POST',headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'},body:JSON.stringify({p_person:P,p_old_or_code:T||$('old').value,p_new:a})});const j=await r.json();
  if(j==='ok'){$('m').className='msg ok';$('m').textContent='Saved ✓ Use this password in all BSB dashes.';$('f').classList.add('hide');$('go').classList.add('hide');history.replaceState(null,'',location.pathname+'?p='+encodeURIComponent(P))}
  else{$('m').textContent=j==='SHORT'?'At least 6 characters.':T?'This link has expired. Ask Ligia for a new one.':'Current password is wrong.';$('go').disabled=false}}
 catch(e){$('m').textContent='Could not save. Try again.';$('go').disabled=false}};
</script>
</body></html>
