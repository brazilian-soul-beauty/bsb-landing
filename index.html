<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BSB Onboarding Route</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f5fb;--card:#fff;--ink:#1f1b2e;--mute:#7a7590;--line:#ebe8f3;--p:#6d4bd8;--p2:#efeafd;--ok:#1f9d6b;--ok2:#e3f6ee;--amb:#b7791f;--amb2:#fdf3e1}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);font-family:Inter,sans-serif;color:var(--ink)}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select{font-family:inherit;font-size:14px}
#app{height:100vh;display:flex;flex-direction:column;padding:18px 24px;gap:14px}
.top{display:flex;align-items:center;gap:14px}
.logo{width:38px;height:38px;border-radius:10px;background:var(--p);color:#fff;display:grid;place-items:center;font-weight:700}
.top h1{font-size:19px;font-weight:700}
.top .sp{flex:1}
.who{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 8px 6px 12px}
.who label{font-size:12px;color:var(--mute);font-weight:600}
.who select{border:0;font-weight:600;background:transparent;outline:0;max-width:200px}
.btn{background:var(--p);color:#fff;border-radius:9px;padding:7px 12px;font-weight:600;font-size:13px}
.btn.g{background:var(--p2);color:var(--p)}
.main{flex:1;min-height:0;display:flex;flex-direction:column}
/* grid */
.grid{flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:14px;min-height:0}
.st{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;text-align:left;display:flex;flex-direction:column;gap:8px;transition:.15s;position:relative;overflow:hidden}
.st:hover{border-color:var(--p);transform:translateY(-2px);box-shadow:0 6px 18px rgba(109,75,216,.12)}
.st .n{font-size:12px;font-weight:700;color:var(--p);background:var(--p2);border-radius:20px;padding:3px 9px;align-self:flex-start}
.st .ic{position:absolute;right:16px;top:12px;font-size:30px}
.st h2{font-size:16px;font-weight:700;line-height:1.25;padding-right:40px}
.st .meta{margin-top:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute);font-weight:600}
.bar{flex:1;height:7px;background:var(--line);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--p);border-radius:9px}
.st.done .bar i{background:var(--ok)}
.tbcn{color:var(--amb);background:var(--amb2);border-radius:20px;padding:2px 8px}
/* stage */
.sh{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.back{width:38px;height:38px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:18px}
.sh .ic{font-size:30px}
.sh h2{font-size:21px;font-weight:700}
.sh .n{font-size:12px;font-weight:700;color:var(--p)}
.sh .bar{max-width:220px;height:9px}
.sh .pc{font-weight:700;font-size:14px;min-width:60px}
.list{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:58px;gap:10px;align-content:start}
.it{background:var(--card);border:1px solid var(--line);border-radius:12px;display:flex;align-items:center;gap:12px;padding:0 12px 0 14px;text-align:left}
.it .box{width:24px;height:24px;border-radius:7px;border:2px solid #cfc9e3;flex:none;display:grid;place-items:center;color:#fff;font-size:14px;font-weight:700}
.it.on{background:var(--ok2);border-color:#bfe8d6}
.it.on .box{background:var(--ok);border-color:var(--ok)}
.it .tx{flex:1;font-size:14px;font-weight:500;line-height:1.3}
.it.on .tx{color:#3b6b57}
.chip{font-size:11px;font-weight:700;border-radius:20px;padding:2px 8px;margin-right:6px}
.c-course{background:#fde8f1;color:#b8326a}.c-ready{background:#e3f0fd;color:#2563a8}.c-acas{background:#ffe9e3;color:#c2410c}
.tbc{font-size:11px;font-weight:700;color:var(--amb);background:var(--amb2);border-radius:20px;padding:2px 8px}
.del{opacity:0;color:var(--mute);font-size:16px;width:24px;height:24px;border-radius:6px}
.it:hover .del{opacity:1}.del:hover{background:#fde2e2;color:#c53030}
.foot{display:flex;align-items:center;gap:10px;margin-top:12px}
.add{flex:1;display:flex;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px}
.add input[type=text]{flex:1;border:0;outline:0;padding:4px 8px}
.add label{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--amb);padding:0 6px}
.pg{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;color:var(--mute)}
.pg button{width:34px;height:34px;border-radius:9px;background:var(--card);border:1px solid var(--line);font-size:16px}
.pg button:disabled{opacity:.35;cursor:default}
.empty{grid-column:1/-1;align-self:center;text-align:center;color:var(--mute);padding:40px}
/* report panel */
.body{flex:1;min-height:0;display:flex;gap:14px}
.body .list{grid-template-columns:1fr}
.rep.full{width:100%;flex-direction:row;gap:20px;padding:20px}
.rep.full .info{width:36%;flex:none;display:flex;flex-direction:column;gap:12px}
.rep.full .ph{flex:1;grid-template-columns:repeat(4,1fr);grid-auto-rows:1fr;height:100%;align-content:stretch}
.rep.full .ph.n1{grid-template-columns:1fr}.rep.full .ph.n2{grid-template-columns:repeat(2,1fr)}.rep.full .ph.n3,.rep.full .ph.n4{grid-template-columns:repeat(2,1fr)}.rep.full .ph.n5,.rep.full .ph.n6{grid-template-columns:repeat(3,1fr)}
.rep.full .ph a{aspect-ratio:auto;height:100%}
.rep.full .ph img{object-fit:cover}
.rep.full .none{flex:1}
.rep{width:42%;flex:none;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;overflow:hidden}
.rep h3{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.rep h3 span{margin-left:auto}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv div{background:var(--bg);border-radius:10px;padding:8px 10px}
.kv b{display:block;font-size:11px;color:var(--mute);font-weight:600;margin-bottom:2px}
.kv i{font-style:normal;font-weight:700;font-size:14px}
.lk{display:flex;gap:8px;flex-wrap:wrap}
.lk a{text-decoration:none;font-size:13px;font-weight:600;background:var(--p2);color:var(--p);border-radius:9px;padding:7px 11px}
.lk a.off{opacity:.4;pointer-events:none}
.ph{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;flex:1;min-height:0;align-content:start}
.ph a{display:block;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--bg)}
.ph img{width:100%;height:100%;object-fit:cover}
.sc{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 12px}
.sc div{font-size:12px;font-weight:600;color:var(--mute)}
.dots{display:flex;gap:3px;margin-top:3px}.dots i{flex:1;height:6px;border-radius:4px;background:var(--line)}.dots i.f{background:var(--p)}
.flag{font-size:12px;font-weight:700;color:#c2410c;background:#ffe9e3;border-radius:20px;padding:3px 9px}
.none{color:var(--mute);font-size:13px;margin:auto;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.md select,.none select{border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:0;background:#fff;max-width:100%}
/* modal */
.ov{position:fixed;inset:0;background:rgba(31,27,46,.35);display:grid;place-items:center;z-index:9}
.md{background:#fff;border-radius:18px;padding:24px;width:340px;display:flex;flex-direction:column;gap:12px}
.md h3{font-size:17px}
.md input{border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:0}
.md input:focus{border-color:var(--p)}
.md .row{display:flex;gap:8px;justify-content:flex-end}
.err{color:#c53030;font-size:13px;min-height:16px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:10px;font-size:13px;opacity:0;transition:.2s;pointer-events:none}
.toast.s{opacity:1}

.st .meta .ok{color:var(--ok);background:var(--ok2);border-radius:20px;padding:3px 9px}
.st .meta .no{color:var(--mute);background:var(--bg);border-radius:20px;padding:3px 9px}
.st .meta .soon{color:var(--amb);background:var(--amb2);border-radius:20px;padding:3px 9px}
.st.has{border-color:#bfe8d6}
.doc{flex:1;min-height:0;display:flex;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:14px}
.big{flex:1;align-items:center;justify-content:center;text-align:center}
.big .ico{font-size:56px}
.big h3{font-size:20px}
.big p{color:var(--mute);font-size:14px}
.big .row2{display:flex;gap:10px;width:min(560px,90%)}
.big input[type=url]{flex:1;border:1px solid var(--line);border-radius:10px;padding:11px 13px;outline:0}
.big input[type=url]:focus{border-color:var(--p)}
.btn.lg{padding:11px 18px;font-size:14px;text-decoration:none;display:inline-block}
.drop{border:2px dashed #cfc9e3;border-radius:14px;padding:26px 40px;cursor:pointer;color:var(--p);font-weight:600}
.drop:hover{background:var(--p2)}
.small{font-size:12px;color:var(--mute);text-decoration:underline;cursor:pointer}
.qs{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:58px;gap:10px;align-content:start}
.q{background:var(--card);border:1px solid var(--line);border-radius:12px;display:flex;align-items:center;gap:10px;padding:0 14px;font-size:14px;font-weight:500}

.two{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:16px;min-height:0}
.ans{display:flex;gap:10px}
.ans button{padding:12px 18px;border-radius:12px;border:2px solid var(--line);font-weight:700;font-size:14px;background:#fff}
.ans .a.on{background:var(--ok2);border-color:var(--ok);color:var(--ok)}
.ans .d.on{background:#fde2e2;border-color:#c53030;color:#c53030}
.ans .w.on{background:var(--amb2);border-color:var(--amb);color:var(--amb)}
textarea{font-family:inherit;font-size:14px;border:1px solid var(--line);border-radius:10px;padding:11px 13px;outline:0;resize:none;width:min(560px,90%);height:90px}
textarea:focus{border-color:var(--p)}
.fr{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.fr .card{padding:16px 18px;gap:8px;overflow:hidden}
.fr h4{font-size:12px;font-weight:700;color:var(--p);letter-spacing:.06em;text-transform:uppercase}
.fr .r{display:flex;justify-content:space-between;gap:10px;font-size:13px;border-bottom:1px solid var(--line);padding:5px 0}
.fr .r b{color:var(--mute);font-weight:600}.fr .r span{font-weight:600;text-align:right}
.linkbar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.pill{font-size:12px;font-weight:700;border-radius:20px;padding:4px 10px}
.pill.ok{color:var(--ok);background:var(--ok2)}.pill.no{color:var(--mute);background:#fff;border:1px solid var(--line)}.pill.w{color:var(--amb);background:var(--amb2)}
.ef{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px;max-width:1100px;width:100%;margin:0 auto}
.ef .steps{display:flex;gap:6px}.ef .steps i{flex:1;height:6px;border-radius:6px;background:var(--line)}.ef .steps i.on{background:var(--p)}
.ef .pane{flex:1;min-height:0;background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px 30px;display:flex;flex-direction:column;gap:16px;overflow:hidden}
.ef h2{font-size:22px}.ef .sub{color:var(--mute);font-size:14px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:14px 20px;align-content:start}
.fg.three{grid-template-columns:1fr 1fr 1fr}
.f{display:flex;flex-direction:column;gap:6px}.f.w2{grid-column:span 2}
.f label{font-size:12px;font-weight:600;color:var(--mute)}
.f input,.f textarea{border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:0;width:100%;font-size:14px;background:#fff}
.f textarea{height:70px}
.f input:focus,.f textarea:focus{border-color:var(--p)}
.yn{display:flex;gap:8px}.yn button{padding:9px 18px;border-radius:10px;border:2px solid var(--line);font-weight:700;background:#fff}.yn button.on{border-color:var(--p);background:var(--p2);color:var(--p)}
.up{display:flex;align-items:center;gap:10px;border:1px dashed #cfc9e3;border-radius:10px;padding:9px 12px;font-size:13px;font-weight:600}
.up .nm{flex:1;color:var(--mute)}.up.ok{border-style:solid;border-color:#bfe8d6;background:var(--ok2)}.up.ok .nm{color:var(--ok)}
.nav{display:flex;justify-content:space-between;align-items:center}
.ck{display:flex;gap:10px;align-items:flex-start;font-size:14px}.ck input{width:18px;height:18px;margin-top:2px;flex:none}
.note{font-size:13px;color:var(--mute);background:var(--bg);border-radius:10px;padding:12px 14px;line-height:1.45}
.saved{font-size:11px;color:var(--ok);font-weight:700}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div class="logo">BS</div>
    <h1>Onboarding Route</h1>
    <div class="sp"></div>
    <div class="who"><label>New starter</label><select id="who"></select></div>
  </div>
  <div class="main" id="main"></div>
</div>
<div class="toast" id="toast"></div>
<input type="file" id="file" accept=".pdf,.doc,.docx,image/*" style="display:none">
<script>
const BASE='https://qwumncqcyurojhuyazuj.supabase.co';
const SB=BASE+'/rest/v1/';
const KEY='sb_publishable_7Oa5ZKlo09avfl-ZwZ876w_dgVwlO4R';
const H={apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'};
const STORE=BASE+'/storage/v1/object/public/bsb-hire/';
const DOCS='bsb-staff-docs';
const TRIALS='https://bsb-trials.vercel.app/?p=ligia';
const STAGES=[
 [1,'Interview','🔎'],[2,'Trial','💅'],[3,'Offer','📩'],[4,'Onboarding form','📝'],[5,'Contract','✍️'],
 [6,'The BSB Way','📖'],[7,'First days','🎓'],[8,'Probation','✅'],[9,'Open questions','❓']
];
const QQ=9,WAYN=6;
const WAY=[['00-details','I · My details'],['01-welcome','II · Welcome'],['02-this-house','III · This House'],['03-words','IV · The Words of the House'],['04-calendar','V · Calendar'],['05-policies','VI · Policies'],['07-etiquette','VII · Etiquette'],['08-image','VIII · Image & Uniform']];
let WS={},WL={};
const APP=location.origin+location.pathname;
let forms={};
let people=[],cands=[],qs=[],person=null,view=0,priv=null;

async function api(path,opt={}){
  const r=await fetch(SB+path,{...opt,headers:{...H,...(opt.headers||{})}});
  if(!r.ok) throw new Error(await r.text());
  const t=await r.text();return t?JSON.parse(t):null;
}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('s');setTimeout(()=>t.classList.remove('s'),1800)}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
const fmtD=d=>d?new Date(d).toLocaleString('en-GB',{timeZone:'Europe/London',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'—';
const fmtDay=d=>d?new Date(d).toLocaleDateString('en-GB',{timeZone:'Europe/London',day:'2-digit',month:'short'}):'';
const mins=s=>!s?'—':s<60?s+' sec':Math.round(s/60)+' min';
const P=()=>people.find(x=>x.id===person);
function cand(){const p=P();return p&&p.cand_id?cands.find(c=>c.id===p.cand_id):null}

async function load(){
  [people,cands,qs]=await Promise.all([
    api('bsb_route_people?select=*&archived=eq.false&order=created_at'),
    api('bsb_hire_candidates?select=id,name,job,stage,interview_at,interview_notes,cv_file,photos,instagram,trial_at,trial_with,trial_done_at,trial_times,trial_scores,trial_flags,trial_photos,trial_photo&order=updated_at.desc'),
    api('bsb_route_items?select=txt&stage=eq.9&order=ord')
  ]);
  (await api('bsb_route_form?select=*')).forEach(f=>forms[f.person_id]=f);
  await Promise.all(people.filter(p=>p.onb_person).map(async p=>{try{const r=await api('rpc/bsb_route_way_status',{method:'POST',body:JSON.stringify({p_person:p.onb_person})});WS[p.id]={};(r||[]).forEach(x=>WS[p.id][x.module]=x)}catch(e){}}));
  const saved=new URLSearchParams(location.search).get('s');
  person=(people.find(p=>p.id===saved)||people[people.length-1]||{}).id||null;
  renderWho();render();
}
function renderWho(){
  document.getElementById('who').innerHTML=people.length?people.map(p=>`<option value="${p.id}" ${p.id===person?'selected':''}>${esc(p.name)}</option>`).join(''):'<option>None yet</option>';
}
function status(n){
  const p=P(),c=cand();if(!p&&n!==QQ)return['no','—'];
  if(n===1)return c&&c.interview_at?['ok',fmtDay(c.interview_at)]:['no','No data'];
  if(n===2)return c&&c.trial_done_at?['ok','Done']:['no','Not done'];
  if(n===3)return p.offer_reply==='Accepted'?['ok','Accepted']:p.offer_reply==='Declined'?['no','Declined']:p.offer_url?['ok','Sent '+fmtDay(p.offer_at)]:['no','Not yet'];
  if(n===4){const f=forms[p.id];return f&&f.submitted_at?['ok','Done '+fmtDay(f.submitted_at)]:f?['soon','In progress']:['no','Not started']}
  if(n===5)return p.contract_file?['ok','Uploaded '+fmtDay(p.contract_at)]:['no','Not yet'];
  if(n===WAYN){const w=WS[p.id];if(!w)return['no','Not started'];const d=WAY.filter(x=>(w[x[0]]||{}).done).length;return d===WAY.length?['ok','Done']:d?['soon',d+' of '+WAY.length]:['no','Not started']}
  if(n===QQ)return['soon',qs.length+' open'];
  return['soon','Soon'];
}
function render(){view?renderStage():renderGrid()}
function renderGrid(){
  document.getElementById('main').innerHTML='<div class="grid">'+STAGES.map(([n,t,ic])=>{
    const [k,txt]=status(n);
    return `<button class="st ${k==='ok'?'has':''}" onclick="view=${n};render()">
      <span class="n">${n}</span><span class="ic">${ic}</span><h2>${t}</h2>
      <div class="meta"><span class="${k}">${k==='ok'?'✓ ':''}${esc(txt)}</span></div></button>`}).join('')+'</div>';
}
function head(n){const [,t,ic]=STAGES[n-1];
  return `<div class="sh"><button class="back" onclick="view=0;render()">←</button><span class="ic">${ic}</span><div><div class="n">STAGE ${n}</div><h2>${t}</h2></div></div>`}
function photosHtml(arr){arr=(arr||[]).filter(Boolean).slice(0,8);return arr.length?'<div class="ph n'+arr.length+'">'+arr.map(f=>`<a href="${STORE+f}" target="_blank"><img src="${STORE+f}" loading="lazy"></a>`).join('')+'</div>':''}
function body(n){
  const p=P(),c=cand();
  if(!p&&n!==QQ)return '<div class="card big"><div class="ico">👤</div><h3>No new starter yet</h3><p>Approve a candidate in the Trials dash</p></div>';
  if(n===1||n===2){
    if(!c)return `<div class="card big"><div class="ico">🔗</div><h3>No candidate linked</h3><select class="none" onchange="linkCand(this.value)" style="border:1px solid var(--line);border-radius:10px;padding:10px">${'<option value="">Choose candidate</option>'+cands.filter(x=>x.stage!=='rejected').map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div>`;
    if(n===1)return `<div class="rep full"><div class="info"><h3>🗒️ Interview report<span class="lk"><a href="${TRIALS}" target="_blank">Trials dash ↗</a></span></h3>
     <div class="kv"><div><b>Name</b><i>${esc(c.name)}</i></div><div><b>Job</b><i>${esc(c.job||'—')}</i></div><div><b>Interview</b><i>${fmtD(c.interview_at)}</i></div><div><b>Status</b><i>${esc(c.stage||'—')}</i></div></div>
     <div class="lk"><a class="${c.interview_notes?'':'off'}" href="${esc(c.interview_notes||'#')}" target="_blank">Granola notes</a><a class="${c.cv_file?'':'off'}" href="${c.cv_file?STORE+c.cv_file:'#'}" target="_blank">CV</a>${c.instagram?`<a href="${esc(c.instagram)}" target="_blank">Instagram</a>`:''}</div></div>
     ${photosHtml(c.photos)||'<div class="none">No work photos</div>'}</div>`;
    const t=c.trial_times||{},l=t.laps||{},sc=c.trial_scores||{},fl=c.trial_flags||[],done=!!c.trial_done_at;
    return `<div class="rep full"><div class="info"><h3>💅 Trial report<span class="lk"><a href="${TRIALS}" target="_blank">Trials dash ↗</a></span></h3>
     <div class="kv"><div><b>Trial</b><i>${fmtD(c.trial_at)}</i></div><div><b>With</b><i>${esc(c.trial_with||'—')}</i></div><div><b>Total time</b><i>${done?mins(t.total):'—'}</i></div><div><b>Status</b><i>${done?'Done':'Not done'}</i></div></div>
     ${done?`<div class="kv"><div><b>Shape</b><i>${mins(l.shape)}</i></div><div><b>Cuticle</b><i>${mins(l.cuticle)}</i></div><div><b>Colour</b><i>${mins(l.colour)}</i></div><div><b>Finish</b><i>${mins(l.finish)}</i></div></div>
     <div class="sc">${['tidy','time','finish','manner','cuticle','presentation'].map(k=>`<div>${k[0].toUpperCase()+k.slice(1)} ${sc[k]||0}/5<div class="dots">${[1,2,3,4,5].map(i=>`<i class="${i<=(sc[k]||0)?'f':''}"></i>`).join('')}</div></div>`).join('')}</div>
     ${fl.length?'<div class="lk">'+fl.map(f=>`<span class="flag">${esc(f.k)}: ${esc(f.t)}</span>`).join('')+'</div>':''}</div>
     ${photosHtml(c.trial_photos&&c.trial_photos.length?c.trial_photos:[c.trial_photo])}`:'</div><div class="none">Trial not done yet</div>'}</div>`;
  }
  if(n===3){
    let left;
    if(p.offer_url&&!window._editOffer)left=`<div class="card big"><div class="ico">📩</div><h3>Offer sent</h3><p>${fmtD(p.offer_at)}</p>
      <a class="btn lg" href="${esc(p.offer_url)}" target="_blank">Open offer ↗</a><span class="small" onclick="window._editOffer=1;render()">Change link</span></div>`;
    else left=`<div class="card big"><div class="ico">📩</div><h3>Offer</h3><p>Paste the offer link</p>
      <form class="row2" onsubmit="event.preventDefault();saveOffer()"><input type="url" id="ou" placeholder="https://" value="${esc(p.offer_url||'')}" required><button class="btn lg">Save</button></form></div>`;
    const r=p.offer_reply||'';
    const right=`<div class="card big"><div class="ico">💬</div><h3>Her answer</h3><p>${p.offer_reply_at?fmtD(p.offer_reply_at):'No answer yet'}</p>
      <div class="ans"><button class="a ${r==='Accepted'?'on':''}" onclick="setReply('Accepted')">✓ Accepted</button><button class="w ${r==='Waiting'?'on':''}" onclick="setReply('Waiting')">⏳ Waiting</button><button class="d ${r==='Declined'?'on':''}" onclick="setReply('Declined')">✕ Declined</button></div>
      <textarea id="rn" placeholder="What she said">${esc(p.offer_reply_note||'')}</textarea><button class="btn lg" onclick="saveReplyNote()">Save note</button></div>`;
    return `<div class="two">${left}${right}</div>`;
  }
  if(n===4)return formReport(p);
  if(n===WAYN)return wayPage(p);
  if(n===5){
    if(p.contract_file)return `<div class="card big"><div class="ico">✍️</div><h3>Contract</h3><p>Uploaded ${fmtD(p.contract_at)}</p>
      <button class="btn lg" onclick="openContract()">Open contract ↗</button><span class="small" onclick="pick()">Replace file</span></div>`;
    return `<div class="card big"><div class="ico">✍️</div><h3>Contract</h3><p>Signed on day 1</p><div class="drop" onclick="pick()">⬆️ Upload contract</div></div>`;
  }
  if(n===QQ)return '<div class="qs">'+qs.map(q=>`<div class="q">❓ ${esc(q.txt.replace(/^Check with ACAS:\s*/,'ACAS: '))}</div>`).join('')+'</div>';
  return '<div class="card big"><div class="ico">🛠️</div><h3>Coming soon</h3><p>We build this stage next</p></div>';
}
function renderStage(){document.getElementById('main').innerHTML=head(view)+'<div class="doc">'+body(view)+'</div>'}
async function patch(obj){
  await api('bsb_route_people?id=eq.'+person,{method:'PATCH',body:JSON.stringify(obj)});
  Object.assign(P(),obj);
}
async function linkCand(id){if(!id)return;try{await patch({cand_id:id});render();toast('Linked')}catch(e){toast('Not saved')}}
async function saveOffer(){
  const u=document.getElementById('ou').value.trim();if(!u)return;
  try{await patch({offer_url:u,offer_at:new Date().toISOString()});window._editOffer=0;render();toast('Saved')}catch(e){toast('Not saved')}
}
async function setReply(v){try{await patch({offer_reply:v,offer_reply_at:new Date().toISOString()});render();toast('Saved')}catch(e){toast('Not saved')}}
async function saveReplyNote(){try{await patch({offer_reply_note:document.getElementById('rn').value.trim(),offer_reply_at:P().offer_reply_at||new Date().toISOString()});render();toast('Saved')}catch(e){toast('Not saved')}}
function myLink(id){return APP+'?f='+id}
function copyLink(){navigator.clipboard.writeText(myLink(person)).then(()=>toast('Link copied'))}
const R=(k,v)=>`<div class="r"><b>${k}</b><span>${v?esc(v):'—'}</span></div>`;
function formReport(p){
  const f=forms[p.id],d=(f&&f.data)||{},docs=d.docs||{};
  const st=f&&f.submitted_at?`<span class="pill ok">✓ Done ${fmtD(f.submitted_at)}</span>`:f?'<span class="pill w">In progress</span>':'<span class="pill no">Not started</span>';
  const bar=`<div class="linkbar">${st}<div style="flex:1"></div><button class="btn g" onclick="copyLink()">🔗 Copy her link</button><a class="btn g" style="text-decoration:none" href="${myLink(p.id)}" target="_blank">Open her page ↗</a></div>`;
  if(!f)return '<div style="flex:1;display:flex;flex-direction:column">'+bar+'<div class="card big"><div class="ico">📝</div><h3>Not started</h3><p>Send her the link</p></div></div>';
  const docRow=(k,l)=>`<div class="r"><b>${l}</b><span>${docs[k]?`<a href="#" onclick="openDoc('${esc(docs[k])}');return false">Open ↗</a>`:'—'}</span></div>`;
  const pv=priv?`${R('Allergies',priv.allergies)}${R('Details',priv.allergies_detail)}${R('Adjustments',priv.support)}${R('Details',priv.support_detail)}${R('NI number',priv.ni)}${R('Share code',priv.share_code)}${R('Account name',priv.bank_name)}${R('Sort code',priv.sort_code)}${R('Account no.',priv.account_no)}`:`<div class="none">🔒 Private<button class="btn" onclick="showPriv()">Show</button></div>`;
  return `<div style="flex:1;display:flex;flex-direction:column;min-height:0">${bar}<div class="fr">
   <div class="card"><h4>Personal</h4>${R('Full name',d.full_name)}${R('Address',d.address)}${R('Date of birth',d.dob)}${R('Phone',d.phone)}${R('Email',d.email)}${R('Position',d.position)}</div>
   <div class="card"><h4>Emergency contact</h4>${R('Name',d.em_name)}${R('Relationship',d.em_rel)}${R('Phone',d.em_phone)}${R('Email',d.em_email)}<h4 style="margin-top:8px">Uniform</h4>${R('Top',d.top)}${R('Trousers / shorts',d.trousers)}${R('Shoes',d.shoes)}</div>
   <div class="card"><h4>Private</h4>${pv}</div>
   <div class="card"><h4>Preferences</h4>${R('Cuisine',d.cuisine)}${R('Treatment 1',d.t1)}${R('Treatment 2',d.t2)}${R('Treatment 3',d.t3)}${R('Favourite shop',d.shop)}${R('Languages',d.languages)}${R('Goal at BSB',d.goal)}</div>
   <div class="card"><h4>Documents</h4>${docRow('passport','Passport')}${docRow('address','Proof of address')}${docRow('p45','P45 / Starter checklist')}${docRow('certs','Certificates')}</div>
   <div class="card"><h4>Declaration</h4>${R('True and complete',d.agree1?'Yes':'')}${R('Consent',d.agree2?'Yes':'')}${R('Signature',d.signature)}${R('Date',f.submitted_at?fmtDay(f.submitted_at):'')}</div>
  </div></div>`;
}
async function showPriv(){
  const pin=prompt('PIN');if(!pin)return;
  try{const r=await api('rpc/bsb_route_private_get',{method:'POST',body:JSON.stringify({p_person:person,p_pin:pin})});
    if(!r){toast('Wrong PIN or empty');return}priv=r;render()}catch(e){toast('Could not open')}
}
async function openDoc(path){
  const w=window.open('','_blank');
  try{const r=await fetch(`${BASE}/storage/v1/object/sign/${DOCS}/${path}`,{method:'POST',headers:H,body:JSON.stringify({expiresIn:600})});
    const j=await r.json();w.location=BASE+'/storage/v1'+j.signedURL}catch(e){w.close();toast('Could not open')}
}
function wayPage(p){
  const w=WS[p.id]||{},L=WL[p.id];
  if(!L){api('rpc/bsb_route_link_way',{method:'POST',body:JSON.stringify({p_id:p.id})}).then(r=>{if(r){WL[p.id]=location.origin+location.pathname.replace(/[^/]*$/,'')+'way.html?p='+encodeURIComponent(r.person)+'&c='+r.code;p.onb_person=r.person;render()}}).catch(()=>toast('Could not load link'))}
  const msg=L?'Hello '+(p.name||'').split(' ')[0]+'! Welcome to Brazilian Soul Beauty. Please open this link: '+L:'';
  const left=`<div class="card big"><div class="ico">📖</div><h3>The BSB Way</h3><p>Her link</p>${L?`<div class="lk" style="justify-content:center"><button class="btn lg" onclick="navigator.clipboard.writeText('${L}').then(()=>toast('Link copied'))">🔗 Copy link</button><a class="btn lg" href="https://wa.me/?text=${encodeURIComponent(msg)}" target="_blank">WhatsApp</a><a class="btn g lg" href="${L}" target="_blank">Open ↗</a></div>`:'<p>Loading…</p>'}</div>`;
  const rows=WAY.map(([id,t])=>{const x=w[id]||{};const k=x.done?'ok':x.n?'w':'no';const lab=x.done?'✓ Done '+fmtDay(x.last):id==='05-policies'&&x.signs?x.signs+' signed':x.n?'In progress':'Not yet';return `<div class="r"><b>${t}</b><span class="pill ${k}">${lab}</span></div>`}).join('');
  return `<div class="two">${left}<div class="card fr" style="display:flex;grid-template-columns:none"><h4>Her progress</h4>${rows}</div></div>`;
}
function pick(){document.getElementById('file').click()}
document.getElementById('file').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  const path=person+'/contract-'+Date.now()+'-'+f.name.replace(/[^\w.\-]/g,'_');
  toast('Uploading…');
  try{
    const r=await fetch(`${BASE}/storage/v1/object/${DOCS}/${path}`,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':f.type||'application/octet-stream'},body:f});
    if(!r.ok)throw new Error(await r.text());
    await patch({contract_file:path,contract_at:new Date().toISOString()});render();toast('Uploaded')
  }catch(err){toast('Upload failed')}
};
async function openContract(){
  const w=window.open('','_blank');
  try{
    const r=await fetch(`${BASE}/storage/v1/object/sign/${DOCS}/${P().contract_file}`,{method:'POST',headers:H,body:JSON.stringify({expiresIn:600})});
    const j=await r.json();w.location=BASE+'/storage/v1'+j.signedURL;
  }catch(e){w.close();toast('Could not open')}
}
document.getElementById('who').onchange=e=>{priv=null;person=e.target.value;history.replaceState(null,'','?s='+person);window._editOffer=0;render()};
/* ===== EMPLOYEE FORM ===== */
const FID=new URLSearchParams(location.search).get('f');
let FD={},fstep=0,fsub=null,mine={},fp=null,pend={},fkey=null;
const PAGES=[
 {t:'Welcome'},
 {t:'Personal information',f:[['full_name','Full name'],['dob','Date of birth','date'],['address','Address','text','w2'],['phone','Phone number','tel'],['email','Email address','email'],['position','Position']]},
 {t:'Emergency contact and uniform',f:[['em_name','Emergency contact name'],['em_rel','Relationship'],['em_phone','Phone number','tel'],['em_email','Email address','email'],['top','Top size (UK)'],['trousers','Trousers / shorts size (UK)'],['shoes','Shoe size (UK)']]},
 {t:'Health and support',priv:1},
 {t:'About you',f:[['cuisine','Cuisine preference'],['shop','Favourite shop (for treats)'],['t1','Favourite treatment 1'],['t2','Favourite treatment 2'],['t3','Favourite treatment 3'],['languages','Languages spoken'],['goal','Your personal goal at BSB','area','w2']]},
 {t:'Documents',docs:1},
 {t:'Declaration',decl:1},
 {t:'Done'}
];
async function fload(){
  document.querySelector('.who').style.display='none';
  document.querySelector('.top h1').textContent='Welcome to BSB';
  const pp=await api('bsb_route_people?select=id,name,role&id=eq.'+FID);
  if(!pp||!pp.length){document.getElementById('main').innerHTML='<div class="card big"><div class="ico">🔗</div><h3>Link not valid</h3></div>';return}
  fp=pp[0];
  const f=(await api('bsb_route_form?select=*&person_id=eq.'+FID))[0];
  if(f){FD=f.data||{};fstep=f.submitted_at?7:Math.min(f.step||0,6);fsub=f.submitted_at}
  if(!FD.full_name)FD.full_name=fp.name;if(!FD.position&&fp.role)FD.position=fp.role;
  try{mine=await api('rpc/bsb_route_private_mine',{method:'POST',body:JSON.stringify({p_person:FID})})||{}}catch(e){}
  frender();
}
function inp(k,l,type,w){const v=esc(FD[k]||'');
  return `<div class="f ${w||''}"><label>${l}</label>${type==='area'?`<textarea id="i_${k}">${v}</textarea>`:`<input id="i_${k}" type="${type||'text'}" value="${v}">`}</div>`}
function pinp(k,l){const sv=mine[k]==='saved';return `<div class="f"><label>${l} ${sv?'<span class="saved">✓ saved</span>':''}</label><input id="p_${k}" placeholder="${sv?'Saved. Type to change':''}"></div>`}
function yn(k){return `<div class="yn"><button class="${pend[k]==='Yes'?'on':''}" onclick="keep();pend['${k}']='Yes';frender()">Yes</button><button class="${pend[k]==='No'?'on':''}" onclick="keep();pend['${k}']='No';frender()">No</button>${mine[k]==='saved'&&!pend[k]?'<span class="saved" style="align-self:center">✓ saved</span>':''}</div>`}
function upl(k,l){const ok=FD.docs&&FD.docs[k];return `<div class="f"><label>${l}</label><div class="up ${ok?'ok':''}"><span class="nm">${ok?'✓ Uploaded':'No file yet'}</span><button class="btn g" onclick="fpick('${k}')">${ok?'Replace':'Upload'}</button></div></div>`}
let typed={};
function keep(){document.querySelectorAll('[id^="p_"]').forEach(el=>{if(el.value.trim())typed[el.id.slice(2)]=el.value.trim()})}
function frender(){
  const pg=PAGES[fstep];let h='';
  if(fstep===0)h=`<h2>Hello ${esc((fp.name||'').split(' ')[0])} 👋</h2><div class="sub">We're so excited to have you with us. Please fill this in with care, it's the first step in our connection.</div><div class="note">About 10 minutes. Your answers save on every page, so you can stop and come back with the same link.</div>`;
  else if(pg.f)h=`<h2>${pg.t}</h2><div class="fg">${pg.f.map(x=>inp(...x)).join('')}</div>`;
  else if(pg.priv)h=`<h2>${pg.t}</h2><div class="note">🔒 Anything you share here is confidential and kept separate.</div><div class="fg">
     <div class="f"><label>Any allergies (products, chemicals, etc.)?</label>${yn('allergies')}</div>${pinp('allergies_detail','If yes, please specify')}
     <div class="f"><label>Anything you'd like us to know, including any health condition, so we can make adjustments at work?</label>${yn('support')}</div>${pinp('support_detail','If yes, tell us')}</div>`;
  else if(pg.docs)h=`<h2>${pg.t}</h2><div class="sub">Please provide these before your first working day.</div><div class="fg three">
     ${upl('passport','Passport (right to work)')}${upl('address','Proof of address')}${upl('p45','P45 or Starter checklist')}
     ${pinp('ni','National Insurance number')}${pinp('share_code','Share code')}${upl('certs','Certificates')}
     ${pinp('bank_name','Bank: account name')}${pinp('sort_code','Bank: sort code')}${pinp('account_no','Bank: account number')}</div>`;
  else if(pg.decl)h=`<h2>${pg.t}</h2><div class="note">We collect this information to manage your employment, process payroll, meet our legal obligations, and keep you safe at work. Health information is used only to support you and make reasonable adjustments, and is stored separately with restricted access. We keep your data only as long as necessary and in line with UK GDPR. You can ask to see, correct, or remove your data at any time.</div>
     <label class="ck"><input type="checkbox" id="i_agree1" ${FD.agree1?'checked':''}>I confirm that the information provided is true and complete to the best of my knowledge.</label>
     <label class="ck"><input type="checkbox" id="i_agree2" ${FD.agree2?'checked':''}>I consent to Brazilian Soul Beauty holding and processing the information provided, including health information, for the purposes described above.</label>
     <div class="fg">${inp('signature','Signature (type your full name)')}<div class="f"><label>Date</label><input value="${new Date().toLocaleDateString('en-GB')}" disabled></div></div>`;
  else h=`<div class="card big" style="border:0"><div class="ico">💜</div><h3>Welcome to the Brazilian Soul Beauty family</h3><p>May this new journey be filled with sparkle, learning, and love.</p></div>`;
  document.getElementById('main').innerHTML=`<div class="ef"><div class="steps">${[1,2,3,4,5,6].map(i=>`<i class="${i<=fstep?'on':''}"></i>`).join('')}</div>
   <div class="pane">${h}</div>
   ${fstep<7?`<div class="nav"><button class="btn g lg" ${fstep===0?'style="visibility:hidden"':''} onclick="fgo(-1)">← Back</button><span class="sub">${fstep?fstep+' of 6':''}</span><button class="btn lg" onclick="fgo(1)">${fstep===0?'Start':fstep===6?'Send ✓':'Next →'}</button></div>`:''}</div>`;
  Object.entries(typed).forEach(([k,v])=>{const el=document.getElementById('p_'+k);if(el)el.value=v});
}
function collect(){
  document.querySelectorAll('[id^="i_"]').forEach(el=>{const k=el.id.slice(2);FD[k]=el.type==='checkbox'?el.checked:el.value.trim()});
  keep();const p={...typed};
  ['allergies','support'].forEach(k=>{if(pend[k])p[k]=pend[k]});
  return p;
}
async function fgo(d){
  const p=collect();
  if(d>0&&fstep===6&&!(FD.agree1&&FD.agree2&&FD.signature)){toast('Tick both boxes and sign');return}
  try{
    if(Object.keys(p).length){await api('rpc/bsb_route_private_save',{method:'POST',body:JSON.stringify({p_person:FID,p})});Object.keys(p).forEach(k=>mine[k]='saved');pend={};typed={}}
    const ns=Math.max(0,Math.min(7,fstep+d)),body={person_id:FID,data:FD,step:ns,updated_at:new Date().toISOString()};
    if(ns===7){body.submitted_at=new Date().toISOString();fsub=body.submitted_at}
    await api('bsb_route_form',{method:'POST',headers:{Prefer:'resolution=merge-duplicates'},body:JSON.stringify(body)});
    fstep=ns;frender();
  }catch(e){toast('Not saved, try again')}
}
function fpick(k){collect();fkey=k;document.getElementById('file').click()}
if(FID){
  document.getElementById('file').onchange=async e=>{
    const f=e.target.files[0];e.target.value='';if(!f||!fkey)return;
    const path=FID+'/'+fkey+'-'+Date.now()+'-'+f.name.replace(/[^\w.\-]/g,'_');toast('Uploading…');
    try{const r=await fetch(`${BASE}/storage/v1/object/${DOCS}/${path}`,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':f.type||'application/octet-stream'},body:f});
      if(!r.ok)throw 0;FD.docs=FD.docs||{};FD.docs[fkey]=path;
      await api('bsb_route_form',{method:'POST',headers:{Prefer:'resolution=merge-duplicates'},body:JSON.stringify({person_id:FID,data:FD,step:fstep})});frender();toast('Uploaded')}catch(err){toast('Upload failed')}
  };
  fload().catch(()=>toast('Could not load'));
} else load().catch(()=>toast('Could not load'));

</script>
</body>
</html>
