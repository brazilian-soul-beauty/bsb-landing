<html lang="en">

<title>The BSB Way</title>

<style>
:root{--ivory:#FAF8F5;--paper:#EDE6DC;--ink:#33302C;--ink2:#625C54;--ink3:#6F685F;--line:#DCD4C9;--bronze:#75644F;--ok:#5E7A45;--no:#A4553F}

button{font:inherit;color:inherit}
.wrap{display:grid;grid-template-columns:1fr 1fr;height:100%}
.pic{background-size:cover;background-position:center;position:relative}

.side{display:flex;flex-direction:column;padding:36px 7vw 32px 6vw;min-height:0}
.head{display:flex;justify-content:space-between;align-items:center;flex:none;position:relative;z-index:2;background:var(--ivory)}
.logo{height:54px;cursor:pointer}
.count{font-size:12px;letter-spacing:.2em;color:var(--ink3)}
.main{flex:1;display:flex;flex-direction:column;justify-content:safe center;gap:22px;min-height:0;max-width:470px;overflow-y:auto;padding:8px 2px}
.num{font-family:'Cormorant Garamond',serif;font-weight:400;font-size:17px;letter-spacing:.3em;color:var(--bronze);text-transform:uppercase}

.lede{font-size:17px;line-height:1.7;color:var(--ink2);font-weight:300}
.meta{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink3)}

.vals{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px 20px}.vals div{border-top:1px solid var(--line);padding-top:7px}.vals b{display:block;font-family:'Cormorant Garamond',serif;font-weight:400;font-size:20px}.vals span{font-size:13px;line-height:1.4;color:var(--ink2)}

.opt .say{font-family:'Cormorant Garamond',serif;font-size:21px;line-height:1.3}
.conf{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--ink);background:var(--paper);padding:12px 14px;border-left:2px solid var(--bronze)}
.conf button{background:#FBF9F5;border:1px solid var(--bronze);padding:9px 16px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer}

.why{border-left:2px solid var(--bronze);padding:4px 0 4px 16px;font-size:15px;line-height:1.6;color:var(--ink2);animation:in .4s ease both}
.why b{display:block;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--bronze);font-weight:400;margin-bottom:4px}
.mrow{display:grid;grid-template-columns:1fr 1.2fr;gap:14px;align-items:center;border-bottom:1px solid var(--line);padding:8px 0}
.mrow span{font-size:15px;color:var(--ink)}
.mrow select{font:inherit;font-size:15px;color:var(--ink);background:#FBF9F5;border:1px solid var(--bronze);padding:6px 8px!important;padding:4px 0;outline:none;cursor:pointer;width:100%}
.mrow.right{border-bottom-color:var(--ok)}.mrow.wrong{border-bottom-color:var(--no)}
.mrow small{grid-column:2;font-size:12.5px;color:var(--ok)}
.ord{display:flex;flex-direction:column;gap:8px}
.ord div{display:flex;align-items:center;gap:12px;border:1px solid var(--line);padding:11px 14px;font-size:15.5px}
.ord div.right{border-color:var(--ok)}.ord div.wrong{border-color:var(--no)}
.ord .n{font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--bronze);width:18px}
.ord .t{flex:1}
.ord button{background:none;border:0;cursor:pointer;font-size:16px;color:var(--ink3);padding:0 4px}
.fl label{display:block;font-size:13px;letter-spacing:.04em;color:var(--ink2);margin-bottom:6px;font-weight:400}
.fl input,.fl textarea{width:100%;border:1px solid var(--bronze);background:#FBF9F5;font-family:'Cormorant Garamond',serif;font-size:20px;color:var(--ink);padding:10px 14px;outline:none;resize:none;border-radius:0}.fl input::placeholder,.fl textarea::placeholder{color:#B9AC9C;font-style:italic}
.fl textarea{height:96px}
.fl input:focus,.fl textarea:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(138,109,74,.12)}
.f{display:flex;flex-direction:column;gap:20px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.sz{display:flex;gap:20px;flex-wrap:wrap}
.sz button{background:#FBF9F5;border:1px solid var(--line);border-bottom:2px solid var(--line);font-family:'Cormorant Garamond',serif;font-size:24px;color:var(--ink3);cursor:pointer;padding:2px 4px 4px}
.sz button.on{color:var(--ink);border-bottom-color:var(--bronze)}
.foot{flex:none;position:relative;z-index:2;background:var(--ivory);display:flex;justify-content:space-between;align-items:center;padding-top:16px;border-top:1px solid var(--line)}
.cta,.bk{background:none;border:0;font-size:12px;letter-spacing:.24em;font-weight:400;text-transform:uppercase;cursor:pointer}
.cta{display:flex;align-items:center;gap:14px}
.cta::after{content:"";width:46px;height:1px;background:currentColor;transition:width .3s}
.cta:hover::after{width:70px}
.cta:disabled{color:var(--ink3);cursor:default}.cta:disabled::after{width:46px;opacity:.4}.cta:disabled::before{content:attr(data-hint);font-size:10.5px;letter-spacing:.14em;color:var(--bronze);text-transform:none;margin-right:4px}
.bk{color:var(--ink3)}
.bar{height:1px;background:var(--line);position:relative;margin-top:20px}.bar b{position:absolute;left:0;top:0;height:1px;background:var(--ink);transition:width .5s}
.sv{font-size:11px;letter-spacing:.2em;color:var(--ink3);text-transform:uppercase}
.sign{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:28px}
.sign small{display:block;font-family:Inter,sans-serif;font-style:normal;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--ink3);margin-top:6px}
.chap{display:flex;flex-direction:column}
.chap button{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:12px;background:none;border:0;border-bottom:1px solid var(--line);padding:13px 0;text-align:left;cursor:pointer}
.chap .r{font-family:'Cormorant Garamond',serif;font-size:20px;color:var(--bronze)}
.chap .t{font-family:'Cormorant Garamond',serif;font-size:22px}
.chap .s{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink3)}
.chap button.done .s{color:var(--ok)}
.chap button[disabled]{cursor:default;opacity:.55}
.chap img{width:22px;height:22px;vertical-align:middle}
@media(max-width:820px){#pic.paper{background-size:auto max(560px,147vw)!important;background-position:50% 46%!important}}
.main{scrollbar-width:none}.main::-webkit-scrollbar{display:none}
.main.ph{gap:14px}.stp{font-family:'Cormorant Garamond',serif;font-size:26px;color:var(--ink);margin-top:6px}.main.ph h1{font-size:clamp(30px,3vw,44px);line-height:1.05}
.chap.path button{padding:9px 0}
.chap.path .t{font-size:19px}.chap button.sub{padding:3px 0 3px 44px;grid-template-columns:40px 1fr auto;border-bottom-color:rgba(220,212,201,.6)}.chap button.sub .t{font-size:16px}.chap button.sub .r{font-size:15px}.chap button.sub img{width:18px;height:18px}
.chap button[data-p="1"][disabled]{opacity:1;cursor:default}
.wi-chips{display:flex;gap:8px;flex-wrap:wrap}
.wi-chips button{background:none;border:1px solid var(--line);padding:6px 12px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;color:var(--ink2)}
.wi-chips button.on{border-color:var(--ink);color:var(--ink)}
.wi-search{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;font-family:'Cormorant Garamond',serif;font-size:22px;padding:4px 0 8px;outline:none}
.wi-list{display:flex;flex-direction:column}
.wi-list button{background:none;border:0;border-bottom:1px solid var(--line);padding:12px 0;text-align:left;cursor:pointer;font-size:15.5px;line-height:1.4;display:flex;justify-content:space-between;gap:12px}
.wi-list button small{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink3);white-space:nowrap;padding-top:3px}
.pager{display:flex;gap:16px;align-items:center;font-size:12px;letter-spacing:.2em;color:var(--ink3)}
.pager button{background:none;border:1px solid var(--line);cursor:pointer;font-size:18px;line-height:1;padding:6px 14px;color:var(--ink)}.pager button[disabled]{opacity:.3;cursor:default}
@media(max-height:900px) and (min-width:821px){.side{padding-top:22px;padding-bottom:20px}.logo{height:44px}.main{gap:14px}h1{font-size:clamp(30px,3.2vw,42px)}.q{font-size:21px}.opt{padding:9px 14px;font-size:14.5px}.opt .say{font-size:18px}.why{font-size:14px;line-height:1.5}.lede,.lines p{font-size:15.5px}.fl textarea{height:48px}.bar{margin-top:12px}.foot{padding-top:12px}}
@media(max-width:820px){.wrap{grid-template-columns:1fr;grid-template-rows:18vh 1fr}.chap button{padding:9px 0}.chap .t{font-size:19px}.why{font-size:14px;line-height:1.5}.conf{font-size:12px;flex-wrap:wrap}.bar{margin-top:12px}.foot{padding-top:12px}.pic .cap{left:20px;bottom:12px}.side{padding:16px 20px;min-height:0}.logo{height:38px}.main{gap:14px}h1{font-size:32px}.lede,.lines p{font-size:15.5px}.q{font-size:21px}.vals{grid-template-columns:1fr 1fr 1fr;gap:8px 12px}.vals span{display:none}.opt{padding:9px 12px;font-size:14px}.opt .say{font-size:16.5px}h1{font-size:29px}}
.pl-lede{font-size:15px}
.chap.pol button{padding:10px 0}.chap.pol .t{font-size:20px}
.step-n{font-family:'Cormorant Garamond',serif;font-size:64px;line-height:1;color:var(--bronze)}.step-n small{font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink3);margin-left:10px;font-family:Inter,sans-serif}
.step{font-family:'Cormorant Garamond',serif;font-size:clamp(26px,2.6vw,34px);line-height:1.25;color:var(--ink)}
.ack{display:flex;align-items:center;gap:14px;background:none;border:1px solid var(--line);padding:14px 18px;font-size:15px;cursor:pointer;text-align:left;transition:border-color .2s,background .2s}
.ack:hover{border-color:var(--bronze)}.ack .box{width:24px;height:24px;border:1px solid var(--ink3);display:grid;place-items:center;font-size:15px;flex:none}
.ack.on{border-color:var(--ok);background:rgba(94,122,69,.07)}.ack.on .box{background:var(--ok);border-color:var(--ok);color:#fff}.ack[disabled]{cursor:default}
.sv-at{font-size:12px;letter-spacing:.12em;color:var(--ok)}
.decl{font-size:16px;line-height:1.6;color:var(--ink2)}.decl b{font-weight:400;color:var(--ink)}
.sigwrap{display:flex;flex-direction:column;gap:6px}.siglab{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2)}.siglab button{background:none;border:0;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink3);cursor:pointer}
.sigbox{width:100%;height:140px;border:1px solid var(--line);background:#FBF9F5;touch-action:none;display:block}.sigbox.done{display:flex;align-items:center;justify-content:center}.sigbox svg{width:100%;height:100%}
.rep-h{font-size:clamp(28px,2.6vw,38px)}
.rep-steps{display:flex;flex-direction:column}.rep-steps div{display:grid;grid-template-columns:20px 1fr auto;gap:10px;border-bottom:1px solid var(--line);padding:6px 0;font-size:13.5px;line-height:1.4;color:var(--ink3)}.rep-steps div.ok{color:var(--ink)}.rep-steps span{color:var(--ok)}.rep-steps small{font-size:11px;color:var(--ink3);white-space:nowrap}
.rep-sig .sigbox{height:90px}.rep-sig small{font-size:12px;color:var(--ink2)}
.pdfb{margin-left:auto;border:1px solid var(--ink)!important;padding:7px 12px!important;color:var(--ink)}
.adm{background:none;border:0;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--bronze);cursor:pointer;text-align:left}
#print{display:none}
@media print{html,body{height:auto;overflow:visible;background:#FBF9F5}.wrap{display:none}#print{display:block;font-family:Inter,sans-serif;color:#2E2A25;font-size:11px}
#print header{display:flex;gap:18px;align-items:center;border-bottom:1px solid #D9CFC2;padding-bottom:12px;margin-bottom:14px}#print header img{height:44px}#print h1{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:400}
#print section{break-inside:avoid;margin-bottom:18px}#print h2{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:400;margin-bottom:6px;color:#8A6D4A}
#print table{width:100%;border-collapse:collapse}#print td{border-bottom:1px solid #EEE7DC;padding:4px 6px;vertical-align:top}#print td.c{width:14px;color:#5E7A45}#print td.d{width:235px;white-space:nowrap;color:#857A6E;font-size:10px}
#print .ps{display:flex;gap:16px;align-items:center;margin-top:8px}#print .psig{width:220px;height:70px;border:1px solid #D9CFC2}#print .psig svg{width:100%;height:100%}#print .ns{color:#A4553F;margin-top:6px}}
.sz button{padding:6px 14px!important}.sz button.on{border-color:var(--bronze)!important;background:var(--paper)!important}
.tap{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--bronze);margin-bottom:-12px}
.wk{display:flex;flex-direction:column}.wk div{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:10px;border-bottom:1px solid var(--line);padding:10px 0;font-size:14.5px}.wk div.hd{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink3);padding-top:0}.wk div.off{color:var(--ink3)}.wk b{font-weight:400;font-family:'Cormorant Garamond',serif;font-size:19px}
.key{display:flex;flex-direction:column;gap:12px}.key div{display:flex;gap:14px;align-items:center;font-size:15px}.key i,.cal i.d{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;font-style:normal;flex:none}
.c-red{background:#C9725F;color:#fff}.c-green{background:#7E9B67;color:#fff}.c-yel{background:#EBCB7E;color:var(--ink)}.c-grey{background:#CFC6BA;color:var(--ink)}.c-off{background:transparent;color:#C4BAAE;border:1px dashed #D9CFC2}
.key small{display:block;font-size:12.5px;color:var(--ink3)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}.cal span{font-size:10px;letter-spacing:.15em;color:var(--ink3)}.cal i.d{width:100%;max-width:40px;height:auto;aspect-ratio:1;margin:auto;font-size:14px;cursor:pointer;border:1px solid transparent}.cal i.d.sel{outline:2px solid var(--ink);outline-offset:2px}.cal i.n{color:var(--ink)}
.calnote{min-height:44px;border-left:2px solid var(--bronze);padding:4px 0 4px 14px;font-size:14.5px;color:var(--ink2)}.calnote b{display:block;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--bronze);font-weight:400}
.golink{align-self:flex-start;border:1px solid var(--bronze);padding:9px 16px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink);text-decoration:none;background:#FBF9F5}
.pal{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.pal div{display:flex;flex-direction:column;gap:6px;align-items:center;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}.pal i{width:100%;aspect-ratio:1;border-radius:50%;border:1px solid var(--line)}
.relrow{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink3)}.relrow .ok{color:var(--ok)}.relrow button{border:1px solid var(--bronze);background:#FBF9F5;font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;cursor:pointer;color:var(--ink)}
#print section.cr{break-inside:auto}#print .okk{color:#5E7A45}#print .no{color:#A4553F}#print td small{color:#857A6E}
.ck{color:var(--ok);font-size:19px;font-weight:400;letter-spacing:0}
.ghost{position:absolute;right:-1vw;bottom:9vh;font-family:'Cormorant Garamond',serif;font-weight:300;font-size:min(30vw,340px);line-height:.8;color:#ECE5DB;pointer-events:none;z-index:0;letter-spacing:-.04em}
.orn{display:flex;align-items:center;gap:10px;color:#33302C;font-size:11px;max-width:220px;margin:-2px 0 2px}.orn i{flex:1;height:1px;background:#D3CABF}
.std{flex:none;text-align:center;font-size:10px;letter-spacing:.32em;color:#6F685F;margin-top:10px;text-transform:uppercase}
@media(max-width:820px){.ghost{font-size:46vw;bottom:12vh}.std{display:none}}
.side{position:relative;overflow:hidden}.main,.head,.foot,.bar{position:relative;z-index:1}
.main h1::after{content:'✦';display:block;width:130px;margin-top:10px;font-family:Inter,sans-serif;font-size:9px;line-height:10px;color:#33302C;text-align:center;letter-spacing:0;background:linear-gradient(#D3CABF,#D3CABF) left center/56px 1px no-repeat,linear-gradient(#D3CABF,#D3CABF) right center/56px 1px no-repeat}
.pic.tp{background:#E7DFD5!important}
.pic.tp::after{display:none}

.tpw .tl{position:relative;font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:#6F685F;margin-bottom:18px}

</style>
</head>
<body>
<div class="wrap">

{id:'03-words',n:'III',title:'The Words of the House',min:15,S:[
 {pic:'nails',cap:'The words of the House',t:'open',h:'The <em>Words</em><br>of the House',lede:'In this House, words are part of the treatment. The same care, the same phrases, from every one of us.',meta:'About 15 minutes · Say them out loud'},
 {id:'p_name',pic:'reception',cap:'Guess first',t:'choose',h:'Guess first',q:'How often should a client hear her own name during one visit?',o:['Once is enough','In every interaction we can, above all when she arrives and when she leaves','Never, it is too personal'],c:1,why:'The brain hears its own name through any noise. It is the fastest way to say “I see you, not a booking”. Use her name every time you can, and always in your first and your last sentence.'},
 {id:'s_new',pic:'reception',cap:'Welcome',t:'choose',say:1,h:'A new client walks in',q:'Which one do we say?',o:['Hi, do you have a booking?','Emma! Welcome in, we’re so happy you found us. I’m [your name], come with me, let me take your coat.','Hello. Take a seat, someone will be with you soon.'],c:1,why:'Her name in the first breath, your name right after, and one act of care: the coat. A new client decides in ten minutes if she returns, and minute one is yours.'},
 {id:'s_reg',pic:'reception',cap:'Welcome',t:'choose',say:1,h:'A regular arrives',q:'Which one do we say?',o:['Hi, welcome to Brazilian Soul Beauty.','Sofia! Good to see you. [Therapist] is just getting your seat ready, come on in.'],c:1,why:'A regular never hears “hi, welcome” like a stranger. She hears her name and who is waiting for her. That is belonging.'},
 {id:'s_drink_new',pic:'sink',cap:'The drink',t:'choose',say:1,h:'Offering a drink to a new client',q:'Which one do we say?',o:['Do you want something to drink?','Can I make your moment a bit more enjoyable? I can serve you a cappuccino, a herbal tea, a glass of water or a glass of wine.'],c:1,why:'We are not giving her a drink. We are giving her a moment. Naming the options makes it feel generous and easy to say yes.'},
 {id:'s_drink_who',pic:'sink',cap:'The drink',t:'choose',h:'Who is this for?',q:'“Can I serve you your favourite drink? You usually get a cappuccino with oat milk, right?”',o:['A new client','A returning client'],c:1,why:'Only a returning client. Check her card before you say it: remembering her drink before she asks is the strongest “you belong here” we have.'},
 {id:'s_drink_no',pic:'room',cap:'The drink',t:'choose',h:'When do we NOT offer a drink?',q:'In which treatment do we never offer a drink?',o:['Manicure','Waxing','Facial'],c:1,why:'Waxing. Never.'},
 {id:'m_never',pic:'stations',cap:'Never say',t:'match',h:'Never say',q:'Match each phrase we never say to what we say instead.',pairs:[['No problem.','My pleasure.'],['I do not know.','Let me find out for you.'],['That is not my job.','Let me get the right person for you.'],['Sorry for the wait.','Thank you for your patience, you have my full attention now.']]},
 {id:'s_checkout',pic:'nails',cap:'Checkout',t:'choose',say:1,h:'She arrives at the desk after her treatment',q:'Which one do we say first?',o:['That’s £46. Card or cash?','Look at those, Emma! Beautiful. Did you enjoy your time with [therapist]?'],c:1,why:'The checkout opens with her result, never with the card machine. Money is the last thing we mention.'},
 {id:'w_next',pic:'nails',cap:'From memory',t:'case',h:'From memory',q:'Her treatment is finished. Write how you offer her next visit.',a:'“Shall I hold your favourite slot for your next visit?”'},
 {id:'s_goodbye',pic:'hall',cap:'Goodbye',t:'choose',say:1,h:'She leaves without booking',q:'Which one do we say?',o:['Are you sure you don’t want to book now?','Take wonderful care of yourself, Laura. We’re here whenever you’re ready, it was a joy having you.','Bye, see you!'],c:1,why:'No pressure at the door, ever. The goodbye becomes her memory of us.'},
 {id:'o_late',pic:'reception',cap:'She is late',t:'order',h:'She arrives late',q:'Put the three steps in the right order.',items:['Reassure first: “You’re here, that’s what matters.”','Let it settle: a seat, some water, a moment.','Then adjust: focus on what makes the biggest difference today.'],why:'A late client walks in stressed. One word of blame keeps the stress firing. Warmth first, then a pause, and only then the plan, framed as a gain, never a loss.'},
 {id:'case_late',pic:'reception',cap:'Case',t:'case',h:'Case',q:'She arrives 20 minutes late and the treatment must be adapted. Write what you say to her.',a:'“You’re here, that’s what matters. Sit down for one second. So you don’t feel rushed at all, we will focus today on what makes the biggest difference, and it will look just as beautiful.”'},
 {id:'w_practise',pic:'nails',cap:'Your turn',t:'write',h:'Your turn',q:'Which phrase will you practise out loud this week?'},
 {pic:'hall',cap:'Chapter III complete',t:'done',h:'Now you speak<br>our <em>language</em>@@FIRST@@.',lede:'Say these phrases out loud until they feel like yours. Next: our calendar, hours and holidays.'}
]},
{id:'04-calendar',n:'IV',title:'Calendar',min:10,S:[
 {pic:'hall',cap:'Our calendar',t:'open',h:'Our <em>calendar</em>',lede:'Our week, your hours, and how our holiday calendar works.',meta:'About 10 minutes'},
 {id:'p_closed',pic:'reception',cap:'Guess first',t:'choose',h:'Guess first',q:'Which days is the salon closed?',o:['Saturday and Sunday','Sunday and Monday','Only Sunday'],c:1,why:'Sunday and Monday. We open Tuesday to Saturday.'},
 {pic:'reception',cap:'Our week',t:'week',h:'Our <em>week</em>'},
 {pic:'stations',cap:'Your start time',t:'read',h:'Your start time',lines:['<b>Start</b> in the salon 15 minutes before your first client.','Those 15 minutes are for <b>prep</b>: station, products, agenda.','At your client’s time, you are <b>at your station</b> with her.','Changing and breakfast happen <b>before</b> you clock in.']},
 {id:'c_ready',pic:'stations',cap:'Check',t:'choose',h:'Check',q:'Your first client is at 10:30. What time do you start in the salon, changed and ready to prep?',o:['9:45','10:15','10:30'],c:1,why:'10:15. You start 15 minutes before your first client of the day, to prep. At 10:30 you are at your station with her.'},
 {pic:'sink',cap:'Your day',t:'read',h:'Your day',lines:['<b>Clock in</b> only when you are ready.','<b>30 minute break</b> on the rota. Clock out and in.','<b>Clock out</b> at the end of your shift.']},
 {pic:'hall',cap:'Holiday calendar',t:'key',h:'How to read our <em>calendar</em>'},
 {pic:'hall',cap:'December',t:'cal',m:12,h:'December',lede:'Tap a day to see what it means.'},
 {id:'c_dec',pic:'hall',cap:'Check',t:'choose',h:'Check',q:'A day is grey on the calendar. Can you ask for a holiday on it?',o:['Yes, if I have days','No, it is blocked'],c:1,why:'No. Grey days are our busiest days, so they are blocked.'},
 {id:'c_xmas',pic:'hall',cap:'Check',t:'choose',h:'Check',q:'The salon is closed on a green day. Does it come out of your 28?',o:['Yes','No, green days do not'],c:1,why:'Green days are closed and not taken from your holidays. Red days are closed and do count.'},
 {pic:'bath',cap:'Summer',t:'cal',m:7,h:'Summer',lede:'Yellow is the summer window. You get 5 working days in summer.'},
 {id:'c_summer',pic:'bath',cap:'Check',t:'choose',h:'Check',q:'Which one can you ask for?',o:['One week in July','Two weeks in August','One week in May'],c:0,why:'One week inside the yellow window. Two weeks in summer is not possible, and May has blocked days.'},
 {pic:'room',cap:'Easter',t:'cal',m:4,h:'Easter',lede:'Red days: the salon is closed and they count as holiday.'},
 {pic:'room',cap:'Your holidays',t:'read',h:'Your <em>holidays</em>',lines:['<b>28 days</b> a year for full time, bank holidays included.','<b>January to December</b> is our holiday year.','<b>Always closed:</b> the first weeks of January and Easter. These days count as holiday.','<b>1 December</b> requests open for the next year.']},
 {pic:'room',cap:'Fair for everyone',t:'read',h:'Fair for <em>everyone</em>',lines:['Every year, around November, we plan the new calendar.','<b>Between Christmas and New Year</b> it changes every year. Some years we work, some years we close <b>green</b> days, so everyone rests more.','Green days do not give you extra days.','Days right after key holidays go by <b>rotation</b>.','You cannot go over your allowance.']},
 {pic:'bath',cap:'Longer breaks',t:'read',h:'Longer <em>breaks</em>',lines:['More than 2 weeks? Only in <b>January</b>, if there is space.','It goes by <b>rotation</b>: if you had it last year, someone who has not goes first.','Two people who have not had it? <b>Time with us</b> decides.']},
 {id:'c_jan',pic:'bath',cap:'Check',t:'choose',h:'Check',q:'You took 3 weeks last January. This year a colleague who never had it asks for the same weeks. Who goes first?',o:['Me, I asked first','My colleague','Whoever has more days left'],c:1,why:'Your colleague. It goes by rotation, so everyone gets a turn. If neither had it, time with us decides.'},
 {pic:'sink',cap:'Unpaid leave',t:'read',h:'No unpaid <em>leave</em>',lines:['Full time is <b>43 hours</b> a week. That gives you <b>28 paid days</b>.','We do not offer unpaid days on top.','Need one more day? Ask for a <b>paid extra day</b>, well in advance.','It is approved only if the team is covered. Nobody works alone.']},
 {id:'c_extra',pic:'sink',cap:'Check',t:'choose',h:'Check',q:'Your holidays are finished and you need one more day. What happens?',o:['I take an unpaid day','I ask for a paid extra day, early, and it depends on cover','It is never possible'],c:1,why:'A paid extra day, planned well in advance, and only if the team is covered.'},
 {pic:'reception',cap:'Before you ask',t:'read',h:'Before you <em>ask</em>',lines:['<b>✓</b> The dates are not blocked.','<b>✓</b> You still have days left.','<b>✓</b> You still have days for that weekday.','<b>✓</b> You signed the Holiday Policy.']},
 {pic:'reception',cap:'Where to see it',t:'read',h:'Where to <em>see it</em>',lines:['<b>1</b> Check the Holidays calendar.','<b>2</b> Ask on Connecteam: Request Time Off.','<b>3</b> January, or no calendar yet? Talk to management.','<b>4</b> Wait for approval before you book any travel.'],link:['Open Holidays','https://bsb-holidays.vercel.app']},
 {id:'case_trip',pic:'reception',cap:'Case',t:'case',h:'Case',q:'You found cheap flights for July. What do you do?',a:'Check the Holidays calendar, ask on Connecteam, and only buy the flights after it is approved.'},
 {pic:'hall',cap:'Chapter IV complete',t:'done',h:'Now you know<br>our <em>rhythm</em>@@FIRST@@.',lede:'Next: our policies.'}

{id:'07-etiquette',n:'VI',title:'Etiquette',min:12,S:[
 {pic:'room',cap:'Etiquette',t:'open',h:'<em>Etiquette</em>',lede:'How we move, speak and care in this House, from the first hello to the last goodbye.',meta:'About 12 minutes'},
 {id:'w_name',pic:'reception',cap:'Her name',t:'case',h:'Her name, every time',q:'She sits down at your station. Write what you say, using her name.',a:'“Emma, can I serve you a nice cappuccino, herbal tea, or a glass of water?” Her name in every interaction, above all at the start and at the end.'},
 {pic:'stations',cap:'Clean first',t:'read',h:'Clean <em>first</em>',lines:['Every manicure starts by cleaning her hands with <b>alcohol</b>.','Files, buffers and towels are <b>single use</b>.','Metal tools are <b>sterilised and sealed</b>. Open them in front of her.','Wax: <b>never double dip</b>.']},
 {id:'m_clean',pic:'stations',cap:'Check',t:'match',h:'Match them',q:'What happens to each one?',pairs:[['Nail file','Single use'],['Metal tools','Sterilised and sealed'],['Wax spatula','Never double dip'],['Her hands','Alcohol first']]},
 {pic:'bath',cap:'A quiet House',t:'read',h:'A quiet <em>House</em>',lines:['Put things down gently. Never throw tools or rubbish.','Never push things with your foot.','Walk softly near the rooms and in front of clients.','In the kitchen, keep your voice low. No loud calls with earphones.','Always remember: a client may be in the massage room.']},
 {id:'c_bin',pic:'stations',cap:'Check',t:'choose',h:'Check',q:'Your client is sitting with you. You need to throw away some rubbish. What do you do?',o:['Throw it into the bin from my seat','Get up, walk to the bin and put it in gently','Pull the bin closer with my foot'],c:1,why:'In front of a client, every gesture is part of the service. Walk there and put it in gently.'},
 {id:'c_tools',pic:'stations',cap:'Check',t:'choose',h:'Check',q:'You finish with a tool. How does it go back in the box?',o:['Dropped in quickly, I am busy','Placed gently, without noise'],c:1,why:'Placed gently. Throwing tools makes noise and looks careless to the client.'},
 {id:'c_kitchen',pic:'sink',cap:'Check',t:'choose',h:'Check',q:'On your break in the kitchen, you are on a call with earphones. What do you do?',o:['Talk as usual','Keep my voice low, a client may be in the massage room'],c:1,why:'Keep your voice low. Earphones make us speak louder without noticing.'},
 {pic:'reception',cap:'Voice and topics',t:'read',h:'Voice and <em>topics</em>',lines:['Cordial, always. With clients and with each other.','A calm, low voice.','No politics, personal problems or team matters in front of clients.']},
 {pic:'room',cap:'Discretion',t:'read',h:'<em>Discretion</em>',lines:['What a client tells you stays here.','No gossip about clients or colleagues.','Worried about something? Talk to management.']},
 {pic:'stations',cap:'Your station',t:'read',h:'Your <em>station</em>',lines:['Clean and ready before every client.','Phone in your locker.','No eating on the salon floor.']},
 {pic:'nails',cap:'The finish',t:'read',h:'The <em>finish</em>',lines:['Recommend the <b>cuticle oil</b>.','It keeps the cuticle hydrated, so the manicure lasts longer.','Use it every day.']},
 {id:'c_bye',pic:'nails',cap:'Check',t:'choose',say:1,h:'Which is our goodbye?',q:'The treatment is finished.',o:['Thank you so much for coming, see you soon!','Emma, it was a pleasure to look after your hands today. I hope to see you soon.'],c:1,why:'Her name, the care you gave, and an invitation to come back.'},
 {id:'c_hand',pic:'reception',cap:'Check',t:'choose',say:1,h:'Handover',q:'You finish and your next client is waiting. What do you say?',o:['Ok, you can go now.','Emma, Joana will look after you now at reception.','Nothing, I just go to my next client.'],c:1,why:'She always knows who looks after her next and where to go.'},
 {id:'case_pol',pic:'room',cap:'Case',t:'case',h:'Case',q:'A client starts talking about politics. What do you do?',a:'Listen kindly, do not share your view, and gently bring the talk back to her and her treatment.'},
 {pic:'hall',cap:'Chapter VI complete',t:'done',h:'Grace in every<br><em>detail</em>@@FIRST@@.',lede:'Next: our image and uniform.'}
]},
{id:'08-image',n:'VII',title:'Image & Uniform',min:9,S:[
 {pic:'vg_cover',cap:'Vanilla Girl',t:'open',h:'The <em>Vanilla Girl</em>',lede:'Our look is minimal, neutral and elegant. Simple pieces, impeccable care, every day.',meta:'About 9 minutes'},
 {id:'p_vanilla',pic:'vg_brunette',cap:'Guess first',t:'choose',h:'Guess first',q:'Which colours make the Vanilla Girl look?',o:['Bright and neon','White, nude, beige and soft neutrals','Black only'],c:1,why:'White, nude, beige, grey and soft pastels. Clean, calm and elegant.'},
 {pic:'vg_uniform',cap:'Your uniform',t:'read',h:'Your <em>uniform</em>',lines:['<b>We give you</b> cardigan, long sleeve top, trousers, belt and trainers.','<b>In summer</b> a short sleeve top.','Only what we give you. Nothing from home.','Clean and ironed, every shift.']},
 {pic:'vg_coat',cap:'Look after it',t:'read',h:'Look <em>after it</em>',lines:['Your trainers <b>stay at the salon</b>. Always clean.','Polish or paint stains come from carelessness. Look after your uniform.','<b>Repeated carelessness</b> means a written warning, and then the cost <b>comes from your salary</b>.','Worn out with time and use? <b>We replace it.</b>']},
 {id:'c_stain',pic:'vg_coat',cap:'Check',t:'choose',h:'Check',q:'You keep staining your trousers with nail polish. What happens?',o:['BSB keeps giving me new ones','A written warning, and then the cost comes from my salary','Nothing happens'],c:1,why:'Repeated carelessness means a warning, and then the cost is taken from your salary. Wear from time and use is on us.'},
 {pic:'vg_knit',cap:'The small details',t:'read',h:'The small <em>details</em>',lines:['Our uniform is light.','<b>No coloured socks. No coloured bra.</b>','Nude, white, beige or pastel only.','Deodorant always. Only a soft perfume.']},
 {pic:'vg_bag',cap:'Our palette',t:'pal',h:'Our <em>palette</em>',lede:'Watch, scrunchie, clip, headband, bracelet: anything you wear must match our palette and our style.'},
 {id:'c_tie',pic:'vg_curls',cap:'Check',t:'choose',h:'Check',q:'Which hair tie can you wear?',o:['A red velvet scrunchie','A caramel hair tie','A neon pink clip'],c:1,why:'Caramel is in our palette. Red and neon are not.'},
 {pic:'vg_ears',cap:'Jewellery',t:'read',h:'<em>Jewellery</em>',lines:['Small and discreet.','<b>Silver, gold or pearl.</b>','Earrings, necklace and bracelet, all simple.']},
 {pic:'vg_mk1',cap:'Makeup',t:'read',h:'<em>Makeup</em>',lines:['Glowing, well cared skin. Light foundation, a touch of highlighter.','<b>Eyes</b> neutral shadow, beige, brown or grey. Mascara. No heavy false lashes.','<b>Cheeks</b> a soft, natural blush.','<b>Lips</b> nude, light pink or soft brown. Balm or gloss.']},
 {id:'m_look',pic:'vg_mk2',cap:'Check',t:'match',h:'Match them',q:'What is our standard for each one?',pairs:[['Lips','Nude or soft pink'],['Eyes','Neutral shadow and mascara'],['Earrings','Small and discreet'],['Perfume','Soft, never strong']]},

 if(pSigned(i))PV.si=0;else{const k=p.steps.findIndex((x,j)=>!pAck(p,j));PV.si=k<0?p.steps.length+1:(k==0?0:k+1)}

function polScreen(){
 const p=POL[PV.pi],S=polScreens(p),s=S[PV.si],no=String(PV.pi+1).padStart(2,'0');
 frame(POLPIC[PV.pi%POLPIC.length],p.title,'Policy '+no+' · '+String(PV.si+1).padStart(2,'0')+' / '+String(S.length).padStart(2,'0'),(PV.si+1)/S.length*100);

  let enc=PV.pts.map(st=>st.map(q=>q[0]+','+q[1]).join(';')).join('|');while(enc.length>3300){PV.pts=PV.pts.map(st=>st.filter((q,k)=>k%2==0||k==st.length-1));enc=PV.pts.map(st=>st.map(q=>q[0]+','+q[1]).join(';')).join('|')}
  setv(PC,f,{name:PV.name.trim(),at:new Date().toISOString(),w:cv.clientWidth,h:cv.clientHeight,pts:enc,min:Math.max(1,Math.round((Date.now()-PV.T)/60000))});

function sigWire(){const cv=$('sgcv'),r=window.devicePixelRatio||1,W=cv.clientWidth,Hh=cv.clientHeight;cv.width=W*r;cv.height=Hh*r;const x=cv.getContext('2d');x.scale(r,r);x.lineWidth=2;x.lineCap='round';x.lineJoin='round';x.strokeStyle='#2E2A25';
 const draw=()=>{x.clearRect(0,0,W,Hh);PV.pts.forEach(st=>{x.beginPath();st.forEach((q,k)=>k?x.lineTo(q[0],q[1]):x.moveTo(q[0],q[1]));if(st.length==1)x.lineTo(st[0][0]+.5,st[0][1]);x.stroke()})};draw();
 const pos=e=>{const b=cv.getBoundingClientRect();return [Math.round(e.clientX-b.left),Math.round(e.clientY-b.top)]};
 cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);PV.stroke=[pos(e)];PV.pts.push(PV.stroke);draw()};
 cv.onpointermove=e=>{if(!PV.stroke)return;const q=pos(e),l=PV.stroke[PV.stroke.length-1];if(Math.abs(q[0]-l[0])+Math.abs(q[1]-l[1])<3)return;PV.stroke.push(q);draw()};
 cv.onpointerup=cv.onpointercancel=()=>{PV.stroke=null;$('nx').disabled=!(PV.pts.length&&(PV.name||'').trim())};
 $('sgc').onclick=()=>{PV.pts=[];draw();$('nx').disabled=true};
 $('sgn').oninput=e=>{PV.name=e.target.value;$('nx').disabled=!(PV.pts.length&&PV.name.trim())}}
function sigSvg(sg){const d=(sg.pts||'').split('|').filter(Boolean).map(st=>st.split(';').map((q,k)=>(k?'L':'M')+q.replace(',',' ')).join(' ')).join(' ');
 return `<svg viewBox="0 0 ${sg.w||400} ${sg.h||140}" preserveAspectRatio="xMidYMid meet"><path d="${d}" fill="none" stroke="#2E2A25" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`}

 return `<div class="fl"><label>${x.l}</label><input placeholder="Write here…" type="${x.ty||'text'}" data-f="${x.id}" value="${esc(v)}"></div>`}
const ff=s=>s.f.flatMap(x=>x.two||[x]);
const formOk=s=>ff(s).every(x=>(get(CH[ci].id,x.id)||'').trim());
function wire(s,c,id,st){
 document.querySelectorAll('.cal i.d').forEach(e=>e.onclick=()=>{CALSEL=+e.dataset.d;screen()});
 if(s.t=='sign'&&$('sgcv'))sigWire();
 document.querySelectorAll('[data-f]').forEach(e=>{if(e.tagName=='BUTTON')e.onclick=()=>{setv(c,e.dataset.f,e.dataset.v);screen()};else e.oninput=()=>{setv(c,e.dataset.f,e.value);$('nx').disabled=!formOk(s)}});
 document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{st.v=+b.dataset.i;st.ok=st.v==s.c;setv(c,id,st);screen()});
 document.querySelectorAll('[data-cf]').forEach(b=>b.onclick=()=>{st.conf=b.dataset.cf;setv(c,id,st);screen()});
 document.querySelectorAll('[data-m]').forEach(e=>e.onchange=()=>{st.sel=st.sel||{};st.sel[e.dataset.m]=e.value;setv(c,id,st);$('nx').disabled=!s.pairs.every((p,i)=>st.sel[i])});
 document.querySelectorAll('[data-up],[data-dn]').forEach(b=>b.onclick=()=>{const k=+(b.dataset.up??b.dataset.dn),j=b.dataset.up!=null?k-1:k+1;if(j<0||j>=st.ord.length)return;[st.ord[k],st.ord[j]]=[st.ord[j],st.ord[k]];setv(c,id,st);screen()});
 document.querySelectorAll('[data-w]').forEach(e=>e.oninput=()=>{st.v=e.value;setv(c,id,st);$('nx').disabled=!e.value.trim()});
}
async function next(){
 if(view=='home')return;
 const C=CH[ci],s=C.S[si],c=C.id,id=s.id,st=id?(get(c,id)||{}):{};
 if(s.t=='read'&&(s._n||1)<s.lines.length){s._n=(s._n||1)+1;return screen()}
 if(s.t=='match'&&!st.checked){st.sel=st.sel||{};st.checked=1;st.ok=s.pairs.every((p,i)=>st.sel[i]==p[1]);setv(c,id,st);await save(c,[id]);return screen()}
 if(s.t=='order'&&!st.checked){st.checked=1;st.ok=st.ord.every((ix,k)=>ix==k);setv(c,id,st);await save(c,[id]);return screen()}
 if(s.t=='case'&&!st.seen){st.seen=1;setv(c,id,st);await save(c,[id]);return screen()}
 if(s.t=='sign'&&!st.at){const cv=$('sgcv');let enc=PV.pts.map(q=>q.map(z=>z[0]+','+z[1]).join(';')).join('|');while(enc.length>3300){PV.pts=PV.pts.map(q=>q.filter((z,k)=>k%2==0||k==q.length-1));enc=PV.pts.map(q=>q.map(z=>z[0]+','+z[1]).join(';')).join('|')}setv(c,id,{name:(PV.name||'').trim(),at:new Date().toISOString(),w:cv?cv.clientWidth:400,h:cv?cv.clientHeight:140,pts:enc});PV.pts=[]}
 $('nx').disabled=true;
 let okSave=true;
 if(s.t=='form')okSave=await save(c,ff(s).map(x=>x.id));
 else if(id)okSave=await save(c,[id]);
 if(s.t=='done'){const mins=Math.max(1,Math.round((Date.now()-T0)/60000));setv(c,'__done',new Date().toISOString());setv(c,'__minutes',String(mins));okSave=await save(c,['__done','__minutes']);if(!okSave){setv(c,'__done',undefined);$('nx').disabled=false;return}return goNext()}
 if(!okSave){$('nx').disabled=false;return}
 if(si<C.S.length-1){si++;CALSEL=null;screen()}
}
function goNext(){const nk=CH.findIndex((x,k)=>k>ci&&!x.soon&&!chDone(x));if(nk<0){view='home';return render()}if(!unlocked(nk)){view='home';return render()}ci=nk;if(CH[ci].pol){view='pol';PV.pg=0;return polHome()}si=resumeAt(CH[ci]);T0=Date.now();view='ch';return render()}
function back(){if(view=='tr'||view=='pol'){view='home';return render()}if(view=='ps')return polBack();if(view=='rep'){if(RP.open!=null){RP.open=null;return report()}if(RP.who){RP.who=null;return report()}view='home';return render()}if(view=='wi'){if(WI.open!=null){WI.open=null;return whatif()}view='home';return render()}if(view=='ch'){CALSEL=null;if(si>0){si--;screen()}else{view='home';render()}}}

/* ---------- WHAT IF ---------- */
async function loadWI(){if(!WI.rows.length){try{WI.rows=await (await fetch(SBU+'bsb_onb_whatif?active=is.true&order=sort',{headers:H})).json()}catch(e){WI.rows=[]}}whatif()}
function whatif(){
 frame('reception','Questions','',0);$('bk').style.visibility='visible';
 const rows=WI.rows.filter(r=>ROLE=='all'||r.roles=='all'||r.roles.split(',').includes(ROLE));
 if(WI.open!=null){const r=rows.find(x=>x.id==WI.open);$('main').innerHTML=`<div class="num">Questions · ${esc(r.area)}</div><p class="q">${esc(r.q)}</p><div class="why"><b>In this House</b>${esc(r.a)}</div>`;$('nx').textContent='All situations';$('nx').disabled=false;$('nx').onclick=()=>{WI.open=null;whatif()};return}
 const areas=['All',...new Set(rows.map(r=>r.area))];
 const f=rows.filter(r=>(WI.area=='All'||r.area==WI.area)&&(!WI.qq||(r.q+' '+r.a).toLowerCase().includes(WI.qq.toLowerCase())));
 const per=6,pages=Math.max(1,Math.ceil(f.length/per));WI.pg=Math.min(WI.pg,pages-1);
 $('main').innerHTML=`<div class="num">Questions</div><h1>What if…</h1><input class="wi-search" id="wq" placeholder="Search a situation" value="${esc(WI.qq)}"><div class="wi-chips">${areas.map(a=>`<button data-a="${esc(a)}" class="${a==WI.area?'on':''}">${esc(a)}</button>`).join('')}</div>
 <div class="wi-list">${f.slice(WI.pg*per,WI.pg*per+per).map(r=>`<button data-o="${r.id}"><span>${esc(r.q)}</span><small>${esc(r.area)}</small></button>`).join('')||'<p class="lede">Nothing found.</p>'}</div>
 <div class="pager"><button id="pp" ${WI.pg?'':'disabled'}>‹</button>${WI.pg+1} / ${pages}<button id="pn" ${WI.pg<pages-1?'':'disabled'}>›</button></div>`;
 $('nx').textContent='My path';$('nx').disabled=false;$('nx').onclick=()=>{view='home';render()};
 $('wq').oninput=e=>{WI.qq=e.target.value;WI.pg=0;const p=e.target.selectionStart;whatif();const n=$('wq');n.focus();n.setSelectionRange(p,p)};
 document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{WI.area=b.dataset.a;WI.pg=0;whatif()});
 document.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{WI.open=+b.dataset.o;whatif()});
 $('pp').onclick=()=>{WI.pg--;whatif()};$('pn').onclick=()=>{WI.pg++;whatif()};
}

$('bk').onclick=()=>{if(view=='home'&&ADMIN){view='rep';RP.who=null;return report()}back()};
$('logo').onclick=()=>{if(!AUTH)return;view='home';render()};
function bindNext(){$('nx').onclick=next}
const _render=render;render=function(){bindNext();_render()};
const _screen=screen;screen=function(){bindNext();_screen()};
function stepDone(C,s){if(!s.id)return true;const v=get(C.id,s.id);
 if(s.t=='form')return ff(s).every(x=>(get(C.id,x.id)||'').trim());
 if(!v)return false;if(s.t=='choose')return v.v!=null&&!!v.conf;if(s.t=='match'||s.t=='order')return !!v.checked;if(s.t=='case')return !!v.seen;if(s.t=='write')return !!(v.v||'').trim();if(s.t=='sign')return !!v.at;return true}
function resumeAt(C){if(chDone(C))return 0;const k=C.S.findIndex(s=>!stepDone(C,s));if(k<=C.S.findIndex(s=>s.id))return 0;const prev=C.S[k-1];return (prev.t=='read'||prev.t=='vals')?k-1:k}
function blocked(kind){frame('reception','Brazilian Soul Beauty','',0);$('bk').style.visibility='hidden';$('nx').style.visibility='hidden';
 const msg={nolink:['Please use your personal link','Your onboarding link has your name and a code. Ask Front of House or your manager to send it to you.'],badcode:['This link is not valid','Please ask your manager for your personal onboarding link.'],offline:['We could not connect','Check your internet and refresh the page.']}[kind];
 $('main').innerHTML=`<div class="num">The BSB Way</div><h1>${msg[0]}</h1><p class="lede">${msg[1]}</p>`}
load().then(async st=>{if(st=='ok'){await checkAdmin();render()}else blocked(st)});
</script>
