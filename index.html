<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json">
<title>Soul Path</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@1,600&display=swap">
<style>
:root{--bg:#F4F3F8;--card:#fff;--ink:#1F1D2B;--muted:#6B6880;--faint:#A3A1B5;--line:#E6E4EF;--p:#6D4AFF;--p2:#9B7BFF;--ps:#EEE9FF;--ok:#1F9D6B;--oks:#E3F6EE;--no:#D0485C;--nos:#FDECEF;--wa:#C98A0B;--was:#FFF4DC}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font:400 15px/1.4 Inter,system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
#app{height:100vh;display:flex;flex-direction:column;padding:18px 22px 16px;gap:14px}
/* top */
.top{display:flex;align-items:center;gap:14px}
.me{display:flex;align-items:center;gap:12px;min-width:0}
.av{width:46px;height:46px;border-radius:50%;background:var(--ps);color:var(--p);display:grid;place-items:center;font-weight:700;font-size:18px;overflow:hidden;flex:none;box-shadow:0 0 0 3px #fff,0 0 0 5px var(--ps)}
.av{position:relative}.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.me b{font-size:19px;font-weight:700;display:block}
.me span{font-size:12.5px;color:var(--muted)}
.sp{flex:1}
.seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{padding:7px 14px;border-radius:9px;font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button.on{background:var(--p);color:#fff}
.nav{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:3px 4px}
.nav button{width:34px;height:32px;border-radius:9px;font-size:18px;color:var(--muted)}
.nav button:disabled{opacity:.25}
.nav b{min-width:150px;text-align:center;font-weight:600;font-size:13.5px}
/* tabs */
.tabs{display:flex;gap:8px}
.tab{padding:9px 16px;border-radius:12px;background:#fff;border:1px solid var(--line);font-weight:600;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:7px}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tab i{font-style:normal;font-size:11px;background:var(--ps);color:var(--p);padding:2px 7px;border-radius:99px}
/* main */
main{flex:1;min-height:0;display:grid;grid-template-columns:330px 1fr;gap:14px}
.hero{border-radius:22px;padding:22px;color:#fff;background:radial-gradient(120% 90% at 0% 0%,#8F6BFF 0%,#6D4AFF 45%,#4A2FD0 100%);display:flex;flex-direction:column;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;bottom:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.08);pointer-events:none}
.hero small{font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.75;font-weight:600}
.hero h2{font:italic 600 34px/1.05 "Cormorant Garamond",serif;margin:6px 0 2px}
.hero p{margin:0;opacity:.85;font-size:13.5px}
.ring{position:relative;width:190px;height:190px;margin:auto}
.ring svg{transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .c b{font-size:56px;font-weight:800;line-height:1;letter-spacing:-2px}
.ring .c span{display:block;font-size:13px;opacity:.85;margin-top:4px}
.verdict{background:rgba(255,255,255,.14);border-radius:14px;padding:12px 14px;font-size:13.5px;font-weight:500;display:flex;gap:10px;align-items:center;z-index:1}
.verdict em{font-style:normal;font-size:22px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);gap:14px;min-height:0}
.tile{background:var(--card);border-radius:20px;padding:16px 16px 14px;display:flex;flex-direction:column;text-align:left;border:1px solid var(--line);position:relative;overflow:hidden;opacity:0;transform:translateY(10px);animation:in .5s cubic-bezier(.2,.8,.2,1) forwards}
.tile:active{transform:scale(.98)}
@keyframes in{to{opacity:1;transform:none}}
.tile .h{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.tile .h em{font-style:normal;font-size:20px}
.chip{margin-left:auto;white-space:nowrap;flex:none;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px}
.chip.ok{background:var(--oks);color:var(--ok)}.chip.no{background:var(--nos);color:var(--no)}.chip.na{background:#F1F0F6;color:var(--faint)}
.tile .big{font-size:40px;font-weight:800;letter-spacing:-1.5px;margin:auto 0 2px;line-height:1}
.tile .big small{font-size:16px;font-weight:600;color:var(--faint);letter-spacing:0}
.tile .sub{font-size:12.5px;color:var(--muted);min-height:34px}
.tile.ok{border-color:#CDEBDD}.tile.no{border-color:#F4CCD3}
.tile .bar{height:6px;border-radius:4px;background:#EEEDF4;overflow:hidden;margin-top:8px}
.tile .bar b{display:block;height:100%;width:0;border-radius:4px;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.tile.ok .bar b{background:var(--ok)}.tile.no .bar b{background:var(--no)}.tile.na .bar b{background:var(--faint)}
.tri{display:flex;gap:6px;margin:auto 0 4px}
.tri div{flex:1;background:#F7F6FB;border-radius:10px;padding:7px 4px;text-align:center}
.tri b{display:block;font-size:20px;font-weight:800}
.tri span{font-size:11px;color:var(--muted)}
.hero.gold{background:radial-gradient(120% 90% at 0% 0%,#F2C46D 0%,#D99A3A 45%,#A8661E 100%)}
.span2{grid-column:span 2}
.lad{position:relative;height:10px;border-radius:6px;background:#EEEDF4;margin:14px 0 6px}
.lad b{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:linear-gradient(90deg,var(--p2),var(--p));width:0;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.lad i{position:absolute;top:-5px;width:2px;height:20px;background:#fff;box-shadow:0 0 0 1px var(--line)}
.ladl{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.ladl span{flex:1;text-align:center}
.arrow{font-size:13px;font-weight:700;margin-left:6px}.arrow.up{color:var(--ok)}.arrow.dn{color:var(--no)}
.rv{display:flex;flex-direction:column;gap:7px;margin-top:10px;overflow:hidden}
.rv div{background:#F7F6FB;border-radius:10px;padding:7px 10px;font-size:12.5px;display:flex;gap:8px}
.rv div b{color:#E2A400;letter-spacing:1px}
.logb{display:flex;flex-direction:column;gap:9px;margin-top:auto}
.logb button{background:var(--ps);color:var(--p);border-radius:14px;padding:12px;font-weight:700;font-size:14.5px;display:flex;align-items:center;justify-content:center;gap:8px}
.logb button:active{transform:scale(.97);background:#E0D7FF}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:600;z-index:30;animation:pop .25s}
.wait{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#fff;border-radius:22px;text-align:center;color:var(--muted)}
.wait em{font-style:normal;font-size:48px}
.bands{display:grid;grid-template-rows:auto 1fr auto 1fr auto;gap:8px;min-height:0}
.bh{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px;margin-top:2px}
.row{display:grid;gap:10px;min-height:0}
.row .tile{padding:12px 13px 11px;border-radius:16px}
.row .tile .big{font-size:30px}
.row .tile .sub{min-height:0;font-size:11.5px}
.row .tile .h{font-size:13px}
.earn{display:grid;grid-template-columns:repeat(3,1fr) 1.6fr;gap:10px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;align-items:center}
.earn div b{display:block;font-size:24px;font-weight:800;letter-spacing:-.5px}
.earn div span{font-size:11.5px;color:var(--muted)}
.earn .tot b{color:var(--ok)}
.allin>div:not(:first-child){padding-left:14px}.allin>div:not(:first-child) b{font-size:21px}.allin>div:not(:first-child) span{font-size:12px}
.earn .coh{background:#F7F6FB;border-radius:12px;padding:8px 12px;font-size:12px;color:var(--ink);line-height:1.5}
.top-rated{display:inline-flex;align-items:center;gap:5px;background:linear-gradient(90deg,#F2C46D,#D99A3A);color:#fff;font-weight:700;font-size:11px;padding:3px 9px;border-radius:99px}
.soon{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#fff;border-radius:22px;border:1px dashed var(--line);grid-column:1/-1;color:var(--muted);text-align:center}
.soon em{font-style:normal;font-size:44px}
.emc{display:flex;flex-direction:column;gap:12px;min-height:0}
.emc .grid{flex:1}
.fil{display:flex;gap:6px;flex-wrap:nowrap;align-items:center}
.fil button{padding:7px 11px;white-space:nowrap;border-radius:99px;background:#fff;border:1px solid var(--line);font-weight:600;font-size:13px}
.fil button.on{background:#0F6B47;color:#fff;border-color:#0F6B47}
.emn{display:flex;flex-direction:column;gap:6px;margin:auto 0}
.emn button{display:flex;align-items:center;gap:10px;text-align:left;color:#fff;padding:10px 12px;border-radius:14px;font-weight:600;font-size:15px;background:transparent}
.emn button.on{background:rgba(255,255,255,.2)}
.emn button em{font-style:normal;font-size:20px}
.pc{cursor:pointer}.pc .t{font-weight:700;font-size:15px;margin-top:8px;line-height:1.25}
.pc .k{font-size:11px;font-weight:700;color:#0F6B47;background:#E3F6EE;padding:3px 8px;border-radius:99px;align-self:flex-start}
.pc.known{border-color:#1F9D6B;box-shadow:inset 0 0 0 1px #1F9D6B}
.thumb{width:100%;flex:1;min-height:0;border-radius:12px;background:#000 center/cover no-repeat;position:relative;margin-top:8px}
.thumb:after{content:'▶';position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:30px;text-shadow:0 2px 10px rgba(0,0,0,.5)}
.say{background:#E3F6EE;color:#0F6B47;border-radius:14px;padding:12px 14px;font-size:15px;font-weight:600}
.vid{width:100%;aspect-ratio:16/9;border:0;border-radius:14px}
.bigbtn{padding:14px;border-radius:14px;font-weight:700;font-size:15px;background:#0F6B47;color:#fff}
.bigbtn.done{background:#E3F6EE;color:#0F6B47}
.flame{font-size:64px;line-height:1;filter:drop-shadow(0 6px 18px rgba(255,140,60,.45));animation:flk 2.4s ease-in-out infinite}
@keyframes flk{50%{transform:scale(1.06) rotate(-2deg)}}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px}
.wk button{display:flex;flex-direction:column;align-items:center;gap:5px;color:#fff;font-size:11px;font-weight:600;opacity:.85;padding:6px 0;border-radius:12px}
.wk button.on{background:rgba(255,255,255,.18);opacity:1}
.wk i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:11px;background:rgba(255,255,255,.18)}
.wk i.g{background:#4BE3A0;color:#0F5B3A}.wk i.y{background:#FFD36B;color:#7A5300}.wk i.t{box-shadow:0 0 0 2px #fff}
.tl{display:flex;gap:6px;margin-top:auto;align-items:flex-end}
.tl div{flex:1;display:flex;flex-direction:column;gap:5px;min-width:0}
.tl b{height:10px;border-radius:99px;background:#E9E6F3}.tl .d b{background:var(--ok)}.tl .n b{background:var(--p)}
.tl span{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pills{display:flex;gap:6px;margin-top:auto}
.pills span{flex:1;text-align:center;padding:10px 0;border-radius:12px;background:#F4F3F8;font-size:12px;font-weight:700;color:var(--faint)}
.pills span.ok{background:var(--oks);color:var(--ok)}
.big small.nx{display:inline-block;max-width:60%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:baseline}
.quote{font-size:14.5px;line-height:1.45;color:var(--ink);margin-top:10px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.boom{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.boom i{position:absolute;top:-30px;font-style:normal;font-size:26px;animation:fall 2.2s cubic-bezier(.2,.7,.4,1) forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.2}}
.strip{display:flex;flex-wrap:wrap;gap:4px;margin-top:12px}
.strip i{width:9px;height:9px;border-radius:3px;background:#EEEDF3}
.strip i.g{background:#3CC48A}.strip i.r{background:#E46A7C}.strip i.p{background:#C9C6D6}
.bands.b1{grid-template-rows:auto 1fr}.bands.b2{grid-template-rows:auto 1fr auto auto}
.bands.b1 .row{grid-template-rows:1fr 1fr}.bands.b2 .row{grid-template-rows:1fr 1fr}
.hr{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.hr div{background:rgba(255,255,255,.16);border-radius:14px;padding:10px 12px}
.hr b{display:block;font-size:22px;font-weight:800}.hr span{font-size:11.5px;opacity:.9}
.nx{background:rgba(0,0,0,.14);border-radius:14px;padding:10px 12px;margin-top:8px;display:flex;flex-direction:column;gap:5px}
.nh{font-size:12px;opacity:.95;display:flex;gap:6px;align-items:center}.nh b{font-size:14px}.nh span{margin-left:auto;background:#fff;color:#0F6B47;font-weight:800;border-radius:99px;padding:2px 8px;font-size:11.5px}
.ni{font-size:12.5px;display:flex;align-items:center;gap:8px}.ni i{display:none}.ni em{font-style:normal;opacity:.8;margin-left:auto}
/* sheet */
.sheet{position:fixed;inset:0;background:rgba(31,29,43,.35);display:none;align-items:center;justify-content:center;z-index:9}
.sheet.on{display:flex}
.panel{background:#fff;border-radius:24px;padding:22px;width:min(760px,92vw);max-height:86vh;display:flex;flex-direction:column;gap:14px;animation:pop .25s ease}
@keyframes pop{from{transform:scale(.96);opacity:0}}
.panel .ph{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px}
.panel .ph em{font-style:normal;font-size:24px}
.panel .ph button{margin-left:auto;width:36px;height:36px;border-radius:50%;background:#F1F0F6;font-size:18px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.cal .dw{font-size:11px;color:var(--faint);text-align:center;font-weight:600}
.dc{border-radius:12px;padding:7px 6px;min-height:56px;background:#F7F6FB;font-size:11.5px;color:var(--faint)}
.dc b{display:block;font-size:13px;color:var(--ink)}
.dc.ok{background:var(--oks);color:var(--ok)}.dc.no{background:var(--nos);color:var(--no)}
.dc.off{background:transparent;border:1px dashed var(--line)}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;gap:10px;align-items:center;background:#F7F6FB;border-radius:12px;padding:10px 12px;font-size:13.5px}
.li b{min-width:86px}
.rule{font-size:12.5px;color:var(--muted);background:var(--ps);border-radius:12px;padding:10px 12px}
/* login */
.login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:20}
.lk{background:#fff;border-radius:26px;padding:28px 30px;width:340px;text-align:center;box-shadow:0 20px 60px rgba(60,40,140,.12)}
.lk h1{font:italic 600 34px "Cormorant Garamond",serif;margin:0;color:var(--p)}
.lk p{color:var(--muted);margin:4px 0 16px;font-size:13.5px}
.dots{display:flex;gap:10px;justify-content:center;margin-bottom:16px}
.dots i{width:13px;height:13px;border-radius:50%;background:var(--line)}
.dots i.f{background:var(--p)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.keys button{height:58px;border-radius:16px;background:#F7F6FB;font-size:22px;font-weight:600}
.keys button:active{background:var(--ps)}
.err{color:var(--no);font-size:13px;min-height:18px;margin-top:10px}
.load{opacity:.45;transition:opacity .2s}
.faces{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:8px}
.face{display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:600;font-size:14px}
.face .av{width:78px;height:78px;font-size:28px}
.face:active .av{transform:scale(.95)}
.lk.wide{width:460px}
.back{font-size:13px;color:var(--muted);margin-top:12px}
.team{display:flex;gap:6px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:4px 6px}
.team button .av{width:34px;height:34px;font-size:13px;box-shadow:none;opacity:.55}
.team button.on .av{opacity:1;box-shadow:0 0 0 2px var(--p)}
@media (max-width:700px){
#app{height:100dvh;padding:calc(env(safe-area-inset-top) + 10px) 0 calc(74px + env(safe-area-inset-bottom));gap:10px}
.top{flex-wrap:wrap;gap:8px;padding:0 14px}
.me{flex:1 1 100%}.me b{font-size:17px}.av{width:38px;height:38px}
.sp{display:none}
.team{order:5;width:100%;overflow-x:auto;justify-content:flex-start;scrollbar-width:none}
.team::-webkit-scrollbar{display:none}
.seg{order:3}.seg button{padding:6px 10px;font-size:12.5px}
.nav{order:4;flex:1}.nav b{min-width:0;flex:1;font-size:12.5px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:8;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));gap:0}
.tab{flex:1;flex-direction:column;gap:2px;border:0;background:none;padding:6px 2px;font-size:11px;border-radius:12px;line-height:1.1;text-align:center}
.tab.on{background:var(--ps);color:var(--p)}
main{display:flex!important;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;gap:0;scrollbar-width:none;-webkit-overflow-scrolling:touch}
main::-webkit-scrollbar{display:none}
main>*{flex:0 0 100%;min-width:0;height:100%;scroll-snap-align:start;padding:0 14px;overflow-y:auto}
.hero{display:flex!important;margin:0 14px;scroll-margin:0 14px;flex:0 0 calc(100% - 28px);padding:18px}
.hero .ring{transform:scale(.85)}
.bands.b1{flex:0 0 100%!important;grid-auto-columns:100%!important}.bands.b2{flex:0 0 200%!important;grid-auto-columns:50%!important}
.bands{flex:0 0 300%;display:grid;grid-template-rows:auto 1fr!important;grid-auto-flow:column;grid-auto-columns:calc(100% / 3);row-gap:8px;padding:0;overflow:visible}
.bands>.bh,.bands>.row,.bands>.earn{margin:0 14px}
.bands>.bh{scroll-snap-align:start}
.bands>.row{grid-template-columns:repeat(2,1fr)!important;grid-auto-rows:1fr;align-content:start;overflow-y:auto}
.bands>.row .tile{min-height:0}
.earn{grid-template-columns:repeat(3,1fr)!important;align-self:start}
.earn .coh{grid-column:1/-1}
.grid{grid-template-columns:repeat(2,1fr)!important;grid-template-rows:none!important;grid-auto-rows:minmax(150px,auto);align-content:start}
.grid>.tile{grid-column:auto!important}
.grid>.span2,.grid>.tile[style*="span 4"],.grid>.tile[style*="span 2"]{grid-column:1/-1!important}
.allin{grid-template-columns:repeat(3,1fr)!important}
.allin>div:first-child{grid-column:1/-1;gap:14px!important;padding:12px 14px!important}.allin>div:first-child b{font-size:30px!important}
.bands>*{min-width:0}
.hm{display:none}.grid{grid-auto-rows:minmax(112px,auto)!important}.tile .big{font-size:32px}.big small.nx{max-width:100%;display:block}.quote{-webkit-line-clamp:3;font-size:13.5px}.flame{font-size:52px}
.emc{padding:0 14px}.fil{overflow-x:auto;scrollbar-width:none}
.emc .grid{padding:0}
.wait{margin:0 14px;scroll-margin:0 14px;flex:0 0 calc(100% - 28px)}
.panel{width:100vw;max-height:92dvh;border-radius:24px 24px 0 0;align-self:flex-end;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.lk,.lk.wide{width:min(92vw,420px);padding:22px 18px}
.faces{gap:12px}.face .av{width:64px;height:64px}
}
@media(max-width:700px){.g4{height:100%;grid-auto-rows:1fr;align-content:stretch}.g4 .tile .big{font-size:56px}}

.td{grid-template-columns:repeat(2,1fr);grid-template-rows:1fr 1fr}
.td .span2{grid-column:span 2}.td.td5{grid-template-columns:repeat(3,1fr);grid-auto-flow:row dense}.tt.ac.ok{background:linear-gradient(135deg,#7FCFA9,#2E8B6E)}

      return '<div class="tile pc'+(k?' known':'')+'" style="animation-delay:'+(i*60)+'ms" onclick="emCard('+c.id+')"><div class="h">'+esc(c.title)+'<span class="chip '+(k||c.id===nextId?'ok':'na')+'">'+(k?'✓ Watched':c.id===nextId?'✨ Today':'New')+'</span></div><div class="thumb" style="background-image:url(https://img.youtube.com/vi/'+c.video+'/mqdefault.jpg)"></div></div>'}).join('')+'</div>';}
  else {var nf=b.new_facial||0,nb=b.new_buyers||0,fc=b.facial_clients||0,by=b.buyers||0,rp=nf?Math.round(100*nb/nf):0,lst=b.list;
    h+='<div class="grid">'+
     '<div class="tile span2"><div class="h"><em>🆕</em>New facial clients who took Eminence home<span class="chip '+(rp>=33?'ok':rp>=20?'ok':'no')+'">'+(rp>=33?'🥇':rp>=20?'🥉':'🎯 20%')+'</span></div><div class="big">'+rp+'<small>%</small></div><div class="sub">'+(S.admin?nb+' of '+nf+' new facial clients · ':'')+'🥉 1 in 5 · 🥇 1 in 3</div><div class="bar"><b data-w="'+Math.min(100,rp*3)+'"></b></div></div>'+
     '<div class="tile"><div class="h"><em>👩</em>All facial clients</div><div class="big">'+(fc?Math.round(100*by/fc):0)+'<small>%</small></div><div class="sub">took Eminence home'+(S.admin?' · '+by+' of '+fc:'')+'</div></div>'+
     '<div class="tile"><div class="h"><em>💷</em>Eminence sold</div><div class="big">'+gbp(b.sales||0)+'</div><div class="sub">'+(b.items||0)+' products</div></div>'+
     (S.admin&&lst?'<div class="tile span2" style="overflow:auto"><div class="h"><em>✅</em>Bought</div><div class="list" style="margin-top:8px">'+((lst.bought||[]).map(function(x){return '<div class="li"><b>'+esc(x.name)+'</b>'+esc(x.item)+'<span style="margin-left:auto">£'+Math.round(x.gbp)+'</span></div>'}).join('')||'<div class="sub">Nobody yet</div>')+'</div></div>'+
       '<div class="tile span2" style="overflow:auto"><div class="h"><em>🆕</em>New facial, not yet</div><div class="list" style="margin-top:8px">'+((lst.not_yet||[]).map(function(x){var d=x.date?pd(x.date):null;return '<div class="li"><b>'+esc(x.name)+'</b><span style="margin-left:auto;color:var(--muted)">'+(d?d.getDate()+' '+MN[d.getMonth()]:'')+'</span></div>'}).join('')||'<div class="sub">Everyone bought 🎉</div>')+'</div></div>'
     :'<div class="tile span2"><div class="h"><em>🧴</em>Products I know</div><div class="big">'+kp+'<small>/'+prods.length+'</small></div><div class="bar"><b data-w="'+(prods.length?100*kp/prods.length:0)+'"></b></div></div>'+
       '<div class="tile span2"><div class="h"><em>🎬</em>Videos watched</div><div class="big">'+kv+'<small>/'+vids.length+'</small></div><div class="bar"><b data-w="'+(vids.length?100*kv/vids.length:0)+'"></b></div></div>')+'</div>';}
  M.innerHTML=h;if(S.emJump&&window.innerWidth<=700){S.emJump=0;M.scrollLeft=M.clientWidth}
  requestAnimationFrame(function(){setTimeout(function(){document.querySelectorAll('.bar b').forEach(function(x){x.style.width=x.getAttribute('data-w')+'%'})},60)})}
function emCard(id){var c=(S.br.cards||[]).filter(function(x){return x.id===id})[0],k=(S.br.known||[]).indexOf(id)>=0,st=c.section==='study';
  document.getElementById('panel').innerHTML='<div class="ph"><em>'+(st?'🎬':'🧴')+'</em>'+esc(c.title)+'<button onclick="closeT()">✕</button></div>'+
    (c.concern?'<span class="k" style="font-size:12px;font-weight:700;color:#0F6B47;background:#E3F6EE;padding:4px 10px;border-radius:99px;align-self:flex-start">'+esc(c.concern)+(c.price?' · £'+c.price:'')+'</span>':'')+
    (c.video?'<iframe class="vid" src="https://www.youtube-nocookie.com/embed/'+c.video+'?rel=0&playsinline=1" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>':'')+
    (c.body?'<div style="font-size:15px;line-height:1.5">'+esc(c.body)+'</div>':'')+
    (c.pitch?'<div class="say">💬 '+esc(c.pitch)+'</div>':'')+
    '<button class="bigbtn'+(k?' done':'')+'" onclick="emKnow('+id+','+(!k)+')">'+(k?'✓ '+(st?'Watched':'I know this one'):(st?'I watched it':'I know this one'))+'</button>';
  document.getElementById('sheet').classList.add('on')}
function emKnow(id,on){var kn=S.br.known||[];if(on){if(kn.indexOf(id)<0)kn.push(id);S.br.known_at=S.br.known_at||{};S.br.known_at[id]=ymd(today())}else kn.splice(kn.indexOf(id),1);S.br.known=kn;
  rpc('soul_brand_know',{p_code:S.code,p_person:S.who,p_card:id,p_on:on}).catch(function(){});closeT();renderEm(document.getElementById('main'))}
function perkForm(){document.getElementById('panel').innerHTML='<div class="ph"><em>💷</em>Add for '+esc(S.who)+'<button onclick="closeT()">✕</button></div>'+
  '<div class="seg" id="pk" style="align-self:flex-start"><button class="on" data-k="discount">💅 Discount</button><button data-k="gift">🎁 Gift</button></div>'+
  '<input id="pw" placeholder="What (e.g. Facial 25% off)" style="font:inherit;padding:12px;border:1px solid var(--line);border-radius:12px">'+
  '<input id="pv" type="number" placeholder="Value £" style="font:inherit;padding:12px;border:1px solid var(--line);border-radius:12px">'+
  '<button onclick="perkSave()" style="background:var(--p);color:#fff;border-radius:12px;padding:12px;font-weight:700">Save</button>';
  document.getElementById('pk').onclick=function(e){var k=e.target.getAttribute('data-k');if(!k)return;[].forEach.call(this.children,function(b){b.classList.toggle('on',b===e.target)})};
  document.getElementById('sheet').classList.add('on')}
function perkSave(){var k=document.querySelector('#pk .on').getAttribute('data-k'),w=document.getElementById('pw').value.trim(),v=+document.getElementById('pv').value;
  if(!w||!v)return toast('Fill both');rpc('soul_perk_add',{p_code:S.code,p_person:S.who,p_kind:k,p_what:w,p_value:v,p_date:ymd(range()[0]>today()?today():(range()[1]<today()?range()[1]:today()))}).then(function(r){if(!r)throw 0;closeT();toast('Saved');load()}).catch(function(){toast('Not saved')})}
function perkDel(id){rpc('soul_perk_del',{p_code:S.code,p_id:id}).then(function(){load()})}
function toast(m){var d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(function(){d.remove()},1800)}
function logV(k){rpc('soul_log_video',{p_code:S.code,p_person:S.who,p_kind:k}).then(function(r){if(!r)throw 0;toast(k==='nails'?'💅 Saved. Beautiful work!':'🎬 Saved. Thank you!');load()}).catch(function(){toast('Not saved. Try again.')})}

/* ---------- detail sheet ---------- */
function openT(k){var c=S.C.filter(function(x){return x.k===k})[0],h='<div class="ph"><em>'+c.ic+'</em>'+c.t+'<button onclick="closeT()">✕</button></div>';
  if(k==='comp'){h+=c.list.length?'<div class="list">'+c.list.map(function(x){return '<div class="li"><b>'+fd(x.incident_date)+'</b>'+esc(x.what||'Complaint')+'<span style="margin-left:auto;color:var(--muted)">'+esc(x.status||'')+'</span></div>'}).join('')+'</div>':'<div class="rule">💜 Zero complaints. Keep it this way.</div>'}
  else if(k==='stars'){h+='<div class="list"><div class="li"><b>Your reviews</b>'+c.rv.n+'</div><div class="li"><b>5 stars</b>'+c.rv.n5+'</div><div class="li"><b>BSB standard</b>'+c.std+'% of reviews with 5 stars</div></div><div class="rule">🏆 BSB is Top Rated on Treatwell. Your level is the level that won the award.</div>'}
  else{var r=range(),days=(S.data&&S.data.days)||[],bad={};c.bad.forEach(function(x){bad[x.d]=x});
    var f=r[0],pad=(f.getDay()+6)%7;h+='<div class="cal">'+DW.map(function(w){return '<div class="dw">'+w+'</div>'}).join('');
    for(var i=0;i<pad;i++)h+='<div></div>';
    days.forEach(function(x){var b=bad[x.d],w=x.worked||(k==='abs'&&x.absent);
      h+='<div class="dc '+(b?'no':(w?'ok':'off'))+'"><b>'+pd(x.d).getDate()+'</b>'+(b?esc(c.fmt(x)):(w?'✓':''))+'</div>'});
    h+='</div>';
    var rules={time:'⏰ Arrive by your start time, every day.',lunch:'🍽️ Lunch is '+(S.data?S.data.lunch_max:30)+' minutes. Every minute over comes out of client time.',abs:'📅 Leave only counts when it is registered in Connecteam.',look:'💄 Tap the lipstick when you arrive. Joana checks it.',tasks:'☑️ Morning, Day and Close tasks, every day you work.'};
    h+='<div class="rule">'+rules[k]+'</div>'}
  document.getElementById('panel').innerHTML=h;document.getElementById('sheet').classList.add('on')}
function closeT(){document.getElementById('sheet').classList.remove('on');var v=document.querySelector('#panel iframe');if(v)v.remove()}
document.getElementById('sheet').onclick=function(e){if(e.target.id==='sheet')closeT()};

/* ---------- policies ---------- */
var POL=[['📱','Phone','Your phone stays in your locker during the shift. Use it only on your break.','Expecting an urgent call? Tell reception before your shift and they will call you.'],
 ['⏰','Arriving','Clock in only when you are ready to work. Changing, breakfast and getting ready happen before.','Lateness is recorded and the time is unpaid.'],
 ['🍽️','Breaks','Your break is 30 minutes. Clock out and clock back in.','Clean your station first. Maximum 2 people in the break room.'],
 ['💄','Look','Uniform every shift, exactly as given. Hair, make-up and nails as in the Vanilla Girl magazine.','Arrive already ready. Mild perfume only.'],
 ['💜','Clients','Calm and kind, always. Even when a client is late or does something you don\'t like.','Never raise your voice. Take any problem to your manager, in private.'],
 ['🤝','Team','No gossip. Disagreements are handled privately, never in front of clients.','Help your colleagues. We win as a team.'],
 ['🌴','Holidays','Up to 1 week: ask 4 weeks before. 1 to 2 weeks: 2 months before.','2 to 3 weeks: only in January, 3 months before. Never book travel before approval.'],
 ['🤒','Sick','Tell your manager on Connecteam and reception on WhatsApp before your shift starts.','Fill the absence form within 24 hours of coming back.'],
 ['🧴','Products','Recommend only Eminence. Never another brand or another salon.','BSB has a partner contract with Eminence. You represent the brand.'],
 ['📸','Social media','No clients on your personal social media.','No photos or videos of clients without their consent.'],
 ['💷','Tips','All tips go to the team box. Never ask a client for a tip.','Tips are shared by hours worked, every month.'],
 ['🚭','Smoking','Only on your break, in the designated area, never where clients can see.','Come back with no smell: wash your hands, freshen your breath.']];
function polCard(){var d=new Date(),i=Math.floor((d-new Date(d.getFullYear(),0,0))/864e5)%POL.length,p=POL[i];
  return '<div class="polc" onclick="openPol('+i+')"><small>Policy of the day</small><b>'+p[0]+' '+p[1]+'</b><span>'+esc(p[2])+'</span><em>All BSB policies ›</em></div>'}
function openPol(i){var pn=document.getElementById('panel');pn.style.width='min(900px,94vw)';pn.style.maxWidth='94vw';pn.innerHTML='<div class="polw"><h3>📜 BSB policies</h3><p class="pols">Tap a rule to read more.</p><div class="polg">'+POL.map(function(p,k){return '<details'+(k===i?' open':'')+'><summary><span>'+p[0]+'</span>'+p[1]+'<i>'+esc(p[2])+'</i></summary><p>'+esc(p[3])+'</p></details>'}).join('')+'</div><p class="pols">Full policies in Connecteam.</p><button class="polx" onclick="closeT()">Close</button></div>';document.getElementById('sheet').classList.add('on')}
/* ---------- day picker ---------- */
function openCal(m){var a=m||new Date(S.anchor);a=new Date(a.getFullYear(),a.getMonth(),1);var td=today(),first=(a.getDay()+6)%7,dim=new Date(a.getFullYear(),a.getMonth()+1,0).getDate(),cur=ymd(new Date(S.anchor)),h='';
  for(var k=0;k<first;k++)h+='<i></i>';
  for(var d=1;d<=dim;d++){var dt=new Date(a.getFullYear(),a.getMonth(),d),fut=dt>td,k2=ymd(dt);h+='<button '+(fut?'disabled':'')+' class="'+(k2===cur&&S.mode==='day'?'on':'')+(k2===ymd(td)?' td':'')+'" onclick="pickDay(\''+k2+'\')">'+d+'</button>'}
  var pm=new Date(a.getFullYear(),a.getMonth()-1,1),nm=new Date(a.getFullYear(),a.getMonth()+1,1);
  document.getElementById('panel').style.width='';document.getElementById('panel').style.maxWidth='';document.getElementById('panel').innerHTML='<div class="calw"><div class="calh"><button onclick="openCal(new Date('+pm.getFullYear()+','+pm.getMonth()+',1))">‹</button><b>'+MN[a.getMonth()]+' '+a.getFullYear()+'</b><button '+(nm>td?'disabled':'')+' onclick="openCal(new Date('+nm.getFullYear()+','+nm.getMonth()+',1))">›</button></div><div class="calg">'+['M','T','W','T','F','S','S'].map(function(x){return '<s>'+x+'</s>'}).join('')+h+'</div><button class="polx" onclick="closeT()">Close</button></div>';
  document.getElementById('sheet').classList.add('on')}
function pickDay(k){S.mode='day';S.anchor=pd(k);S.tday=k;[].forEach.call(document.getElementById('seg').children,function(b){b.classList.toggle('on',b.getAttribute('data-m')==='day')});closeT();load()}
/* ---------- controls ---------- */
document.getElementById('seg').onclick=function(e){var m=e.target.getAttribute('data-m');if(!m)return;S.mode=m;
  [].forEach.call(this.children,function(b){b.classList.toggle('on',b.getAttribute('data-m')===m)});load()};
function step(n){var a=new Date(S.anchor);if(S.mode==='day')a.setDate(a.getDate()+n);else if(S.mode==='week')a.setDate(a.getDate()+7*n);else if(S.mode==='year')a.setFullYear(a.getFullYear()+n,0,1);else a.setMonth(a.getMonth()+n,1);
  if(a>today())a=today();S.anchor=a;load()}
document.getElementById('prev').onclick=function(){step(-1)};document.getElementById('per').onclick=function(){openCal()};document.getElementById('next').onclick=function(){step(1)};
document.getElementById('tabs').onclick=function(e){var b=e.target.closest('.tab');if(!b)return;S.tab=b.getAttribute('data-t');
  [].forEach.call(this.children,function(x){x.classList.toggle('on',x===b)});document.getElementById('main').scrollLeft=0;
  if(S.mode==='year'&&S.tab!=='biz'){S.mode='month';[].forEach.call(document.getElementById('seg').children,function(x){x.classList.toggle('on',x.getAttribute('data-m')==='month')});load();return}
  render()};
loadPeople();
</script>
