<!DOCTYPE html>
<html lang="en">
<head><script>/*BSB-TIP350*/(function(){
/* TIP350 (20/10/2026): a gorjeta por hora ficava £0 o dia todo porque o turno ABERTO no Connecteam tem minutes vazio
   (so vira numero no clock out). Aqui, todo pedido de horas (bsb_clockins minutes>0) passa a contar o turno aberto
   como "desde o clock in ate agora" (teto 16 h; turno esquecido aberto em outro dia nao conta). */
var f=window.fetch; if(!f||f.__tip350) return;
var w=function(u,o){
  try{
    var s=String(u&&u.url||u);
    if(s.indexOf('/bsb_clockins?')>-1&&s.indexOf('select=minutes&')>-1&&s.indexOf('minutes=gt.0')>-1){
      var nu=s.replace('select=minutes&','select=minutes,clock_in,clock_out&').replace('&minutes=gt.0','').replace('minutes=gt.0&','');
      return f.call(this,nu,o).then(function(r){
        if(!r.ok) return r;
        return r.json().then(function(rows){
          var now=Date.now();
          var out=(rows||[]).map(function(x){var m=+x.minutes||0;
            if(!m&&x.clock_in){var a=Date.parse(x.clock_in),b=x.clock_out?Date.parse(x.clock_out):now;m=Math.round((b-a)/60000);if(!(m>0)||m>16*60)m=0;}
            return {minutes:m};}).filter(function(x){return x.minutes>0;});
          return new Response(JSON.stringify(out),{status:200,headers:{'Content-Type':'application/json'}});
        });
      });
    }
  }catch(e){}
  return f.apply(this,arguments);
};
w.__tip350=true; window.fetch=w;
})();
</script>

.appt .l4 .chip { border-radius: 999px; padding: 1px 8px; background: rgba(255,255,255,0.82); color: #585A75; white-space: nowrap; border: 1px solid rgba(0,0,0,0.04); }
.appt .l4 .chip.handoff { background: #EAF2FF; color: #1D4E9A; }
.appt .l4 .chip.bday { background: #FDF1E4; color: #9A5B10; }
.appt .l4 .chip.pref { background: #F1EEFF; color: #4634C7; }
.livedot { width: 7px; height: 7px; border-radius: 50%; background: var(--live-red); display: inline-block; flex: none; animation: blinklive 1.4s ease-in-out infinite; }
@keyframes blinklive { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

/* run controls inside modal */
/* v31.5: a conversa, um momento por vez */
/* v31.12: as frases viraram LEITURA. Nada aqui e clicavel. */
.pread { display: flex; flex-direction: column; gap: 10px; padding-top: 4px; }
.pread-row { border-left: 3px solid var(--accent); background: var(--surface-3); border-radius: 10px; padding: 11px 14px; }
.pread-h { font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--text-3); margin-bottom: 5px; }
.pread-say { font-size: 15px; line-height: 1.5; color: var(--text-1); }
.pread-coach { font-size: 13px; color: var(--text-2); line-height: 1.5; }
.pread-offer { margin-top: 6px; font-size: 13px; color: var(--text-2); }
.pread-offer b { color: var(--accent-deep); }
/* a tela do run e calma de proposito */
.run-quiet { text-align: center; color: var(--text-2); font-size: 15px; padding: 26px 16px 6px; }
.run-quiet span { display: block; font-size: 13px; color: var(--text-3); margin-top: 6px; }
.pchips { display: flex; flex-wrap: wrap; gap: 6px; padding: 2px 0 10px; }
.pchip { border: 1px solid var(--border-2); background: #fff; border-radius: 999px; padding: 7px 13px 7px 7px; font-family: inherit; font-size: 13px; color: var(--text-2); cursor: pointer; display: inline-flex; align-items: center; gap: 7px; }
.pchip-n { width: 19px; height: 19px; border-radius: 50%; background: var(--surface-2); color: var(--text-3); font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
.pchip.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.pchip.on .pchip-n { background: rgba(255,255,255,.25); color: #fff; }
.pchip.done { border-color: #BFE8D2; color: #1B7A4A; }
.pchip.done .pchip-n { background: var(--green); color: #fff; }
.pchip.done.on { background: var(--green); border-color: var(--green); color: #fff; }
.pchip.done.on .pchip-n { background: rgba(255,255,255,.3); }
.pcard { border-left: 3px solid var(--accent); background: var(--surface-3); border-radius: 14px; padding: 16px 18px 14px; }
.pcard.done { border-left-color: var(--green) !important; background: #F5FBF8; }
.pcard-h { font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; margin-bottom: 10px; }
.pcard-say { font-size: 18px; line-height: 1.5; color: var(--text-1); cursor: pointer; }
.pcard-say.copied { color: var(--green); }
.pcard-coach { font-size: 14px; color: var(--text-2); margin-top: 10px; line-height: 1.5; }
.pcard-offer { margin-top: 12px; background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; font-size: 15px; }
.pcard-price { color: var(--accent-deep); font-weight: 700; margin-left: 8px; }
.pcard-art { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pcard-art-h { width: 100%; font-size: 12px; color: var(--text-3); }
.art-opt { background: #fff; border: 1px solid var(--border); border-radius: 999px; padding: 6px 12px; font-size: 13px; color: var(--text-2); }
.art-opt b { color: var(--accent-deep); margin-left: 6px; }
/* a acao que faltava: como se marca */
.pact { display: flex; gap: 8px; margin-top: 14px; }
.pact-b { flex: 1; border: 1px solid var(--border-2); background: #fff; border-radius: 11px; padding: 13px 10px; font-family: inherit; font-size: 14px; font-weight: 600; color: var(--text-2); cursor: pointer; }
.pact-b.did.on { background: var(--green); border-color: var(--green); color: #fff; }
.pact-b.skip { font-weight: 400; font-size: 13px; flex: 0 0 auto; padding: 13px 14px; color: var(--text-3); }
.pact-b.skip.on { background: var(--surface-2); color: var(--text-2); border-color: var(--border-2); }
.pnav { display: flex; justify-content: space-between; gap: 8px; margin-top: 12px; }
.pnav-b { border: 0; background: none; font-family: inherit; font-size: 12.5px; color: var(--text-2); padding: 4px 0; cursor: pointer; }
.pnav-b.next { color: var(--accent); font-weight: 600; }
/* a faixa do jogo */
.score-strip { background: linear-gradient(180deg,#F6F4FF,#FFFFFF); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; margin-bottom: 14px; }
.sc-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.sc-now { font-size: 21px; font-weight: 700; color: var(--accent-deep); }
.sc-of { font-size: 12px; font-weight: 400; color: var(--text-3); margin-left: 3px; }
.sc-lvl { font-size: 12px; font-weight: 600; color: var(--accent-deep); }
.sc-next { display: block; font-size: 11px; color: var(--text-3); text-align: right; }
.sc-bar { height: 7px; border-radius: 999px; background: #EAE6FB; overflow: hidden; margin-top: 9px; }
.sc-bar span { display: block; height: 100%; border-radius: 999px; background: var(--accent); transition: width .35s; }
.sc-month { font-size: 11px; color: var(--text-3); margin-top: 7px; }
/* os pontos dentro do check out */
.wrap-pts { float: right; font-size: 11px; font-weight: 700; color: var(--text-3); }
.wrap-row.did .wrap-pts { color: var(--green); }
.wrap-row.big { border-color: #D9D0FA; background: #FBFAFF; }
.wrap-row.big.did { border-color: #BFE8D2; background: #F2FBF6; }
.wrap-total { text-align: center; font-size: 13px; color: var(--text-2); margin: 10px 0 4px; }
.wrap-total b { font-size: 18px; color: var(--accent-deep); }
.wrap-ask { text-align:center; margin:14px 0 4px; padding:13px 14px; border:1px dashed var(--accent); border-radius:14px; background:#FBFAFF; font-size:15px; font-weight:600; color:var(--accent-deep); }
.wrap-ask span { display:block; font-size:12px; font-weight:400; color:var(--text-2); margin-top:5px; line-height:1.5; }
/* v31.8: uma tela por momento. O botao grande vai para o FIM da tela, que e onde
   a mao dela esta depois de ler ou de conversar. */
.run-wizard.stage-brief .run-controls,
.run-wizard.stage-run .run-controls { margin: 18px 0 0; }
.due-blink { animation: bsbDue 1.5s ease-in-out infinite; }
@keyframes bsbDue {
  0%,100% { box-shadow: 0 0 0 0 transparent; }
  50%     { box-shadow: 0 0 0 3px var(--thc), 0 0 14px 2px var(--thc); }
}
@media (prefers-reduced-motion: reduce) { .due-blink { animation: none; box-shadow: 0 0 0 2px var(--thc); } }
.blink-btn { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--border-2); background:#fff; color:var(--text-3); font-family:inherit; font-size:12px; border-radius:999px; padding:6px 12px; cursor:pointer; }
.blink-btn.on { color:var(--text-2); border-color:var(--border-2); }
.blink-btn span { font-size:11.5px; }
.run-mini.running { background: var(--accent-soft); color: var(--accent-deep); border-radius: 999px; padding: 2px 8px; font-size: 10px; font-weight: 600; }
.run-mini.done { background: #EAF7F0; color: #1B7A4A; border-radius: 999px; padding: 2px 8px; font-size: 10px; font-weight: 600; }
.wdone-pts { margin-top: 8px; font-size: 13px; font-weight: 700; color: var(--accent-deep); }
.wrap-later { display: block; font-size: 11px; color: var(--text-3); font-weight: 400; margin-top: 3px; }
/* o bonus depois da medalha */
.bonus { border: 1px dashed var(--accent); border-radius: 14px; padding: 14px 16px; margin-top: 14px; background: #FBFAFF; }
.bonus[open] { border-style: solid; }
.bonus.did { border-color: #BFE8D2; background: #F4FBF7; border-style: solid; }
.bonus summary { list-style: none; cursor: pointer; position: relative; padding-right: 52px; }
.bonus summary::-webkit-details-marker { display: none; }
.bonus-t { display: block; font-size: 15px; font-weight: 700; color: var(--accent-deep); }
.bonus.did .bonus-t { color: #1B7A4A; }
.bonus-p { position: absolute; top: 0; right: 0; font-size: 13px; font-weight: 700; color: var(--accent-deep); }
.bonus.did .bonus-p { color: var(--green); }
.bonus-s { display: block; font-size: 12.5px; color: var(--text-2); margin-top: 5px; line-height: 1.5; }
.run-controls { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
/* v31.4: um botao grande por vez. comecar, depois terminar. nada compete com ele. */
.run-btn.big { width: 100%; font-size: 18px; font-weight: 700; padding: 19px 16px; border-radius: 14px; letter-spacing: .01em; }
/* v32.119: acao principal COLADA no rodape. Ela nunca rola para achar o proximo passo. */
.run-wizard .run-btn.big { position: sticky; bottom: 0; z-index: 5; }
.run-wizard .run-btn.big::after { content:''; position:absolute; left:-16px; right:-16px; bottom:-14px; height:14px; background:var(--bg); z-index:-1; }
.run-wizard .run-btn.big.start,
.run-wizard .run-btn.big.finish { box-shadow: 0 -6px 18px rgba(255,255,255,.9), 0 4px 16px rgba(91,71,224,.3); }
.run-wizard .run-btn.big.finish { box-shadow: 0 -6px 18px rgba(255,255,255,.9), 0 4px 16px rgba(34,182,110,.3); }
/* e o "voltar" acompanha, logo abaixo, sem ocupar o lugar do botao */
.run-wizard .run-sub { position: sticky; bottom: 0; background: var(--bg); padding-bottom: 4px; z-index: 4; }
.run-btn.big.start { box-shadow: 0 4px 14px rgba(91,71,224,.28); }
.run-btn.big.finish { background: var(--green); border-color: var(--green); color: #fff; box-shadow: 0 4px 14px rgba(34,182,110,.28); }
.rnote .planbox { background:#FAFAFC; border-color:#ECECF4; border-radius:14px; margin:8px 2px 2px; }
.rnote .plan-h { color:#585A75; }
.rnote .plan-h b, .rnote .plan-s { color:#1F2235; }
.rnote .plan-row { border-top-color:#EFEFF3; }
.rnote .plan-n { background:#EFEFF3; color:#585A75; }
/* v32.13: os passos, para ela saber onde esta */
.steps { display:flex; align-items:center; gap:6px; margin-bottom:12px; }
.step { display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--text-3); }
.step-n { width:20px; height:20px; border-radius:50%; background:var(--surface-2,#F3F2FA); color:var(--text-3); font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; }
.step.on { color:var(--accent-deep); font-weight:600; }
.step.on .step-n { background:var(--accent); color:#fff; }
.step.did .step-n { background:var(--green); color:#fff; }
.step.did { color:#1B7A4A; }
.step-line { flex:1; height:1px; background:var(--border); }
.planbox { border:1px solid var(--border); border-radius:14px; background:var(--surface); padding:12px 14px; margin-bottom:12px; }
.plan-h { font-size:12.5px; color:var(--text-2); margin-bottom:9px; display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
.plan-h b { color:var(--text); }
.plan-tot { margin-left:auto; font-size:11.5px; color:var(--text-3); font-variant-numeric:tabular-nums; }
.plan-row { display:flex; align-items:center; gap:10px; padding:7px 0; border-top:1px solid #F4F3F8; }
.plan-row:first-of-type { border-top:0; }
.plan-n { width:19px; height:19px; border-radius:50%; background:var(--surface-2,#F3F2FA); color:var(--text-3); font-size:10.5px; font-weight:700; display:flex; align-items:center; justify-content:center; flex:0 0 auto; }
.plan-t { font-size:12.5px; color:var(--text-3); font-variant-numeric:tabular-nums; flex:0 0 auto; width:42px; }
.plan-s { flex:1; font-size:14px; color:var(--text); border-left:3px solid var(--accent); padding-left:9px; line-height:1.35; }
.plan-d { font-size:12px; color:var(--text-3); font-variant-numeric:tabular-nums; flex:0 0 auto; }
/* v32.119: cada servico num cartao proprio, como no dash da Joana — sem preco nem pagamento */
.svccard { display:flex; align-items:center; gap:14px; background:#fff; border:1px solid var(--border);
  border-left:4px solid var(--accent); border-radius:12px; padding:11px 14px; margin-bottom:7px; }
.svccard.now { border-color:var(--accent); box-shadow:0 2px 10px rgba(91,71,224,.10); }
.svccard:last-child { margin-bottom:0; }
.plan-gap { height:4px; }
.sv-t { flex:0 0 auto; font-size:16px; font-weight:700; color:var(--text); font-variant-numeric:tabular-nums; min-width:48px; }
.sv-b { flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
.sv-n { font-size:15px; font-weight:600; color:var(--text); line-height:1.3; }
.sv-m { font-size:12px; color:var(--text-3); }
.sv-m b { color:var(--accent-deep); font-weight:700; }
.run-undo { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
.run-undo button { border:1px solid var(--border-2); background:#fff; color:var(--text-2); font-family:inherit; font-size:12.5px; border-radius:9px; padding:6px 12px; cursor:pointer; }
.run-undo span { font-size:11.5px; color:var(--text-3); }
.wz-back { border:1px solid var(--border-2); background:#fff; color:var(--text-2); font-family:inherit; font-size:13px; border-radius:10px; padding:9px 15px; cursor:pointer; }
.planend { border:1px solid var(--border); border-radius:14px; background:var(--surface); padding:13px 15px; margin-bottom:12px; }
.planend-t { font-size:15px; color:var(--text); }
.planend-t b { font-variant-numeric:tabular-nums; }
.planend-s { font-size:13px; color:var(--text-2); margin-top:5px; line-height:1.5; }
/* v32.119: a ficha da visita, logo abaixo do recado da Ligia */
.bcard { border:1px solid var(--border); border-radius:14px; background:var(--surface); padding:4px 15px 10px; margin:12px 0 0; }
.bc-h { font-size:10.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--text-3); padding:11px 0 3px; }
.bc-row { display:flex; gap:12px; padding:9px 0; border-top:1px solid #F4F3F8; align-items:baseline; }
.bc-k { flex:0 0 108px; font-size:11.5px; color:var(--text-3); line-height:1.5; }
.bc-v { flex:1; font-size:14px; color:var(--text); line-height:1.5; }
.bc-v b { font-variant-numeric:tabular-nums; }
.bc-sub { display:block; font-size:12px; color:var(--text-2); margin-top:4px; }
.bc-row.star .bc-v { color:var(--accent-deep); font-weight:600; }
/* v32.119: o degrau em uma linha, e o upgrade em bloco */
.sealline { display:flex; align-items:center; gap:9px; border-radius:11px; padding:8px 13px; color:#fff; margin-bottom:12px; font-size:12.5px; }
.sealline b { font-weight:800; letter-spacing:1.1px; font-size:12px; }
.sealline span:last-child { opacity:.9; }
.sl-ico { font-size:16px; }
.upblock { border:1px solid #E3C88A; background:#FFFBF2; border-radius:14px; padding:11px 14px; margin-bottom:12px; }
.up-h { font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:#8A6A1E; margin-bottom:7px; }
.up-row { display:flex; align-items:baseline; gap:10px; padding:5px 0; }
.up-n { flex:1; font-size:15px; color:var(--text); }
.up-p { font-size:15px; font-weight:700; color:#8A6A1E; font-variant-numeric:tabular-nums; }
.up-s { font-size:12px; color:var(--text-2); margin-top:6px; padding-top:7px; border-top:1px solid #F0E4C8; }
.up-sec { font-size:10.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:#B08A3E; margin:8px 0 2px; }
.up-sec:first-of-type { margin-top:2px; }
/* v32.119: o roteiro de cada extra, escondido ate ela tocar */
.uprec > summary { list-style:none; cursor:pointer; }
.uprec > summary::-webkit-details-marker { display:none; }
.uprec[open] { background:#FFFDF7; border:1px solid #F0E4C8; border-radius:10px; padding:2px 9px 9px; margin:4px -9px; }
.ur-w { font-size:12px; color:var(--text-2); line-height:1.5; margin-top:4px; }
.ur-w b { color:#8A6A1E; }
.ur-s { font-size:13px; color:var(--text); line-height:1.5; margin-top:7px; padding:8px 11px; background:#fff; border:1px solid #F0E4C8; border-radius:10px; font-style:italic; }
.ur-s.alt { opacity:.8; }
/* v32.119: o que a casa ja sabe da cliente, no plano */
.knownbox { border:1px solid #DCD6F7; background:#F8F6FF; border-radius:14px; padding:11px 14px; margin-bottom:12px; }
.knownbox.empty { font-size:13px; color:var(--text-2); line-height:1.5; border-color:#E3C88A; background:#FFFBF2; }
.knownbox.empty b { color:#8A6A1E; }
.kn-h { font-size:11px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--accent-deep); margin-bottom:7px; }
.kn-row { display:flex; gap:11px; padding:4px 0; align-items:baseline; }
.kn-c { flex:0 0 auto; font-size:12.5px; color:var(--text-2); min-width:92px; }
.kn-v { flex:1; font-size:14px; color:var(--text); font-weight:500; }
/* v32.119: o fim do dia dela */
.dayend { text-align:center; border-radius:16px; padding:22px 18px 18px; margin-top:14px;
  background:linear-gradient(135deg,#1B7A4A,#2FBF7F); color:#fff; box-shadow:0 8px 22px rgba(27,122,74,.28); }
.de-ico { font-size:40px; line-height:1; }
.de-t { font-family:'Cormorant Garamond',Georgia,serif; font-size:25px; margin-top:6px; }
.de-s { font-size:14px; opacity:.95; margin-top:6px; line-height:1.5; }
.de-btn { margin-top:14px; width:100%; border:0; background:#fff; color:#1B7A4A; font-family:inherit;
  font-size:15px; font-weight:700; border-radius:13px; padding:13px; cursor:pointer; }
.up-n i { display:block; font-style:normal; font-size:11.5px; color:var(--text-3); margin-top:1px; }
/* v32.119: a tarja da visita, fixa em todas as telas do atendimento */
.runstrip { background:#FAFAFC; color:var(--text); border:1px solid var(--border); border-radius:14px;
  padding:11px 15px; margin:0 0 14px; box-shadow:0 1px 3px rgba(16,24,40,.06); }
/* v33.5: a tarja era um banner roxo com sombra, mais pesado que o selo e que o botao.
   Contexto e quieto; cor fica com o selo (QUEM) e com o botao (ACAO). */
.rs-svc { font-size:15.5px; font-weight:600; line-height:1.35; }
.rs-svc.many { font-size:13.5px; line-height:1.4; }
.rs-svc i { font-style:normal; opacity:.55; margin:0 9px; font-weight:400; }
.rs-svc i::before { content:'|'; }
.rs-time { font-size:13px; margin-top:4px; opacity:.92; font-variant-numeric:tabular-nums; }
.rs-time b { font-weight:700; }
.rs-next { margin-left:10px; padding-left:10px; border-left:1px solid rgba(255,255,255,.3); }
/* v32.119: o aftercare em clipe */
.acwrap { margin-bottom:12px; }
.acwrap-h { font-size:10.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--text-3); margin:0 0 7px 2px; }
.acbox { border:1px solid var(--border); border-radius:14px; background:var(--surface); margin-bottom:7px; overflow:hidden; }
.acbox > summary { list-style:none; cursor:pointer; display:flex; align-items:center; gap:11px; padding:12px 15px; font-size:15px; color:var(--text); }
.acbox > summary::-webkit-details-marker { display:none; }
.acbox > summary::after { content:'\203A'; margin-left:auto; color:var(--text-3); font-size:19px; transition:transform .15s; }
.acbox[open] > summary::after { transform:rotate(90deg); }
.ac-ico { font-size:19px; }
.ac-t { font-weight:600; }
.ac-n { font-size:11px; color:var(--text-3); background:var(--surface-2,#F3F2FA); border-radius:999px; padding:1px 8px; }
.ac-list { margin:0; padding:0 15px 4px 34px; }
.ac-list li { font-size:14px; line-height:1.55; color:var(--text); margin-bottom:7px; }
.acmore { margin:2px 12px 12px; border-radius:11px; background:#F6F4FE; border:1px solid #DCD6F7; }
.acmore > summary { list-style:none; cursor:pointer; padding:9px 13px; font-size:12.5px; font-weight:600; color:var(--accent-deep); }
.acmore > summary::-webkit-details-marker { display:none; }
.ac-why { margin:0; padding:0 14px 11px 30px; }
.ac-why li { font-size:13px; line-height:1.55; color:var(--text-2); margin-bottom:7px; }
.ac-kit { font-size:13px; color:var(--text-2); background:#FFF8E9; border:1px solid #E3C88A; border-radius:12px; padding:10px 13px; line-height:1.5; margin:2px 12px 12px; }
.ac-kit b { color:#8A6A1E; }
/* v32.119: os servicos e a ultima visita dentro do quadradinho do run */
.runnow { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-bottom:11px; }
.rn-svc { font-size:12.5px; color:var(--text-2); background:#fff; border:1px solid var(--border); border-radius:999px; padding:4px 11px; }
.rn-svc b { color:var(--text); font-variant-numeric:tabular-nums; margin-right:4px; }
.rn-last { font-size:12px; color:var(--text-3); background:transparent; border:1px dashed var(--border-2); border-radius:999px; padding:4px 11px; }
/* v32.119: o selo do nivel, mesmo desenho do dash da Joana */
.seal { display:flex; gap:13px; align-items:flex-start; border-radius:14px; padding:12px 15px; color:#fff; margin:12px 0 0; box-shadow:0 6px 18px rgba(31,18,53,.22); }
.seal-ico { font-size:30px; line-height:1.1; filter:drop-shadow(0 2px 4px rgba(0,0,0,.25)); }
.seal-txt { min-width:0; flex:1; }
.seal-t { font-weight:800; letter-spacing:1.4px; font-size:13px; }
.seal-t span { opacity:.82; font-weight:600; letter-spacing:.2px; font-size:11.5px; }
.seal-m { font-size:13.5px; line-height:1.45; margin-top:4px; opacity:.96; }
.seal-w { font-size:12.5px; line-height:1.45; margin-top:7px; padding-top:7px; border-top:1px solid rgba(255,255,255,.28); opacity:.95; }
.seal-f { font-size:11.5px; margin-top:7px; opacity:.85; font-variant-numeric:tabular-nums; }
.block.lunch { background:repeating-linear-gradient(45deg,#F4F3F9,#F4F3F9 6px,#ECEBF3 6px,#ECEBF3 12px); border:1px dashed var(--border-2); color:var(--text-2); cursor:grab; font-size:11px; display:flex; align-items:center; justify-content:center; border-radius:8px; user-select:none; touch-action:none; }
.block.lunch:active { cursor:grabbing; border-color:var(--accent); color:var(--accent-deep); }
.startbox { border:1px solid var(--border); border-radius:14px; background:var(--surface); padding:16px 16px 14px; margin-bottom:14px; text-align:center; }
.st-t { font-family:'Cormorant Garamond',Georgia,serif; font-size:21px; color:var(--text); }
.st-sub { font-size:14px; color:var(--text-2); margin-top:7px; line-height:1.5; }
.st-sub.ok { color:#1B7A4A; }
.st-sub.late { color:#B42318; }
.st-note { font-size:12px; color:var(--text-3); margin-top:9px; }
/* v32.119: o progresso em bolinhas, no lugar dos cinco nomes escritos */
.steps { display:flex; align-items:center; gap:10px; padding:2px 0 12px; }
.pdots { display:flex; gap:6px; align-items:center; }
.pdot { width:7px; height:7px; border-radius:50%; background:var(--border-2); transition:all .2s; }
.pdot.done { background:#22B66E; }
.pdot.on { background:var(--accent); width:20px; border-radius:99px; }
.pnow { font-size:13px; font-weight:700; color:var(--accent-deep); }
.pof { font-size:11.5px; color:var(--text-3); margin-left:auto; font-variant-numeric:tabular-nums; }
/* v32.119: a cliente ja esta na casa, com outra terapeuta */
.st-sub.here { color:#1B7A4A; background:#F2FBF6; border:1px solid #CDE9D8; border-radius:12px; padding:11px 14px; line-height:1.5; }
.st-sub.here span { display:block; color:var(--text-2); font-size:12.5px; margin-top:4px; }
.dmrow { display:flex; align-items:center; gap:12px; padding:11px 14px 11px 12px; margin-bottom:12px;
  background:#fff; border:1px solid #ECECF4; border-radius:16px; box-shadow:0 2px 10px rgba(31,34,53,.05);
  cursor:pointer; transition:background .15s, transform .08s; }
.dmrow:active { transform:scale(.995); }
.dmrow.read { background:#F7FBF8; border-color:#CDE9D8; }
.dmrow.read .dmrow-prev { color:#1B7A4A; }
/* o anel de story, igual ao do cabecalho do recado */
.dmrow-av { flex:0 0 auto; display:flex; padding:2px; border-radius:50%;
  background:conic-gradient(from 210deg,#F9CE34,#EE2A7B,#6228D7,#F9CE34); }
.dmrow-av .dm-avimg, .dmrow-av .dm-av { width:46px; height:46px; border:2px solid #fff; }
.dmrow-txt { flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
.dmrow-top { display:flex; align-items:baseline; gap:8px; }
.dmrow-top b { font-size:14.5px; font-weight:700; color:#1F2235; }
.dmrow-top i { font-style:normal; font-size:11.5px; color:#9A9BB4; }
.dmrow-prev { font-size:13.5px; color:#585A75; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.dmrow-dot { flex:0 0 auto; width:9px; height:9px; border-radius:50%; background:var(--accent);
  box-shadow:0 0 0 3px rgba(91,71,224,.15); }
.run-sub { width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 12px; color: var(--text-2); margin-top: -4px; }
.run-sub .over { color: var(--live-red); font-weight: 600; }
.run-more { background: none; border: 0; font-family: inherit; font-size: 12px; color: var(--text-2); text-decoration: underline; padding: 4px 2px; cursor: pointer; }
/* o caminho da visita, no topo do checkout */
.wpath { display: flex; flex-wrap: wrap; gap: 6px; margin: -2px 0 12px; }
.wpath-i { font-size: 11px; background: var(--surface-2); border-radius: 999px; padding: 4px 10px; color: var(--text-2); }
.wpath-i b { color: var(--text-1); font-weight: 600; }
.wrap-hint { font-size: 12px; color: var(--text-3); margin: 2px 0 10px; }
.wrap-row .wrap-sub { display: block; font-size: 11px; font-weight: 400; color: var(--text-3); margin-top: 2px; }
.wrap-row.did .wrap-sub { color: #3E8F68; }
.run-btn { border: 1px solid var(--accent); background: var(--bg); color: var(--accent-deep); font-size: 13px; font-weight: 500; padding: 9px 16px; border-radius: 10px; cursor: pointer; }
.run-btn.start { background: var(--accent); color: #fff; border-color: var(--accent); }
.run-btn.finish { border-color: var(--green); color: #157347; }
.run-status { font-size: 12px; color: var(--text-2); align-self: center; font-variant-numeric: tabular-nums; }
.run-status.over { color: var(--live-red); font-weight: 500; }
.mini-btn { border: 1px solid var(--border); background: var(--bg); color: var(--text-2); font-size: 12px; padding: 6px 12px; border-radius: 999px; cursor: pointer; }

/* task cards in strip */
.taskblock {
  border: 1px dashed var(--gold); background: linear-gradient(135deg,#FDF8EC,#FBF4DE);
  border-radius: 14px; padding: 13px 16px;
}
.taskblock.closing { border-color: #B8A0D8; background: linear-gradient(135deg,#F6F1FB,#EFE8F7); }
.taskblock.daytime { border-color: var(--border-2); background: #FAFAFF; }
.taskblock .tb-head { display: flex; align-items: baseline; gap: 8px; }
.taskblock .tb-time { font-size: 12px; font-weight: 500; color: var(--gold-deep); font-variant-numeric: tabular-nums; }
.taskblock.closing .tb-time { color: #6B4E96; }
.taskblock .tb-title { font-size: 14px; font-weight: 500; flex: 1; }
.taskblock .tb-prog { font-size: 11px; color: var(--text-3); }
.taskbar { height: 5px; border-radius: 999px; background: rgba(0,0,0,.06); margin: 9px 0 11px; overflow: hidden; }
.taskbar > i { display: block; height: 100%; background: var(--gold); border-radius: 999px; transition: width .25s; }
.taskblock.closing .taskbar > i { background: #8A6BC0; }
.taskblock.daytime .taskbar > i { background: var(--accent); }
.task-list { display: flex; flex-direction: column; gap: 7px; }
.task-item {
  display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--bg); cursor: pointer; text-align: left; width: 100%;
}
.task-item.done { opacity: .62; }
.task-item .tk-box { width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--border-2); display: flex; align-items: center; justify-content: center; font-size: 12px; color: #fff; flex: none; }
.task-item.done .tk-box { background: var(--green); border-color: var(--green); }
.task-item .tk-lb { font-size: 13px; flex: 1; }
.task-item.done .tk-lb { text-decoration: line-through; color: var(--text-3); }
.task-item .tk-by { font-size: 10px; color: var(--green); font-variant-numeric: tabular-nums; }

.free-note { text-align: center; font-size: 11px; color: var(--text-3); font-style: italic; margin: 2px 0 12px; }

/* ============ MODAL (personalisation) ============ */
.overlay { position: fixed; inset: 0; background: rgba(17,24,39,0.42); backdrop-filter: blur(2px); z-index: 100; display: none; align-items: flex-start; justify-content: center; padding: 34px 12px; overflow-y: auto; }
.overlay.open { display: flex; }
.modal { background: var(--bg); border-radius: 18px; max-width: 620px; width: 100%; box-shadow: var(--shadow-lg); overflow: hidden; border: 1px solid var(--border); }
.modal-head { padding: 20px 24px 16px; border-bottom: 1px solid var(--border); position: relative; }
.modal-head .eyebrow { font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-3); margin-bottom: 4px; }
.modal-head h2 { font-family: 'Cormorant Garamond', serif; font-weight: 400; font-size: 24px; line-height: 1.1; }
.modal-head .svc-line { font-size: 12px; color: var(--text-2); margin-top: 5px; font-variant-numeric: tabular-nums; }
.modal-close { position: absolute; top: 14px; right: 14px; border: none; background: #F6F5FB; width: 32px; height: 32px; border-radius: 50%; font-size: 17px; color: var(--text-2); cursor: pointer; }
.modal-body { padding: 18px 24px 24px; max-height: 66vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
button { -webkit-tap-highlight-color: rgba(0,0,0,0); }
.modal-foot { padding: 14px 24px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.save-note { font-size: 11px; color: var(--text-3); }
.save-btn { border: none; background: var(--accent); color: #fff; font-size: 13px; font-weight: 500; padding: 9px 20px; border-radius: 10px; cursor: pointer; }

.top-allergy { background: #FCE7E8; border: 1px solid #F3B4B6; color: #B42318; border-radius: 12px; padding: 11px 14px; margin-bottom: 16px; font-size: 13px; font-weight: 500; display: flex; gap: 9px; align-items: center; }

.pf-group { margin-bottom: 18px; }
.pf-group > .g-title { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent-deep); font-weight: 500; margin-bottom: 4px; }
.pf-group > .g-sub { font-size: 11px; color: var(--text-3); margin-bottom: 10px; }
.pf-field { margin-bottom: 13px; }
.pf-field > label { display: block; font-size: 12px; color: var(--text-2); margin-bottom: 6px; font-weight: 500; }
.pf-field .hintline { font-size: 11px; color: var(--text-3); margin-top: 5px; }
.pf-chips { display: flex; gap: 7px; flex-wrap: wrap; }
.pf-chip { font-size: 12px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--border-2); background: var(--bg); color: var(--text-2); cursor: pointer; transition: all .12s; }
.pf-chip.on { background: var(--accent); color: #fff; border-color: var(--accent); }
.pf-fromform{display:inline-block;margin-top:6px;background:#FBF8F0;border:1px dashed #E4DAC6;color:#8A5F09;border-radius:8px;padding:5px 10px;font-size:12px;font-weight:600;cursor:pointer}
.pf-fromform i{font-style:normal;opacity:.7;font-weight:500;font-size:10.5px}
.pf-chip.pf-sug{border-color:#C9A96E;background:#FBF8F0;color:#8A5F09}
.pf-chip.danger.on { background: var(--live-red); border-color: var(--live-red); }
.pf-chip.avoid.on { background: #6B4E96; border-color: #6B4E96; }
.pf-input { width: 100%; border: 1px solid var(--border-2); border-radius: 10px; padding: 10px 12px; font-size: 16px; font-family: inherit; color: var(--text); background: var(--bg); }
.pf-input:focus { outline: none; border-color: var(--accent); }
textarea.pf-input { resize: vertical; min-height: 54px; line-height: 1.5; }
.pf-readonly { background: #F6F5FB; border: 1px dashed var(--border-2); border-radius: 10px; padding: 9px 12px; font-size: 12px; color: var(--text-2); }
.pf-readonly b { font-weight: 500; color: var(--text); }

/* v35.4: searchable colour picker (lupa) — the shelf list is too long for chips */
.pf-ctags { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 8px; }
.pf-ctag { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; padding: 6px 6px 6px 12px; border-radius: 999px; background: var(--accent); color: #fff; line-height: 1.3; }
.pf-ctag.avoid { background: #6B4E96; }
.pf-ctag .cbrand { opacity: .8; font-size: 10.5px; }
.pf-ctag .x { cursor: pointer; flex: none; width: 18px; height: 18px; border-radius: 50%; background: rgba(255,255,255,.28); display: flex; align-items: center; justify-content: center; font-size: 11px; line-height: 1; }
.pf-csearch { position: relative; }
.pf-csearch .ic { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); font-size: 13px; opacity: .5; pointer-events: none; }
.pf-csearch input { width: 100%; box-sizing: border-box; font-family: inherit; font-size: 16px; padding: 10px 12px 10px 32px; border: 1px solid var(--border-2); border-radius: 10px; background: var(--bg); color: var(--text); }
.pf-csearch input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
/* v35.7: era position:absolute (pop por cima), mas a lupa mora dentro de um <details class="pf-acc">
   que tem overflow:hidden (pro accordion fechar redondinho) — o popup nascia e enchia certinho
   (por isso passava no rig), so que CORTADO, invisivel pra ela na tela de verdade. Virou bloco
   normal, empurra o resto do accordion pra baixo em vez de flutuar por cima; nunca mais clipa. */
.pf-cdrop { margin-top: 6px; background: var(--bg); border: 1px solid var(--border-2); border-radius: 10px; box-shadow: var(--shadow-md); max-height: 234px; overflow-y: auto; }
.pf-cdrop.hidden { display: none; }
.pf-copt { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; font-size: 13.5px; color: var(--text); cursor: pointer; border-bottom: 1px solid var(--border); }
.pf-copt:last-child { border-bottom: none; }
.pf-copt:active { background: var(--accent-soft); }
.pf-copt .cb { font-size: 10.5px; color: var(--text-3); flex: none; }
.pf-cempty { padding: 10px 12px; font-size: 12px; color: var(--text-3); }

/* collapsible personalisation accordions */
.pf-acc { border: 1px solid var(--border); border-radius: 12px; margin-bottom: 10px; overflow: hidden; background: var(--bg); }
.pf-acc[open] { box-shadow: var(--shadow-sm); }
.pf-sum { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; user-select: none; }
.pf-sum::-webkit-details-marker { display: none; }
.pf-sum .g-title { font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent-deep); font-weight: 600; margin: 0; }
.pf-caret { color: var(--text-3); font-size: 18px; transition: transform .15s ease; }
.pf-acc[open] .pf-caret { transform: rotate(90deg); }
.pf-acc .g-sub { font-size: 11px; color: var(--text-3); padding: 0 14px 4px; }
.pf-acc-body { padding: 4px 14px 14px; }

/* recent-visits list */
.hist-list { display: flex; flex-direction: column; }
.hist-row { display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; border-bottom: 1px solid #F3F2F9; font-size: 12.5px; }
.hist-more { padding: 8px 0 0; font-size: 11.5px; color: var(--text-3); }
.hist-row:last-child { border-bottom: none; }
.hist-row .hd { color: var(--text-3); flex: none; width: 62px; font-variant-numeric: tabular-nums; }
.hist-row .hs { flex: 1; color: var(--text); line-height: 1.35; }
.hist-row .hw { color: var(--text-3); flex: none; font-size: 11px; }
.pf-chip.static { cursor: default; background: #F6F5FB; }
.late-phrase { font-size: 12px; color: var(--gold-deep); background: #FBF4DE; border: 1px solid var(--gold); border-radius: 10px; padding: 9px 12px; margin-bottom: 14px; }
.late-phrase i { color: var(--text-2); }

/* card: source tag + add-on chip + inline run button */
.appt .tag.src { font-weight: 700; letter-spacing: 0.03em; }
.appt .tag.member { background: #F1EAD2; color: #8A6A1E; font-weight: 600; }
.appt .tag.arrived { background: #DCF4E7; color: #1B8A5A; font-weight: 600; }
.appt .tag.patchok { background: #DCF4E7; color: #1B8A5A; }
.tag.st { font-weight: 600; letter-spacing: 0.02em; }
.tag.st-member  { background: #F1EAD2; color: #8A6A1E; }
.tag.st-vip     { background: #ECE0FA; color: #6B3FA0; }
.tag.st-new     { background: #E2DBF8; color: #4634C7; }
.tag.st-comeback{ background: #D6F2EE; color: #0E8C80; }
.tag.st-loyal   { background: #DCF4E7; color: #1B8A5A; }
.tag.st-regular { background: #DEE9FB; color: #2B5F9E; }
.tag.st-trying  { background: #FBF1D6; color: #9A7416; }
.appt .tag.src-sal { background: #FBE7C4; color: #8A5A00; }
.appt .tag.src-tw  { background: #C8EDD9; color: #0E6B3F; }
.appt .tag.src-fr  { background: #E2DBF8; color: #4634C7; }
.appt .l4 .chip.addon { background: #FBE7C4; color: #8A5A00; }

/* ---- the run wizard (treatment flow), same visual language as the Front Desk run ---- */
.rbrief{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0 4px}
.rb-chip{font-size:11px;color:var(--text-2,#585A75);background:#fff;border:1px solid var(--border,#ECECF4);border-radius:999px;padding:3px 9px;white-space:nowrap}
.rb-chip.hot{color:#8B5CB8;border-color:#DCCDF0;background:#F9F5FD;font-weight:600}
.rb-chip.warn{color:#B54708;border-color:#F5CBA0;background:#FEF7EE;font-weight:600}
.rnote{background:#fff;border:1px solid #ECECF4;border-radius:16px;padding:10px 12px 6px;margin-top:10px;box-shadow:0 2px 10px rgba(31,34,53,.05)}
.rnote-head{display:flex;align-items:center;gap:10px;padding:2px 2px 8px}
.rnote-meta{flex:1;min-width:0}
.rnote-from{font-weight:700;font-size:14px;color:#1F2235}
.rnote-handle{font-weight:500;color:#9A9BB4;font-size:12.5px}
.rnote-sub{font-size:11.5px;color:#9A9BB4}
.rnote-when{text-align:center;font-size:10px;letter-spacing:.06em;color:#B9BAC9;font-weight:700;margin:6px 0}
.rnote-head{cursor:pointer}
.rnote-new{flex:0 0 auto;background:var(--accent);color:#fff;font-size:9.5px;font-weight:800;letter-spacing:.08em;border-radius:999px;padding:3px 9px;margin-right:6px;animation:rnPulse 1.8s ease-in-out infinite}
@keyframes rnPulse{0%,100%{box-shadow:0 0 0 0 rgba(91,71,224,.45)}50%{box-shadow:0 0 0 5px rgba(91,71,224,0)}}
@media (prefers-reduced-motion:reduce){.rnote-new{animation:none}}
.rnote-reply{display:block;width:100%;margin-top:8px;border:1px solid var(--accent);background:#fff;color:var(--accent-deep);font-family:inherit;font-size:14px;font-weight:600;border-radius:12px;padding:11px 13px;cursor:pointer;text-align:center}
.rnote-reply.sent{border-color:#CDE9D8;background:#F7FBF8;color:#1B7A4A;font-weight:500;cursor:default}
.fbrief-fold > summary{list-style:none;cursor:pointer;padding:11px 14px;font-size:13.5px;color:var(--text-2)}
.fbrief-fold > summary::-webkit-details-marker{display:none}
.fbrief-fold > summary::after{content:'\203A';float:right;color:var(--text-3);font-size:18px}
.rnote-fold{flex:0 0 auto;width:28px;height:28px;border-radius:50%;border:1px solid #ECECF4;background:#fff;color:#9A9BB4;font-size:17px;line-height:1;cursor:pointer;font-family:inherit}
.rnote-head .dm-avimg,.rnote-head .dm-av{width:38px;height:38px}

.rnote-body{display:flex;flex-direction:column;gap:3px;padding:0 2px}
.rnote-p{align-self:flex-start;max-width:92%;background:#EFEFF3;border:none;border-radius:6px 18px 18px 6px;padding:9px 13px;font-size:13.5px;line-height:1.5;color:#141522;margin:0}
.rnote-body .rnote-p:first-child{border-radius:18px 18px 18px 6px}
.rnote-body .rnote-p:last-child{border-radius:6px 18px 18px 18px}
.rnote-p b{font-weight:700;color:#1F2235}
.rnote-p.hot{background:#F1EEFD;color:#3B2E8F}
.rnote-p.warn{background:#FDECEC;color:#B42318;font-weight:500}
.rnote-sign{text-align:right;font-size:11px;color:#9A9BB4;font-weight:600;margin:8px 6px 4px;font-style:normal}
.rphrases{margin-top:10px}
.rphrases>summary{font-size:12px;color:#9A9BB4;cursor:pointer;font-weight:700;list-style:none;padding:8px 12px;border:1px dashed var(--border-2,#DDDCEC);border-radius:11px;background:#FAFAFE}
.rphrases>summary::-webkit-details-marker{display:none}
.rphrases[open]>summary{border-style:solid;color:#5B47E0;border-color:#DCD6F7;background:#F8F7FE}
.rt-foot{font-size:11px;color:#9A9BB4;margin-top:5px;text-align:right}
.rplan{display:flex;flex-direction:column;gap:7px;margin-top:8px}
.rp-phase{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:#9A9BB4;font-weight:700;margin-top:5px}

  .fu-btn:hover { border-color: #7FB6E0; background: #E8F3FC; }

  .run-btn.finish:hover { background: #E9F7EF; }

}

/* v28: one-line house card for tight slots */

.ck-card { background: linear-gradient(180deg,#F6F4FF,#FFFFFF); border: 1px solid var(--border); border-radius: 14px; padding: 13px 15px; margin-bottom: 16px; text-align: left; }
.ck-h { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--accent-deep); margin-bottom: 7px; }

.ck-tasks b { color: var(--accent-deep); }

/* ================= v27 TOUCH LAYER (iPad) ================= */
html { -webkit-text-size-adjust: 100%; }
body { overscroll-behavior: none; touch-action: manipulation; }
.tl-scroll { overscroll-behavior: contain; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
* { -webkit-tap-highlight-color: transparent; }
button, .tc-dot, .mrow, .tband, .morning-card, .col-intent, .chip, .who-chip, .adm-chip,
.tr-opt, .wchip, .dm-btn, .block, .tk-row, .task-item {
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
input, textarea, select, .pf-input, .adm-paste, .adm-pass { -webkit-user-select: text; user-select: text; font-size: 16px; }
.pf-input, .adm-paste { line-height: 1.45; }
/* press feedback replaces the hover cue on touch */
.tc-dot:active, .mrow:active, .morning-card:active, .col-intent:active, .nav-b:active,
.today-b:active, .mstep-btn:active, .dm-btn:active, .tr-opt:active, .adm-chip:active,
.who-chip:active, .chip:active, .tk-row:active { filter: brightness(.96); transform: scale(.985); }
.nav-b:active, .today-b:active { transform: scale(.94); }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
}

<script>
/* ================= v32: NAVEGACAO DELAS =================
   A casca e a mesma da Joana. As PAGINAS nao: a nav dela e recepcao (Reports,
   Members, Add-ons, Forms); a delas e o trabalho delas. */
var VIEWS = [
  { id:'timeline', label:'Timeline' },
  { id:'forms',    label:'Forms'    },   /* v33.14: a Michelle ve as fichas alem do cartao */
  { id:'phrases',  label:'Phrases'  },
  { id:'tasks',    label:'Tasks'    },
  { id:'shopping', label:'Shopping' },
  { id:'stock',    label:'\uD83D\uDCE6 Stock' },
  { id:'tips',     label:'\uD83D\uDC9B Tips' }
];
var CURRENT_VIEW = 'timeline';

/* v32.119: a casa fecha 19:15 de terça a sexta e 17:15 no sábado. Segunda é fechado. */
function closeHourFor(dstr) {
  var d = new Date(String(dstr) + 'T12:00:00');
  return (d.getDay() === 6) ? (17 * 60) : (19 * 60);
}
function closeTaskWindow(dstr) {
  var c = closeHourFor(dstr);
  return fmtClock(c - 15) + ' to ' + fmtClock(c);
}

/* v32.11: o pisca pode incomodar em dia cheio, entao da para desligar no cantinho. */
var LS_BLINK = 'bsb_th_blink';
function blinkOn() { try { return localStorage.getItem(LS_BLINK) !== 'off'; } catch(e) { return true; } }
function toggleBlink() {
  try { localStorage.setItem(LS_BLINK, blinkOn() ? 'off' : 'on'); } catch(e){}
  renderDay(); renderBlinkBtn();
}
/* toque no carimbo: diagnostico rapido, para nunca mais ficar no escuro */
function showBuildInfo() {
  var filled = 0;
  Object.keys(FORMS_BY_APPT).forEach(function(k){
    (FORMS_BY_APPT[k] || []).forEach(function(f){ if (f.status === 'filled' || f.status === 'reviewed') filled++; });
  });
  alert('Build v37.9\n\n' +
    'Forms feed: ' + (FORMS_OK === true ? 'OK' : (FORMS_OK === false ? 'FAILED' : 'not loaded yet')) + '\n' +
    'Forms received: ' + FORMS_N + '\n' +
    'Filled or reviewed: ' + filled + '\n' +
    'Indexed by appointment: ' + Object.keys(FORMS_BY_APPT).length + '\n' +
    'Indexed by client: ' + Object.keys(FORMS_BY_CLIENT).length + '\n\n' +
    'Appointments loaded: ' + (APPTS[currentDate] || []).length + ' for ' + currentDate);
}
function renderBlinkBtn() {
  var b = document.getElementById('blinkBtn'); if (!b) return;
  var on = blinkOn();
  b.className = 'blink-btn' + (on ? ' on' : '');
  b.title = on ? 'Blinking on, tap to turn it off' : 'Blinking off, tap to turn it on';
  b.innerHTML = (on ? '\uD83D\uDD34' : '\u26AA') + '<span>' + (on ? 'Blink on' : 'Blink off') + '</span>';
}
function renderNav() {
  var el = document.getElementById('crossnav'); if (!el) return;
  var badge = function(v){ return (v.id === 'tasks') ? tasksBadge() : (v.id === 'shopping' ? shoppingBadge() : (v.id === 'forms' ? formsBadge() : (v.id === 'stock' ? stockBadge() : ''))); };
  var tab = function(v){ return '<a class="' + (CURRENT_VIEW === v.id ? 'active' : '') + '" onclick="switchView(\'' + v.id + '\')">' + esc(v.label) + badge(v) + '</a>'; };
  if (!simpleOn()) { el.innerHTML = VIEWS.map(tab).join(''); return; }
  /* v36.0: modo simples, so o caminho da cliente na barra; o resto no menu ⋯ */
  var front = VIEWS.filter(function(v){ return v.id === 'timeline' || v.id === 'forms'; });
  var rest = VIEWS.filter(function(v){ return v.id !== 'timeline' && v.id !== 'forms'; });
  var cur = rest.filter(function(v){ return v.id === CURRENT_VIEW; })[0];
  el.innerHTML = front.map(tab).join('') +
    (cur ? tab(cur) : '') +
    '<span class="nav-more-wrap"><a class="nav-more' + (MORE_OPEN ? ' open' : '') + '" onclick="toggleMore()">\u22EF More</a>' +
    (MORE_OPEN ? '<div class="nav-more-menu">' + rest.map(function(v){
      return '<button class="nav-more-item" onclick="moreGo(\'' + v.id + '\')">' + esc(v.label) + badge(v) + '</button>';
    }).join('') + '</div>' : '') + '</span>';
}
function switchView(id) {
  CURRENT_VIEW = id;
  ['timeline','forms','phrases','tasks','shopping','stock','tips'].forEach(function(v){
    var n = document.getElementById('view' + v.charAt(0).toUpperCase() + v.slice(1));
    if (n) n.style.display = (v === id) ? '' : 'none';
  });
  var dn = document.getElementById('dateNav');
  if (dn) dn.style.display = (id === 'timeline') ? '' : 'none';   /* data so faz sentido na agenda */
  renderNav();
  if (id === 'forms') renderFormsPage();
  if (id === 'phrases') renderPhrasesPage();
  if (id === 'tasks') renderTasksPage();
  if (id === 'shopping') renderShoppingPage();
  if (id === 'stock') openStockTab();
  if (id === 'tips') renderTipsPage();
  try { window.scrollTo(0,0); } catch(e){}
}
function onPickerChange() {
  var el = document.getElementById('dateNavPicker');
  if (el && el.value) { currentDate = el.value; renderDay(); }
}

/* ================= CONFIG ================= */
var SB_URL = 'https://qwumncqcyurojhuyazuj.supabase.co';
var SB_KEY = 'sb_publishable_7Oa5ZKlo09avfl-ZwZ876w_dgVwlO4R';

/* consultation forms, same edge function Joana uses (RLS blocks direct REST on bsb_forms) */
var FORMS_FN    = SB_URL + '/functions/v1/forms';
var FORMS_ADMIN = 'BSBF-admin-7Q2xLmn8-202637322';   /* v32.10: bate com o ADMIN_TOKEN da edge function 'forms' */
var FORM_LABELS = { massage:'Massage', body_scrub:'Body scrub', facial:'Facial', profhilo:'Profhilo', chemical_peel:'Chemical peel', mesotherapy:'Mesotherapy', pregnancy_massage:'Pregnancy massage', brow_lash:'Brow & Lash' };
var FORMS_BY_CLIENT = {};
var FORMS_BY_APPT = {};
var FORMS_BY_NAME = {};      /* v33.16: nome minusculo -> rows (marketplace vem sem client_id) */
var FORM_OVR = {};           /* ckey id:<id> / nm:<nome> -> [{form_type, state}] da recepcao */
var FORM_SENTLOG = {};       /* appt/ext id e ckey -> true (Joana mandou a mao, bsb_reminder_log) */
var FORMS_OK = null, FORMS_N = 0;   /* client_id -> [rows] */
/* v32.16: assinatura do que temos, para so redesenhar quando algo mudar de verdade */
function formsFingerprint() {
  var ids = [];
  Object.keys(FORMS_BY_APPT).forEach(function(k){
    (FORMS_BY_APPT[k] || []).forEach(function(f){ ids.push(f.id + ':' + f.status + ':' + (f.filled_at || '')); });
  });
  return ids.sort().join('|');
}
/* releitura em background: a ficha preenchida 2 minutos atras tem que aparecer sozinha */
var formsTick = null;
function startFormsWatch() {
  if (formsTick) clearInterval(formsTick);
  formsTick = setInterval(function(){
    var before = formsFingerprint();
    loadForms().then(function(){
      if (formsFingerprint() === before) return;      /* nada mudou, nao mexe na tela */
      setSync('ok', 'forms updated');
      renderDay();
      if (CURRENT_VIEW === 'forms') renderFormsPage();   /* v33.14 */
      if (modalApptId) { var a = findAppt(modalApptId); if (a) renderModal(a); }
    });
  }, 60000);
}
function loadForms() {
  return fetch(FORMS_FN, { method:'POST', headers:{ 'Content-Type':'application/json', apikey:SB_KEY, Authorization:'Bearer '+SB_KEY },
    body: JSON.stringify({ action:'list', admin:FORMS_ADMIN }) })
    .then(function(r){ return r.json(); })
    .then(function(data){
      /* falhar calado aqui custou um dia inteiro sem ficha na tela */
      if (!data || !data.ok || !data.forms) { setSync('err', 'forms: ' + ((data && data.error) || 'no data')); FORMS_OK = false; return; }
      FORMS_OK = true; FORMS_N = data.forms.length;
      FORMS_BY_CLIENT = {}; FORMS_BY_APPT = {};
      data.forms.forEach(function(r){
        if (r.client_id) (FORMS_BY_CLIENT[r.client_id] = FORMS_BY_CLIENT[r.client_id] || []).push(r);
        /* muita ficha chega SEM client_id e so com appt_id: sem este indice ela sumia */
        if (r.appt_id)   (FORMS_BY_APPT[r.appt_id]   = FORMS_BY_APPT[r.appt_id]   || []).push(r);
        /* v33.16: marketplace nao tem client_id; o NOME e a chave da casa (nm:) */
        var nk = String(r.client_name || '').trim().toLowerCase();
        if (nk) (FORMS_BY_NAME[nk] = FORMS_BY_NAME[nk] || []).push(r);
      });
    }).catch(function(){})
    .then(function(){ return loadFormSideTables(); });
}
/* v33.16: o que a JOANA marcou tambem conta ("ja tem em papel", "nao pedir", "mandei a
   mao"). Isso vive em bsb_form_override_live e bsb_reminder_log, nao em bsb_forms, e a
   aba dizia "Not sent" para visita ja resolvida na recepcao. */
function loadFormSideTables() {
  var p1 = sbGet(SB_URL + '/rest/v1/bsb_form_override_live?select=ckey,form_type,state')
    .then(function(rows){
      FORM_OVR = {};
      (rows || []).forEach(function(o){
        if (!o || !o.ckey) return;
        (FORM_OVR[o.ckey] = FORM_OVR[o.ckey] || []).push({ form_type: o.form_type, state: o.state });
      });
    }).catch(function(){});
  var p2 = sbGet(SB_URL + '/rest/v1/bsb_reminder_log?select=appt_id,ext_id,client_id,client_name&kind=eq.form&order=sent_at.desc&limit=500')
    .then(function(rows){
      FORM_SENTLOG = {};
      (rows || []).forEach(function(r){
        if (!r) return;
        if (r.appt_id) FORM_SENTLOG[r.appt_id] = true;
        if (r.ext_id) FORM_SENTLOG[r.ext_id] = true;
        if (r.client_id) FORM_SENTLOG['id:' + r.client_id] = true;
        var nk = String(r.client_name || '').trim().toLowerCase();
        if (nk) FORM_SENTLOG['nm:' + nk] = true;
      });
    }).catch(function(){});
  return Promise.all([p1, p2]);
}
var CRM_URL = 'https://rcvxtgmazqnxltuagfni.supabase.co';
var CRM_KEY = 'sb_publishable_qhRnD4WczZjrzmLmuyn2QQ_51LtduHS';
var AGENDA_TABLE = 'bsb_agenda';
var AGENDA_ROW = 'agenda';
var LS_RUN = 'bsb_therapist_run_v1';   /* run timing lives per day on the device (operational, resets daily) */

var THERAPISTS = [
  { key: 'ligia',    name: 'Ligia',    role: 'Founder',          color: '#5B47E0' },
  { key: 'dania',    name: 'Dania',    role: 'Beauty Therapist', color: '#C77DA6' },
  { key: 'anukis',   name: 'Anukis',   role: 'Nail Therapist',   color: '#3E9E8F' },
  { key: 'sana',     name: 'Sana',     role: 'Nail Therapist',   color: '#5E86C7' },
  { key: 'michelle', name: 'Michelle', role: 'Skin Therapist',   color: '#D08A3E' }
];

/* ================= STATE ================= */
var ACTIVE_TH = null;          /* "ticking as", who is logging house tasks right now (not a login) */
var LS_ACTIVE = 'bsb_therapist_active';
var currentDate = todayStr();
var APPTS = {};                /* date -> [appt] for ALL therapists (whole-team agenda) */
var OVERLAY = { clientTags: {}, byAppt: {}, clientNotes: {} };   /* inherited from Joana's bsb_agenda blob */

/* the drinks menu Joana uses (names only in this app, never prices); refreshed from bsb_drinks */
var DRINKS_MENU = [
  {category:'Coffees & Teas',name:'Brazilian Coffee'},
  {category:'Coffees & Teas',name:'Brazilian Cappuccino'},
  {category:'Coffees & Teas',name:'Matcha Latte'},
  {category:'Coffees & Teas',name:'Brazilian Iced Mate'},
  {category:'Coffees & Teas',name:'Hibiscus Iced Tea'},
  {category:'Soft',name:'Elderflower Spritz'},
  {category:'Sparkling',name:'Prosecco'},
  {category:'Sparkling',name:'Mimosa'},
  {category:'Cocktails',name:'Aperol Spritz'},
  {category:'Cocktails',name:'Caipirinha'},
  {category:'Cocktails',name:'Elderflower Gin & Tonic'},
  {category:'Wine',name:'White Wine'},

  try { localStorage.setItem('bsb_th_simple', simpleOn() ? 'off' : 'on'); } catch(e) {}
  if (simpleOn() && ['phrases','tasks','shopping','stock','tips'].indexOf(CURRENT_VIEW) >= 0) switchView('timeline');
  renderNav(); renderDay(); if (typeof renderAdminModal === 'function' && adminOpen) renderAdminModal();
}
var MORE_OPEN = false;
function toggleMore() { MORE_OPEN = !MORE_OPEN; renderNav(); }
function moreGo(id) { MORE_OPEN = false; switchView(id); }
function toggleTestMode() {
  var on = !testModeOn();
  try { localStorage.setItem('bsb_th_testmode', on ? 'on' : 'off'); } catch(e){}
  renderTrainingBanner();   /* v35.12: faixa + botao pintado, nos dois sentidos */
  if (typeof toast === 'function') toast(on ? '🧪 Test mode ON · try Start & Finish on any day (nothing saves)' : 'Test mode off');
  else if (window.jToast) jToast(on ? '🧪 Test mode ON' : 'Test mode off');
  try { var a = modalApptId ? findAppt(modalApptId) : null; if (a) renderModal(a); } catch(e){}
  try { render(); } catch(e){}
}
function toggleTraining() {
  var on = !trainingOn();
  try { localStorage.setItem(LS_TRAIN, on ? 'on' : 'off'); } catch(e){}
  if (on) { adminResetAllRuns(); }        /* comeca do zero para treinar */
  renderTrainingBanner(); renderAdminModal(); renderDay();
}
function renderTrainingBanner() {
  var el = document.getElementById('trainBanner');
  /* v35.12: o \uD83E\uDDEA test mode fica gravado no iPad pra sempre e so pintava o botao no toque; depois
     de recarregar, parecia desligado enquanto engolia toda gravacao. Agora tem faixa igual ao
     training, e o botao nasce pintado. */
  var tb = document.getElementById('testBtn');
  if (tb) { tb.style.background = testModeOn() ? '#FBF3E0' : ''; tb.style.borderColor = testModeOn() ? '#C9A96E' : ''; }
  if (!el) return;
  var on = trainingOn() || testModeOn();
  el.style.display = on ? 'block' : 'none';
  el.innerHTML = trainingOn()
    ? '\uD83C\uDF93 <b>Training mode</b> \u00b7 nothing here is saved. Practise freely. ' +
      '<button onclick="toggleTraining()">Turn off</button>'
    : (testModeOn()
      ? '\uD83E\uDDEA <b>Test mode is ON</b> \u00b7 nothing you do here is being saved (tasks, ticks, shopping, cards). ' +
        '<button onclick="toggleTestMode()">Turn off</button>'
      : '');
}

function followUpBlock(a) {
  /* v32.119: regra dela — follow-up e SO da Michelle, e SO em servico de pele (estava aparecendo
     numa manicure da Anukis). v35.9: ela pediu "todos servicos da michele ter a opcao de fazer o
     call back igual nos faciais follow up" — tirou o filtro de categoria, mantem so a terapeuta:
     agora qualquer servico da Michelle (pele OU massagem) ganha o callback. */
  if (a.therapist !== 'michelle') return '';
  if (!a.clientId || currentDate !== todayStr()) return '';
  var fu = followUpFor(a);
  if (fu) {
    var svcF = (fu.service || a.service || '').split(' - ')[0];
    var chips = [[7,'1w'],[14,'2w'],[21,'3w'],[28,'4w']].map(function(o){
      return '<button class="fu-chip' + (fu.days === o[0] ? ' on' : '') + '" onclick="fuSetDays(\'' + esc(a.id) + '\',' + o[0] + ')">' + o[1] + '</button>';
    }).join('');
    var boughtF = (fu.bought && fu.bought.length) ? fu.bought : retailSoldNames(a.id);
    return '<div class="pf-field"><label>📩 Follow-up</label><div class="fu-on">\u2713 In Joana\u2019s upcoming, she\u2019ll check in about the <b>' + esc(svcF) + '</b> around <b>' + fuDateLabel(fu.due || addDaysIso(currentDate, fu.days || 14)) + '</b>.' +
      (boughtF.length ? ' \uD83D\uDECD\uFE0F took home <b>' + esc(boughtF.join(', ')) + '</b>.' : '') +
      '<button class="fu-undo" onclick="toggleFollowUp(\'' + esc(a.id) + '\')">undo</button></div>' +
      '<div class="wrap-fu-row" style="margin-top:6px">' + chips + '</div></div>';
  }
  return '<div class="pf-field"><label>📩 Follow-up</label>' +
    '<button class="fu-btn" onclick="toggleFollowUp(\'' + esc(a.id) + '\')">📩 Ask Joana to follow up with ' + esc(firstName(a.client) || 'her') + '</button>' +
    '<div class="hintline">Goes to Joana\u2019s agenda, ideal after a first facial, a strong peel, or anything worth checking in on.</div></div>';
}

function todayStr() {
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
/* v32.8: destaque no recado. Ela le no meio do movimento, entao o olho tem que achar
   sozinho: o servico, a hora, o preco, o produto e o nome de quem recebe a cliente.
   O ** vem escrito no proprio texto; hora, preco e minutos sao pegos automaticamente. */
function hiNote(t) {
  var x = esc(t);
  x = x.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  x = x.replace(/(\d{1,2}:\d{2}\s?(?:am|pm)?)/gi, '<b>$1</b>');
  x = x.replace(/(\u00a3\d+(?:[.,]\d+)?)/g, '<b>$1</b>');
  x = x.replace(/\b(\d+\s?min)\b/g, '<b>$1</b>');
  return x;
}
function esc(s) {
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function toMin(t) {
  if (!t) return 0;
  var p = String(t).split(':');
  return (parseInt(p[0],10)||0)*60 + (parseInt(p[1],10)||0);
}
function minToHHMM(m) {
  m = Math.max(0, Math.round(m));
  return String(Math.floor(m/60)).padStart(2,'0') + ':' + String(m%60).padStart(2,'0');
}
function fmtClock(m) {
  var h = Math.floor(m/60), mm = m%60;
  var ap = h >= 12 ? 'pm' : 'am';
  var h12 = h % 12; if (h12 === 0) h12 = 12;
  return h12 + (mm ? ':' + String(mm).padStart(2,'0') : '') + ap;
}
function nowMin() { var d = new Date(); return d.getHours()*60 + d.getMinutes(); }
function fmtDate(iso) {
  var d = new Date(iso + 'T12:00:00');
  var wd = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][d.getDay()];
  var m = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()];
  return { wd: wd, txt: d.getDate() + ' ' + m + ' ' + d.getFullYear() };
}
function daysBetween(a, b) { return Math.round((new Date(b+'T12:00:00') - new Date(a+'T12:00:00')) / 86400000); }
function fmtShort(iso) {
  var d = new Date(iso + 'T12:00:00'); if (isNaN(d)) return String(iso||'');
  var m = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()];
  return d.getDate() + ' ' + m + (d.getFullYear() !== new Date().getFullYear() ? ' ' + String(d.getFullYear()).slice(2) : '');
}
function firstName(full) { return String(full || '').trim().split(/\s+/)[0] || ''; }
function initials(n) { var p = String(n||'').trim().split(/\s+/); return ((p[0]||'')[0]||'').toUpperCase() + (p.length>1 ? (p[p.length-1][0]||'').toUpperCase() : ''); }
function canonTh(n) {
  var k = (n||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
  var map = { ligia:'ligia', dania:'dania', anukis:'anukis', sana:'sana', samaneh:'sana', michelle:'michelle', michele:'michelle', joana:'joana', aluana:'aluana' };
  if (map[k]) return map[k];

/* ---------- v31.3: a categoria do servico ----------
   Fonte 1 (manda): bsb_service_price_map, a taxonomia da propria casa, que a Ligia atualiza
   quando cria servico novo, sem ninguem precisar mexer neste arquivo.
   Fonte 2 (rede): o regex abaixo, para servico que o mapa ainda nao conhece ou classifica
   como "Outros" (Nose, Full Face, Footlogix, os rituais da Eminence...). */
var SVC_CAT = {};                 /* nome do servico (minusculo) -> nails|waxing|brows|skin|massage */
var PT2CAT = { 'unhas':'nails', 'pedicure':'nails', 'remo\u00e7\u00e3o':'nails',
  'sobrancelha & c\u00edlios':'brows', 'depila\u00e7\u00e3o & tint':'waxing',
  'massagem':'massage', 'facial & pele':'skin' };
function loadServiceCats() {
  return sbGet(SB_URL + '/rest/v1/bsb_service_price_map?select=raw_service,category').then(function(rows){
    (rows || []).forEach(function(r){
      if (!r || !r.raw_service) return;
      var c = PT2CAT[String(r.category || '').trim().toLowerCase()];
      if (c) SVC_CAT[String(r.raw_service).trim().toLowerCase()] = c;
    });
  }).catch(function(){});
}
function categoryOfName(name) {
  var s = String(name || '').trim().toLowerCase();
  if (!s) return 'other';
  if (SVC_CAT[s]) return SVC_CAT[s];
  /* rede de seguranca */
  if (/manicure|pedicure|\bnail|biab|gel|shellac|builder|acrylic|acryl|infill|overlay|soak off|dip\b|chrome|cat eye|french|ombre|footlogix|callus|paraffin|\bibx\b|cutic/.test(s)) return 'nails';
  if (/wax|hollywood|bikini|underarm|hair removal|sugar|threading|thread\b|upper lips?\b|\blegs?\b|\bnose\b|\bchin\b|buttock|abdominal|\bstrip\b|full face|sideburn|navel|perianal/.test(s)) return 'waxing';
  if (/\bbrazilian\b/.test(s) && !/soul|manicure|pedicure|nail|massage|drainage|lymphatic|glow|cappuccino|blow|moon bath/.test(s)) return 'waxing';
  if (/brow|lash|lamination|tint|henna|lift\b/.test(s)) return 'brows';
  /* v32.119: "Facial Lymphatic & Sculpt Massage" e MASSAGEM, nao facial. A palavra que
     manda e a tecnica, nao a parte do corpo. */
  if (/massage|drainage|lymphatic|reflexolog|deep tissue|sculpt|scrub/.test(s)) return 'massage';
  if (/facial|skin|peel|profhilo|mesotherapy|dermaplan|microneedl|hydro|led|glow|derma|\u00e9minence|eminence|gemstone|radiance|ritual|milia/.test(s)) return 'skin';
  if (/relax|body\b/.test(s)) return 'massage';
  return 'other';
}
function category(a) {
  /* num run agrupado o a.service e a soma dos servicos; a categoria de verdade
     vem das PARTES, nao da string colada (senao "Hollywood + Pedicure" some como unhas) */
  if (a && a.__group && a.__group.length) return runCategories(a)[0];
  return categoryOfName(a && a.service);
}
function hasCat(a, c) { return runCategories(a).indexOf(c) >= 0; }
/* v31.3: groupedAppt corta o nome no " - " ao juntar os servicos, entao a variante
   ("Classic Polish", "Gel Polish") sumia e as regras que dependem dela erravam.
   Aqui devolvemos o nome INTEIRO de cada parte do dia. */
function runParts(a) { return (a && a.__group && a.__group.length) ? a.__group : [a]; }
function runServiceText(a) {
  return runParts(a).map(function(x){ return String((x && x.service) || ''); }).join(' | ').toLowerCase();
}
/* TODAS as categorias que a cliente faz hoje com esta terapeuta, na ordem do dia.
   E disto que as personalizacoes tem que sair: do que foi feito, nao do primeiro servico. */
function runCategories(a) {
  if (!a) return ['other'];
  var parts = (a.__group && a.__group.length) ? a.__group : (typeof runSiblings === 'function' ? runSiblings(a) : [a]);
  var out = [];
  parts.forEach(function(x){
    var c = categoryOfName(x && x.service);
    if (out.indexOf(c) < 0) out.push(c);
  });
  if (!out.length) out.push(categoryOfName(a.service));
  /* "other" so sobrevive se for a unica coisa do dia */
  if (out.length > 1) {
    var real = out.filter(function(c){ return c !== 'other'; });
    if (real.length) out = real;
  }
  return out;
}

/* v35.21: o PostgREST devolve NO MAXIMO 1000 linhas por chamada, mesmo com limit=2000. O historico
   de 30 clientes num sabado cheio passa de 2000 linhas (21/08: 36 clientes, 2016 linhas; uma cliente
   sozinha tem 402) e o corte era silencioso: as datas mais antigas sumiam e a ficha dizia menos visitas.
   Aqui pagina ate acabar. */
function sbGetAll(url, pageSize) {
  pageSize = pageSize || 1000;
  var all = [], from = 0;
  function step() {
    return fetch(url, { headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, Range: from + '-' + (from + pageSize - 1) } })
      .then(function(r){ return r.ok ? r.json() : []; })
      .then(function(rows){
        rows = rows || []; all = all.concat(rows);
        if (rows.length === pageSize) { from += pageSize; return step(); }
        return all;
      });
  }
  return step().catch(function(){ return all; });
}

   A regra vive no hub (bsb_lunch_rules: 30 min entre 12h e 15h, por terapeuta). O app
   coloca sozinho no primeiro vao livre da janela; ela pode ARRASTAR para outro horario;
   e se entrar cliente em cima, ele pula para o proximo vao de 30 min. */
var LUNCH_RULES = {};

function loadLunchRules() {
  return sbGet(SB_URL + '/rest/v1/bsb_lunch_rules?select=therapist,minutes,window_start,window_end,active')
    .then(function(rows){

        LUNCH_RULES[canonTh(r.therapist)] = {
          mins: Number(r.minutes) || 30,
          from: toMin(String(r.window_start || '12:00').slice(0,5)),
          to:   toMin(String(r.window_end   || '15:00').slice(0,5))
        };
      });
    }).catch(function(){});

function lunchOvrStore() { try { return JSON.parse(localStorage.getItem(LS_LUNCH) || '{}'); } catch(e){ return {}; } }
function lunchOvrSave(o) { try { localStorage.setItem(LS_LUNCH, JSON.stringify(o)); } catch(e){} }
function lunchFree(key, start, mins) {
  var end = start + mins;
  var busy = (APPTS[currentDate] || []).filter(function(x){ return x.therapist === key; })
    .some(function(x){ var s2 = toMin(x.time); return s2 < end && (s2 + (x.duration || 60)) > start; });
  if (busy) return false;
  return !(BLOCKS[currentDate] || []).some(function(b){
    if (b.therapist !== key) return false;
    var s2 = toMin(b.time), d2 = b.duration || 30;
    return s2 < end && (s2 + d2) > start;
  });
}
function lunchSlotFor(key) {
  var r = LUNCH_RULES[key]; if (!r) return null;
  /* se o Salonized ja tem um bloqueio de almoco, ele manda e o app nao inventa outro */
  var real = (BLOCKS[currentDate] || []).some(function(b){
    return b.therapist === key && (b.duration || 30) === r.mins && !/absent/i.test(b.service || '');
  });
  if (real) return null;
  var OV = lunchOvrStore();
  if (OV[currentDate + '|' + key + '|hide']) return null;   /* v32.119: passou para outra */
  var o = OV[currentDate + '|' + key];
  if (o != null && lunchFree(key, o, r.mins)) return { start: o, mins: r.mins, moved: true };
  /* v36.6: passo de 5 min. Dania 17/09 so tinha o vao 13:40-14:10 e a grade de 15 em 15
     (12:00, 12:15... 13:30, 13:45) nunca caia em 13:40: o break sumia da agenda sem aviso. */
  for (var t = r.from; t + r.mins <= r.to; t += 5) {
    if (lunchFree(key, t, r.mins)) return { start: t, mins: r.mins, bumped: (o != null) };
  }
  return null;   /* dia cheio: nao inventa almoco onde nao cabe */
}

/* v35.19: o auditor de toque pegou: preventDefault no touchstart faz o iPad ENGOLIR o click,
   entao o card da manha, o de fechamento, a faixa de daytime, o almoco e os projetos nao abriam
   com o dedo (so com mouse). No toque deixamos o click viver; o touchmove continua travando o
   scroll (passive:false) e um dedo que se move nao vira click. No mouse segue como era. */
/* v36.3: "nao consigo arrastar os breaks" (iPad). A v35.19 tirou o preventDefault do touchstart para o
   click viver, mas sem ele o iPad rouba o gesto para o scroll. Volta o preventDefault SEMPRE, e o
   toque-sem-arrastar vira click por conta propria no up(): arrasta E abre. */
function dragStartGuard(ev) {
  ev.preventDefault();
  ev.stopPropagation();
  return { touch: !!ev.touches, el: ev.currentTarget || ev.target };
}
function dragTapEnd(g) {
  if (!g || !g.touch || !g.el) return;
  try { g.el.click(); } catch (e) {}
}
function dragTaskCard(ev, key, per) {
  var g = dragStartGuard(ev);
  var y0 = (ev.touches ? ev.touches[0].clientY : ev.clientY);
  var x0 = (ev.touches ? ev.touches[0].clientX : ev.clientX);
  var moved = false, owner = key;
  var el = ev.currentTarget || ev.target;
  var base = parseInt((el && el.style && el.style.top) || '0', 10) || 0;
  function move(e2) {
    if (e2.cancelable) e2.preventDefault();
    var y = (e2.touches ? e2.touches[0].clientY : e2.clientY);
    var x = (e2.touches ? e2.touches[0].clientX : e2.clientX);
    var top = Math.max(0, base + (y - y0));
    /* v32.119: para QUEM ela arrastou. O card muda de coluna. */
    var toKey = colAtPoint(x, y) || owner;
    var o = taskPosStore();
    if (toKey !== owner) {
      o[currentDate + '|' + owner + '|' + per + '|hide'] = 1;
      delete o[currentDate + '|' + owner + '|' + per];
      delete o[currentDate + '|' + toKey + '|' + per + '|hide'];
    }
    o[currentDate + '|' + toKey + '|' + per] = Math.round(top);
    taskPosSave(o); owner = toKey; moved = true; renderDay();
  }
  function up() {
    document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up);
    document.removeEventListener('touchmove', move); document.removeEventListener('touchend', up);
    if (moved) setSync('ok', 'tasks moved'); else dragTapEnd(g);
  }
  document.addEventListener('mousemove', move); document.addEventListener('mouseup', up);
  document.addEventListener('touchmove', move, { passive:false }); document.addEventListener('touchend', up);
}

/* v35.20: REGRAS DO CHECK OUT por servico (bsb_checkout_rules), editadas pela Ligia em ⚙ 🧾.
   Ela: "quero ajustar todos os servicos e quais 'took anything home' aparece. quero q tenha em
   alguns se teve additional service, e aonde tem o took home personalizado com cada servico".
   Uma regra por CATEGORIA (nails, waxing, brows, skin, massage, other) e regras por SERVICO
   (palavra-chave no nome; vale quando TODAS as partes do dia batem, senao "Gel Removal Manicure"
   viraria "so remocao"). A regra diz: pergunta Extras? pergunta Took home? com que texto, e
   quais categorias do retail aparecem embaixo. */
var CHECKOUT_RULES = [];
function loadCheckoutRules() {
  return sbGet(SB_URL + '/rest/v1/bsb_checkout_rules?select=*&active=eq.true&order=sort.asc')
    .then(function(rows){ CHECKOUT_RULES = rows || []; }).catch(function(){});
}
function ruleMatchesRun(rule, a) {
  var kw = String(rule.match || '').toLowerCase().split('|').map(function(x){ return x.trim(); }).filter(Boolean);
  if (!kw.length) return false;
  var parts = runParts(a).map(function(x){ return String((x && x.service) || '').toLowerCase(); }).filter(Boolean);
  if (!parts.length) return false;
  return parts.every(function(pt){ return kw.some(function(k){ return pt.indexOf(k) >= 0; }); });
}
function checkoutRuleFor(a) {
  var svc = CHECKOUT_RULES.filter(function(r){ return r.kind === 'service' && ruleMatchesRun(r, a); })[0];
  if (svc) return svc;
  var cat = category(a);
  var byCat = CHECKOUT_RULES.filter(function(r){ return r.kind === 'category' && r.match === cat; })[0];
  return byCat || { id: '', kind: 'category', match: cat, label: CAT_LABEL[cat] || 'Treatment', extras: true, retail: true, retail_label: 'Took anything home?', retail_cats: [] };
}
/* os produtos que esta cliente ve no check out: so as categorias da regra (vazio = todas) */
function retailProductsFor(a) {
  var rule = checkoutRuleFor(a);
  var cats = (rule.retail_cats || []).map(function(c){ return String(c).toLowerCase(); });
  if (!cats.length) return RETAIL_PRODUCTS;
  return RETAIL_PRODUCTS.filter(function(p){ return cats.indexOf(String(p.category || 'Other').toLowerCase()) >= 0; });
}

/* v35.17: "e se ela comprou mais de um?" — quantidade por produto, com − e + na sacola */
function retailQty(apptId, productId, delta) {
  var a = findAppt(apptId); if (!a) return;
  var it = null; (RETAIL_SOLD[apptId] || []).forEach(function(x){ if (x.product_id === productId) it = x; });
  if (!it) return;
  var q = (it.qty || 1) + delta;
  if (q <= 0) { toggleRetailItem(apptId, productId); return; }   /* zerar = tirar da sacola */
  it.qty = q;
  rerenderIfGroupOpen(apptId);
  sbUpsert('bsb_retail_sales', { date: currentDate, appt_id: apptId, client_id: a.clientId || null, client: a.client || null,
    therapist: canonTh(a.therapist), product_id: productId, product: it.product, qty: q }, 'appt_id,product_id')
    .then(function(r){ if (r && r.ok) setSync('ok', it.product + ' \u00d7' + q); }).catch(function(){ setSync('err', 'not saved'); });
}
/* toca num produto no check out: entra/sai de bsb_retail_sales, e o "Took anything home" vira sim */
function toggleRetailItem(apptId, productId) {
  var a = findAppt(apptId); if (!a) return;
  var p = null; RETAIL_PRODUCTS.forEach(function(x){ if (x.id === productId) p = x; }); if (!p) return;
  var list = RETAIL_SOLD[apptId] || [];
  var has = list.some(function(x){ return x.product_id === productId; });
  if (has) {
    RETAIL_SOLD[apptId] = list.filter(function(x){ return x.product_id !== productId; });
    if (!RETAIL_SOLD[apptId].length && wizVal(apptId, 'retail') === true) setWizVal(apptId, 'retail', undefined);
    rerenderIfGroupOpen(apptId);
    fetch(SB_URL + '/rest/v1/bsb_retail_sales?appt_id=eq.' + encodeURIComponent(apptId) + '&product_id=eq.' + encodeURIComponent(productId), {
      method: 'DELETE', headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, Prefer: 'return=minimal' }
    }).then(function(r){ if (!r.ok) setSync('err', 'not saved · ' + r.status); }).catch(function(){ setSync('err', 'not saved'); });
  } else {
    RETAIL_SOLD[apptId] = list.concat([{ product_id: productId, product: p.name, qty: 1 }]);
    setWizVal(apptId, 'retail', true);
    rerenderIfGroupOpen(apptId);
    sbUpsert('bsb_retail_sales', { date: currentDate, appt_id: apptId, client_id: a.clientId || null, client: a.client || null,
      therapist: canonTh(a.therapist), product_id: productId, product: p.name, qty: 1 }, 'appt_id,product_id')
      .then(function(r){ if (r && r.ok) setSync('ok', 'sold · ' + p.name); }).catch(function(){ setSync('err', 'not saved'); });
  }
}
/* v35.16: ela — "quando clico em cleanser tinha que aparecer qual; só produtos da Eminence; pode
   aparecer kit; o que ela clicar vai aparecendo: Eminence › Cleanser › Chamomile". Catálogo inteiro
