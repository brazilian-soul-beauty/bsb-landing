<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Soul Path</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Soul Path">
<meta name="theme-color" content="#5B47E0">
<link rel="manifest" href="manifest.json">
<link id="touchIcon" rel="apple-touch-icon" href="icons/ligia.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F5FB;--card:#fff;--ink:#1F2235;--mut:#8A8BA6;--line:#ECECF4;--pur:#5B47E0;--pur2:#EEEBFF;--grn:#22B66E;--grn2:#E6F7EE;--red:#E5484D;--red2:#FDECEC;--gold:#E3B23C;--gold2:#FFF5DC;--pink:#E23E8C;--pink2:#FDE8F2;--sil:#9BA3B4;--brz:#C98A55}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select{font-family:inherit;font-size:14px;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;color:var(--ink)}
#app{height:100dvh;display:flex;flex-direction:column}
.top{height:58px;flex:none;display:flex;align-items:center;gap:12px;padding:0 18px;background:#fff;border-bottom:1px solid var(--line)}
.top .logo{font-weight:800;font-size:17px;color:var(--pur);white-space:nowrap}
.top .who{font-weight:700;font-size:15px;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--pur2);color:var(--pur);white-space:nowrap}
.chip.g{background:var(--grn2);color:var(--grn)}.chip.r{background:var(--red2);color:var(--red)}.chip.y{background:var(--gold2);color:#9A6B00}.chip.k{background:#F1F1F6;color:var(--mut)}
.tabs{display:flex;gap:4px;margin-left:auto}
.tab{padding:8px 14px;border-radius:10px;font-weight:600;font-size:14px;color:var(--mut)}
.tab.on{background:var(--pur);color:#fff}
.out{font-size:13px;color:var(--mut);font-weight:600;padding:8px}
.pg{flex:1;min-height:0;padding:16px 18px;display:flex;flex-direction:column;gap:14px;overflow:hidden}
.card{background:var(--card);border-radius:18px;box-shadow:0 1px 3px rgba(16,24,40,.06);padding:16px}
.h{font-size:13px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.big{font-size:34px;font-weight:800;line-height:1}
.mut{color:var(--mut)}
.row{display:flex;gap:14px;min-height:0}
.grow{flex:1;min-width:0}
.bar{height:10px;border-radius:99px;background:#F0EFF7;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--pur);transition:width .6s}
.banner{background:linear-gradient(90deg,var(--pur),#8C6CF0);color:#fff;border-radius:14px;padding:10px 16px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:10px}
.prac{background:var(--gold2);color:#7A5600;border-radius:12px;padding:8px 14px;font-size:13px;font-weight:600}
/* login */
.login{flex:1;display:flex;align-items:center;justify-content:center}
.lg{width:320px;text-align:center}
.lg h1{font-size:28px;font-weight:800;color:var(--pur);margin-bottom:4px}
.dots{display:flex;gap:12px;justify-content:center;margin:22px 0}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--pur)}
.dots i.f{background:var(--pur)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.keys button{height:62px;border-radius:16px;background:#fff;font-size:24px;font-weight:700;box-shadow:0 1px 3px rgba(16,24,40,.08)}
.err{color:var(--red);font-weight:600;height:20px;margin-top:10px;font-size:14px}
/* today */
.hero{display:flex;align-items:center;gap:16px}
.fire{font-size:44px;line-height:1}
.mis{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;flex:1;min-height:0}
.mc{display:flex;flex-direction:column;justify-content:center;gap:12px;min-height:0}
.mc .grow{flex:none;width:85%}
.mc{align-items:center;text-align:center}
.mc .bar{width:100%}
.mc .miss{justify-content:center}
.miss.ok span{background:var(--grn2);color:var(--grn)}
.mc .why{font-size:13px;color:var(--mut);font-weight:600;margin-top:8px}
.mc .ic{font-size:44px}
.mc .t{font-weight:800;font-size:17px}
.mc .n{font-size:40px;font-weight:800;margin:4px 0 8px}
.mc.done{background:var(--grn2)}
.mc.done .bar i{background:var(--grn)}
.miss{display:flex;flex-wrap:wrap;gap:5px}
.miss span{background:var(--pink2);color:var(--pink);font-size:12px;font-weight:700;border-radius:99px;padding:3px 9px}
.look{display:flex;gap:10px;align-items:center}
.lk{flex:1;height:64px;border-radius:14px;border:2px solid var(--line);background:#fff;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px}
.lk.on{border-color:var(--pink);background:var(--pink2);color:var(--pink)}.lk.ro{cursor:default;opacity:.75}.lk.ro.on{opacity:1}
.lkst{min-width:170px;text-align:center;font-weight:700;font-size:14px}
/* path */
.road{display:flex;align-items:center;justify-content:space-between;position:relative;padding:10px 20px}
.road:before{content:"";position:absolute;left:60px;right:60px;top:56px;height:6px;border-radius:9px;background:#E4E1F5}
.st{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:8px;width:150px;text-align:center}
.st .o{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;background:#fff;border:4px solid #E4E1F5}
.st.done .o{border-color:var(--grn);background:var(--grn2)}
.st.cur .o{border-color:var(--pur);background:var(--pur2);box-shadow:0 0 0 8px rgba(91,71,224,.12)}
.st .nm{font-weight:800;font-size:14px}
.st .pl{font-size:12px;font-weight:700;color:var(--grn)}
.st .pl.mut{color:var(--mut)}
.gates{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.gate .gv{font-size:22px;font-weight:800;margin:6px 0}
.gate.ok{background:var(--grn2)}
.gate.ok .bar i{background:var(--grn)}
/* wins */
.wins{display:grid;grid-template-columns:repeat(5,1fr);grid-auto-rows:1fr;gap:12px;flex:1;min-height:0}
.wins.w11{grid-template-columns:repeat(6,1fr)}
.w{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;padding:12px}
.w > div:last-child{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%}
.w .wi{font-size:52px;filter:grayscale(1);opacity:.4}
.w.t1 .wi,.w.t2 .wi,.w.t3 .wi{filter:none;opacity:1}
.w .wn{font-weight:800;font-size:16px}
.w .wt{display:flex;gap:6px;font-size:24px}
.w .wt b{opacity:.2}.w .wt b.on{opacity:1}
.w .wp{font-size:12px;color:var(--mut);font-weight:600}
.w.t3{background:var(--gold2)}
/* prizes */
.boxes{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.bx{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;text-align:center}
.bx .bi{font-size:40px}
.bx .bn{font-size:13px;font-weight:700}
.bx.ready{background:var(--pur2);animation:wig 2.2s infinite}
@keyframes wig{0%,88%,100%{transform:rotate(0)}92%{transform:rotate(-4deg)}96%{transform:rotate(4deg)}}
.reveal{position:fixed;inset:0;background:rgba(31,34,53,.55);display:flex;align-items:center;justify-content:center;z-index:50}
.reveal .card{width:min(380px,90vw);text-align:center;padding:30px}
.reveal .bi{font-size:70px;animation:pop .6s}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
/* admin */
.team{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:start}
.tc .kv{font-size:15px;padding:3px 0}
.tc{display:flex;flex-direction:column;gap:9px;cursor:pointer}
.tc .nm{font-size:19px;font-weight:800}
.kv{display:flex;justify-content:space-between;font-size:14px;font-weight:600}
.kv b{font-weight:800}
.btn{padding:9px 14px;border-radius:11px;font-weight:700;font-size:14px;background:var(--pur);color:#fff}
.btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.btn.g{background:var(--grn)}.btn.r{background:#fff;border:1.5px solid var(--red);color:var(--red)}
.btn.sm{padding:6px 10px;font-size:13px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl td,.tbl th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
.tbl th{font-size:12px;color:var(--mut);font-weight:700;text-transform:uppercase}
.tbl input,.tbl select{padding:5px 7px;font-size:13px}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:8px;font-size:13px;color:var(--mut);font-weight:600}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-weight:600;font-size:14px;z-index:60}
.load{flex:1;display:flex;align-items:center;justify-content:center;color:var(--mut);font-weight:600}


/* v4 arte */
.std{display:inline-block;margin-top:6px;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:700;background:rgba(255,255,255,.2);color:#fff}
.std.warn{background:rgba(255,255,255,.92);color:#7A6F61}
.mimg{width:76px;height:76px;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(120,80,40,.3))}
.mc:not(.done) .mimg{filter:grayscale(.15) drop-shadow(0 6px 10px rgba(120,80,40,.25))}
@media (max-width:760px){.mimg{width:40px;height:40px}}
.mapc{padding:0;overflow:hidden;aspect-ratio:2.416;flex:none;max-height:min(44vh,420px);position:relative;background:#FBF7F3}
.mapin{position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);height:100%;aspect-ratio:2.416;max-width:100%;background:url(medals/map_full.webp) center/100% 100% no-repeat;z-index:1;-webkit-mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent);mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent)}.mapc::before{content:'';position:absolute;inset:-30px;background:url(medals/map_full.webp) center/cover no-repeat;filter:blur(22px) saturate(1.1);opacity:.85}.mapc::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(251,247,243,.55),rgba(251,247,243,0) 25%,rgba(251,247,243,0) 75%,rgba(251,247,243,.55))}
@supports not (aspect-ratio:1){.mapc{height:300px}}
.pin{position:absolute;transform:translate(-50%,-78%);display:flex;flex-direction:column;align-items:center;gap:4px}
.pin .lk{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 4px 14px rgba(120,80,40,.35)}
.pin.done .lk{background:#E6F7EE;color:var(--grn);font-weight:900}
.pin .lbl{background:rgba(255,255,255,.92);border-radius:99px;padding:3px 10px;font-size:12px;font-weight:800;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.pin.cur .av{animation:hop 1.6s ease-in-out infinite;filter:drop-shadow(0 8px 10px rgba(120,80,40,.45))}
.pin.cur .lbl{background:var(--pur);color:#fff}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.mis .mimg{width:58px!important;height:58px!important}.mc .n{margin:2px 0 4px!important}
.lookgift{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding:6px 14px;border-radius:12px;background:var(--pink2);color:var(--pink);font-size:13px;font-weight:700}.lookgift.ok{background:var(--grn2);color:var(--grn)}
.kys{display:flex;gap:5px}.ky{width:26px;height:26px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:15px;background:rgba(255,255,255,.7);border:1.5px dashed currentColor;opacity:.8}.ky.key{border:none;background:#FFF3D6;opacity:1;animation:wig 2.4s infinite}.ky.miss{border-style:solid;opacity:.35}
.tiers{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}.tiers span{font-size:12px;font-weight:800;padding:5px 10px;border-radius:99px;background:#F3F1FA;color:var(--mut)}.tiers span.done{background:var(--grn2);color:var(--grn)}.tiers span.on{background:var(--pur);color:#fff}
.revbox{z-index:1;background:rgba(255,255,255,.14);border-radius:16px;padding:12px 16px;min-width:230px;display:flex;flex-direction:column;gap:4px}
.revbox .rl{font-size:12px;font-weight:700;opacity:.9}.revbox .rn{font-size:30px;font-weight:800;line-height:1}.revbox .rn b{font-size:40px}
.chap{position:absolute;left:14px;top:12px;background:rgba(255,255,255,.92);border-radius:99px;padding:5px 12px;font-size:12px;font-weight:800;color:var(--pur);box-shadow:0 2px 8px rgba(0,0,0,.12)}
.pin.gate .lk{background:rgba(255,246,220,.95);box-shadow:0 0 0 6px rgba(255,214,140,.35),0 4px 14px rgba(120,80,40,.35)}
.hero2{background:linear-gradient(100deg,rgba(74,55,201,.92) 0%,rgba(91,71,224,.82) 45%,rgba(140,108,240,.55) 100%),url(medals/sunrise.webp) center/cover!important}
.bx .bi img{width:86px;height:86px;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(120,80,40,.3))}
.bx.wait .bi img{filter:grayscale(.6) opacity(.55)}
.bx.ready .bi img{animation:wig 1.8s infinite}
.reveal .bi img{width:170px;height:170px;object-fit:contain}
@media (max-width:760px){.pin .lk{width:30px;height:30px;font-size:14px}.pin .lbl{font-size:10px;padding:2px 6px}.pin.cur .av{width:44px!important;height:44px!important}}

/* v3 movimento */
@property --deg{syntax:'<angle>';inherits:false;initial-value:0deg}
.ring{background:conic-gradient(#FFD27A var(--deg), rgba(255,255,255,.18) 0)!important;transition:--deg 1.2s cubic-bezier(.2,.8,.2,1)}
.rise{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.98)}}
.hero2 .av{animation:bob 3.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.mc.win{animation:winpop .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes winpop{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}
.mc{transition:background .5s,transform .2s}
.mc:active,.lk:active,.tab:active{transform:scale(.97)}
.xpf{position:fixed;z-index:80;font-weight:900;font-size:26px;color:#FFB800;text-shadow:0 2px 0 #fff,0 4px 12px rgba(91,71,224,.4);pointer-events:none;animation:xpup 1.4s ease-out forwards}
@keyframes xpup{0%{opacity:0;transform:translateY(10px) scale(.6)}20%{opacity:1;transform:translateY(0) scale(1.15)}100%{opacity:0;transform:translateY(-90px) scale(1)}}
.xpbar{height:8px;border-radius:9px;background:rgba(255,255,255,.22);overflow:hidden;margin-top:8px;max-width:340px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#FFD27A,#FFF1C2);border-radius:9px;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.xptag{font-size:12px;font-weight:800;opacity:.9;margin-top:4px}
.bar i{transition:width 1s cubic-bezier(.2,.8,.2,1)}
.lvlup{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,rgba(91,71,224,.55),rgba(31,34,53,.75));animation:fadein .3s}
.lvlup .box{text-align:center;color:#fff}
.lvlup .big1{font-size:90px;animation:pop .8s cubic-bezier(.2,1.6,.4,1)}
.lvlup h2{font-family:'Cormorant Garamond',serif;font-size:44px;margin:6px 0}
@keyframes fadein{from{opacity:0}}

/* v2 cara de jogo */
.av{border-radius:50%;object-fit:contain;flex:none;display:inline-flex;align-items:center;justify-content:center}
.av.ini{background:linear-gradient(135deg,#E9D9B8,#C9A26A);color:#fff;font-weight:800;border-radius:50%}
.serif{font-family:'Cormorant Garamond',serif;font-weight:600}
.hero2{display:flex;align-items:center;gap:22px;padding:14px 22px;border-radius:22px;color:#fff;
  background:radial-gradient(120% 140% at 0% 0%,#8C6CF0 0%,#5B47E0 45%,#3B2BA8 100%);box-shadow:0 10px 30px rgba(91,71,224,.28);position:relative;overflow:hidden}
.hero2:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,214,140,.35),transparent 70%)}
.hero2 .hi{font-size:34px;line-height:1.05}
.hero2 .sub{opacity:.85;font-weight:600;font-size:14px;margin-top:4px}
.ring{width:118px;height:118px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;position:relative;z-index:1}
.ring .in{width:92px;height:92px;border-radius:50%;background:#4A37C9;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .in b{font-size:30px;font-weight:800;line-height:1}.ring .in span{font-size:11px;font-weight:700;opacity:.85}
.flame{display:flex;flex-direction:column;align-items:center;z-index:1;min-width:96px}
.flame .f{font-size:46px;line-height:1;animation:flick 1.8s infinite ease-in-out}
@keyframes flick{0%,100%{transform:scale(1)}50%{transform:scale(1.08) rotate(-3deg)}}
.flame b{font-size:28px;font-weight:800}.flame span{font-size:12px;font-weight:700;opacity:.85}
.conf{position:fixed;top:-30px;font-size:22px;z-index:70;pointer-events:none;animation:fall 2.6s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.2}}
.w.t1,.w.t2,.w.t3{position:relative;overflow:hidden;border:2px solid #F1DFB2}
.w.t1:before,.w.t2:before,.w.t3:before{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.7),transparent);animation:shine 3.5s infinite}
@keyframes shine{0%{left:-60%}60%,100%{left:130%}}
.w.t0 .wi{filter:brightness(0);opacity:.12}
.w.t0{border:2px dashed #E4E1F5;background:#FBFAFF}
.w > *{position:relative;z-index:1}
.w.t1:before,.w.t2:before,.w.t3:before{z-index:0;opacity:.6}
.cal .dn{font-size:16px}
.w.art .wi img{width:96px;height:96px;object-fit:contain;filter:drop-shadow(0 6px 12px rgba(201,138,85,.35))}
.w.art.t0 .wi{filter:none;opacity:1}
.w.art.t0 .wi img{filter:grayscale(1) brightness(1.15);opacity:.38}
.w.art:not(.t0) .wi img{animation:medal 3.5s ease-in-out infinite}
@keyframes medal{0%,100%{transform:rotate(-3deg) scale(1)}50%{transform:rotate(3deg) scale(1.04)}}
.togo{font-size:12px;font-weight:800;color:var(--pur);background:var(--pur2);border-radius:99px;padding:3px 10px}
.st .o img{width:84px;height:84px}
.st.cur .o{width:96px;height:96px;background:#fff;border-color:var(--gold);box-shadow:0 0 0 8px rgba(227,178,60,.18)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:1fr;gap:6px;flex:1;min-height:0}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.strip .card{padding:12px}
.welcome{flex:1;display:flex;flex-direction:column;gap:14px}
@media (max-width:760px){
  .hero2{gap:10px;padding:12px}
  .hero2 .av{width:58px!important;height:58px!important}
  .gpend{display:none}
  .goalc .big{font-size:22px!important}
  .goalc .h{font-size:11px}
  .goalc span{font-size:12px}
  .hero2 .sub{font-size:12px}.hero2 .hi{font-size:24px}
  .ring{width:84px;height:84px}.ring .in{width:64px;height:64px}.ring .in b{font-size:20px}
  .flame .f{font-size:30px}.flame b{font-size:20px}.flame{min-width:60px}
  .strip{grid-template-columns:repeat(3,1fr)}.strip .card .big{font-size:18px!important}
  .st .o img{width:52px;height:52px}.st.cur .o{width:60px;height:60px}
}
@media (max-width:760px){
  .top{height:auto;flex-wrap:wrap;padding:8px 12px;gap:6px}
  .tabs{margin-left:0;width:100%;order:9}
  .top .chip{display:none}

      '<div class="kv"><span>🔒 Next level</span><b>' + (m.next ? m.pathPct + '%' : 'Top') + '</b></div>' + bar(m.pathPct, 100) +
      (m.paused ? '<span class="chip y">🔧 Pit stop · paused</span>' : '') +
      (m.ready ? '<button class="btn g" onclick="event.stopPropagation();approveLevel(\'' + e(p.person) + '\')">🔓 Open ' + e(m.next.name) + '</button>' : '') +
      '<div class="mut" style="font-size:12px;font-weight:600">' + MOT[p.motivator] + '</div>' +
      '<select onclick="event.stopPropagation()" onchange="setDream(\'' + e(p.person) + '\',this.value)"><option value="">🌟 Dream: not chosen</option>' +
        Object.keys(DREAM).map(function(k){ return '<option value="' + k + '"' + (p.dream === k ? ' selected' : '') + '>' + DREAM[k].ic + ' ' + DREAM[k].name + '</option>'; }).join('') + '</select></div>';
  }).join('') + '</div>';
}
function setDream(name, v){
  rpc('bsb_sp_set_dream', { p_code: S.code, p_person: name, p_dream: v }).then(function(ok){ if (!ok) return toast('Not saved'); var p = personOf(name); if (p) p.dream = v || null; toast(v ? DREAM[v].ic + ' ' + name + ' · ' + DREAM[v].name : '🌟 Cleared'); }).catch(function(){ toast('Not saved'); });
}
function approveLevel(name){
  var p = personOf(name), m = S.M[name]; if (!p || !m || !m.next) return;
  var nl = p.level + 1;
  Promise.all([
    upsert('bsb_sp_levelups', { person: name, level: nl, approved_by: S.who }),
    savePerson(Object.assign({}, adminRow(name), { level: nl, level_since: TODAY }))
  ]).then(function(){ toast('🔓 ' + name + ' is now ' + m.next.name); return loadBase(); }).then(adminLoad).catch(function(){ toast('Not saved'); });
}

/* ===== STEPS: os passos que a Ligia define para abrir o proximo nivel ===== */
function pgSteps(){
  var who = S.stepWho || (therapists()[0] || {}).person, p = personOf(who) || {}, L = S.set.levels || [], nx = L[p.level] || {};
  var ap = S.adminPeople.filter(function(x){ return x.person === who; })[0] || {};
  var list = S.steps.filter(function(x){ return x.person === who && x.level === p.level + 1; }), pp = pager('steps', list, 8);
  if (!S.adminPeople.length) rpc('bsb_sp_admin_people', { p_code: S.code }).then(function(r){ S.adminPeople = r; render(); });
  return '<div class="row" style="align-items:center;gap:10px">' + therapists().map(function(t){ return '<button class="btn ' + (t.person === who ? '' : 'ghost') + ' sm" onclick="S.stepWho=\'' + e(t.person) + '\';render()" style="display:flex;align-items:center;gap:6px">' + av(t.person, 24) + e(t.person) + '</button>'; }).join('') + '</div>' +
    '<div class="card" style="flex:1;min-height:0"><div class="h">🔑 ' + e(who) + ' · steps to open ' + e(nx.name || 'next level') + (ap.next_rate ? ' · £' + Number(ap.next_rate).toFixed(2) + '/h' : '') + '</div>' +
    '<div class="row" style="gap:8px;margin-bottom:10px"><input id="stN" placeholder="New step" class="grow"><button class="btn" onclick="addStep()">Add</button></div>' +
    '<table class="tbl">' + pp.items.map(function(x){ return '<tr><td style="width:40px">' + (x.done_at ? '✅' : '🔑') + '</td><td><b>' + e(x.title) + '</b>' + (x.done_at ? '<div class="mut" style="font-size:12px">done ' + dShort(x.done_at) + '</div>' : '') + '</td>' +
      '<td style="white-space:nowrap"><button class="btn sm ' + (x.done_at ? 'ghost' : 'g') + '" onclick="stepDone(' + x.id + ',' + (!x.done_at) + ')">' + (x.done_at ? 'Undo' : '✓ Done') + '</button> <button class="btn ghost sm" onclick="stepDel(' + x.id + ')">✕</button></td></tr>'; }).join('') + '</table>' + pp.html +
    (list.length ? '' : '<div class="mut" style="font-weight:600">No steps yet. She sees these on her plan.</div>') + '</div>';
}
function addStep(){
  var t = document.getElementById('stN').value.trim(); if (!t) return toast('Write the step');
  var who = S.stepWho || (therapists()[0] || {}).person, p = personOf(who);
  upsert('bsb_sp_steps', { person: who, level: p.level + 1, title: t, sort: S.steps.length }).then(function(r){ S.steps = S.steps.concat(r); S.M = {}; render(); }).catch(function(){ toast('Not saved'); });
}
function stepDone(id, on){ var d = on ? TODAY : null; patch('bsb_sp_steps', 'id=eq.' + id, { done_at: d }).then(function(){ S.steps.forEach(function(x){ if (x.id === id) x.done_at = d; }); S.M = {}; toast(on ? '✅ Done' : 'Undone'); render(); }); }
function stepDel(id){ remove('bsb_sp_steps', 'id=eq.' + id).then(function(){ S.steps = S.steps.filter(function(x){ return x.id !== id; }); S.M = {}; render(); }); }

/* ===== LOOK (Joana e Ligia) ===== */
function loadLook(){ return get('bsb_sp_look?date=eq.' + TODAY).then(function(r){ S.looks = {}; r.forEach(function(x){ S.looks[x.person] = x; }); }).catch(function(){ S.looks = {}; }); }
function pgLook(){
  return '<div class="card" style="flex:1;min-height:0"><div class="h">💄 Look today · ' + dShort(TODAY) + '</div><table class="tbl"><tr><th>Who</th><th>Make-up</th><th>Hair</th><th>Uniform</th><th>Check</th><th></th></tr>' +
    (S.role === 'ops' ? [] : therapists()).map(function(p){
      var L = (S.looks || {})[p.person] || {}, all = L.make && L.hair && L.uniform;
      return '<tr><td style="display:flex;align-items:center;gap:8px">' + av(p.person, 34) + '<b>' + e(p.person) + '</b></td><td>' + (L.make ? '✓' : '·') + '</td><td>' + (L.hair ? '✓' : '·') + '</td><td>' + (L.uniform ? '✓' : '·') + '</td>' +
        '<td>' + (L.check_ok === true ? '<span class="chip g">👍 ' + e(L.check_by || '') + '</span>' : L.check_ok === false ? '<span class="chip r">✗ ' + e(L.check_note || '') + '</span>' : all ? '<span class="chip y">⏳ Waiting</span>' : '<span class="chip k">Not marked</span>') + '</td>' +
        '<td style="white-space:nowrap">' + (all ? '<button class="btn g sm" onclick="lookCheck(\'' + e(p.person) + '\',true)">👍</button> <input id="ln_' + e(p.person) + '" placeholder="What is missing" style="width:150px"> <button class="btn r sm" onclick="lookCheck(\'' + e(p.person) + '\',false)">✗</button>' : '') + '</td></tr>';
    }).join('') + '</table></div>';
}
function lookCheck(name, ok){
  var inp = document.getElementById('ln_' + name), note = inp ? inp.value.trim() : '';
  if (!ok && !note){ toast('Write what is missing'); if (inp) inp.focus(); return; }
  var row = { check_ok: ok, check_note: ok ? null : note, check_by: S.who, check_at: new Date().toISOString() };
  patch('bsb_sp_look', 'date=eq.' + TODAY + '&person=eq.' + encodeURIComponent(name), row).then(function(){
    S.looks[name] = Object.assign(S.looks[name] || {}, row); toast(ok ? '👍 ' + name : '✗ ' + name); render();
  }).catch(function(){ toast('Not saved'); });
}

/* ===== PRIZES SHELF ===== */
function pager(key, list, n){ var pg = S.page[key] || 0, max = Math.max(0, Math.ceil(list.length / n) - 1); if (pg > max) pg = max; S.page[key] = pg; return { items: list.slice(pg * n, pg * n + n), html: list.length > n ? '<div class="pager">' + (pg + 1) + ' / ' + (max + 1) + ' <button class="btn ghost sm" onclick="pgMove(\'' + key + '\',-1)">‹</button><button class="btn ghost sm" onclick="pgMove(\'' + key + '\',1)">›</button></div>' : '' }; }
function pgMove(k, d){ S.page[k] = Math.max(0, (S.page[k] || 0) + d); render(); }
var SZ = { S: '🎟 Small', M: '💄 Medium', L: '🏆 Big' };
function pgShelf(){
  var shelf = S.prizes.filter(function(x){ return x.status === 'shelf'; });
  var pend = S.rewards.filter(function(x){ return x.status === 'earned'; });
  var sp = pager('shelf', shelf, 7), pp = pager('pend', pend, 6);
  var ym = TODAY.slice(0, 7);
  return '<div class="row" style="flex:1;min-height:0">' +
    '<div class="card grow"><div class="h">🎁 Shelf</div>' +
      '<div class="row" style="gap:8px;margin-bottom:10px"><input id="pzN" placeholder="Prize" class="grow"><select id="pzS"><option value="S">🎟 Small</option><option value="M">💄 Medium</option><option value="L">🏆 Big</option></select><input id="pzF" placeholder="From" style="width:110px"><button class="btn" onclick="addPrize()">Add</button></div>' +
      '<table class="tbl">' + sp.items.map(function(x){ return '<tr><td><b>' + e(x.name) + '</b></td><td>' + SZ[x.size] + '</td><td class="mut">' + e(x.source || '') + '</td><td><button class="btn ghost sm" onclick="delPrize(' + x.id + ')">✕</button></td></tr>'; }).join('') + '</table>' + sp.html +
      (shelf.length ? '' : '<div class="mut" style="font-weight:600">Add what the salon gets or what you buy</div>') + '</div>' +
    '<div class="card grow"><div class="h">🎉 Earned · give a prize</div>' +
      '<table class="tbl">' + pp.items.map(function(x){
        var opts = shelf.filter(function(z){ return z.size === x.size; }).concat(shelf.filter(function(z){ return z.size !== x.size; }));
        return '<tr><td><b>' + e(x.person) + '</b><div class="mut" style="font-size:12px">' + e(x.reason) + '</div></td><td>' + SZ[x.size] + '</td><td><select id="rw_' + x.id + '"><option value="">Choose</option>' + opts.map(function(z){ return '<option value="' + z.id + '">' + e(z.name) + '</option>'; }).join('') + '</select></td><td><button class="btn sm" onclick="givePrize(' + x.id + ')">Give</button></td></tr>';
      }).join('') + '</table>' + pp.html + (pend.length ? '' : '<div class="mut" style="font-weight:600">Nothing waiting</div>') +
      '<div style="margin-top:14px;display:flex;gap:10px;align-items:center"><button class="btn" onclick="raffle()">🎟 Raffle · ' + mName(ym) + '</button><span class="mut" style="font-size:13px;font-weight:600">' + therapists().map(function(p){ var m = S.M[p.person]; return e(p.person) + ' ' + (m ? m.tickets : 0); }).join(' · ') + '</span></div></div></div>';
}
function addPrize(){
  var n = document.getElementById('pzN').value.trim(); if (!n) return toast('Write the prize');
  upsert('bsb_sp_prizes', { name: n, size: document.getElementById('pzS').value, source: document.getElementById('pzF').value.trim() || null })
    .then(function(r){ S.prizes = r.concat(S.prizes); render(); }).catch(function(){ toast('Not saved'); });
}
function delPrize(id){ remove('bsb_sp_prizes', 'id=eq.' + id).then(function(){ S.prizes = S.prizes.filter(function(x){ return x.id !== id; }); render(); }); }
function givePrize(id){
  var sel = document.getElementById('rw_' + id), pid = sel ? +sel.value : 0; if (!pid) return toast('Choose a prize');
  var pz = S.prizes.filter(function(x){ return x.id === pid; })[0];
  Promise.all([patch('bsb_sp_rewards', 'id=eq.' + id, { status: 'ready', prize_id: pid, prize_name: pz.name }), patch('bsb_sp_prizes', 'id=eq.' + pid, { status: 'given' })])
    .then(function(){ S.rewards.forEach(function(x){ if (x.id === id){ x.status = 'ready'; x.prize_id = pid; x.prize_name = pz.name; } }); pz.status = 'given'; toast('🎁 Box ready on her page'); render(); })
    .catch(function(){ toast('Not saved'); });
}
function raffle(){
  if (!S.live) return toast('Starts ' + dShort(S.liveFrom));
  var ym = TODAY.slice(0, 7), key = 'raffle-' + ym;
  if (S.rewards.some(function(x){ return x.reason_key === key; })) return toast('Already drawn this month');
  var pool = [];
  therapists().forEach(function(p){ var m = S.M[p.person]; if (!m || m.thisMonth.onTimePct < 90) return; for (var i = 0; i < m.tickets; i++) pool.push(p.person); });
  if (!pool.length) return toast('No tickets yet');
  var win = pool[Math.floor(Math.random() * pool.length)];
  upsert('bsb_sp_rewards', { person: win, reason: '🎟 Raffle · ' + mName(ym), reason_key: key, size: 'S' }).then(function(r){ S.rewards = r.concat(S.rewards); toast('🎉 ' + win + ' won the raffle'); render(); });
}

/* ===== PIT STOPS ===== */
function pgPits(){
  var list = S.pits.slice(), pp = pager('pits', list, 8), pd = +S.set.pitstop_days || 14;
  return '<div class="card" style="flex:1;min-height:0"><div class="h">🔧 Pit stops · a complaint pauses the path, refresh + ' + pd + ' clean days opens it again</div>' +
    '<table class="tbl"><tr><th>Who</th><th>Topic</th><th>Opened</th><th>Refresh</th><th>Status</th></tr>' + pp.items.map(function(x){
      var st = !x.refresh_done_at ? '<span class="chip r">Needs refresh</span>' : addDays(x.refresh_done_at, pd) <= TODAY ? '<span class="chip g">✓ Done</span>' : '<span class="chip y">⏳ ' + Math.round((new Date(addDays(x.refresh_done_at, pd)) - new Date(TODAY)) / 864e5) + ' days</span>';
      return '<tr><td><b>' + e(x.person) + '</b></td><td>' + e(x.topic || '') + '</td><td>' + dShort(x.opened_at) + '</td><td>' + (x.refresh_done_at ? dShort(x.refresh_done_at) : '<button class="btn sm" onclick="pitRefresh(' + x.id + ')">✓ Refresh done</button>') + '</td><td>' + st + '</td></tr>';
    }).join('') + '</table>' + pp.html + (list.length ? '' : '<div class="mut" style="font-weight:600;margin-top:10px">No pit stops</div>') +
    '<div class="h" style="margin-top:18px">🎓 Refresh trainings</div><table class="tbl"><tr><th>Who</th><th>Make-up</th><th>Hair</th><th>Uniform</th></tr>' + therapists().map(function(p){
      return '<tr><td><b>' + e(p.person) + '</b></td>' + ['make','hair','uniform'].map(function(t){
        var on = S.refresh.some(function(x){ return x.person === p.person && x.topic === t; });
        return '<td><button class="btn sm ' + (on ? 'g' : 'ghost') + '" onclick="refTog(\'' + e(p.person) + '\',\'' + t + '\',' + on + ')">' + (on ? '✓ Done' : 'Mark') + '</button></td>';
      }).join('') + '</tr>';
    }).join('') + '</table></div>';
}
function pitRefresh(id){ patch('bsb_sp_pitstops', 'id=eq.' + id, { refresh_done_at: TODAY }).then(function(){ S.pits.forEach(function(x){ if (x.id === id) x.refresh_done_at = TODAY; }); S.M = {}; adminLoad(); }); }
function refTog(name, t, on){
  (on ? remove('bsb_sp_refresh', 'person=eq.' + encodeURIComponent(name) + '&topic=eq.' + t) : upsert('bsb_sp_refresh', { person: name, topic: t, done_at: TODAY }, 'person,topic'))
    .then(function(){ return get('bsb_sp_refresh?select=*'); }).then(function(r){ S.refresh = r; S.M = {}; adminLoad(); });
}

/* ===== SETTINGS ===== */
S.adminPeople = [];
function adminRow(n){ return S.adminPeople.filter(function(x){ return x.person === n; })[0] || personOf(n); }
function savePerson(row){ return rpc('bsb_sp_save_person', { p_code: S.code, p: row }); }
function pgSet(){
  if (!S.adminPeople.length){ rpc('bsb_sp_admin_people', { p_code: S.code }).then(function(r){ S.adminPeople = r; render(); }); return '<div class="load">Loading…</div>'; }
  var L = S.set.levels || [];
  return '<div class="row"><div class="card grow"><div class="h">⚙️ Rules</div><table class="tbl">' +
      '<tr><td>Counting starts</td><td><input type="date" id="s_live" value="' + e(S.liveFrom) + '"></td></tr>' +
      '<tr><td>📸 Videos for the big prize</td><td><input type="number" id="s_cg" value="' + e(S.set.content_goal) + '" style="width:80px"></td></tr>' +
      '<tr><td>⭐ Star month: full days %</td><td><input type="number" id="s_sp" value="' + e(S.set.star_pct) + '" style="width:80px"></td></tr>' +
      '<tr><td>🔧 Pit stop clean days</td><td><input type="number" id="s_pd" value="' + e(S.set.pitstop_days) + '" style="width:80px"></td></tr>' +
      '<tr><td>💷 Girls see £ on their path</td><td><input type="checkbox" id="s_sh"' + (S.set.show_pay ? ' checked' : '') + '></td></tr>' +
      (function(){ var y1 = TODAY.slice(0, 7), d = new Date(y1 + '-15T12:00:00Z'); d.setUTCMonth(d.getUTCMonth() + 1); var y2 = d.toISOString().slice(0, 7);
        return '<tr><td>🎁 Make-up gift · ' + mName(y1) + '</td><td><input id="s_lg1" data-ym="' + y1 + '" value="' + e(lookGift(y1)) + '" placeholder="Foundation, mascara…" style="width:200px"></td></tr>' +
          '<tr><td>🎁 Make-up gift · ' + mName(y2) + '</td><td><input id="s_lg2" data-ym="' + y2 + '" value="' + e(lookGift(y2)) + '" placeholder="Foundation, mascara…" style="width:200px"></td></tr>'; })() +
      '<tr><td>🧊 Shields per month</td><td><input type="number" id="s_fz" value="' + e(S.set.freezes) + '" style="width:80px"></td></tr>' +
      L.slice(1).map(function(l, i){ return '<tr><td>🔓 ' + e(l.name) + '</td><td>+£ <input type="number" step="0.25" id="s_lv' + (i + 1) + '" value="' + e(l.plus) + '" style="width:80px">/h</td></tr>'; }).join('') +
      '</table><button class="btn" style="margin-top:10px" onclick="saveSet()">Save</button>' +
      '<div class="h" style="margin-top:16px">🎯 Goals</div><table class="tbl">' + therapists().map(function(p, i){ var g = S.goals[p.person] || {};
        return '<tr><td><b>' + e(p.person) + '</b></td><td><input id="gt' + i + '" value="' + e(g.title || '') + '" placeholder="Goal" style="width:170px"></td>' +
          '<td><select id="gp' + i + '">' + Object.keys(GOALW).map(function(k){ return '<option value="' + k + '"' + (k === (g.preset || 'facial') ? ' selected' : '') + '>' + k + '</option>'; }).join('') + '</select></td>' +
          '<td><input type="number" id="gv' + i + '" value="' + e(g.target || 40) + '" style="width:58px">%</td></tr>'; }).join('') +
      '</table><button class="btn" style="margin-top:10px" onclick="saveGoals()">Save goals</button></div>' +
    '<div class="card grow"><div class="h">👥 People</div><table class="tbl"><tr><th>Who</th><th>Code</th><th>Since</th><th>Level</th><th>Moves her</th><th>On</th></tr>' +
      S.adminPeople.map(function(p, i){
        return '<tr><td><b>' + e(p.person) + '</b><div class="mut" style="font-size:11px">' + e(p.role) + '</div></td><td><input id="pc' + i + '" value="' + e(p.code || '') + '" style="width:64px"></td>' +
          '<td><input type="date" id="pd' + i + '" value="' + e(p.start_date || '') + '" style="width:130px"></td>' +
          '<td><select id="pl' + i + '">' + L.map(function(l){ return '<option value="' + l.n + '"' + (l.n === p.level ? ' selected' : '') + '>' + l.n + '</option>'; }).join('') + '</select></td>' +
          '<td><select id="pm' + i + '">' + Object.keys(MOT).map(function(k){ return '<option value="' + k + '"' + (k === p.motivator ? ' selected' : '') + '>' + MOT[k] + '</option>'; }).join('') + '</select></td>' +
          '<td><input type="checkbox" id="pa' + i + '"' + (p.active ? ' checked' : '') + '></td></tr>';
      }).join('') + '</table><button class="btn" style="margin-top:10px" onclick="savePeople()">Save</button></div></div>';
}
function saveGoals(){
  var rows = therapists().map(function(p, i){ var t = document.getElementById('gt' + i).value.trim();
    return { person: p.person, title: t || 'My goal', preset: document.getElementById('gp' + i).value, target: +document.getElementById('gv' + i).value || 40, days: 60, active: !!t, updated_at: new Date().toISOString() }; });
  upsert('bsb_sp_goals', rows, 'person').then(function(){ toast('✓ Goals saved'); S.M = {}; return loadBase(); }).then(adminLoad).catch(function(){ toast('Not saved'); });
}
function saveSet(){
  var L = (S.set.levels || []).map(function(l, i){ if (!i) return l; var v = document.getElementById('s_lv' + i); return Object.assign({}, l, { plus: v ? +v.value : l.plus }); });
  var rows = [
    { key: 'live_from', value: document.getElementById('s_live').value },
    { key: 'content_goal', value: +document.getElementById('s_cg').value },
    { key: 'star_pct', value: +document.getElementById('s_sp').value },
    { key: 'pitstop_days', value: +document.getElementById('s_pd').value },
    { key: 'freezes', value: +document.getElementById('s_fz').value },
    { key: 'levels', value: L },
    { key: 'show_pay', value: document.getElementById('s_sh').checked },
    { key: 'look_gift', value: (function(){ var g = Object.assign({}, S.set.look_gift || {}); ['s_lg1','s_lg2'].forEach(function(id){ var el = document.getElementById(id); if (el) g[el.getAttribute('data-ym')] = el.value.trim(); }); return g; })() }
  ];
  upsert('bsb_sp_settings', rows, 'key').then(function(){ toast('✓ Saved'); S.M = {}; return loadBase(); }).then(adminLoad).catch(function(){ toast('Not saved'); });
}
function savePeople(){
  Promise.all(S.adminPeople.map(function(p, i){
    return savePerson(Object.assign({}, p, { code: document.getElementById('pc' + i).value.trim(), start_date: document.getElementById('pd' + i).value || '',
      level: +document.getElementById('pl' + i).value, motivator: document.getElementById('pm' + i).value, active: document.getElementById('pa' + i).checked, level_since: p.level_since || '' }));
  })).then(function(){ toast('✓ Saved'); S.adminPeople = []; S.M = {}; return loadBase(); }).then(adminLoad).catch(function(){ toast('Not saved'); });
}

/* menina: carrega o look dela junto */
var _render = render;
var _r2;
render = function(){
  if (S.view && S.lookMine === undefined){ S.lookMine = {}; loadMyLook().then(function(){ _render(); animateIn(); }); }
  if (S.view && S.lookFor !== S.view){ S.lookFor = S.view; S.lookMine = undefined; S.lookMine = {}; loadMyLook().then(function(){ _render(); animateIn(); }); }
  _render(); animateIn(); S.justWon = null;
};
