<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#7C3AED">
<title>Marketing Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1B1533;--mut:#6F6890;--acc:#7C3AED;--acc2:#EC4899;--up:#059669;--down:#E11D48;--amb:#D97706;--blue:#2563EB;--card:rgba(255,255,255,.6);--bd:rgba(255,255,255,.85);--r:22px;--chipbg:rgba(124,58,237,.1);--track:rgba(124,58,237,.12);--num:'Inter';--nw:800;--solid:#fff;
--bg:radial-gradient(900px 600px at 8% 0%,#E9D5FF 0%,transparent 60%),radial-gradient(800px 600px at 100% 10%,#FBCFE8 0%,transparent 55%),radial-gradient(900px 700px at 60% 110%,#C7D2FE 0%,transparent 60%),#F5F3FF;--sh:0 10px 40px rgba(88,60,160,.12),inset 0 1px 0 rgba(255,255,255,.9);--grad:linear-gradient(120deg,#7C3AED,#EC4899);--btnink:#fff}
body.night{--ink:#F4F1FF;--mut:#8E87AD;--acc:#A78BFA;--acc2:#34D399;--up:#34D399;--down:#FB7185;--amb:#FBBF24;--blue:#38BDF8;--card:#161229;--bd:#2A2347;--chipbg:rgba(167,139,250,.14);--track:#231D3D;--num:'Space Grotesk';--nw:700;--solid:#161229;
--bg:radial-gradient(700px 500px at 85% -10%,rgba(124,58,237,.35) 0%,transparent 60%),radial-gradient(600px 500px at 0% 100%,rgba(52,211,153,.14) 0%,transparent 60%),#0C0918;--sh:0 0 0 1px #2A2347;--grad:linear-gradient(120deg,#A78BFA,#A78BFA);--btnink:#120E22}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:Inter,system-ui,sans-serif;font-size:13.5px;color:var(--ink);background:var(--bg);background-attachment:fixed;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:inherit}
button:disabled{opacity:.4;cursor:default}
input,select,textarea{font:inherit;color:var(--ink);min-width:0;padding:9px 11px;border-radius:12px;border:1px solid var(--track);background:var(--card);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
textarea{resize:none}
a{color:var(--acc);text-decoration:none}
[hidden]{display:none!important}
.glass{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:var(--sh)}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#app{display:flex;gap:16px;padding:16px;height:100vh;height:100dvh}
/* menu */
#rail{width:196px;flex:none;padding:16px 12px;display:flex;flex-direction:column;gap:6px;min-height:0}
#rail .brand{font-weight:800;font-size:17px;letter-spacing:-.02em;padding:0 8px 10px}
.sw{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--track);margin-bottom:8px}
.sw button{flex:1;text-align:center;padding:7px 4px;border-radius:999px;font-size:12px;font-weight:700;color:var(--mut)}
.sw button.on{background:var(--acc);color:var(--btnink)}
.mi{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:999px;font-weight:600;color:var(--mut);width:100%}
.mi.on{background:var(--chipbg);color:var(--acc)}
.mi b{margin-left:auto;font-size:11px;font-weight:700;background:var(--acc);color:var(--btnink);border-radius:999px;padding:1px 7px}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--mut);display:inline-block}
.dot.g{background:var(--up);box-shadow:0 0 0 3px color-mix(in srgb,var(--up) 22%,transparent)}
.dot.a{background:var(--amb);box-shadow:0 0 0 3px color-mix(in srgb,var(--amb) 22%,transparent)}
.dot.r{background:var(--down);box-shadow:0 0 0 3px color-mix(in srgb,var(--down) 22%,transparent)}
.dot.p{background:var(--acc)}.dot.b{background:var(--blue)}
#rail .sp{flex:1}
#srcb{display:flex;align-items:center;gap:9px;padding:9px 12px;font-size:12px;font-weight:600;color:var(--mut);width:100%}
#who{font-size:11.5px;color:var(--mut);padding:0 12px}
/* main */
#main{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px;min-height:0}
.hd{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex:none}
.hd h1{font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.05}
.hd p{color:var(--mut);font-size:12.5px;margin-top:3px}
.tools{display:flex;gap:6px;align-items:center;flex:none}
.tb{padding:8px 13px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--chipbg);color:var(--acc);white-space:nowrap;display:inline-block}
.tb.on{background:var(--acc);color:var(--btnink)}
#band{flex:none;padding:8px 14px;border-radius:14px;font-size:12.5px;font-weight:600;background:color-mix(in srgb,var(--amb) 16%,transparent);color:var(--amb);width:100%}
#band.red{background:color-mix(in srgb,var(--down) 14%,transparent);color:var(--down)}
#body{flex:1;min-height:0;display:flex;gap:16px}
#page{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;gap:10px}
#panel{width:372px;flex:none;padding:16px;display:flex;flex-direction:column;gap:8px;min-height:0;position:relative;overflow:hidden}
#panel h2{font-size:18px;font-weight:800;letter-spacing:-.02em}
.px{display:none}
.big{font-family:var(--num);font-weight:var(--nw);font-size:46px;letter-spacing:-.05em;line-height:.95}
.sec{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-top:4px;display:flex;align-items:center;gap:8px}
.sec i{flex:1;height:1px;background:var(--track)}
.row{display:flex;gap:6px;align-items:center}
.wrap{display:flex;gap:6px;flex-wrap:wrap}
.pills{display:flex;gap:4px;flex-wrap:wrap}
.pill{padding:6px 11px;border-radius:999px;font-size:12px;font-weight:600;background:var(--chipbg);color:var(--acc);white-space:nowrap}
.pill.on{background:var(--acc);color:var(--btnink)}
.pill b{margin-left:5px;font-weight:800}
.chip{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;flex:none;white-space:nowrap;display:inline-block}
.c-g{color:var(--up);background:color-mix(in srgb,var(--up) 14%,transparent)}.c-a{color:var(--amb);background:color-mix(in srgb,var(--amb) 16%,transparent)}
.c-r{color:var(--down);background:color-mix(in srgb,var(--down) 13%,transparent)}.c-m{color:var(--mut);background:var(--track)}.c-p{color:var(--acc);background:var(--chipbg)}
.c-b{color:var(--blue);background:color-mix(in srgb,var(--blue) 13%,transparent)}
.btn{padding:11px 14px;border-radius:14px;color:var(--btnink);font-weight:700;background:var(--grad);text-align:center;display:block;width:100%}
.btn.sm{padding:8px 10px;font-size:12.5px;border-radius:12px}
.gh{padding:8px 10px;border-radius:12px;font-weight:600;font-size:12.5px;background:var(--chipbg);color:var(--acc);text-align:center;flex:1;white-space:nowrap}
.gh.ok{background:color-mix(in srgb,var(--up) 14%,transparent);color:var(--up)}
button:active:not(:disabled){transform:scale(.98)}
.list{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 2px;border-top:1px solid var(--track);width:100%;min-height:44px;flex:none}
.li:first-child{border-top:0}
.li>div:first-child{min-width:0;flex:1}
.li b{font-weight:600;display:block}.li small{color:var(--mut);font-size:11.5px;display:block}
.li .rt{text-align:right;color:var(--mut);font-size:11.5px;flex:none}
button.li:hover b{color:var(--acc)}
.pg{display:flex;align-items:center;justify-content:center;gap:14px;font-size:12px;color:var(--mut);padding-top:6px;flex:none}
.pg button{width:30px;height:30px;border-radius:50%;background:var(--chipbg);color:var(--acc);font-weight:700;text-align:center}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--mut);text-align:center;font-weight:600;padding:16px}
.sk{opacity:.4}
/* tiles */
.tile{overflow:hidden;padding:12px 14px;display:flex;flex-direction:column;justify-content:space-between;gap:4px;min-width:0;min-height:0;outline:2px solid transparent;transition:outline-color .2s,transform .15s;opacity:0;transform:translateY(12px);animation:in .3s forwards}
.tile.sel{outline-color:var(--acc)}
.tile .t{font-size:12px;font-weight:600;color:var(--mut);display:flex;align-items:center;gap:6px}
.tile .v{font-family:var(--num);font-weight:var(--nw);font-size:32px;letter-spacing:-.04em;line-height:1}
.tile .s{font-size:11.5px;color:var(--mut)}
.hero .v{font-size:72px;line-height:.9;letter-spacing:-.05em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
body.night .hero .v{text-shadow:0 0 34px rgba(167,139,250,.55);color:var(--acc);background:none}
.grid{display:grid;gap:10px;min-height:0}
@keyframes in{to{opacity:1;transform:none}}
/* today cards */
.cgrid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:10px}
.cc{padding:12px;display:flex;flex-direction:column;gap:5px;min-height:0;min-width:0;overflow:hidden}
.cc .nm{font-weight:700;font-size:14.5px}
.cc .msg{flex:1 1 0;min-height:0;overflow:hidden;font-size:12px;color:var(--mut);line-height:1.4;cursor:pointer}
/* calendar */
.cal{flex:1;min-height:0;display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .dh{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);text-align:center}
.dc{padding:6px 7px;border-radius:14px;display:flex;flex-direction:column;gap:2px;min-height:0;min-width:0;overflow:hidden;background:var(--card);border:1px solid var(--bd);outline:2px solid transparent}
.dc.sel{outline-color:var(--acc)}.dc.out{visibility:hidden}
.dc .n{font-weight:700;font-size:12px;display:flex;justify-content:space-between;gap:4px;color:var(--mut)}
.dc.td .n span:first-child{background:var(--acc);color:var(--btnink);border-radius:999px;padding:0 6px}
.dc .n em{font-style:normal;font-weight:600;font-size:10.5px}
.it{font-size:10.5px;font-weight:600;padding:2px 6px;border-radius:7px;display:block}
.yg{flex:1;min-height:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:minmax(0,1fr) minmax(0,1fr);gap:10px}
/* map */
.lane{display:flex;flex-direction:column;gap:6px;flex:1 1 0;min-height:0}
.lrow{display:flex;gap:6px;flex:1 1 0;min-height:0;align-items:stretch}
.lrow .tile{flex:1}
.ar{flex:none;width:34px;display:flex;align-items:center;justify-content:center;color:var(--acc);font-size:11.5px;font-weight:700}
/* week */
.week{flex:1;min-height:0;display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.dcol{padding:9px;display:flex;flex-direction:column;gap:5px;min-height:0;min-width:0;overflow:hidden}
.dcol.td{outline:2px solid var(--acc)}
.dcol .dh{font-weight:700;font-size:13px;display:flex;justify-content:space-between}
.dcol .dh span{color:var(--mut);font-weight:600;font-size:11.5px}
.slot{font-size:10.5px;color:var(--mut);font-weight:600}
.pc{padding:6px 8px;border-radius:10px;background:var(--chipbg);font-size:11.5px;font-weight:600;line-height:1.25;width:100%;border-left:3px solid var(--mut);flex:none}
.pc small{display:block;font-size:10px;color:var(--mut);font-weight:600}
.pc span{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.pc.live{border-left-color:var(--up)}.pc.ok{border-left-color:var(--blue)}.pc.pend{border-left-color:var(--amb)}
.pc.sel{outline:2px solid var(--acc)}
/* bars */
.bars{flex:1;min-height:0;display:flex;align-items:flex-end;gap:8px}
.bars>div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;min-width:0}
.bars i{display:block;width:100%;border-radius:8px 8px 3px 3px;background:var(--acc);min-height:3px;transform-origin:bottom;animation:grow .6s both}
.bars small{font-size:10.5px;color:var(--mut);font-weight:600}.bars b{font-size:11px;font-weight:700}
@keyframes grow{from{transform:scaleY(0)}}
.heat{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}
.heat div{height:34px;border-radius:7px;display:flex;align-items:flex-end;justify-content:center;font-size:9.5px;font-weight:600;padding-bottom:2px;background:var(--acc)}
.fun{display:flex;flex-direction:column;gap:5px}
.fun button{display:flex;align-items:center;gap:8px;width:100%}
.fun span{font-size:12px;font-weight:600;width:64px;flex:none}
.fun i{display:block;height:22px;border-radius:7px;background:var(--acc);min-width:4px}
.fun b{font-size:12px}.fun .sel i{background:var(--acc2)}
.txt{flex:1;min-height:0;overflow:hidden;font-size:13px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
/* gate + toast */
#gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:9;background:var(--bg);padding:20px}
#gate form,.unlock form{padding:26px;width:100%;max-width:310px;display:flex;flex-direction:column;gap:12px;text-align:center}
#gate input,.unlock input{text-align:center;font-size:17px;padding:12px}
.err{color:var(--down);font-size:12.5px;min-height:16px;font-weight:600}
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,30px);opacity:0;transition:.25s;z-index:20;padding:11px 18px;border-radius:14px;font-weight:700;background:var(--ink);color:var(--solid);pointer-events:none;max-width:90vw}
#toast.on{transform:translate(-50%,0);opacity:1}#toast.bad{background:var(--down);color:#fff}
#tabbar{display:none}.mdot{display:none}
.mob{display:none}
@media(max-width:1180px){#panel{width:330px}.cgrid{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(3,1fr)}}
@media(max-width:899px){
 #app{flex-direction:column;padding:12px 12px 0;gap:8px}
 #rail{display:none}.mob{display:flex}
 #upd,#th{display:none}.hd h1{font-size:21px}.hd p{display:none}.tb{padding:7px 10px;font-size:12px}
 #body{position:relative}
 #panel{position:fixed;inset:0;width:auto;z-index:5;border-radius:0;transform:translateX(102%);transition:transform .25s;background:var(--bg);border:0;padding:16px}
 #panel.open{transform:none}
 .px{display:block;position:absolute;right:12px;top:12px;width:36px;height:36px;border-radius:50%;background:var(--chipbg);color:var(--acc);font-weight:700;text-align:center;z-index:2}
 #panel h2{padding-right:44px}
 #tabbar{display:flex;flex:none;margin:0 -12px;padding:6px 6px calc(6px + env(safe-area-inset-bottom));border-radius:22px 22px 0 0;gap:0}
 #tabbar button{flex:1;text-align:center;font-size:11px;font-weight:600;color:var(--mut);padding:7px 0;border-radius:14px}
 #tabbar button.on{color:var(--acc);background:var(--chipbg)}
 .cgrid{grid-template-columns:1fr;grid-template-rows:repeat(2,1fr)}
 .hero .v{font-size:52px}.tile .v{font-size:24px}.tile{padding:9px 11px;border-radius:16px}
 .yg{grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr);gap:6px}
 .week{grid-template-columns:1fr}.week .dcol{display:none}.week .dcol.cur{display:flex}
 .mdot{display:inline-block}.cal{gap:3px}.dc{padding:4px;border-radius:10px}.dc .it{display:none}.dc .n em{display:none}
 .lrow{flex-wrap:wrap}.ar{display:none}.lrow .tile{flex:1 1 40%}
 .k4{grid-template-columns:1fr 1fr!important}
}
@media(max-height:760px){#el .li small{display:none}#el .li{min-height:34px;padding:5px 2px}.fun i{height:16px}.fun{gap:3px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.tile{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="gate"><form class="glass" id="gf" autocomplete="off"><h2 style="font-weight:800">Marketing Hub</h2><input id="pw" type="password" placeholder="Password" aria-label="Password"><button class="btn" id="gb">Enter</button><div class="err" id="ge"></div></form></div>
<div id="app" hidden>
 <nav class="glass" id="rail">
  <div class="brand">Marketing Hub</div>
  <div class="sw" id="sw"></div>
  <div id="menu"></div>
  <span class="sp"></span>
  <button id="srcb"><span class="dot" id="srcd"></span><span id="srct">Sources</span></button>
  <div id="who"></div>
  <button class="mi" id="out">Log out</button>
 </nav>
 <div id="main">
  <div class="hd"><div style="min-width:0"><h1 id="ttl"></h1><p id="sub"></p></div>
   <div class="tools"><div class="sw mob" id="sw2" style="margin:0"></div><span id="upd" style="font-size:11.5px;color:var(--mut)" class="ell"></span><button class="tb" id="rf" title="Refresh">Refresh</button><button class="tb" id="th"></button><button class="tb mob" id="more">Menu</button></div></div>
  <button id="band" hidden></button>
  <div id="body"><div id="page"></div><aside class="glass" id="panel"><button class="px" id="px">✕</button><div id="pn" style="display:flex;flex-direction:column;gap:8px;flex:1;min-height:0"></div></aside></div>
  <div class="glass" id="tabbar"></div>
 </div>
</div>
<div id="toast"></div>
<script>
'use strict';
const BASE='https://qwumncqcyurojhuyazuj.supabase.co/rest/v1/rpc/',KEY='sb_publishable_7Oa5ZKlo09avfl-ZwZ876w_dgVwlO4R';
const HD={apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'};
const $=i=>document.getElementById(i),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PAGES={camp:[['today','Today'],['cal','Calendar'],['clients','Clients'],['results','Results']],cont:[['week','Week'],['create','Create'],['film','Film'],['num','Numbers']]};
const TITLES={today:'Today',cal:'Calendar',clients:'Clients',results:'Results',week:'Week',create:'Create',film:'Film',num:'Numbers'};
const LINKS={studio:'https://bsb-lab-studio.vercel.app',planner:'https://bsb-marketing.vercel.app',eco:'https://bsb-lab-ecosystem.vercel.app',lastmin:'https://bsb-lastminute.vercel.app',codes:'https://bsb-codes.vercel.app'};
let TOK=null,PW=null,BOOT=null,side='camp',cur='today',busy=false,tries=0,lockUntil=0,money=false,seq=0;
const S={},T={};
try{TOK=localStorage.getItem('bsb_mkth_tok')}catch(e){}
/* ---------- helpers ---------- */
async function rpc(fn,body){const r=await fetch(BASE+fn,{method:'POST',headers:HD,body:JSON.stringify(body||{})});if(!r.ok)throw new Error('http');return r.json();}
async function tk(fn,body){const j=await rpc(fn,Object.assign({p_token:TOK},body||{}));if(j&&j.ok===false&&!j.err){logout(true);throw new Error('auth');}return j;}
async function eco(fn,body){const j=await rpc(fn,Object.assign({p_pin:PW||TOK},body||{}));if(!j||j.ok===false)throw new Error(j&&j.err==='LOCKED'?'locked':'lock');return j;}
function toast(t,bad){const e=$('toast');e.textContent=t;e.className='on'+(bad?' bad':'');clearTimeout(toast.t);toast.t=setTimeout(()=>e.className='',2400);}
const nf=n=>Number(n||0).toLocaleString('en-GB');
const gbp=n=>money?'£'+nf(Math.round(n||0)):'£ •••';
function pd(iso){const t=String(iso).slice(0,10).split('-').map(Number);return new Date(Date.UTC(t[0],t[1]-1,t[2]));}
function addD(iso,n){const d=pd(iso);d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);}
const dfmt=(iso,o)=>iso?pd(iso).toLocaleDateString('en-GB',Object.assign({timeZone:'UTC',day:'numeric',month:'short'},o||{})):'';
const tfmt=ts=>ts?new Date(ts).toLocaleString('en-GB',{timeZone:'Europe/London',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'no data';
const hrs=ts=>ts?(Date.now()-new Date(ts).getTime())/36e5:null;
const MN=['January','February','March','April','May','June','July','August','September','October','November','December'],DW=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const wide=()=>innerWidth>=900;
const red=()=>matchMedia('(prefers-reduced-motion:reduce)').matches;
function countUp(root){(root||document).querySelectorAll('[data-v]').forEach(e=>{const t=+e.dataset.v,suf=e.dataset.s||'';if(e.closest('.hero')&&String(Math.round(t)).length>=5)e.style.fontSize=wide()?'50px':'38px';if(red()||!t){e.textContent=nf(t)+suf;return}const s=performance.now();(function f(n){const p=Math.min(1,(n-s)/600);e.textContent=nf(Math.round(t*p))+suf;if(p<1)requestAnimationFrame(f)})(s)});}
const chip=(t,c)=>'<span class="chip c-'+(c||'m')+'">'+esc(t)+'</span>';

  $('page').querySelectorAll('[data-all]').forEach(b=>b.onclick=()=>{FM.who='Everyone';FM.kind=b.dataset.all;FM.page=0;draw();openPanel();});
  if(!FM.who||(FM.who!=='Everyone'&&!people.includes(FM.who))){FM.who=people.slice().sort((a,b)=>n(b,'film')-n(a,'film'))[0];FM.kind=n(FM.who,'film')?'film':n(FM.who,'send')?'send':'done';}
  flist();}
};
function flist(){const rows=S.content.shots.filter(s=>(FM.who==='Everyone'||(s.person||'No one')===FM.who)&&fk[FM.kind](s)),per=6,pages=Math.max(1,Math.ceil(rows.length/per));if(FM.page>pages-1)FM.page=pages-1;
 pn('<h2 class="ell">'+esc(FM.who)+'</h2><div class="pills">'+['film','send','done'].map(k=>'<button class="pill'+(FM.kind===k?' on':'')+'" data-k="'+k+'">'+FL[k].replace(' · 7 days','')+'</button>').join('')+'</div><div class="list">'+(rows.length?rows.slice(FM.page*per,FM.page*per+per).map(s=>'<button class="li" data-id="'+s.id+'"><div><b class="ell">'+esc(s.title||s.frame||'Take')+'</b><small class="ell">'+(FM.who==='Everyone'?esc(s.person||'No one')+' · ':'')+(Array.isArray(s.takes)?s.takes.length+' takes':'')+(s.day?' · '+dfmt(s.day):'')+(s.skip?' · moved':'')+'</small></div>'+chip(s.done?'Done':s.sent?'Filming':'To send',s.done?'g':s.sent?'b':'a')+'</button>').join(''):'<div class="empty">Nothing here</div>')+'</div><div class="pg" id="lpg"></div>');
 if(rows.length>per)pager('lpg',FM.page,pages,rows.length,p=>{FM.page=p;flist();});
 $('pn').querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{FM.kind=b.dataset.k;FM.page=0;draw();});
 $('pn').querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>shot(b.dataset.id,0));}
function shot(id,page){const s=S.content.shots.find(x=>x.id===id);if(!s){flist();return}const tk_=Array.isArray(s.takes)?s.takes:[],per=5,pages=Math.max(1,Math.ceil(tk_.length/per));
 pn('<button class="tb" id="bk" style="align-self:flex-start">◀ '+esc(FM.who)+'</button><h2 style="font-size:16px;line-height:1.25">'+esc(s.title||s.frame||'Take')+'</h2><div class="wrap">'+chip(s.done?'Done':s.sent?'Filming':'To send',s.done?'g':s.sent?'b':'a')+(s.day?chip(dfmt(s.day,{weekday:'short'})):'')+(s.fam?chip(s.fam,'p'):'')+'</div><div class="sec">Takes<i></i></div><div class="list">'+(tk_.length?tk_.slice(page*per,page*per+per).map((t,i)=>'<div class="li"><div><b style="white-space:normal;font-size:12.5px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden">'+(page*per+i+1)+' · '+esc(t.say?'“'+t.say+'”':t.t||'')+'</b><small>'+esc(t.say?(t.mode==='camera'?'Say to camera':'Voice only'):(t.kind==='photo'?'Photo':'Video')+(t.sec?' · '+t.sec+' s':''))+'</small></div></div>').join(''):'<div class="empty">No take list</div>')+'</div><div class="pg" id="hpg"></div>'+
  (fk.send(s)?'<button class="btn" id="sa">Send to '+esc(s.person||'the team')+'</button>':fk.film(s)?'<button class="gh" id="sb" style="flex:none">Take back</button>':''));
 if(tk_.length>per)pager('hpg',page,pages,tk_.length,p=>shot(id,p));$('bk').onclick=flist;
 const run=async a=>{if(busy)return;busy=true;let j=null;try{j=await tk('bsb_mkth_shot',{p_id:id,p_action:a});}catch(e){if(e.message==='auth'){busy=false;return}}busy=false;
  if(j&&j.ok){toast(a==='send'?'Sent ✓':'Taken back ✓');delete S.content;try{await loadContent();}catch(e){}if(cur==='film'){draw();}}else toast((j&&j.err)||'Not saved. Try again',true);};
 if($('sa'))$('sa').onclick=()=>run('send');if($('sb'))$('sb').onclick=()=>run('back');openPanel();}
/* ---------- NUMBERS ---------- */
const NU={tab:'posts',page:0,cf:'on'};
R.num={
 async load(){if(!S.num){const n=await tk('bsb_mkth_numbers');if(!n||!n.ok)throw new Error('http');S.num=n;}if(!S.codes){try{const t=BOOT.today;S.codes=await eco('bsb_eco_descontos',{p_from:addD(t,-30),p_to:t});}catch(e){if(e.message==='http')throw e;S.codes={lock:true};}}
  if(!S.cstate){try{S.cstate=await tk('bsb_mkth_codes');}catch(e){if(e.message==='auth')throw e;S.cstate={rows:[]};}}},
 draw(){const n=S.num,a=n.m30,b=n.p30,ok=n.hours.filter(h=>h.n>=2),best=ok.length?ok.reduce((x,y)=>y.idx>x.idx?y:x):null,mx=Math.max(1,...n.months.map(m=>+m.avg_reel_reach||0)),hx=Math.max(.01,...n.hours.map(h=>+h.idx||0));
  $('sub').textContent='Instagram read '+tfmt(n.fetched)+' · '+nf(n.n)+' posts measured';
  $('page').innerHTML='<div class="grid k4" style="grid-template-columns:1.5fr repeat(4,1fr);flex:none"><button class="tile glass hero" data-np><div class="t">Views · 30 days</div><div class="v" data-v="'+a.views+'">0</div><div class="s">'+delta(a.views,b.views,'30 days before')+'</div></button>'+
   [['Posts',a.posts,b.posts],['Saves',a.saves,b.saves],['Shares',a.shares,b.shares]].map(([l,x,y],i)=>'<button class="tile glass" data-np style="animation-delay:'+(i+1)*40+'ms"><div class="t">'+l+'</div><div class="v" data-v="'+x+'">0</div><div class="s">'+delta(x,y,'before')+'</div></button>').join('')+
   '<div class="tile glass" style="animation-delay:160ms"><div class="t">Best hour</div><div class="v">'+(best?best.h+':00':'')+'</div><div class="s">'+(best?String(best.idx)+'× normal · '+best.n+' posts':'Not enough posts')+'</div></div></div>'+
   '<div class="glass" style="flex:1;min-height:0;padding:14px;display:flex;flex-direction:column;gap:8px"><div class="sec" style="margin:0">Reel reach by month<i></i></div><div class="bars">'+n.months.map(m=>'<div><b>'+(m.avg_reel_reach==null?'':nf(Math.round(m.avg_reel_reach)))+'</b><i style="height:'+Math.round(78*(+m.avg_reel_reach||0)/mx)+'%"></i><small>'+pd(m.month).toLocaleDateString('en-GB',{month:'short',timeZone:'UTC'})+' · '+m.reels+' reels</small></div>').join('')+'</div></div>'+
   '<div class="glass" style="flex:none;padding:12px 14px;display:flex;flex-direction:column;gap:6px"><div class="sec" style="margin:0">When posts do best<i></i></div><div class="heat">'+n.hours.map(h=>'<div title="'+h.n+' posts" style="opacity:'+(.15+.85*(+h.idx||0)/hx).toFixed(2)+';color:var(--btnink)">'+h.h+'h</div>').join('')+'</div></div>';
  $('page').querySelectorAll('[data-np]').forEach(b=>b.onclick=()=>{NU.tab='posts';NU.page=0;nlist();openPanel();});
  nlist();}
};
function nlist(){const n=S.num,cd=S.codes||{},tabs=[['posts','Top posts',n.posts.length],['mail','Emails',n.journeys.length],['codes','Codes',cd.rows?cd.rows.length:0]];let rows,html,per=NU.tab==='codes'?5:6;
 if(NU.tab==='posts'){rows=n.posts;html=x=>'<a class="li" href="'+esc(/^https:\/\//i.test(x.url)?x.url:'#')+'" target="_blank" rel="noopener" style="color:inherit"><div><b class="ell">'+esc(x.cap||x.kind)+'</b><small>'+esc(x.kind)+' · '+dfmt(x.at)+' · '+nf(x.saves)+' saves</small></div><div class="rt"><b style="color:var(--ink)">'+nf(x.views)+'</b>'+(x.x?'<br>'+x.x+'×':'')+'</div></a>';}
 else if(NU.tab==='mail'){rows=n.journeys;html=x=>'<div class="li"><div><b class="ell">'+esc(x.name)+'</b><small>'+nf(x.started)+' people in</small></div>'+chip(x.status==='sending'?'Live':x.status,x.status==='sending'?'g':'a')+'</div>';}
 else{const stt={};((S.cstate&&S.cstate.rows)||[]).forEach(c=>stt[String(c.code).toLowerCase()]=c.on);const all=(cd.rows||[]).map(x=>Object.assign({},x,{on:stt[String(x.raw||x.code).toLowerCase()]}));((S.cstate&&S.cstate.rows)||[]).forEach(c=>{if(!all.some(x=>String(x.raw||x.code).toLowerCase()===String(c.code).toLowerCase()))all.push({code:c.code,n:0,booked:0,off:0,on:c.on});});
  NU.all=all;rows=all.filter(x=>NU.cf==='on'?x.on===true:NU.cf==='off'?x.on===false:x.on==null);html=x=>'<div class="li"><div><b class="ell">'+esc(x.code)+'</b><small>'+nf(x.n)+' paid · '+nf(x.booked)+' booked</small></div><div class="rt">'+gbp(x.off)+' off</div></div>';}
 const pages=Math.max(1,Math.ceil(rows.length/per));if(NU.page>pages-1)NU.page=pages-1;
 pn('<h2>'+tabs.find(t=>t[0]===NU.tab)[1]+'</h2><div class="pills">'+tabs.map(t=>'<button class="pill'+(t[0]===NU.tab?' on':'')+'" data-t="'+t[0]+'">'+t[1]+'<b>'+t[2]+'</b></button>').join('')+(NU.tab==='codes'&&!cd.lock?'<button class="pill" data-eye></button>':'')+'</div>'+(NU.tab==='codes'&&!cd.lock?'<div class="pills">'+[['on','Active'],['off','Off'],['na','No status']].map(z=>'<button class="pill'+(NU.cf===z[0]?' on':'')+'" data-cf="'+z[0]+'">'+z[1]+'<b>'+NU.all.filter(x=>z[0]==='on'?x.on===true:z[0]==='off'?x.on===false:x.on==null).length+'</b></button>').join('')+'</div>':'')+'<div class="sec">'+(NU.tab==='mail'?'Automations':'Last 30 days')+'<i></i></div><div class="list">'+(NU.tab==='codes'&&cd.lock?'<div class="empty">Open Calendar once to unlock<button class="tb" id="ngo">Calendar</button></div>':rows.length?rows.slice(NU.page*per,NU.page*per+per).map(html).join(''):'<div class="empty">'+(NU.tab==='codes'?'No code here':'Nothing in 30 days')+'</div>')+'</div><div class="pg" id="npg"></div>'+(NU.tab==='codes'?'<a class="gh" style="flex:none" href="'+LINKS.codes+'" target="_blank" rel="noopener">Discount codes</a>':''));
 if(rows.length>per&&!(NU.tab==='codes'&&cd.lock))pager('npg',NU.page,pages,rows.length,p=>{NU.page=p;nlist();});
 $('pn').querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{NU.tab=b.dataset.t;NU.page=0;nlist();setMoneyBtn();});if($('ngo'))$('ngo').onclick=()=>go('cal');$('pn').querySelectorAll('[data-cf]').forEach(b=>b.onclick=()=>{NU.cf=b.dataset.cf;NU.page=0;nlist();});setMoneyBtn();}
/* ---------- boot ---------- */
if(TOK)start().catch(()=>{$('ge').textContent='Could not connect. Try again';});
setInterval(()=>{if(!TOK||$('app').hidden||busy||document.hidden)return;if(Date.now()-(T[cur]||0)>600000&&!$('panel').classList.contains('open')&&!document.activeElement.matches('input,textarea,select')){for(const k in S)delete S[k];T[cur]=0;rpc('bsb_mkth_boot',{p_token:TOK}).then(b=>{if(b&&b.ok){BOOT=b;go(cur);}else logout(true);}).catch(()=>{});}},60000);
</script>
