/* answers the therapist actually needs at a glance, before starting the run */
var BRIEF_KEYS = ['skin_type','skintype','concerns','skin_conditions','brings','goal','pressure','focus_areas','massage_type','aroma','music','scalp','home_actives','had_before','last_visit','lidocaine_consent'];
var BRIEF_LABELS = { skintype:'Skin type', skin_type:'Skin type', brings:'Her goal', had_before:'Had it before', last_visit:'Last visit', lidocaine_consent:'Lidocaine consent', skin_conditions:'Skin conditions', home_actives:'Home actives', focus_areas:'Focus areas', massage_type:'Massage type' };
function briefLabel(k) { return BRIEF_LABELS[k] || humanKey(k); }
function isFlagAnswer(k, v) {
  if (!/allerg|medicat|pregnan|condition|surgery|pain|injur|accutane|keloid|bruise|adverse|doctor_care|smoke/i.test(k)) return false;
  var s = String(Array.isArray(v) ? v.join(', ') : (v==null?'':v)).trim().toLowerCase();
  return s && s !== 'no' && s !== 'none' && s !== 'no allergies' && s !== 'n/a';
}
/* consent-style boilerplate that isn't useful in a summary */
var BRIEF_SKIP = /^(results_vary|side_effects|follow_instructions|newsletter|photos|multiple|signed|consent_)/;
function formBriefRows(f) {
  var ans = f.answers || {}; var flags = [], rows = [], texts = [];
  Object.keys(ans).forEach(function(k){
    if (k === '_meta' || k === 'full_name' || k === 'signed_date' || /^signed$/i.test(k) || /_details$/.test(k) || BRIEF_SKIP.test(k)) return;
    var v = ans[k]; if (Array.isArray(v)) v = v.join(', ');
    if (v === '' || v == null) return;
    var det = ans[k + '_details']; if (det) v = v + ', ' + det;
    /* v32.16: a nova fabrica de formulario usa a PERGUNTA como chave ("Any pain, injury
       or recent surgery?"). Um "Yes" ali e risco e nao pode cair na regra que descarta
       yes/no, senao some da tela. */
    var riskQ = /pain|injur|surger|allerg|pregnan|breastfeed|condition|medicat|vein|skin issue|implant|epilep|diabet/i.test(k);
    if (isFlagAnswer(k, ans[k]) || (det && isFlagAnswer(k, det)) ||
        (riskQ && /^yes\b/i.test(String(ans[k]).trim()))) flags.push({ k:k, v:String(v), flag:true });
    else if (BRIEF_KEYS.indexOf(k) !== -1) rows.push({ k:k, v:String(v) });
    /* v32.119: regra dela — "se teve um NÃO não vai no summary". Um SIM vai: e uma
       preferencia que ela pediu (couro cabeludo, aquecedor, silencio). */
    else if (!/^(no|none|n\/a|nao|n\u00e3o)$/i.test(String(v).trim())) texts.push({ k:k, v:String(v) });
  });
  /* v32.119: o resumo e TUDO que ela respondeu de verdade. Nada de teto. */
  return flags.concat(rows).concat(texts);
}
/* sits at the TOP of the modal for facial/massage, before the run: flags visible, a Summary button, the full form behind a tap */
function formBriefBlock(a) {
  var kinds = runFormKinds(a);
  if (!kinds) return '';
  var list = clientForms(a);
  /* v32.119: so avisa da ficha FALTANDO quando o servico realmente exige uma. */
  if (!list.length) return formRequired(a)
    ? '<details class="fbrief fbrief-fold"><summary>\uD83D\uDCCB Consultation form \u00b7 <b>not filled yet</b></summary>' +
      '<div class="fbrief-empty">Joana sends it before the visit. If it matters today, ask her.</div></details>'
    : '';
  var f = list[0];
  var lbl = FORM_LABELS[f.form_type] || f.form_type;
  if (f.status === 'sent') {
    return '<div class="fbrief"><div class="fbrief-head">📋 ' + esc(lbl) + ' form</div><div class="fbrief-empty">⏳ Sent, not filled yet. Joana is on it.</div></div>';
  }
  var when = f.filled_at ? String(f.filled_at).slice(0,10) : '';
  var rows = formBriefRows(f);
  var flags = rows.filter(function(r){ return r.flag; });
  var rest = rows.filter(function(r){ return !r.flag; });   /* v32.119: sem corte */
  var chip = function(r){ return '<span class="fbrief-chip' + (r.flag ? ' flag' : '') + '">' + (r.flag ? '⚠ ' : '') + esc(briefLabel(r.k)) + ': <b>' + esc(r.v) + '</b></span>'; };
  return '<div class="fbrief">' +
    '<div class="fbrief-head">📋 ' + esc(lbl) + ' form · ' + (f.status==='reviewed' ? '🔵 reviewed' : '🟢 filled') + (when ? ' ' + esc(when) : '') + '</div>' +
    (flags.length ? '<div class="fbrief-chips">' + flags.map(chip).join('') + '</div>' : '') +
    (rest.length
      ? '<details class="fa-acc fb-sum"><summary>⭐ Summary · what matters for you</summary><div class="fbrief-chips" style="padding:10px 12px">' + rest.map(chip).join('') + '</div></details>'
      : (flags.length ? '' : '<div class="fbrief-empty">Nothing flagged, her answers are all clear.</div>')) +
    '<details class="fa-acc"><summary>Open the full form · every answer</summary>' +
      '<div class="fa-list">' + formAnswersHtml(f) + '</div></details>' +
    '</div>';

/* ================= v33.14: A ABA FORMS =================
   Pedido dela: "um aba para os forms pra michelle ver alem de aparecer no cliente".
   A espinha e a AGENDA (mesma licao do Reader da Joana): cada visita que EXIGE ficha
   nos proximos 7 dias vira uma linha com o estado REAL. Teste de patch nao pede ficha.
   Verde abre as respostas com o MESMO leitor do cartao; embaixo, o arquivo. */
function formsAgendaRuns(days) {
  var out = [], seen = {};
  for (var i = 0; i < (days || 7); i++) {
    var d = new Date(todayStr() + 'T12:00:00'); d.setDate(d.getDate() + i);
    var dIso = d.toISOString().slice(0, 10);
    var dia = (APPTS[dIso] || []).slice().sort(function(x, y){ return toMin(x.time) - toMin(y.time); });
    dia.forEach(function(a){
      if (a.isBlock) return;
      if (/patch\s*test/i.test(a.service || '')) return;
      if (!formRequired(a)) return;
      var k = dIso + '|' + canonTh(a.therapist) + '|' + (a.clientId || String(a.client || '').toLowerCase());
      if (seen[k]) return; seen[k] = 1;               /* um run por cliente+terapeuta */
      out.push({ d: dIso, a: a });
    });
  }
  return out;
}
function formStateFor(a) {
  if (latestFilledForm(a)) return 'filled';
  var kinds = runFormKinds(a);
  /* a marcacao da recepcao vale (bsb_form_override): ja tem em papel / nao pedir */
  var keys = [];
  if (a.clientId) keys.push('id:' + a.clientId);
  var nm0 = String(a.client || '').trim().toLowerCase();
  if (nm0) keys.push('nm:' + nm0);
  var ovr = null;
  keys.forEach(function(k){ (FORM_OVR[k] || []).forEach(function(o){
    if (ovr) return;
    if (kinds && o.form_type && kinds.indexOf(o.form_type) === -1) return;
    ovr = o.state;
  }); });
  if (ovr === 'onfile') return 'onfile';
  if (ovr === 'skip') return 'skip';
  var sent = formsFor(a).some(function(f){
    return f.status === 'sent' && (f._direct || (kinds && kinds.indexOf(f.form_type) !== -1));
  });
  if (!sent && ovr === 'sent') sent = true;
  /* o envio a mao da Joana (bsb_reminder_log) tambem conta como enviado */
  if (!sent) {
    runParts(a).forEach(function(x){ [x.id, x.ext_id, x.appt_id].forEach(function(k){ if (k && FORM_SENTLOG[k]) sent = true; }); });
    keys.forEach(function(k){ if (FORM_SENTLOG[k]) sent = true; });
  }
  return sent ? 'waiting' : 'missing';
}
function formsBadge() {
  var n = formsAgendaRuns(1).filter(function(r){ var st = formStateFor(r.a); return st === 'missing' || st === 'waiting'; }).length;
  return n ? '<span class="jt-navbadge" style="display:inline-block;margin-left:6px;background:#B7791F;color:#fff;border-radius:999px;padding:1px 7px;font-size:11px;font-weight:600">' + n + '</span>' : '';
}
function formsDayLabel(dIso) {
  if (dIso === todayStr()) return 'TODAY';
  var t = new Date(todayStr() + 'T12:00:00'); t.setDate(t.getDate() + 1);
  if (dIso === t.toISOString().slice(0, 10)) return 'TOMORROW';
  var d = new Date(dIso + 'T12:00:00');
  return ['SUN','MON','TUE','WED','THU','FRI','SAT'][d.getDay()] + ' ' + d.getDate();
}
function formsPageHtml() {
  var runs = formsAgendaRuns(7);

  if (!runs.length) h += '<div class="fp-empty">No visits needing a form in the next 7 days.</div>';
  var day = null;

    var a = r.a, th = thByKey(canonTh(a.therapist)) || { name: a.therapist || '?', color: '#999' };
    var st = formStateFor(a);
    var head = '<span class="fp-tm">' + fmtClock(toMin(a.time)) + '</span>' +

    if (st === 'filled') {

  });
  /* o arquivo: preenchidas mais recentes, mesmo de visitas fora da janela */
  var all = [], seenF = {};
  var colhe = function(f){
    if (!f || (f.status !== 'filled' && f.status !== 'reviewed')) return;
    var k = f.id || (f.form_type + '|' + (f.appt_id || '') + '|' + (f.filled_at || ''));
    if (seenF[k]) return; seenF[k] = 1; all.push(f);

  Object.keys(FORMS_BY_APPT).forEach(function(k){ (FORMS_BY_APPT[k] || []).forEach(colhe); });
  Object.keys(FORMS_BY_CLIENT).forEach(function(k){ (FORMS_BY_CLIENT[k] || []).forEach(colhe); });
  all.sort(function(x, y){ return String(y.filled_at || '').localeCompare(String(x.filled_at || '')); });
  all = all.slice(0, 20);
  if (all.length) {
    h += '<details class="fp-arch"><summary>\uD83D\uDCC1 All filled forms \u00b7 latest ' + all.length + '</summary>' +
      all.map(function(f){
        return '<details class="fp-arow"><summary>' + esc(f.client_name || 'No name') + ' \u00b7 ' +
          esc(FORM_LABELS[f.form_type] || f.form_type || 'form') + ' \u00b7 ' + esc(String(f.filled_at || '').slice(0, 10)) +
          '</summary><div class="fa-list">' + formAnswersHtml(f) + '</div></details>';
      }).join('') + '</details>';
  }
  return h + '</div>';
}

function saveFollowups(a) {

      if (!days) return null;

               service:runServiceText(a)||null, kind:kind, due_date:due.toISOString().slice(0,10),
               note:note, created_by:(a.therapist||'therapist') };

    var rows = [ mk('aftercare', g.after, 'Aftercare message after facial'),
                 mk('rebook',   g.back,  'Call to book the next facial') ].filter(Boolean);
    rows.forEach(function(row){
      fetch(SB_URL + '/rest/v1/bsb_followups', { method:'POST',

}

/* ============================================================================
   🐞 GRAVADOR DE ERROS — versão do APP DAS TERAPEUTAS (BSB_Timeline_Therapists)
   Cole este bloco inteiro dentro do <script> do app. Ele é defensivo: se alguma
   variável do app não existir, ele ignora aquela parte em vez de quebrar.
   ============================================================================ */
let LAST_ERRS = [], LAST_TAPS = [], REC = null;

function noteErr(msg) {
  try {
    if (typeof recLog === 'function') recLog('\u26A0 ERRO', msg);
    LAST_ERRS.push(new Date().toTimeString().slice(0, 5) + ' ' + String(msg).slice(0, 200));
    if (LAST_ERRS.length > 6) LAST_ERRS.shift();
  } catch (e) {}
}
try {
  window.addEventListener('error', function (ev) { noteErr((ev && ev.message) || 'erro'); });
  window.addEventListener('unhandledrejection', function (ev) { noteErr('promise: ' + ((ev && ev.reason && ev.reason.message) || ev.reason || '')); });
  document.addEventListener('click', function (ev) {
    try {
      const el = ev.target && ev.target.closest ? ev.target.closest('button,[onclick],a,.chip,.dmrow') : null;
      if (!el) return;
      let rot = (el.textContent || '').replace(/\s+/g, ' ').trim().slice(0, 42);
      if (!rot) rot = el.getAttribute('title') || el.id || el.className || 'algo';
      LAST_TAPS.push(new Date().toTimeString().slice(0, 5) + ' ' + rot);
      if (LAST_TAPS.length > 10) LAST_TAPS.shift();
      if (typeof recLog === 'function' && el.id !== 'bsbReportBtn') recLog('\uD83D\uDC46 clicou', rot);
    } catch (e) {}
  }, true);
} catch (e) {}

/* --- CONTEXTO: adaptado ao app das terapeutas --- */
function reportCtx() {
  const c = { pg: 'Timeline', cli: '', ver: '', th: 'terapeuta' };
  try {
    /* a terapeuta ativa (o app já guarda em ACTIVE_TH ao abrir tarefas/run) */
    if (typeof ACTIVE_TH !== 'undefined' && ACTIVE_TH) c.th = String(ACTIVE_TH);
    /* qual view está aberta: viewTimeline / viewTasks / viewShopping / viewPhrases */
    ['Timeline', 'Phrases', 'Tasks', 'Shopping'].forEach(function (v) {
      const el = document.getElementById('view' + v);
      if (el && el.style && el.style.display !== 'none' && el.offsetParent !== null) c.pg = v;
    });
    /* cliente aberta: o modal do cliente ou o run em andamento */
    const mc = document.querySelector('#clientModal .cm-name, #clientModal h2, .cm-head b');
    if (mc && mc.textContent) c.cli = mc.textContent.trim().slice(0, 60);
    /* carimbo de versão (o subtítulo mostra a build) */
    const sub = document.querySelector('.sub, #buildTag, .build');
    if (sub && sub.textContent) c.ver = sub.textContent.trim().slice(0, 40);
  } catch (e) {}
  return c;
}

/* --- A FOTO DA TELA: o que está acontecendo agora --- */
function screenSnapshot() {
  const L = [];
  try {
    const c = reportCtx();
    L.push('Terapeuta: ' + c.th);
    L.push('Tela: ' + c.pg + (c.ver ? ' (' + c.ver + ')' : ''));
    if (c.cli) L.push('Cliente aberta: ' + c.cli);

    /* em que estágio do run ela está: ① Start ② Message ③ Plan ④ Run ⑤ Confirm */
    try {
      if (typeof briefStep !== 'undefined' && briefStep) {
        const est = Object.keys(briefStep).map(function (k) { return k + '=' + briefStep[k]; }).join(', ');
        if (est) L.push('Estágio do run: ' + est);
      }
    } catch (e) {}

    /* runs em andamento hoje (quem já começou, quem terminou) */
    try {
      if (typeof runStore !== 'undefined' && runStore) {
        const rs = Object.keys(runStore).map(function (k) {
          const r = runStore[k] || {};
          return k + ':' + (r.phase || '?') + (r.startedAt ? ' desde ' + String(r.startedAt).slice(11, 16) : '');
        });
        if (rs.length) L.push('Runs: ' + rs.slice(0, 6).join(' · '));
      }
    } catch (e) {}

    /* telas abertas por cima */
    const abertos = [];
    ['clientModal', 'taskModal', 'adminModal', 'wizardOverlay', 'runOverlay'].forEach(function (id) {
      const el = document.getElementById(id);
      if (el && el.offsetParent !== null) abertos.push(id);
    });
    if (abertos.length) L.push('Aberto na hora: ' + abertos.join(', '));

    /* saúde dos dados: agenda e fichas carregadas */
    try {
      /* v32.119: APPTS e um mapa por data, entao .length era SEMPRE 0 — o painel dizia
         "0 agendamentos" mesmo com o dia cheio, e me mandou caçar o bug errado. */
      if (typeof APPTS !== 'undefined' && APPTS) {
        var _hoje = (APPTS[currentDate] || []).length;
        var _tot = 0; Object.keys(APPTS).forEach(function(d){ _tot += (APPTS[d] || []).length; });
        L.push('Dados: ' + _hoje + ' hoje, ' + _tot + ' carregados' +
               (typeof APPTS_LOADED !== 'undefined' ? (APPTS_LOADED ? '' : ' \u26A0 a carga falhou') : ''));
      }
      if (typeof FORMS_BY_APPT !== 'undefined' && FORMS_BY_APPT) L.push('Fichas indexadas: ' + Object.keys(FORMS_BY_APPT).length);
    } catch (e) {}

    if (LAST_TAPS.length) L.push('Últimos toques: ' + LAST_TAPS.slice(-6).join(' \u2192 '));
    if (LAST_ERRS.length) L.push('Técnico: ' + LAST_ERRS.join(' | '));
  } catch (e) { L.push('(foto parcial: ' + e.message + ')'); }
  return L.join('\n');
}

/* --- GRAVAÇÃO --- */
function recLog(tipo, texto) {
  if (!REC) return;
  try {
    const seg = Math.round((Date.now() - REC.t0) / 1000);
    REC.passos.push('+' + seg + 's ' + tipo + ' ' + String(texto).slice(0, 120));
    if (REC.passos.length > 120) REC.passos.shift();
    const c = document.getElementById('recCount');
    if (c) c.textContent = REC.passos.length + ' passo' + (REC.passos.length !== 1 ? 's' : '');
  } catch (e) {}
}
function recToggle() {
  if (REC) { recStop(); return; }
  REC = { t0: Date.now(), passos: [] };
  recLog('\uD83D\uDCCD', 'comecei a gravar em: ' + reportCtx().pg);
  const btn = document.getElementById('bsbReportBtn');
  if (btn) {
    btn.innerHTML = '\u23FA <span style="font-size:12.5px">Recording\u2026 <span id="recCount">1 passo</span> \u00b7 tap to stop</span>';
    btn.style.background = '#FDECEF'; btn.style.borderColor = '#F3C0CD'; btn.style.color = '#B3264B';
  }
  const dica = document.createElement('div');
  dica.id = 'recDica';
  dica.style.cssText = 'position:fixed;right:16px;bottom:64px;z-index:8001;background:#fff;border:1.5px solid #F3C0CD;border-radius:14px;padding:11px 13px;box-shadow:0 10px 30px rgba(20,18,40,.16);max-width:250px;font-size:12.5px;color:#B3264B';
  dica.innerHTML = '\u23FA <b>Recording</b><br><span style="font-size:11.5px;color:#9A9BB4">Do it again, the same thing that went wrong. Then tap the button to stop \uD83D\uDC9B</span>';
  document.body.appendChild(dica);
  setTimeout(function () { const x = document.getElementById('recDica'); if (x) x.remove(); }, 8000);
}
function recStop() {
  if (!REC) return;
  const dur = Math.round((Date.now() - REC.t0) / 1000);
  const passos = REC.passos.slice();
  REC = null;
  const x = document.getElementById('recDica'); if (x) x.remove();
  enviarRelato('\uD83C\uDFAC gravação (' + dur + 's)',
    'GRAVAÇÃO (' + dur + 's, ' + passos.length + ' passos)\n' + passos.join('\n') + '\n\n--- estado no fim ---\n' + screenSnapshot());
}

/* --- ENVIO (um caminho só para os dois modos) --- */
function enviarRelato(oQue, corpo) {
  const c = reportCtx();
  const btn = document.getElementById('bsbReportBtn');
  if (btn) { btn.innerHTML = '\u23F3 <span style="font-size:12.5px">sending\u2026</span>'; }
  fetch(SB_URL + '/rest/v1/bsb_app_reports', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Prefer: 'return=minimal', apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY },
    body: JSON.stringify({ who: c.th, what: oQue, page: c.pg, client_ctx: c.cli || null,
      app_version: c.ver || null, auto_error: corpo, url: String(location.href).slice(0, 300), ua: String(navigator.userAgent).slice(0, 200) })
  }).then(function (r) {
    if (!r.ok) throw new Error('x');
    recFeedback('\u2705 <span style="font-size:12.5px">Ligia will see it \uD83D\uDC9B</span>', '#E7F6F0', '#9FD9C2', '#0E6B58');
  }).catch(function () {
    try {
      const fila = JSON.parse(localStorage.getItem('bsb_reports_fila') || '[]');
      fila.push({ what: oQue, page: c.pg, cli: c.cli, ver: c.ver, th: c.th, when: new Date().toISOString(), foto: corpo });
      localStorage.setItem('bsb_reports_fila', JSON.stringify(fila));
      recFeedback('\u2705 <span style="font-size:12.5px">saved on this iPad</span>', '#FFF7E8', '#F0D9A8', '#B4770A');
    } catch (e) {}
  });
}
function recFeedback(html, bg, bd, cor) {
  const btn = document.getElementById('bsbReportBtn'); if (!btn) return;
  btn.innerHTML = html; btn.style.background = bg; btn.style.borderColor = bd; btn.style.color = cor;
  setTimeout(function () {
    btn.style.background = '#fff'; btn.style.borderColor = '#E4E4EC'; btn.style.color = '#585A75';
    btn.innerHTML = '\uD83D\uDC1E <span style="font-size:12.5px">Something wrong?</span>';
  }, 3600);
}
function quickReport() { enviarRelato('(1 toque, sem texto)', screenSnapshot()); }

/* --- O MENU DO BOTÃO --- */
function reportMenu() {
  if (REC) { recStop(); return; }
  const old = document.getElementById('bsbRepMenu'); if (old) { old.remove(); return; }
  const m = document.createElement('div');
  m.id = 'bsbRepMenu';
  m.style.cssText = 'position:fixed;right:16px;bottom:64px;z-index:8002;background:#fff;border:1.5px solid #E4E4EC;border-radius:16px;padding:10px;box-shadow:0 14px 40px rgba(20,18,40,.20);width:252px';
  m.innerHTML =

    '<button type="button" style="width:100%;text-align:left;padding:11px 12px;font-size:12.5px;font-weight:700;border-radius:12px;margin-top:6px;background:#FDECEF;border:1px solid #F3C0CD;color:#B3264B;cursor:pointer" onclick="document.getElementById(\'bsbRepMenu\').remove();recToggle()">\u23FA Record it happening<br><span style="font-weight:400;font-size:11px;color:#B07C8C">do it again \u00b7 then tap stop</span></button>';
  document.body.appendChild(m);
  setTimeout(function () {
    document.addEventListener('click', function fecha(ev) {
      const mm = document.getElementById('bsbRepMenu');
      if (mm && !mm.contains(ev.target) && ev.target.id !== 'bsbReportBtn') { mm.remove(); document.removeEventListener('click', fecha, true); }
    }, true);

}

/* --- fila offline sobe sozinha --- */
function flushReports() {
  try {
    const fila = JSON.parse(localStorage.getItem('bsb_reports_fila') || '[]');
    if (!fila.length) return;
    Promise.all(fila.map(function (r) {
      return fetch(SB_URL + '/rest/v1/bsb_app_reports', { method: 'POST',
        headers: { 'Content-Type': 'application/json', Prefer: 'return=minimal', apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY },

          app_version: r.ver || null, auto_error: (r.foto || '') + '\n(offline ' + r.when + ')' }) });
    })).then(function () { localStorage.removeItem('bsb_reports_fila'); }).catch(function () {});
  } catch (e) {}
}
setTimeout(flushReports, 4000);

<script>/*BSB-TASKS-INICIO*/function bsbOpenTasks(){var k=(typeof ACTIVE_TH!=="undefined"&&ACTIVE_TH)||"";var n=k;try{if(k&&typeof thByKey==="function"&&thByKey(k))n=thByKey(k).name||k}catch(e){}var f=String(n||"").trim().split(/\s+/)[0].toLowerCase();window.open("https://bsb-team.vercel.app/?tab=content"+(f?"#"+encodeURIComponent(f):""),"_blank")}/*BSB-TASKS-FIM*/</script><script>

(function(){
  var FREE_MIN = 15;
  function v378dayWindow(d) { return { s: 10 * 60, e: closeHourFor(d) }; }
  function v378busy(key, d) {
    var occ = [];
    (APPTS[d] || []).forEach(function(a){
      if (a.therapist !== key) return;
      var s = toMin(a.time), e = a.end ? toMin(a.end) : s + (a.duration || 60);

      var bk = b.therapist || canonTh(String(b.service || b.client || '').trim().split(/\s+/)[0]);
      if (bk !== key) return;
      var s = toMin(b.time), dur = b.duration || 30;

    }

  window.v378freeGaps = function(key, d) {
    var w = v378dayWindow(d), b = v378busy(key, d);
    if (b.allDay) return [];
    var occ = b.occ.sort(function(x, y){ return x.s - y.s; });
    var out = [], cur = w.s;
    occ.forEach(function(o){
      if (o.e <= cur) return;
      if (o.s - cur >= FREE_MIN) out.push({ s: cur, e: Math.min(o.s, w.e) });
      cur = Math.max(cur, o.e);
    });
    if (w.e - cur >= FREE_MIN) out.push({ s: cur, e: w.e });
    return out.filter(function(g){ return g.e - g.s >= FREE_MIN; });

      var who = canonTh(l.done_by || ''); if (!who) return;

    document.querySelectorAll('.tl-col[data-thcol]').forEach(function(col){
      col.querySelectorAll('.donetk').forEach(function(x){ x.remove(); });
      var ck = col.getAttribute('data-thcol');
      var list = (by[ck] || []).sort(function(a, b){ return a.m - b.m; });
      var groups = [];
      list.forEach(function(x){ var g = groups[groups.length - 1]; if (g && x.m - g.last < 12) { g.items.push(x); g.last = x.m; } else groups.push({ m: x.m, last: x.m, items: [x] }); });
      var gaps = v378freeGaps(ck, d), hmin = 22 / PX_PER_MIN;
      groups.forEach(function(g){

<script>/*BSB-RUNSYNC-INICIO*/
/* RUNSYNC v2 (10/10/2026, revisao: le start~ certo e desfaz o que outro iPad desfez) v1 (09/10/2026) Ligia: "os cinzas tinham mais, por que nao ta aparecendo todos que ja estavam cinza?"

   no iPad onde ela fez o check out; em outro aparelho, ou se o Safari limpasse, sumia. O Hub ja recebia tudo
   (bsb_task_log start:/start~/done:<appt>), mas ninguem lia de volta.
   AGORA: ao abrir, a cada 60 s e ao trocar de dia, le o Hub e completa o que falta no aparelho. O Hub manda:
   done no Hub = cartao cinza em qualquer aparelho. Desfazer o fim (reopenRun) e desfazer o Start (undoStart)

(function(){
  if (typeof runStore !== 'function' || typeof runSave !== 'function' || typeof findAppt !== 'function' || typeof SB_URL === 'undefined') return;
  function minLondres(iso){
    try { var t = new Date(iso).toLocaleTimeString('en-GB', { timeZone: 'Europe/London', hour12: false, hour: '2-digit', minute: '2-digit' }).split(':'); return (+t[0]) * 60 + (+t[1]); } catch(e) { return null; }

        if (ini[id] != null && !cur.hubStart) { cur.hubStart = true; mudou = true; }

  }

  }, true);
  function carrega(){
