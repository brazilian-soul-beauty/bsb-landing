var RT_PATH = {};   /* appt_id -> { brand, cat } (onde ela está no catálogo agora) */
function rtPath(apptId) { return RT_PATH[apptId] || (RT_PATH[apptId] = { brand: '', cat: '' }); }
function rtGo(apptId, level, val) {
  var p = rtPath(apptId);
  if (level === 'brand') { p.brand = val || ''; p.cat = ''; }
  else if (level === 'cat') { p.cat = val || ''; }
  else { p.brand = ''; p.cat = ''; }
  rerenderIfGroupOpen(apptId);
}
function retailPickHtml(a) {
  if (!RETAIL_PRODUCTS.length) return '';
  var sold = {}; retailSoldFor(a.id).forEach(function(x){ sold[x.product_id] = 1; });
  /* v35.20: so o que a regra do servico manda mostrar (⚙ 🧾 Check out); a sacola nao filtra */
  var LIST = retailProductsFor(a);
  if (!LIST.length) return '<div class="rt-pick"><div class="hintline">No products set for this service yet · Ligia adds them in ⚙ 🧾 Check out / 🛍 Retail.</div></div>';
  var p = rtPath(a.id);
  var brands = [], cats = [], seenB = {}, seenC = {};
  LIST.forEach(function(x){
    var b = x.brand || 'Other'; if (!seenB[b]) { seenB[b] = 1; brands.push(b); }
  });
  if (!p.brand && brands.length === 1) p.brand = brands[0];   /* só Eminence: já entra nela */
  var oneBrand = brands.length === 1;
  /* v35.20: regra com UMA categoria so (ex.: waxing → minis): ja abre nos produtos */
  if (p.brand && !p.cat) {
    var only = []; LIST.forEach(function(x){ if ((x.brand || 'Other') === p.brand) { var c0 = x.category || 'Other'; if (only.indexOf(c0) < 0) only.push(c0); } });
    if (only.length === 1) p.cat = only[0];
  }
  var chip = function(txt, on, onclick, cls){ return '<button class="wpick' + (on ? ' on' : '') + (cls ? ' ' + cls : '') + '" onclick="' + onclick + '">' + txt + '</button>'; };
  /* v35.17: A SACOLA em cima — o que ela já marcou, com quantidade (− 1 +) e ✕, sempre visível */
  var bag = retailSoldFor(a.id);
  var bagHtml = '';
  if (bag.length) {
    bagHtml = '<div class="rt-bag"><div class="rt-bag-h">🛍️ In the bag · ' + bag.reduce(function(s2, x){ return s2 + (x.qty || 1); }, 0) + '</div>' +
      bag.map(function(x){
        return '<div class="rt-bag-row"><span class="rt-bag-n">' + esc(x.product) + '</span>' +
          '<span class="rt-qty"><button onclick="retailQty(\'' + esc(a.id) + '\',\'' + esc(x.product_id) + '\',-1)">−</button><b>' + (x.qty || 1) + '</b><button onclick="retailQty(\'' + esc(a.id) + '\',\'' + esc(x.product_id) + '\',1)">+</button></span>' +
          '<button class="rt-x" onclick="toggleRetailItem(\'' + esc(a.id) + '\',\'' + esc(x.product_id) + '\')" title="Remove">✕</button></div>';
      }).join('') + '</div>';
  }
  /* o caminho + um BOTAO de voltar de verdade (o breadcrumb sozinho parecia texto no iPad) */
  var upLevel = p.cat ? 'brand' : (p.brand && !oneBrand ? 'root' : '');
  var upVal = p.cat ? p.brand : '';
  var back = upLevel ? '<button class="rt-back" onclick="rtGo(\'' + esc(a.id) + '\',' + esc(JSON.stringify(upLevel)) + ',' + esc(JSON.stringify(upVal)) + ')">‹ Back</button>' : '';
  var crumb = '<div class="rt-crumb">' + back +
    '<button class="rt-cr' + (!p.brand ? ' cur' : '') + '" onclick="rtGo(\'' + esc(a.id) + '\',\'root\')">🛍 Shop</button>' +
    (p.brand ? ' › <button class="rt-cr' + (!p.cat ? ' cur' : '') + '" onclick="rtGo(\'' + esc(a.id) + '\',\'brand\',' + esc(JSON.stringify(p.brand)) + ')">' + esc(p.brand) + '</button>' : '') +
    (p.cat ? ' › <span class="rt-cr cur">' + esc(p.cat) + '</span>' : '') + '</div>';
  var body = '';
  if (!p.brand) {
    body = '<div class="wrap-picks">' + brands.map(function(b){ return chip(esc(b), false, 'rtGo(\'' + esc(a.id) + '\',\'brand\',' + esc(JSON.stringify(b)) + ')'); }).join('') + '</div>';
  } else if (!p.cat) {
    LIST.forEach(function(x){ if ((x.brand || 'Other') !== p.brand) return; var c = x.category || 'Other'; if (!seenC[c]) { seenC[c] = 1; cats.push(c); } });
    body = '<div class="wrap-picks">' + cats.map(function(c){
      var nSold = LIST.filter(function(x){ return (x.brand || 'Other') === p.brand && (x.category || 'Other') === c && sold[x.id]; }).length;
      return chip(esc(c) + (nSold ? ' <b>' + nSold + '</b>' : ''), nSold > 0, 'rtGo(\'' + esc(a.id) + '\',\'cat\',' + esc(JSON.stringify(c)) + ')');
    }).join('') + '</div>';
  } else {
    var items = LIST.filter(function(x){ return (x.brand || 'Other') === p.brand && (x.category || 'Other') === p.cat; });
    body = '<div class="wrap-picks">' + items.map(function(x){
      return chip(esc(x.name) + (sold[x.id] ? ' ✓' : ''), !!sold[x.id], 'toggleRetailItem(\'' + esc(a.id) + '\',\'' + esc(x.id) + '\')');
    }).join('') + '</div>' +
    /* v35.17: "adicionar mais produtos" — volta pras categorias com um toque so */
    '<button class="rt-more" onclick="rtGo(\'' + esc(a.id) + '\',\'brand\',' + esc(JSON.stringify(p.brand)) + ')">+ Add another product</button>';
  }
  return '<div class="rt-pick">' + bagHtml + crumb + body + '</div>';
}

  if (isNaN(mm) || !dd) return null;

  var nx = new Date(now.getFullYear(), mm, dd);

  var next = null;
  day.forEach(function(x){
    var s2 = toMin(x.time);
    if (s2 >= end - 1 && (next === null || s2 < next)) next = s2;
  });
  return next;
}
function expectedEnd(a) {
  if (a.end) return toMin(a.end);
  return toMin(a.time) + (a.duration || 60);
}
function runState(a) {
  var r = runFor(a);
  var exp = expectedEnd(a);
  var now = nowMin();
  var today = currentDate === todayStr();
  if (r && r.end != null) return { phase: 'done', over: false, exp: exp };
  if (r && r.start != null) {
    /* v32.11: se ela so abriu o run horas depois, isso nao e "atraso", e o app sendo
       aberto tarde. Passou de 90 min, nao inventamos numero nem alarme. */
    var rawLate = Math.max(0, r.start - toMin(a.time));
    var late = (rawLate > 90) ? 0 : rawLate;
    var treat = treatmentMinsFor(a);
    var clean = cleanupMinsFor(a);
    var owed = r.start + treat;              /* ela tem que entregar o tratamento inteiro */
    var chair = owed + clean;                /* e a cadeira so vaga depois de limpar */
    var nx = nextClientStart(a);
    return { phase:'running', over: today && now > exp, exp: exp,
             mins: today ? (now - r.start) : 0, startedLate: late,
             treat: treat, clean: clean, owed: owed, chair: chair,
             nextStart: nx, behind: (nx != null ? Math.max(0, chair - nx) : 0) };
  }
  /* not started: if it's today and we're already past the scheduled window start, it's due */
  return { phase: 'idle', over: false, exp: exp, due: today && now >= toMin(a.time) };
}

/* v35.14: pedido dela — "quando tiver algo acabando, prioridade e ver se tem em stock e quanto, e
   mandar aviso pro dash da Aluana". O bilhete "acabou X" casa com o produto do stock (vw_inv_stock,
   a mesma view do dash de compras); a linha mostra quanto ainda tem no armario, e o produto ganha
   flagged_at em bsb_inv_products, que e o ⚠ "team-flagged" que a Aluana ja ve no Overview dela. */
function stockMatchFor(name) {
  var n = String(name || '').toLowerCase().replace(/\s+/g, ' ').trim();
  if (n.length < 4 || !STOCK || !STOCK.length) return null;
  var best = null, bestLen = 0;
  STOCK.forEach(function(p){
    var pn = String(p.name || '').toLowerCase().replace(/\s+/g, ' ').trim();
    if (!pn) return;
    if (pn === n) { best = p; bestLen = 1e9; return; }
    if (pn.length >= 4 && (n.indexOf(pn) >= 0 || pn.indexOf(n) >= 0) && pn.length > bestLen) { best = p; bestLen = pn.length; }
  });
  return best;
}
function stockQtyLabel(p) {
  if (!p) return '';
  var q = Math.max(0, Math.round(Number(p.est_stock) || 0));
  var u = p.pack_unit ? ' ' + p.pack_unit + (q === 1 ? '' : 's') : '';
  return q > 0 ? ('📦 about ' + q + u + ' still in stock') : '📦 none left in stock';
}
function flagForAluana(p) {
  if (!p || p.product_id == null) return Promise.resolve(null);
  return sbPatch('bsb_inv_products', 'product_id=eq.' + Number(p.product_id), { flagged_at: new Date().toISOString() })
    .then(function(r){ if (r && (r.ok || r.training)) setSync('ok', 'Aluana’s dash flagged'); return r; })
    .catch(function(){ setSync('err', 'saved here · could not flag Aluana’s dash'); return null; });

var STOCK = [];

function stockLow(r) {

function renderStockPage() {

  }
  var groups = {}, order = [];
  STOCK.forEach(function(r){

    if (!groups[key]) { groups[key] = []; order.push(key); }

  order.sort(function(a, b){ return a.localeCompare(b); });

function taskDueToday(t) {
  var f = t.freq || 'daily';
  if (f === 'daily') return true;
  var d = new Date(currentDate + 'T12:00:00');
  if (f === 'weekly') return t.weekday != null && d.getDay() === Number(t.weekday);
  if (f === 'alt') {
    var anchor = t.anchor ? new Date(String(t.anchor).slice(0,10) + 'T12:00:00') : null;
    if (!anchor) return true;
    var diff = Math.round((d - anchor) / 86400000);
    return diff >= 0 && diff % 2 === 0;
  }
  return true;
}

    if (thKey && t.assignee && t.assignee !== thKey) return false;

  });
}

/* one fetch of the window, keeps ALL therapists and builds the handoff index */
var APPTS_LOADED = false;
function loadAppts() {
  var all = [], from = 0, size = 1000, failed = false;
  function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  var lo = new Date(); lo.setDate(lo.getDate()-14);
  var hi = new Date(); hi.setDate(hi.getDate()+60);
  var win = '&date=gte.' + ymd(lo) + '&date=lte.' + ymd(hi);
  function step() {
    return fetch(SB_URL + '/rest/v1/bsb_appointments?select=*&status=neq.Removido' + win + '&order=date.asc', {
      headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, Range: from + '-' + (from+size-1) }
    }).then(function(r){
      if (!r.ok) { failed = true; return []; }
      return r.json();
    }).then(function(rows){
      all = all.concat(rows || []);
      if (rows && rows.length === size) { from += size; return step(); }
      return all;
    }).catch(function(){ failed = true; return all; });
  }
  /* v32.119: se o Range falhar (proxy, cache, CDN), tenta UMA vez sem ele. Era daqui que
     vinha "0 agendamentos carregados" com as fichas carregando normalmente. */
  function plainB() {
    return fetch(SB_URL + '/rest/v1/bsb_appointments?select=*&status=neq.Removido' + win + '&order=date.asc&limit=1000', {
      headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY }
    }).then(function(r){ return r.ok ? r.json() : []; }).catch(function(){ return []; });
  }
  return step().then(function(rows){
    if ((!rows || !rows.length) && failed) return plainB();
    return rows;
  }).then(function(rows){
    APPTS_LOADED = !!(rows && rows.length) || !failed;
    if (!APPTS_LOADED) setSync('err', 'the day did not load');
    buildHandoffIndex(rows || []);
    ingestAppts(rows || []);
  });
}

function tipClientsSoFar(dateStr, uptoMin) {
  var seen = {}, n = 0;

    if (x.isBlock) return;

/* day at a glance: how many clients, first/last, compact attention counts */
function renderDaySummary(appts) {
  if (!appts.length) return '<div class="day-sum"><span class="ds-count">No bookings</span></div>';
  var sorted = appts.slice().sort(function(a,b){ return toMin(a.time) - toMin(b.time); });
  var first = sorted[0].time, last = sorted[sorted.length-1].time;
  var n = { nw:0, patch:0, allergy:0, late:0 };
  sorted.forEach(function(a){
    if (isNewClient(a)) n.nw++;
    if (needsPatchTest(a)) n.patch++;
    if (hasHema(a) || hasAllergy(a)) n.allergy++;
    if (clientLate(a)) n.late++;
  });
  var flags = [];
  if (n.nw) flags.push(n.nw + ' new');
  if (n.patch) flags.push(n.patch + ' patch');
  if (n.allergy) flags.push(n.allergy + ' allergy');
  if (n.late) flags.push(n.late + ' late');
  return '<div class="day-sum"><span class="ds-count">' + sorted.length + ' client' + (sorted.length>1?'s':'') + '</span>' +
    '<span class="ds-sep">·</span> ' + esc(first) + ' to ' + esc(last) +
    (flags.length ? '<span class="ds-sep">·</span> <span class="ds-att">👀 ' + flags.join(' · ') + '</span>' : '') + '</div>';
}

/* collapsed check-in, a pill that opens the modal */
function checkinPill() {

  var ready = list.filter(function(t){ return CHECK_ITEMS.every(function(i){ return checkDone(i.k, t.key); }); }).length;
  var all = ready === list.length && list.length > 0;
  return '<button class="checkin-pill' + (all ? ' done' : '') + '" onclick="openCheckin()">' +
    (all ? '✨' : '☐') + ' Check-in · ' + ready + '/' + list.length + ' ready</button>';
}
function teamToday() {
  var day = APPTS[currentDate] || [];
  var keys = {}; day.forEach(function(a){ if (a.therapist) keys[a.therapist] = 1; });
  var list = THERAPISTS.filter(function(t){ return keys[t.key]; });
  return list.length ? list : THERAPISTS.slice();
}

function intentionIdx(key, date) {
  date = date || currentDate;
  var t = Date.parse(date + 'T00:00:00');
  var dayNum = isNaN(t) ? 0 : Math.floor(t / 86400000);       /* increments by 1 each day → never repeats two days running */
  var k = key || '', off = 0;
  for (var i = 0; i < k.length; i++) off = (off * 31 + k.charCodeAt(i)) >>> 0;   /* each therapist starts at a different point in the bank */
  var n = DAILY_INTENTIONS.length;
  return (((dayNum + (off % n)) % n) + n) % n;
}
function intentionFor(key, date) {
  var idx = intentionIdx(key, date), lang = thLang(key);
  if (lang === 'pt' && DAILY_PT[idx]) return DAILY_PT[idx];
  if (lang === 'fa' && DAILY_FA[idx]) return DAILY_FA[idx];
  return DAILY_INTENTIONS[idx];

function pgTodayCards(key){
  var st = pgState(key);
  var seed = 0; var s = 'pg|' + key + '|' + currentDate;
  for (var j = 0; j < s.length; j++){ seed = ((seed << 5) - seed) + s.charCodeAt(j); seed |= 0; }
  seed = Math.abs(seed);
  var scored = PG_CARDS.map(function(c, i){ return { c: c, box: st.boxes[c.k] || 0, i: i }; });
  scored.sort(function(a, b){ return (a.box - b.box) || (((a.i + seed) % PG_CARDS.length) - ((b.i + seed) % PG_CARDS.length)); });
  return scored.slice(0, 5).map(function(x){ return x.c; });
}

function pgReveal(){ if (pgRun) { pgRun.revealed = true; renderPhraseGame(); } }
function pgScore(kind){
  if (!pgRun || !pgRun.revealed) return;
  var cards = pgTodayCards(pgRun.key); var c = cards[pgRun.i];
  var st = pgState(pgRun.key); var b = st.boxes[c.k] || 0;
  if (kind === 'yes') { st.boxes[c.k] = Math.min(3, b + 1); pgRun.perfect++; }
  else if (kind === 'blank') { st.boxes[c.k] = 0; }
  pgSave(pgRun.key, st);
  pgRun.i++; pgRun.revealed = false;
  if (pgRun.i >= cards.length && !pgRun.wasDone) {
    var y = new Date(Date.parse(currentDate + 'T00:00:00') - 86400000).toISOString().slice(0, 10);
    st.streak = (st.lastDay === y) ? (st.streak + 1) : 1;
    st.lastDay = currentDate;
    st.days[currentDate] = { done: true, perfect: pgRun.perfect, of: cards.length };
    pgSave(pgRun.key, st);
  }
  renderPhraseGame();
}
function renderPhraseGame(){
  var ov = document.getElementById('pgOv');
  if (!ov) { ov = document.createElement('div'); ov.id = 'pgOv'; ov.className = 'pg-ov'; ov.onclick = function(e){ if (e.target === ov) pgClose(); }; document.body.appendChild(ov); }

  var lang = (typeof thLang === 'function') ? thLang(pgRun.key) : 'en';
  var body = '';

    var d = st.days[currentDate] || {};
    var pf = d.perfect != null ? d.perfect : pgRun.perfect;
    body = '<div class="pg-final"><div style="font-size:44px">' + (pf >= cards.length ? '\uD83E\uDD29' : pf >= cards.length - 1 ? '\uD83D\uDE42' : '\uD83C\uDF31') + '</div>' +
      '<div class="pg-score">' + pf + '/' + cards.length + ' word for word</div>' +
      '<div class="pg-streak">\uD83D\uDD25 streak <b>' + (st.streak || 0) + '</b> \u00b7 the ones you miss come back tomorrow</div>' +
      '<button class="pg-btn" style="margin-top:12px" onclick="pgClose()">Done</button></div>';

            '<button class="pg-ghost" onclick="pgScore(\'almost\')">Almost</button>' +
            '<button class="pg-ghost" onclick="pgScore(\'blank\')">Went blank</button>' +
          '</div>');
  }
  ov.innerHTML = '<div class="pg-card"><div class="pg-head">\uD83C\uDFB4 Phrase memory<button class="pg-x" onclick="pgClose()">\u00d7</button></div>' + body + '</div>';

    members: day.filter(isMember).length,
    handoffs: day.filter(function(a){ return !!nextHandoff(a); }).length,
    notes: day.filter(isImportantNote).length
  };
}

function trainingDayIdx(key, size, salt) {
  var t = Date.parse((currentDate || todayStr()) + 'T00:00:00');
  var dayNum = isNaN(t) ? 0 : Math.floor(t / 86400000);
  var off = 0; String(key || '').split('').forEach(function(c){ off = (off * 53 + c.charCodeAt(0)) >>> 0; });
  return ((dayNum + off + (salt || 0)) % size + size) % size;
}
/* today's menu: one phrase per theme (today's variation), she chooses ONE to memorise */
function trainingCards(key) {
  var t = thByKey(key); var me = t ? firstName(t.name) : '';
  return TRAINING_BANK.map(function(cat){
    var idx = trainingDayIdx(key + '|' + cat.k, cat.phrases.length);
    var phrase = cat.phrases[idx];
    if (cat.k === 'handover' && me && phrase.indexOf(me) !== -1) {
      idx = (idx + 1) % cat.phrases.length;               /* never hand the client to yourself */
      phrase = cat.phrases[idx];
    }
    if (me) phrase = phrase.replace(/\bDania\b/g, me);    /* speak with your own name */
    return { k:cat.k, icon:cat.icon, title:cat.title, brief:cat.brief, phrase:phrase, idx:idx };
  });
}
function trainingCard(key, k) {
  var c = trainingCards(key).filter(function(x){ return x.k === k; })[0];
  return c || null;
}
function trainingQuizToday(key) {
  var i1 = trainingDayIdx(key, TRAINING_QUIZ.length, 3);
  var i2 = (i1 + 1 + trainingDayIdx(key, TRAINING_QUIZ.length - 1, 5)) % TRAINING_QUIZ.length;
  return [TRAINING_QUIZ[i1], TRAINING_QUIZ[i2]];
}
function quizOptions(q, key, salt) {
  var opts = [q.correct].concat(q.wrong);
  var idx = trainingDayIdx(key, 4, salt || 7);
  return opts.slice(idx).concat(opts.slice(0, idx));      /* stable daily shuffle */
}
/* score: practice 20/10 + quiz 2x15 + said-it-to-clients up to 50 (+5 Eminence for Michelle, capped) */
var USAGE_PTS = { all:50, most:35, few:15, none:5 };
function trainingScore(st, key) {
  var quiz = trainingQuizToday(key);
  var pts = (st.mark === 'good' ? 20 : st.mark === 'practice' ? 10 : 0);
  quiz.forEach(function(q, i){ if (st.quizPick['q'+i] === q.correct) pts += 15; });
  pts += USAGE_PTS[st.usage] || 0;
  if (key === 'michelle' && st.eminence === true) pts += 5;
  return Math.min(100, pts);
}

function trainingEminence(v) {
  var st = trainState(trainingTh);
  st.eminence = v; st.phase = 'score'; st.done = true;
  syncTraining(st);
  saveTrainState(trainingTh, st);
  renderTrainingModal();
}
/* upsert today's row (skipped entirely in testing mode) */
function syncTraining(st) {
  var key = trainingTh; if (!key || trainTesting()) return;
  var quiz = trainingQuizToday(key);
  var qc = quiz.filter(function(q, i){ return st.quizPick['q'+i] === q.correct; }).length;
  var card = trainingCard(key, st.phraseK);
  var row = { id: currentDate + '|training:' + key, date: currentDate, therapist: key,
    score: st.done ? trainingScore(st, key) : null,
    good: st.mark === 'good' ? 1 : 0, practice: st.mark === 'practice' ? 1 : 0,
    quiz_correct: qc, quiz_total: quiz.length,
    phrase_key: st.phraseK, phrase_idx: card ? card.idx : null, usage: st.usage,
    eminence: st.eminence, updated_at: new Date().toISOString() };
  var wk = (TRAINING_WEEK[key] = TRAINING_WEEK[key] || []).filter(function(r){ return r.id !== row.id; });
  wk.push(row); TRAINING_WEEK[key] = wk;
  setSync('busy', 'saving…');
  sbUpsert('bsb_training_log', row, 'id')
    .then(function(r){ setSync(r&&r.ok?'ok':'err', r&&r.ok?'training saved':'sync failed'); })
    .catch(function(){ setSync('err','sync failed'); });
}
/* reset today: local state + week row + Supabase row, so Ligia can test freely */
function trainResetDay() {
  var key = trainingTh; if (!key) return;
  clearTrainState(key);
  var id = currentDate + '|training:' + key;
  TRAINING_WEEK[key] = (TRAINING_WEEK[key] || []).filter(function(r){ return r.id !== id; });
  sbDelete('bsb_training_log', id).catch(function(){});
  renderTrainingModal();
}
function trainBack() {
  var st = trainState(trainingTh);
  var order = ['pick','practice','quiz','day','usage','eminence','score'];
  var i = order.indexOf(st.phase);
  if (i <= 0) return;
  st.phase = order[i-1];
  if (st.phase === 'quiz') { st.quizStep = Math.max(0, trainingQuizToday(trainingTh).length - 1); }
  if (st.phase === 'day' && trainingTh !== 'michelle') st.phase = 'quiz';   /* non-Michelle skips eminence going back */
  saveTrainState(trainingTh, st);
  renderTrainingModal();
}
function weekBarsHtml(key) {
  var rows = TRAINING_WEEK[key] || [];
  var byDate = {}; rows.forEach(function(r){ byDate[r.date] = r; });
  var base = Date.parse((currentDate || todayStr()) + 'T00:00:00');
  var bars = '', sum = 0, n = 0;
  for (var i = 6; i >= 0; i--) {
    var d = new Date(base - i*86400000);
    var ds = d.toISOString().slice(0,10);
    var r = byDate[ds];
    var sc = r && r.score != null ? r.score : null;
    if (sc != null) { sum += sc; n++; }
    var dow = ['S','M','T','W','T','F','S'][d.getDay()];
    bars += '<div class="twk-col"><div class="twk-bar"><i style="height:' + (sc != null ? Math.max(sc, 6) : 0) + '%"></i></div><span class="twk-d">' + dow + '</span></div>';
  }
  var avg = n ? Math.round(sum / n) : null;
  return '<div class="twk">' + bars + '</div>' +
    '<div class="twk-avg">' + (n ? ('This week: <b>' + avg + '</b> average · ' + n + ' day' + (n>1?'s':'') + ' trained') : 'First training of the week, it counts from today.') + '</div>';
}

function renderTaskBlock(period, timeLabel, title) {
  var tasks = tasksByPeriod(period);
  if (!tasks.length) return '';
  var done = tasks.filter(function(t){ return taskDone(t.id); }).length;
  var pct = Math.round(done / tasks.length * 100);
  var cls = period === 'closing' ? 'closing' : (period === 'daytime' ? 'daytime' : '');
  var out = '<div class="taskblock ' + cls + '"><div class="tb-head">' +
    '<span class="tb-time">' + esc(timeLabel) + '</span>' +
    '<span class="tb-title">' + esc(title) + '</span>' +
    '<span class="tb-prog">' + done + '/' + tasks.length + '</span></div>' +
    '<div class="taskbar"><i style="width:' + pct + '%"></i></div>' +
    '<div class="task-list">';
  out += tasks.map(function(t){
    var l = taskDone(t.id);
    var fb = taskFreqLabel(t), wb = taskWhoLabel(t);
    return '<button class="task-item' + (l?' done':'') + '" onclick="toggleTask(\'' + esc(t.id) + '\')">' +
      '<span class="tk-box">' + (l ? '✓' : '') + '</span>' +
      '<span class="tk-lb">' + esc(t.label) +
        (fb ? '<span class="tk-badge">' + esc(fb) + '</span>' : '') +
        (wb ? '<span class="tk-badge who">' + esc(wb) + '</span>' : '') + '</span>' + taskLinkBtn(t) +
      (l ? '<span class="tk-by">✓ ' + esc(doneStamp(t.id)) + '</span>' : '') + '</button>';
  }).join('');
  out += '</div></div>';
  return out;
}

/* ---------- the agenda grid (whole team, mirrors Front Desk) ---------- */
var PX_PER_MIN = 2, SLOT_H = 60;
function renderGrid() {
  var root = document.getElementById('timelineRoot'); if (!root) return;
  var isToday = currentDate === todayStr();
  var appts = (APPTS[currentDate] || []).slice();

  if (!appts.length) {
    /* v32.119: dia sem cliente e dia que NAO CARREGOU sao coisas diferentes. Antes as duas
       diziam a mesma coisa, e a Sana ficava batendo num botao que nunca ia responder. */
    var falhou = apptsReady && !APPTS_LOADED;
    root.innerHTML = '<div class="tl-wrap" style="--slot-h:' + SLOT_H + 'px"><div class="tl-empty">' +
      (falhou
        ? '<b>\u26A0 The day did not load.</b><span>It is the connection, not an empty diary.</span>' +
          '<button class="reloadbtn" onclick="retryDay()">\u21BB Try again</button>'
        : (apptsReady ? 'No bookings on this day.' : 'Loading the day\u2026')) +
      '</div></div>';
    return;
  }

  function endOf(a){ return a.end ? toMin(a.end) : (toMin(a.time) + (a.duration || 60)); }

  var minS = 9.5*60, maxE = 19.25*60;   /* agenda BSB: 09:30 as 19:15 */
  appts.forEach(function(a){
    var s = toMin(a.time), e = endOf(a);
    if (s < minS) minS = Math.max(8*60, Math.floor(s/30)*30);
    if (e > maxE) maxE = Math.min(21.5*60, Math.ceil(e/30)*30);
  });
  var dayBlocks = BLOCKS[currentDate] || [];
  dayBlocks.forEach(function(b){
    var s = toMin(b.time), dur = b.duration || 30;
    if (s === 0 && dur >= 1440) return;                  /* all-day block doesn't stretch the axis */
    var e = s + dur;
    if (s < minS) minS = Math.max(8*60, Math.floor(s/30)*30);
    if (e > maxE) maxE = Math.min(21.5*60, Math.ceil(e/30)*30);
  });
  var totalH = (maxE - minS) * PX_PER_MIN;

  /* v28: house cards must never sit under a booking. Morning goes in the free space
     before the day's first item; closing goes after the day's last one. */
  var firstStartAll = maxE, lastEndAll = minS;
  appts.forEach(function(a){ var s = toMin(a.time), e = endOf(a); if (s < firstStartAll) firstStartAll = s; if (e > lastEndAll) lastEndAll = e; });
  dayBlocks.forEach(function(b){
    var s = toMin(b.time), dur = b.duration || 30;
    if (s === 0 && dur >= 1440) return;
    if (s < firstStartAll) firstStartAll = s;
    if (s + dur > lastEndAll) lastEndAll = s + dur;
  });
  var mAvail = (firstStartAll - minS) * PX_PER_MIN - 6;
  var MORNING_H = mAvail >= 44 ? 44 : (mAvail >= 26 ? mAvail : 0);   /* 0 = no room, falls back to a header chip */
  var MORNING_TOP = Math.max(0, Math.min((9*60+45 - minS) * PX_PER_MIN, mAvail - MORNING_H));
  /* v32.119: o fechamento acompanha a hora que a casa fecha. Sabado e 17:15, nao 19:15,
     entao o card das tarefas de fechamento sobe junto. */
  var CLOSING_TOP = Math.max((closeHourFor(currentDate) - minS) * PX_PER_MIN, (lastEndAll - minS) * PX_PER_MIN + 6);
  if (isToday && tasksByPeriod('closing').length) totalH = Math.max(totalH, CLOSING_TOP + 50);

  /* coluna existe se ha cliente OU bloqueio/break (dia de ausencia/almoco nunca some da grade) */
  /* HIDE393 Ligia 29/10: "quando nao tiver ninguem agendado na agenda da pessoa, nao aparecer no screen".
     Coluna so aparece se a pessoa tem pelo menos 1 cliente no dia (bloqueio, almoco ou folga sozinhos nao contam). */
  var active = THERAPISTS.filter(function(t){
    return appts.some(function(a){ return a.therapist === t.key && a.client; });
  });
  var known = {}; THERAPISTS.forEach(function(t){ known[t.key] = 1; });
  var ROSTER_OK = { ligia:1, dania:1, anukis:1, sana:1, michelle:1, joana:1, aluana:1 };
  appts.forEach(function(a){
    if (a.therapist && !known[a.therapist]) {
      /* fora do time atual: coluna SO se houver cliente de verdade (agenda antiga do Salonized
         com bloqueio nao vira coluna fantasma; cliente real aparece de proposito, pra remarcar) */
      if (!ROSTER_OK[a.therapist] && !a.client) return;
      if (!ROSTER_OK[a.therapist] && !appts.some(function(x){ return x.therapist === a.therapist && x.client; })) return;
      known[a.therapist] = 1;
      active.push({ key: a.therapist, name: a.therapist.charAt(0).toUpperCase() + a.therapist.slice(1), role: ROSTER_OK[a.therapist] ? '' : '⚠ old calendar', color: '#5B47E0' });
    }
  });
  if (!active.length) { root.innerHTML = '<div class="tl-wrap"><div class="tl-empty-day">No bookings on this day.</div></div>'; return; }

  var gridCols = '64px ' + active.map(function(){ return 'minmax(150px,1fr)'; }).join(' ');
  var html = '<div class="tl-wrap" style="--slot-h:' + SLOT_H + 'px">';
  html += '<div class="tl-header" style="grid-template-columns:' + gridCols + '"><div class="col-time">Time</div>';
  active.forEach(function(t){
    var intentBtn = '';
    /* v37.0: "o training ainda ta la": no modo simples o cabecalho da coluna fica so com o nome.
       Sem o recado da Ligia, sem 🎓 training, sem ☀️ (tudo continua atras do ⚙ → modo simples OFF). */
    if (currentDate === todayStr() && !simpleOn()) {
      var ist = intentState(t.key);
      intentBtn = '<button class="dm-btn' + (ist.committed ? ' read' : '') + '" onclick="event.stopPropagation();openIntention(\'' + t.key + '\')" title="A message from Ligia">' +
        '<span class="dm-ring' + (ist.committed ? ' seen' : '') + '">' + ligiaAvSmall() + (ist.committed ? '' : '<span class="dm-dot">1</span>') + '</span>' +
        '<span class="dm-lab">' + (ist.committed ? (ist.face ? ist.face : '✓') : 'Ligia') + '</span></button>' +
        (function(){ var ts = trainState(t.key); var lab = ts.done ? '🎓 ✓' : (ts.phraseK ? '🎓 ✦' : '🎓');
          return '<button class="col-intent col-train" onclick="event.stopPropagation();openTraining(\'' + t.key + '\')" title="Daily training">' + lab + '</button>'; })() +
        (function(){   /* v28: no room on the agenda for the morning card, so it lives up here */
          if (MORNING_H > 0) return '';
          var cD = CHECK_ITEMS.filter(function(i){ return checkDone(i.k, t.key); }).length;
          var mL = tasksByPeriod('morning').filter(function(x){ return !taskDone(x.id); }).length;
          return '<button class="col-intent col-morning" onclick="event.stopPropagation();openMorning(\'' + t.key + '\')" title="Morning check">☀️ ' + cD + '/' + CHECK_ITEMS.length + (mL ? ' · 🧺' + mL : ' ✓') + '</button>';
        })();
    }
    html += '<div class="col-th"><div class="avatar" style="background:' + t.color + '">' + initials(t.name) + '</div>' +
      '<div><div class="nm">' + esc(t.name) + '</div>' + (t.role ? '<div class="rl">' + esc(t.role) + '</div>' : '') + intentBtn + '</div></div>';
  });
  html += '</div><div class="tl-body" style="grid-template-columns:' + gridCols + ';height:' + totalH + 'px">';

  html += '<div class="tl-time-col">';
  for (var m = minS; m < maxE; m += 30) {
    var hour = m % 60 === 0;
    var lbl = hour ? (String(Math.floor(m/60)).padStart(2,'0') + ':00') : (m === minS ? (String(Math.floor(m/60)).padStart(2,'0') + ':' + String(m%60).padStart(2,'0')) : '');
    html += '<div class="tl-time-slot' + (hour ? ' hour' : '') + '">' + lbl + '</div>';
  }
  html += '</div>';

  active.forEach(function(t){
    /* v32.119: a coluna se identifica, para o arraste saber para quem foi solto */
    html += '<div class="tl-col" data-thcol="' + esc(t.key) + '"><div class="grid-bg"></div>';
    /* v33.6: o card "Ready to start?" separado saiu; ele mora DENTRO do card de
       tasks la embaixo (um bloco so, compacto). Dois cards amarelos empilhados
       faziam a manha parecer ocupada, e isto e CONFIRMACAO, nao tarefa longa. */
    /* blocks: lunch / unavailable / absent (mirrors Front Desk) */
    (BLOCKS[currentDate] || []).filter(function(b){ return b.therapist === t.key; }).forEach(function(b){
      var s = toMin(b.time), dur = b.duration || 30;
      if (s === 0 && dur >= 1440) { s = minS; dur = maxE - minS; }
      var btop = (s - minS) * PX_PER_MIN, bh = Math.max(dur * PX_PER_MIN - 2, 16);
      var label = blockLabel(b.service, dur);
      html += '<div class="block" style="top:' + btop + 'px;height:' + bh + 'px">' + label + '</div>';
    });
    /* v32.119: o almoco que o app coloca sozinho, arrastavel */
    var ls = lunchSlotFor(t.key);   /* v36.2: o break delas fica, tambem no modo simples ("falta o break delas") */
    if (ls) {
      var ltop = (ls.start - minS) * PX_PER_MIN, lh = Math.max(ls.mins * PX_PER_MIN - 2, 16);
      html += '<div class="block lunch" style="top:' + ltop + 'px;height:' + lh + 'px" ' +
        'onmousedown="dragLunch(event,\'' + t.key + '\')" ontouchstart="dragLunch(event,\'' + t.key + '\')" ' +
        'title="Drag to move your lunch">\uD83C\uDF7D ' + fmtClock(ls.start) + '\u2013' + fmtClock(ls.start + ls.mins) +

    }
    /* v32.119: os PROJETOS dela, no primeiro vao livre. Pulam sozinhos se entrar cliente. */
    (simpleOn() ? [] : projectsFor(t.key)).forEach(function(pr){   /* v36.0 */
      var ps = projectSlotFor(t.key, pr.id, pr.slot_min || 30, pr.when_pref || 'anytime');
      if (!ps) return;
      var pct = Math.round(100 * (pr.done_min || 0) / Math.max(1, pr.total_min || 1));
      var ptop = (ps.start - minS) * PX_PER_MIN, ph = Math.max(ps.mins * PX_PER_MIN - 2, 22);
      html += '<div class="block proj" style="top:' + ptop + 'px;height:' + ph + 'px" ' +
        'onmousedown="dragProject(event,\'' + t.key + '\',\'' + esc(pr.id) + '\')" ' +
        'ontouchstart="dragProject(event,\'' + t.key + '\',\'' + esc(pr.id) + '\')" ' +
        'onclick="openProject(\'' + esc(pr.id) + '\')" title="' + esc(pr.title) + '">' +
        '<div class="pj-t">\uD83D\uDCCC ' + esc(pr.title) + '</div>' +
        '<div class="pj-b"><span style="width:' + pct + '%"></span></div>' +
        '<div class="pj-m">' + fmtClock(ps.start) + ' \u00b7 ' + ps.mins + 'min \u00b7 ' + pct + '%' +
          (ps.moved ? ' \u00b7 moved' : '') + '</div></div>';
    });
    var colAppts = appts.filter(function(a){ return a.therapist === t.key; });
    var laneItems = colAppts.map(function(a){ var s = toMin(a.time); return { a:a, s:s, e:endOf(a), lane:0, laneCount:1 }; })
      .sort(function(x,y){ return x.s - y.s || y.e - x.e; });
    laneItems = mergeShortParts(laneItems);   /* v35.21 */
    var grp = [], grpEnd = -1, laneEnds = [];

      for (var li=0; li<laneEnds.length; li++) if (laneEnds[li] <= it.s) { ln = li; break; }
      if (ln === -1) { ln = laneEnds.length; laneEnds.push(it.e); } else laneEnds[ln] = it.e;
      it.lane = ln; grp.push(it); grpEnd = grp.length === 1 ? it.e : Math.max(grpEnd, it.e);
    });
    closeGrp();
    /* daytime tasks: a soft block in this therapist's first free window (>= 40 min between clients).
       v35.7: o vao livre so olhava pros CLIENTES (laneItems) e ignorava bloqueio/almoco, entao a
       banda podia nascer bem em cima do "Jo Break" ou do almoco arrastavel. Agora entra tudo que
       ocupa a coluna (clientes + bloqueios do Salonized + o almoco que o proprio app desenha) antes
       de procurar o vao, e ainda assim ficou arrastavel (dentro do vao) pro caso de ela preferir
       ajustar na mao. */
    if (taskPerson(t.key) && !simpleOn() && tasksByPeriod('daytime').length) {   /* v36.0 */
      var occ = laneItems.map(function(it){ return { s: it.s, e: it.e }; })
        .concat((BLOCKS[currentDate] || []).filter(function(b){ return b.therapist === t.key; }).map(function(b){
          var bs = toMin(b.time); return { s: bs, e: bs + (b.duration || 30) };
        }));
      if (ls) occ.push({ s: ls.start, e: ls.start + ls.mins });
      /* v35.11: os projetos dela tambem ocupam a coluna (senao a faixa nascia debaixo do 📌) */
      projectsFor(t.key).forEach(function(pr){
        var ps = projectSlotFor(t.key, pr.id, pr.slot_min || 30, pr.when_pref || 'anytime');
        if (ps) occ.push({ s: ps.start, e: ps.start + ps.mins });
      });
      /* v35.11: 10 min bastam, e o vao pode ser antes da 1a cliente (das 10h) ou depois da ultima */
      var gap = findDaytimeGap(occ, Math.max(10 * 60, minS), Math.min(closeHourFor(currentDate), maxE));
      if (gap) {
        var dts = tasksByPeriod('daytime'); var dd = dts.filter(function(x){ return taskDone(x.id); }).length;
        var gapPx = (gap.e - gap.s) * PX_PER_MIN;
        var bandPxH = Math.max(14, Math.min(gapPx - 4, 40));   /* num vao de 10 min (20px) vira uma linha fina */
        var bandMin = bandPxH / PX_PER_MIN;
        var off = Math.max(0, Math.min(dayTaskOffsetFor(t.key), (gap.e - gap.s) - bandMin));
        var bandTop = (gap.s + off - minS) * PX_PER_MIN + 2;
        html += '<div class="block daytask' + (bandPxH < 24 ? ' tight' : '') + '" style="top:' + bandTop + 'px;height:' + bandPxH + 'px" ' +
          'onmousedown="dragDayTaskBand(event,\'' + t.key + '\',' + gap.s + ',' + gap.e + ',' + bandMin + ')" ' +
          'ontouchstart="dragDayTaskBand(event,\'' + t.key + '\',' + gap.s + ',' + gap.e + ',' + bandMin + ')" ' +
          'onclick="openTasks(\'daytime\')" title="Drag if it is in the way">🧺 Daytime tasks · ' + dd + '/' + dts.length + '</div>';

    }
    laneItems.forEach(function(it){ html += renderApptBlock(it, minS, isToday); });
    /* v32.119: opening card, no comeco da agenda, igual ao de fechamento no fim.

    if (isToday && taskPerson(t.key) && !simpleOn()) {   /* v36.0 */
      var opTasks = tasksByPeriod('morning');
      var cDone = CHECK_ITEMS.filter(function(i){ return checkDone(i.k, t.key); }).length;
      var lookOk = CHECK_ITEMS.length > 0 && cDone === CHECK_ITEMS.length;
      if (opTasks.length || CHECK_ITEMS.length) {

        var allOk = lookOk && opLeft === 0;
        /* v33.6: UM card so, de UMA linha, ancorado pelo pe na primeira cliente (ou nas
           10h): com 30px ele comeca ~09:45, como ela pediu. O clique abre o wizard que
           CONFIRMA a aparencia de cada uma e depois as tasks; e um toque-toque, e a

        /* v33.11: pedido dela (segunda vez, agora regra dura): o card mora AS 09:45,
           ALINHADO em todas as colunas, com espaco para ler. So encolhe se uma cliente

        var firstStart = null;
        laneItems.forEach(function(it){ if (firstStart === null || it.s < firstStart) firstStart = it.s; });

        var opBottom = (Math.min(firstStart === null ? 10 * 60 : firstStart, 10 * 60) - minS) * PX_PER_MIN - 2;
        var opH = Math.max(18, opBottom - opTop);
        if (taskHidden(t.key, 'morning')) { opTop = -9999; }   /* foi para outra coluna */
        var opLine = allOk ? '\u2728 Started \u2713'
          : '\u2600\uFE0F Ready to start? \u00b7 look ' + cDone + '/' + CHECK_ITEMS.length +
            (opTasks.length ? ' \u00b7 \uD83E\uDDFA ' + (opLeft || '\u2713') : '');
        html += '<div class="morning-card opening-card draggable tight' + (allOk ? ' ready' : '') + '" style="top:' + opTop + 'px;height:' + opH + 'px"' +
          ' onmousedown="dragTaskCard(event,\'' + t.key + '\',\'morning\')" ontouchstart="dragTaskCard(event,\'' + t.key + '\',\'morning\')"' +
          ' onclick="openMorning(\'' + t.key + '\')">' +

    }
    /* closing card, her end-of-day tasks, signed under her name (like the morning card) */
    if (isToday && taskPerson(t.key) && !simpleOn()) {   /* v36.0 */
      var clTasks = tasksByPeriod('closing');
      if (clTasks.length) {
        var clLeft = clTasks.filter(function(x){ return !taskDone(x.id); }).length;
        var clTop = CLOSING_TOP;
        var clH = Math.max((19*60+15 - 19*60) * PX_PER_MIN - 3, 44);
        var clSaved = taskPosFor(t.key, 'closing');
        if (clSaved != null) clTop = clSaved;
        if (taskHidden(t.key, 'closing')) { clTop = -9999; }   /* v32.119: foi para outra coluna */
        html += '<div class="morning-card closing-card draggable' + (clLeft===0 ? ' ready' : '') + '" style="top:' + clTop + 'px;height:' + clH + 'px"' +
          ' onmousedown="dragTaskCard(event,\'' + t.key + '\',\'closing\')" ontouchstart="dragTaskCard(event,\'' + t.key + '\',\'closing\')"' +
          ' onclick="openClosing(\'' + t.key + '\')">' +
          '<div class="mc-title">' + (clLeft===0 ? '🌙 Closed down' : '🌙 Closing tasks') + '</div>' +
          '<div class="mc-sub">' + (clLeft ? clLeft + ' task' + (clLeft>1?'s':'') + ' left' : 'all done ✓') + '</div></div>';

  html += '</div></div>';

/* a tappable band across the whole agenda for morning/closing house tasks */
function taskBand(period, atMin, minS) {
  var tasks = tasksByPeriod(period);
  if (!tasks.length) return '';
  var done = tasks.filter(function(t){ return taskDone(t.id); }).length;
  var meta = TASK_META[period];
  var top = (atMin - minS) * PX_PER_MIN;
  return '<div class="tband ' + period + '" style="top:' + top + 'px;grid-column:1/-1" onclick="openTasks(\'' + period + '\')">' +
    meta.icon + ' ' + esc(meta.title) + ' · ' + done + '/' + tasks.length +
    (done === tasks.length ? ' ✓' : '') + '<span class="tb-hint">tap to tick</span></div>';

/* v35.21: o auditor (com a agenda real do dia) pegou: 4 servicos curtos seguidos da mesma cliente
   (Underarms 5m, Lower Legs 15m, Brazilian 10m, Upper Lips 5m) viravam 4 tiras empilhadas, uma por
   cima da outra, com o nome escondido e o toque caindo na tira de baixo. Um bloco de 5 min tem 20px
   de altura minima e o de baixo comeca 10px depois. Agora partes CONSECUTIVAS da mesma cliente,
   na mesma coluna, em que alguma e curta (< 15 min) viram UM bloco so, do primeiro inicio ao
   ultimo fim, com os servicos listados. Abrir o bloco abre o mesmo cartao (o run ja agrupa). */
function mergeShortParts(items) {
  var out = [];
  items.forEach(function(it){
    var last = out[out.length - 1];
    /* "Delay", "Break", "X is not available" nao sao servico: ficam como estao, nunca entram na fusao */
    var filler = function(x){ return /^\s*(delay|break|lunch|jo break)\s*$|is (not available|absent)/i.test(String(x.service || '')); };
    var sameClient = last && last.a && it.a && !it.a.isBlock && !last.a.isBlock && !filler(it.a) && !filler(last.a) &&
      String(last.a.clientId || last.a.client || '').trim().toLowerCase() === String(it.a.clientId || it.a.client || '').trim().toLowerCase();
    var touching = sameClient && it.s <= last.e + 2;
    var short = touching && ((it.e - it.s) < 15 || (last.e - last.s) < 15);
    if (touching && (short || last.merged)) {
      last.merged = (last.merged || [last.a]).concat([it.a]);
      last.e = Math.max(last.e, it.e);
    } else out.push(it);
  });
  return out;
}
function renderApptBlock(it, minS, isToday) {  var a = it.a, cat = category(a), col = CAT_COLOR[cat] || CAT_COLOR.other;
  var dur = it.merged ? (it.e - it.s) : (a.duration || (it.e - it.s) || 60);
  /* v35.21: bloco fundido mostra os servicos das partes, curtos, na ordem */
  var svcLabel = a.service || '';
  if (it.merged) svcLabel = it.merged.map(function(x){ return String(x.service || '').split(' - ')[0].split(' \u2013 ')[0].trim(); })
    .filter(function(x, i, arr){ return x && arr.indexOf(x) === i; }).join(' + ');
  var top = (it.s - minS) * PX_PER_MIN;
  var h = Math.max(dur * PX_PER_MIN - 3, 20);
  /* v32.119: o card diz o estado, para ela nao precisar abrir para saber */
  var rsCard = runState(a);
  if (rsCard.phase === 'done') cls += ' st-done';
  else if (rsCard.phase === 'running') cls += ' st-live';
  /* v32.119: card curto (ate ~25 min) entra no modo compacto, senao o texto invade o
     agendamento de baixo. .tiny mostra so hora + nome, numa linha so. */
  if (h < 56) cls += ' tiny';
  if (h < 34) cls += ' micro';
  var laneStyle = it.laneCount > 1
    ? 'left:calc(' + (it.lane * 100 / it.laneCount) + '% + 4px);width:calc(' + (100 / it.laneCount) + '% - 8px);right:auto;'
    : '';
  var rs = runState(a);
  var hema = hasHema(a);
  var running = isToday && rs.phase === 'running';
  var cls = 'appt' + (rs.phase === 'done' ? ' done' : '') + (running ? ' live' : '') + (hema ? ' hema' : '') + (h < 44 ? ' tiny' : '');

  var tags = '';
  if (running) tags += '<span class="livedot"></span>';
  if (clientArrived(a)) tags += '<span class="tag arrived">✓ in</span>';
  var sl = sourceLabel(a); if (sl) tags += '<span class="tag src src-' + sl.toLowerCase() + '">' + sl + '</span>';
  var st = statusTag(a); if (st) tags += '<span class="tag st st-' + st.cls + '">' + (st.cls==='member'?'💎 ':'') + st.t + '</span>';
  if (langFor(a) === 'pt') tags += '<span class="tag pt">PT</span>';
  var beh = behaviourLabel(a); if (beh === 'Difficult') tags += '<span class="tag late">⚠ care</span>';
  if (clientLate(a)) tags += '<span class="tag late">⏰</span>';
  /* v37.5: amiga/parente marcada junto, com outra terapeuta */
  (function(){ var cs = companionsOf(a); if (cs.length) tags += '<span class="tag duo" title="Booked together, seat them side by side">\uD83D\uDC6F together \u00b7 ' + esc(cs.map(function(c){ var t = thByKey(c.therapist); return t ? t.name : c.therapist; }).join(' & ')) + '</span>'; })();
  safetyLabels(a).forEach(function(s){ tags += '<span class="tag ' + (s.warn?'hema':'patchok') + '">' + esc(s.t) + '</span>'; });
  if (needsPatchTest(a)) tags += '<span class="tag patch">🧪</span>';
  if (/soak.?off|removal|remove\b/i.test((a.service||'') + ' ' + (a.notes||''))) tags += '<span class="tag patch">💧 gel off</span>';
  if (hema) tags += '<span class="tag hema">HEMA</span>';
  else if (hasAllergy(a) && !safetyLabels(a).some(function(s){return s.k==='allergy';})) tags += '<span class="tag hema">allergy</span>';
  /* v33.17: quanto passou, em minutos, contra o tempo DEVIDO (owed) */
  var ovG = running ? (nowMin() - rs.owed) : 0;
  if (running) tags += '<span class="tag ' + (ovG >= 1 ? 'over' : 'run') + '">' + (ovG >= 1 ? '+' + ovG + 'm' : rs.mins + 'm') + '</span>';
  else if (rs.phase === 'done') tags += '<span class="tag done">✓</span>';

  var l1 = '<div class="l1"><span>' + esc(a.time || '') + '</span><span>· ' + dur + 'm</span>' + tags + '</div>';

  var body;
  if (h < 44) {
    body = '<div class="l2">' + esc(a.client || 'Guest') + ' <span style="color:' + col.tx + ';font-weight:400">· ' + esc(svcLabel) + '</span></div>';
  } else {
    body = '<div class="l2">' + esc(a.client || 'Guest') + '</div><div class="l3" style="color:' + col.tx + '">' + esc(svcLabel) + '</div>';
    if (h >= 74) {
      var chips = [];
      prefSummary(a, PREFS_CACHE[a.clientId], cat).forEach(function(txt){ chips.push('<span class="chip pref">' + esc(txt) + '</span>'); });
      if (instantAddons(a).length) chips.push('<span class="chip addon">+ ' + esc(instantAddons(a)[0]) + '</span>');
      var bIso = knownBirthday(a), bAway = bIso ? bdayDaysAway(bIso) : null;
      if (bAway !== null && (bAway <= BDAY_WINDOW || bAway >= 365 - BDAY_WINDOW)) chips.push('<span class="chip bday">\uD83C\uDF82 ' + (bAway === 0 ? 'today' : (bAway <= BDAY_WINDOW ? 'in ' + bAway + 'd' : (365 - bAway) + 'd ago')) + '</span>');
      var handoff = nextHandoff(a);
      if (handoff) { var hn = thByKey(handoff.therapist); var hname = hn ? hn.name : (handoff.therapist || 'another'); chips.push('<span class="chip handoff">↔ ' + esc(hname) + ' ' + fmtClock(toMin(handoff.time)) + '</span>'); }
      if (chips.length) body += '<div class="l4">' + chips.join('') + '</div>';
    }
    if (h >= 96) {
      var bits = [];
      var lv = lastVisitInfo(a);
      if (lv) bits.push('↻ ' + lv.days + 'd ago · ' + lv.count + ' visits');
      var cn = cleanNotes(a);
      if (cn && !isImportantNote(a)) bits.push('📝 ' + cn);
      if (bits.length) body += '<div class="l5">' + esc(bits.join(' · ')) + '</div>';
      if (cn && isImportantNote(a)) body += '<div class="l5 note-important">⚠ ' + esc(cn) + '</div>';
    }
  }

  /* Run, visible on the card (today), doesn't open the modal */
  /* v31.8: a agenda mostra o ESTADO, nao comanda o atendimento. O Start saiu daqui:
     o run comeca dentro da cliente, onde ela tem o recado da Ligia na frente. */
  var run = '';
  if (isToday && h >= 56) {
    if (rs.phase === 'running') { var ovM = nowMin() - rs.owed; run = '<span class="run-mini running">\u25CF ' + (ovM >= 1 ? '+' + ovM + 'm' : rs.mins + 'm') + '</span>'; }
    else if (rs.phase === 'done') run = '<span class="run-mini done">\u2713 done</span>';
  }

  /* v32.11: pisca na cor da terapeuta quando ja passou da hora e o run nao comecou.
     Para sozinho no instante em que ela aperta Start. */
  var thc = (thByKey(a.therapist) || {}).color || 'var(--accent)';
  var due = blinkOn() && isToday && !a.isBlock && rs.phase === 'idle' && nowMin() >= toMin(a.time);
  if (due) cls += ' due-blink';
  return '<div class="' + cls + '" style="top:' + top + 'px;height:' + h + 'px;' + laneStyle +
    'background:' + col.bg + ';border-color:' + col.bd + ';--thc:' + thc + '" onclick="openClient(\'' + esc(a.id) + '\')"' +
    ' onmouseenter="showTip(event,\'' + esc(a.id) + '\')" onmousemove="moveTip(event)" onmouseleave="hideTip()">' + l1 + body + run + '</div>';
}

/* ---------- hover quick-look (desktop); iPad taps straight to the modal ---------- */
/* v35.18: on the iPad a tap fires mouseenter BEFORE click and mouseleave never comes, so the
   dark quick-look box opened under her finger and stayed stuck on screen (Ligia: "o hover do
   app fica travado na tela"). The quick-look is now desktop-only: it needs a real pointer and

  catch (e) { return true; }
}

document.addEventListener('pointerdown', function (e) { if (e.pointerType && e.pointerType !== 'mouse') { LAST_TOUCH_AT = Date.now(); hideTip(); } }, { passive: true, capture: true });
function showTip(ev, id) {

  var a = findAppt(id); if (!a) return;
  var tt = document.getElementById('tooltip'); if (!tt) return;
  var lv = lastVisitInfo(a), cat = category(a);

  html += '<div class="tt-row"><b>' + esc(a.time || '') + '</b> · ' + (a.duration || 60) + 'm · ' + esc(a.service || '') + '</div>';
  var th = thByKey(a.therapist);
  html += '<div class="tt-row">' + esc(th ? th.name : (a.therapist || '')) + (sourceName(a) ? ' · ' + esc(sourceName(a)) : '') + '</div>';
  html += '<div class="tt-row">' + (lv ? '<b>' + lv.count + '</b> visits · last <b>' + lv.days + 'd ago</b>' : '<b>First visit</b>') +
    (clientArrived(a) ? ' · ✓ arrived ' + esc(a.checkIn) : '') + '</div>';
  if (langFor(a) === 'pt') html += '<div class="tt-row">🇧🇷 speaks Portuguese</div>';
  var beh = behaviourLabel(a); if (beh) html += '<div class="tt-row">🙂 ' + esc(beh) + '</div>';
  var dr = favDrink(a); if (dr) html += '<div class="tt-row">☕ ' + esc(dr) + '</div>';
  var ps = prefSummary(a, PREFS_CACHE[a.clientId], cat);
  if (ps.length) html += '<div class="tt-row">✦ ' + esc(ps.join(' · ')) + '</div>';
  var warn = [];
  if (hasHema(a)) warn.push('🚨 HEMA-free only'); else if (hasAllergy(a)) warn.push('🚨 allergy on file');
  if (labelsFor(a).pregnant) warn.push('🤰 pregnant');
  if (needsPatchTest(a)) warn.push('🧪 patch test?');

function levelFor(points) {
  var cur = RUN_LEVELS.length ? RUN_LEVELS[0] : null, next = null;

  if (d < 30)  { var w = Math.round(d / 7); return '**' + w + (w === 1 ? ' week' : ' weeks') + ' ago**'; }
  if (d < 365) { var m = Math.max(1, Math.round(d / 30)); return '**' + m + (m === 1 ? ' month' : ' months') + ' ago**'; }
  var y = Math.floor(d / 365), rm = Math.round((d % 365) / 30);

        : '\uD83D\uDCBE Save what ' + esc(who) + ' likes \u00b7 ' + esc(svcLbl)) + '</span>' +
      '<span class="bonus-p">' + (gotP ? '\u2713' : '') + '</span>' +
      '<span class="bonus-s">' + (gotP
        ? 'Thank you. Next time starts from what you wrote.'
        : 'While it is fresh \u00b7 next time starts from what you write.') + '</span></summary>' +   /* v33.13: 1 linha */
      '<div class="wz-embed">' + buildCategoryFieldsAll(a) + '</div></details>';
    return shell('done', '\u2B50 ' + who, medal + bonus + dayDoneHtml(a) +
      '<div class="run-sub"><button class="run-more" onclick="reopenRun(\'' + esc(a.id) + '\')">reopen the run</button></div>', null);
  }

  /* ---- 3 - check out ---- */
  /* (tratado no topo da funcao, em wrapOpen) */

  /* ---- o CHECK OUT, agora pelo shell como todos os outros ---- */
  if (wrapOpen[a.id]) {
    return shell('wrap', '\u2713 ' + esc(firstName(a.client) || 'your client'),
      alerts + buildWrapUp(a), null);
  }

  /* ---- 2 - o run: so a conversa e o botao de terminar ---- */
  /* v32.119: com o run comecado, QUALQUER estagio que nao seja o check out cai aqui.
     Antes so 'run' e vazio casavam, e um 'plan' guardado do iPad travava a menina. */
  if (rs.phase === 'running') {
    return shell('run', '\u25CF ' + who,
      (typeof runPlanHtml==='function' ? runPlanHtml(a) : '') + alerts +
      /* v32.119: ela pediu para tirar "She is with you. Nothing to tap here / Press Finish...".
         Nao dizia nada que ela nao soubesse. runNowHtml (o que fazer AGORA) fica. */
      /*CLEANRUN171*/
      /* v33.13: o aftercare se DIZ no fim do tratamento, maos ainda na cliente. Entao o
         clipe mora AQUI, em cima do Finish, nao no Before. Cada momento com o que e seu. */
      /* v36.7: "isso pode tirar": o clipe de aftercare e as frases prontas sairam do run */
      timer +
      /* v32.119: o desfazer e excecao — vive no fim, discreto */
      '<div class="run-undo"><button onclick="undoStart(\'' + esc(a.id) + '\')">\u2039 Started by mistake? Undo</button></div>',
      null);
  }

  /* v33: as telas intermediarias (plano e mensagem separadas) ja tinham sido fundidas
     na tela unica; os blocos if(false) que sobraram sairam de vez. */

  /* ---- 0 - o START: e este toque que marca a hora que ela pegou a cliente ---- */
  var due = toMin(a.time);
  var lateNow = (currentDate === todayStr()) ? Math.max(0, nowMin() - due) : 0;
  var lateLine = (currentDate !== todayStr())
    ? '<div class="st-sub">Booked for <b>' + fmtClock(due) + '</b>.</div>'
    : (elsewhereNow(a)
        ? (function(e){
            return '<div class="st-sub here">\u2713 <b>' + esc(who) + ' is already in the salon</b>, with <b>' +
              esc(e.who) + '</b> right now' + (e.end != null ? ' \u00b7 until about <b>' + fmtClock(e.end) + '</b>' : '') +
              '.<span>Not late, still with ' + esc(firstName(e.who) || e.who) + '. Start when ' + esc(who) + ' comes to you.</span></div>';
          })(elsewhereNow(a))
      : lateNow > 45
        /* v33.5: atraso absurdo nao ganha grito vermelho nem conselho de recuperar */
        ? '<div class="st-sub">' + esc(who) + ' was due at <b>' + fmtClock(due) + '</b>, a good while ago. Check with Joana before you start.</div>'
      : lateNow >= 5
        ? '<div class="st-sub late">'        : '<div class="st-sub ok">' + esc(who) + ' is due at <b>' + fmtClock(due) + '</b>. \uD83D\uDC4F Right on time.</div>');
  /* ---- v32.119: UMA TELA SO, o "antes". Regra dela: orientacao antes, registro depois,
     nada no meio. Eram tres toques com a cliente esperando na recepcao. ---- */
  var endB = toMin(a.time) + slotMinsFor(a);
  var mineB = (APPTS[currentDate] || []).filter(function(x){
    return x.therapist === a.therapist && !x.isBlock && toMin(x.time) >= endB &&
           (x.clientId || x.client) !== (a.clientId || a.client);
  }).sort(function(x, y){ return toMin(x.time) - toMin(y.time); });
  var nextB = mineB[0] || null;
  var gapB = nextB ? (toMin(nextB.time) - endB) : null;
  var gapLineB = nextB
    ? '<div class="planend-s embed"><b>Next client</b> at <b>' + fmtClock(toMin(nextB.time)) + '</b>' +
      (gapB >= 15 ? ', so you have <b>' + gapB + ' min</b> in between. Room for an extra.'
       : (gapB > 0 ? ', only <b>' + gapB + ' min</b> in between, so keep to the time.'
                   : ', back to back. Finish on the dot.')) + '</div>'
    : '<div class="planend-s embed">No one after ' + esc(who) + ', so you can take your time.</div>';
  return shell('start', '',
    alerts + formFlagsHtml(a) +                     /* v33.1: excecoes juntas, no topo */
    sealHtml(a) +                                   /* QUEM ela e \u00b7 toque abre a historia */
    /* v36.6: a nota da Ligia saiu do cartao ("aquela mensagem minha da cliente nao quero mais") */
    runPlanHtml(a, gapLineB) +                      /* O QUE \u00b7 a ficha no icone do servico */
    upgradeBlockHtml(a, gapB) +                     /* v33.8: a oportunidade COLADA no servico:
                                                       o "room for an extra" emenda na oferta */
    knownPrefsHtml(a) +                             /* v33.13: so aparece quando JA tem conteudo */
    '<div class="startbox">' + lateLine +
      '<div class="st-note">Tap when you go to get ' + esc(who) + '.</div></div>' +
    /* v36.6: sem promessa no botao ("no botao inicial ainda aparece treat like princess"): so Start */
    '<button class="run-btn big start" onclick="startRun(\'' + esc(a.id) + '\')">\u25B6 Start with ' + esc(who) + '</button>', null);
}

function buildRunControls(a) {

    btn = '<button class="run-btn big start" onclick="startRun(\'' + esc(a.id) + '\')">\u25B6 Start</button>';
    if (rs.due) btn += '<div class="run-sub"><button class="run-more" onclick="openWrapUp(\'' + esc(a.id) + '\')">already done? go straight to check out</button></div>';
  }
  else if (rs.phase === 'running') {
    /* v31.14: o que interessa nao e "passou do horario", e se a cliente RECEBEU o

    /* v32.119: ela quer ver a hora que COMECOU e a hora que TERMINA, nao so a duracao */
    var r0 = runFor(a);
    var startedAt = (r0 && r0.start != null) ? fmtClock(r0.start) : '';
    /* v32.119: UM numero, o que muda a acao dela: a que horas termina. O resto era ruido
       no meio do atendimento, com as maos ocupadas. */
    /* v33.17: pedido dela ("ja tenha um: vc esta atrasada 1m 2m 3 5 ou 10"),
       principalmente na massagem, onde ninguem olha relogio. O dono do tempo e o
       rs.owed (o tratamento INTEIRO da cliente, mesmo comecando atrasada): reta
       final avisa "N min left", passou vira "N min over", ambar ate 4, vermelho de 5. */
    var lateBy = (currentDate === todayStr()) ? (nowMin() - rs.owed) : -999;
    var tail0 = ' her time ends <b>' + fmtClock(rs.owed) + '</b>' +
      (startedAt ? ' \u00b7 started ' + startedAt : '');
    var owedTxt;
    if (lateBy >= 1) {
      owedTxt = '<span class="overchip' + (lateBy >= 5 ? ' hard' : '') + '">\u23F1 ' + lateBy + ' min over</span>' + tail0;
    } else if (lateBy >= -10) {
      owedTxt = '<span class="leftchip">\u23F1 ' + (-lateBy) + ' min left</span>' + tail0;
    } else {
      owedTxt = '';
    }
    /* v33.5: o "Ends at" e O numero da sala e ficava atras do botao fixo */
    btn = (owedTxt ? '<div class="run-sub above">' + owedTxt + '</div>' : '') +
      '<button class="run-btn big finish" onclick="openWrapUp(\'' + esc(a.id) + '\')">\u2713 Finish</button>';
  } else if (rs.phase === 'done') {
    var qsC = wrapQuestions(a);
    var doneC = qsC.filter(function(q){ return wizVal(a.id, q.k) === true; }).length;
    btn = '<span class="run-status">\u2713 finished \u00b7 ' + doneC + '/' + qsC.length + ' done</span><button class="mini-btn" onclick="reopenRun(\'' + esc(a.id) + '\')">reopen</button>';
  }
  var phrase = '';
  if (rs.phase === 'running' && rs.startedLate >= 5) {
    var first0 = firstName(a.client) || 'her';
    /* A MICHELLE entrega o tempo cheio: facial e massagem nao se cortam. As outras
       RECUPERAM dentro do tempo de arrumacao da sala, que e o que a casa reserva. */
    /* so da para recuperar dentro do tempo de arrumacao da sala. Passou disso, nao e
       recuperavel: a cliente recebe o tempo dela e a recepcao e avisada. */
    var canRecover = (a.therapist !== 'michelle') && rs.clean > 0 && rs.startedLate <= rs.clean;
    if (!canRecover) {
      phrase = '<div class="late-phrase">You started ' + rs.startedLate + ' min late. ' + esc(first0) +
        ' still gets the full <b>' + rs.treat + ' min</b>, to <b>' + fmtClock(rs.owed) + '</b>.' +
        (rs.behind > 0
          ? ' That puts you about <b>' + rs.behind + ' min</b> behind, so tell the desk now and Joana looks after the next one: <i>\u201cAlmost done, she\u2019ll be worth the wait, I\u2019ll be right with her.\u201d</i>'
          : ' There is room after ' + esc(first0) + ', so no rush.') +
        '</div>';
    } else {
      phrase = '<div class="late-phrase">You started <b>' + rs.startedLate + ' min</b> late, so pull it back' +
        (rs.clean ? ', you have <b>' + rs.clean + ' min</b> of tidy-up time to use' : '') +
        '. Aim to finish by <b>' + fmtClock(toMin(a.time) + rs.treat) + '</b>, the same as always, so the next client is not paying for it.' +
        '</div>';
    }
  } else if (rs.phase === 'running' && rs.behind > 0 && nowMin() > rs.owed) {
    phrase = '<div class="late-phrase">Her treatment time is up and the next client is at ' + fmtClock(rs.nextStart) +
      '. A warm line for the desk: <i>\u201cAlmost done, she\u2019ll be worth the wait, I\u2019ll be right with her.\u201d</i></div>';
  }
  return '<div class="run-controls">' + btn + '</div>' + phrase;
}
/* v32.119: era a ultima cliente do dia dela? So conta as que ainda nao terminaram. */

/* recent visits, read-only history (service · therapist), never prices/deposits */
function buildHistory(a) {
  var h = historyFor(a);
  if (!h.length) {
    if (isNewClient(a)) return accWrap('↻ Recent visits', '', '<div class="pf-readonly">First visit with us, a chance to make a lovely first impression.</div>', false);
    return '';
  }
  /* v29: uma VISITA = um dia, a mesma regra do lastVisitInfo. Antes aqui contava LINHA de
     servico, entao a mesma cliente lia "visita 21" na nota e "76" neste cabecalho. */
  var byDay = {}, days = [];
  h.forEach(function(r){
    if (!r.date) return;
    if (!byDay[r.date]) { byDay[r.date] = []; days.push(r.date); }
    byDay[r.date].push(r);
  });
  if (!days.length) return '';
  var rows = days.slice(0, 8).map(function(d){
    var list = byDay[d], whos = [], svc = [];
    list.forEach(function(r){
      var th = thByKey(canonTh(r.therapist)); var w = th ? th.name : (r.therapist || '');
      if (w && whos.indexOf(w) === -1) whos.push(w);
      if (r.service) svc.push(r.service);
    });
    return '<div class="hist-row"><span class="hd">' + esc(fmtShort(d)) + '</span>' +
      '<span class="hs">' + esc(svc.join(' · ')) + '</span>' +
      (whos.length ? '<span class="hw">' + esc(whos.join(' & ')) + '</span>' : '') + '</div>';
  }).join('');
  if (days.length > 8) rows += '<div class="hist-more">+ ' + (days.length - 8) + ' earlier visits</div>';
  return accWrap('↻ Recent visits · ' + days.length, 'Today is her ' + ordEn(days.length + 1) + ' visit. One day with us counts as one visit, however many services.',
    '<div class="hist-list">' + rows + '</div>', false);
}

/* field builders ---------------------------------------------------- */
function grp(cat) { draftPrefs[cat] = draftPrefs[cat] || {}; return draftPrefs[cat]; }

function chipRow(cat, field, options, opts) {
  opts = opts || {};
  var g = grp(cat);
  var cur = g[field];
  var formHint = (!cur && !opts.multi) ? formValueFor(cat, field).toLowerCase() : '';
  var multi = !!opts.multi;
  var extra = opts.chipClass ? ' ' + opts.chipClass : '';
  return '<div class="pf-chips">' + options.map(function(o){
    var val = (typeof o === 'object') ? o.v : o;
    var lb = (typeof o === 'object') ? o.l : o;
    var on = multi ? (Array.isArray(cur) && cur.indexOf(val) !== -1) : (cur === val);
    var vl = String(val).toLowerCase();
    var sug = (!on && formHint && (formHint === vl || formHint.indexOf(vl) === 0 || vl.indexOf(formHint) === 0));
    return '<button class="pf-chip' + extra + (on?' on':'') + (sug?' pf-sug':'') + '" onclick="toggleChip(\'' + cat + '\',\'' + field + '\',\'' + esc(val).replace(/'/g,"\\'") + '\',' + multi + ')">' + esc(lb) + (sug?' \u00b7 from form':'') + '</button>';
  }).join('') + '</div>';
}
function toggleChip(cat, field, val, multi) {
  var g = grp(cat);
  if (multi) {
    g[field] = Array.isArray(g[field]) ? g[field] : [];
    var idx = g[field].indexOf(val);
    if (idx === -1) g[field].push(val); else g[field].splice(idx, 1);
  } else {
    g[field] = (g[field] === val) ? null : val;
  }
  /* HEMA toggles the red banner live */
  if (cat === 'nails' && field === 'hema') {}
  touchPersonalise();
  var a = findAppt(modalApptId); if (a) renderModal(a);
}
function toggleFlag(cat, field) {
  var g = grp(cat); g[field] = !g[field];
  var a = findAppt(modalApptId); if (a) renderModal(a);
}
/* v35.1: cada campo do cartao aceita VARIOS nomes de form (codigo curto E pergunta por extenso).
   Ha dois formatos de ficha no sistema e a Michelle precisa ver os dois. */
var FORM_FIELD_MAP = {
  'massage.pressure':   ['pressure', 'How do you like the pressure?'],
  'massage.focus':      ['focus_areas', 'Which areas would you like us to focus on?'],
  'massage.avoidareas': ['avoid'],
  'massage.aroma':      ['aroma', 'Which aroma would you like for your oil?'],
  'massage.music':      ['music', 'What would you like to listen to?'],
  'massage.oilallergy': ['allergies_details', 'Any allergies, including to products or plasters?'],
  'massage.conditions': ['conditions_inj_details', 'Any pain, injury or recent surgery?', 'Anything you would like us to know?'],
  'skin.skintype':      ['skin_type', 'How does your skin usually behave?'],
  'skin.conditions':    ['Any medical conditions we should know about?'],
  'skin.allergies':     ['Any allergies, including to products or plasters?']
};
function formValueFor(cat, field) {
  try {
    var a = modalApptId ? findAppt(modalApptId) : null; if (!a) return '';
    var keys = FORM_FIELD_MAP[cat + '.' + field]; if (!keys) return '';
    if (typeof keys === 'string') keys = [keys];
    var f = latestFilledFormOf(a, runFormKinds(a)); if (!f || !f.answers) return '';
    for (var i=0;i<keys.length;i++){
      var v = f.answers[keys[i]];
      if (v == null || v === '') continue;
      if (Array.isArray(v)) v = v.join(', ');
      v = String(v).trim();
      if (/^(no|n\/a|none|no allergies)$/i.test(v)) continue;
      return v;
    }
    return '';
  } catch(e){ return ''; }
}
function textField(cat, field, placeholder, big) {
  var g = grp(cat); var raw = g[field] || '';
  var fromForm = raw ? '' : formValueFor(cat, field);
  var v = esc(raw);
  var badge = fromForm ? '<span class="pf-fromform" onclick="acceptFormVal(\'' + cat + '\',\'' + field + '\',this)">' + esc(fromForm) + ' <i>from her form \u00b7 tap to keep</i></span>' : '';
  if (big) return '<textarea class="pf-input" placeholder="' + esc(placeholder) + '" oninput="setText(\'' + cat + '\',\'' + field + '\',this.value)">' + v + '</textarea>' + badge;
  return '<input class="pf-input" placeholder="' + esc(placeholder) + '" value="' + v + '" oninput="setText(\'' + cat + '\',\'' + field + '\',this.value)">' + badge;
}
function acceptFormVal(cat, field, el) {
  grp(cat)[field] = el.textContent.replace(/\s*from her form.*$/,'').trim();
  touchPersonalise();
  var a = findAppt(modalApptId); if (a) renderModal(a);
}
function setText(cat, field, val) { grp(cat)[field] = val; touchPersonalise(); }
/* qualquer toque de verdade na ficha (chip ou texto) conta como personalizar */
function touchPersonalise() {
  try {
    var a = modalApptId ? findAppt(modalApptId) : null;
    if (a && a.clientId) markPersonalised(a.clientId);

}

/* v28: the drink picker lived here. Setting it is Joana's job; the therapist reads it
   in the client brief and in the welcome line of the run. */
/* v31.3: a cliente que faz Hollywood + pedicure com a mesma menina precisa das DUAS
   fichas abertas. Antes so a primeira categoria aparecia e a outra sumia. */
function buildCategoryFieldsAll(a) {
  var cats = runCategories(a);
  var seen = {}, out = '';
  cats.forEach(function(c){ if (seen[c]) return; seen[c] = 1; out += buildCategoryFields(a, c); });
  return out;
}

function buildCategoryFields(a, cat) {
  var out;
  if (cat === 'nails') out = nailsFields(a);
  else if (cat === 'waxing') out = waxFields(a);
  else if (cat === 'brows') out = browFields(a);
  else if (cat === 'skin') out = skinFields(a);
  else if (cat === 'massage') out = massageFields(a);
  else out = group('Treatment notes', 'Anything that makes this service better for her.',
    fld('Notes', textField('other', 'notes', 'e.g. prefers a quiet room, sensitive to strong scents', true)));
  /* drink only where we serve it: the nail chair (Joana's rule: waxing/brows/massage/room, no) */
  return out;

/* v37.0: "quero o hand e a personalizacao e o feet a personalizacao separado, mao e pe e diferente;
   se ela tem pe aparece o pe, se tem mao aparece mao; e poe naked pra quando nao pinta".
   A ficha guarda hands e feet em separado (draftPrefs.hands / draftPrefs.feet). O que e da PESSOA
   (HEMA) fica em nails.hema, compartilhado. Fichas antigas (nails.shape etc.) viram hands na primeira
   abertura, e nails.pedilevel vira feet.hardskin, sem apagar nada. */
function nailPartsFor(a) {
  var txt = (runParts(a).map(function(x){ return x.service || ''; }).join(' ') + ' ' + (a.service || '')).toLowerCase();
  var feet = /pedi|\bfeet\b|\bfoot\b|\btoe/.test(txt);
  var hands = /mani|\bhand|biab|builder|gel\b|shellac|acryl|infill|overlay|nail art|chrome|cat eye|french|removal|soak/.test(txt);
  if (!feet && !hands) hands = true;
  var out = []; if (hands) out.push('hands'); if (feet) out.push('feet');
  return out;
}
function seedLegacyNails(P) {
  try {
    if (!P) return P;
    var n = P.nails || {};

/* ---------- v31.2: a massagem e um RITUAL, e a cliente ja nos disse como ela quer ----------
   O formulario de massagem traz aroma, musica, pressao, couro cabeludo, areas de foco e o que
   evitar. Isso e ouro de atendimento: e o quarto pronto ANTES dela deitar. Aqui juntamos o que
   a terapeuta anotou (prefs, mais recente) com o que a propria cliente escolheu na ficha. */
function mAns(v) {
  if (v == null) return '';
  if (Array.isArray(v)) v = v.filter(Boolean).join(', ');
  var s = String(v).trim();
  if (!s) return '';
  if (/^(n\/?a|na|none|no|nao|n\u00e3o|nothing|nenhum[ao]?|-|\.)$/i.test(s)) return '';
  return s;
}
/* A fabrica nova grava a PERGUNTA como chave ("How do you like the pressure?").
   Procurar por 'pressure' exato nao acha nada, e era por isso que a nota dizia
   "we do not have her form yet" com a ficha preenchida logo abaixo na mesma tela. */
function ansFind(ans, re) {
  var keys = Object.keys(ans || {});
  for (var i = 0; i < keys.length; i++) {
    if (re.test(keys[i])) { var v = mAns(ans[keys[i]]); if (v) return v; }
  }
  return '';
}
function ansYes(ans, re) {
  var keys = Object.keys(ans || {});
  for (var i = 0; i < keys.length; i++) {
    if (re.test(keys[i]) && /^yes\b/i.test(String(ans[keys[i]] || '').trim())) return String(ans[keys[i]]).trim();
  }
  return '';
}
function massageBrief(a) {
  var p = (PREFS_CACHE[a && a.clientId] || {}).massage || {};
  var f = latestFilledFormOf(a, FORM_KIND.massage);
  var ans = (f && f.answers) || {};
  var b = {
    aroma:    mAns(p.aroma) || mAns(ans.aroma) || ansFind(ans, /aroma|scent|fragran/i),
    pressure: mAns(p.pressure) || mAns(ans.pressure) || ansFind(ans, /pressure/i),
    focus:    mAns(p.focus) || mAns(ans.focus_areas) || ansFind(ans, /focus|areas would you like/i),
    avoid:    mAns(p.avoidareas) || mAns(ans.avoid) || ansFind(ans, /avoid/i),
    wants:    ansFind(ans, /would like us to know|your goals|what brings you|expect/i),
    type:     mAns(ans.massage_type) || ansFind(ans, /type of massage/i),
    temp:     mAns(p.temp),
    scalp:    /^yes/i.test(String(ans.scalp || '') || ansFind(ans, /scalp/i)),
    silence:  p.music === 'silence',
    music:    '',
    allergy:  '',
    cautions: [],
    fromForm: !!f
  };
  /* musica: o "silencio" que a terapeuta anotou manda; senao o genero que a cliente escolheu */
  if (!b.silence) b.music = mAns(ans.music) || ansFind(ans, /music/i) || (p.music === 'relaxing' ? 'relaxing' : '');
  /* alergia de oleo: nunca deixar passar */
  var al = mAns(p.oilallergy) || mAns(ans.allergies_details) ||
           (/^no allergies?$/i.test(String(ans.allergies || '')) ? '' : mAns(ans.allergies)) ||
           ansYes(ans, /allerg/i);
  b.allergy = al;
  /* cuidados clinicos que mudam a mao dela */
  if (mAns(p.conditions)) b.cautions.push(mAns(p.conditions));
  if (mAns(ans.conditions_inj_details)) b.cautions.push(mAns(ans.conditions_inj_details));
  if (mAns(ans.pain_details)) b.cautions.push(mAns(ans.pain_details));
  if (/^yes$/i.test(String(ans.pregnant_postpartum || '')) || ansYes(ans, /pregnan|breastfeed/i)) b.cautions.push('pregnant or postpartum');
  /* medicacao e condicao vindas por pergunta: entram como cuidado, nao somem */
  var med = ansYes(ans, /medicat/i);       if (med) b.cautions.push(med);
  var cnd = ansYes(ans, /medical condition|blood pressure|circulation|clotting|vein/i); if (cnd) b.cautions.push(cnd);
  var pin = ansYes(ans, /pain|injur|surger/i); if (pin) b.cautions.push(pin);
  if (mAns(ans.surgery_details)) b.cautions.push(mAns(ans.surgery_details));
  return b;
}

/* consultation-form values: prefs first, then her latest filled form of the right kind */
function fromConsult(a, key) {
  var p = PREFS_CACHE[a.clientId];
  if (p && p.consult && p.consult[key]) return p.consult[key];
  var KIND_FOR = { skinType: FORM_KIND.skin, massageNotes: FORM_KIND.massage };
  var f = latestFilledFormOf(a, KIND_FOR[key] || runFormKinds(a));
  if (f && f.answers) {
    if (f.answers[key]) return f.answers[key];
    var alt = { skinType:'skin_type', massageNotes:'focus_areas' }[key];
    if (alt && f.answers[alt]) return f.answers[alt];
  }
  return '';
}

/* ---------- consultation forms quick view (Joana's forms feed this dash) ---------- */
/* v32.119: quais servicos EXIGEM ficha preenchida. Patch test entra na lista de tipos que
   o app sabe LER, mas nao faz unhas e depilacao exigirem ficha. */
function formRequired(a) {
  if (hasCat(a, 'skin') || hasCat(a, 'massage')) return true;
  return /lash|lamination|tint|henna|profhilo|peel|meso/i.test(runServiceText(a) || '');
}
var FORM_KIND = {
  skin:    ['facial','chemical_peel','mesotherapy','profhilo'],
  massage: ['massage','pregnancy_massage','body_scrub'],
  brows:   ['lash','lash_lift','lash_extensions','brow_lamination','patch_test','tint'],
  waxing:  ['waxing','patch_test'],
  nails:   ['patch_test']
};
function runFormKinds(a) {
  /* v31.3: um run de massagem + facial precisa das fichas das DUAS coisas */
  var out = [];
  runCategories(a).forEach(function(c){
    (FORM_KIND[c] || []).forEach(function(k){ if (out.indexOf(k) < 0) out.push(k); });
  });
  return out.length ? out : null;
}
/* todas as fichas desta visita: pelo agendamento (inclusive as partes do dia) e pela cliente */
function formsFor(a) {
  var out = [], seen = {};
  /* marca as que vieram pelo AGENDAMENTO: essas nunca sao filtradas por categoria */
  /* nem toda ficha vem com id; sem uma chave de reserva o dedup engolia todas menos a primeira */
  var keyOf = function(f){ return f.id || [f.form_type, f.appt_id, f.client_id, f.filled_at, f.status].join('|'); };
  var push = function(f){ if (!f) return; var k = keyOf(f); if (!seen[k]) { seen[k] = 1; out.push(f); } };
  runParts(a).forEach(function(x){
    [x.id, x.ext_id, x.appt_id].forEach(function(k){
      if (k) (FORMS_BY_APPT[k] || []).forEach(function(f){ f._direct = true; push(f); });
    });
  });
  if (a && a.clientId) (FORMS_BY_CLIENT[a.clientId] || []).forEach(push);
  /* v33.16: cliente de marketplace sem client_id acha a ficha pelo NOME (chave nm: da
     casa). Sem _direct, o filtro por tipo continua valendo nos leitores. */
  var nm0 = String((a && a.client) || '').trim().toLowerCase();
  if (nm0) (FORMS_BY_NAME[nm0] || []).forEach(push);
  return out;
}
function clientForms(a) {
  var kinds = runFormKinds(a);
  var list = formsFor(a).filter(function(f){
    if (f._direct) return true;                       /* e desta visita, mostra sempre */
    return kinds && kinds.indexOf(f.form_type) !== -1;
  });
  list.sort(function(x,y){ return String(y.filled_at||y.created_at||'').localeCompare(String(x.filled_at||x.created_at||'')); });
  return list;
}
/* v31.3: agora que um run pode abrir fichas de DOIS tipos (massagem + facial no mesmo dia),
   "a mais recente" nao serve mais: cada leitor tem que pedir a ficha DO SEU tipo, senao a
   massagem acaba lendo o formulario do facial e vem vazia. */
function latestFilledFormOf(a, kinds) {
  if (!a) return null;
  var l = formsFor(a).filter(function(f){
    if (f.status !== 'filled' && f.status !== 'reviewed') return false;
    if (!kinds) return true;
    if (kinds.indexOf(f.form_type) !== -1) return true;
    return !!f._direct && kinds === runFormKinds(a);   /* a ficha desta visita vale */
  });
  l.sort(function(x,y){ return String(y.filled_at||y.created_at||'').localeCompare(String(x.filled_at||x.created_at||'')); });
  return l.length ? l[0] : null;
}
function latestFilledForm(a) { return latestFilledFormOf(a, runFormKinds(a)); }
function humanKey(k) {
  return String(k).replace(/_/g,' ').replace(/\b\w/g, function(c){ return c.toUpperCase(); });
}
/* v27: shadowed isFlagAnswer() removed; the broader one (accutane, keloid, doctor_care...) is the live rule */
function formAnswersHtml(f) {
  var ans = f.answers || {}; var rows = '';
  if (ans.full_name) rows += '<div class="fa-row"><span class="fa-q">Signed</span><span class="fa-a">' + esc(ans.full_name) + (ans.signed_date ? ' · ' + esc(ans.signed_date) : '') + '</span></div>';
  Object.keys(ans).forEach(function(k){
    if (k === '_meta' || k === 'full_name' || k === 'signed_date') return;
    if (/_details$/.test(k)) return;
    var v = ans[k];
    if (Array.isArray(v)) v = v.join(', ');
    /* v32.119: "o full, todas, todas". Aqui entra ate o que ficou em branco, para ela ver
       que a pergunta existe e nao foi respondida. */
    if (Array.isArray(ans[k]) && !ans[k].length) v = '\u2014';
    if (v === '' || v == null) v = '\u2014';
    var det = ans[k + '_details'];
    if (det) v = v + ', ' + det;
    var flag = isFlagAnswer(k, ans[k]) || (det && isFlagAnswer(k, det));
    rows += '<div class="fa-row' + (flag ? ' fa-flag' : '') + '"><span class="fa-q">' + (flag ? '⚠ ' : '') + esc(humanKey(k)) + '</span><span class="fa-a">' + esc(String(v)) + '</span></div>';
  });
  return rows || '<div class="fa-row"><span class="fa-a">No answers recorded.</span></div>';
}
/* the block inside the client modal: her forms at a glance, tap to open the answers */
function consultFormsBlock(a) {

    } else {

        '<div class="fa-list">' + formAnswersHtml(f) + '</div></details>';
