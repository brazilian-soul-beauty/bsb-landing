<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json">
<title>Soul Path</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@1,600&display=swap">
<style>
:root{--bg:#F4F3F8;--card:#fff;--ink:#1F1D2B;--muted:#6B6880;--faint:#A3A1B5;--line:#E6E4EF;--p:#6D4AFF;--p2:#9B7BFF;--ps:#EEE9FF;--ok:#1F9D6B;--oks:#E3F6EE;--no:#D0485C;--nos:#FDECEF;--wa:#C98A0B;--was:#FFF4DC}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font:400 15px/1.4 Inter,system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
#app{height:100vh;display:flex;flex-direction:column;padding:18px 22px 16px;gap:14px}
/* top */
.top{display:flex;align-items:center;gap:14px}
.me{display:flex;align-items:center;gap:12px;min-width:0}
.av{width:46px;height:46px;border-radius:50%;background:var(--ps);color:var(--p);display:grid;place-items:center;font-weight:700;font-size:18px;overflow:hidden;flex:none;box-shadow:0 0 0 3px #fff,0 0 0 5px var(--ps)}
.av{position:relative}.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.me b{font-size:19px;font-weight:700;display:block}
.me span{font-size:12.5px;color:var(--muted)}
.sp{flex:1}
.seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{padding:7px 14px;border-radius:9px;font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button.on{background:var(--p);color:#fff}
.nav{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:3px 4px}
.nav button{width:34px;height:32px;border-radius:9px;font-size:18px;color:var(--muted)}
.nav button:disabled{opacity:.25}
.nav b{min-width:150px;text-align:center;font-weight:600;font-size:13.5px}
/* tabs */
.tabs{display:flex;gap:8px}
.tab{padding:9px 16px;border-radius:12px;background:#fff;border:1px solid var(--line);font-weight:600;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:7px}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tab i{font-style:normal;font-size:11px;background:var(--ps);color:var(--p);padding:2px 7px;border-radius:99px}
/* main */
main{flex:1;min-height:0;display:grid;grid-template-columns:330px 1fr;gap:14px}
.hero{border-radius:22px;padding:22px;color:#fff;background:radial-gradient(120% 90% at 0% 0%,#8F6BFF 0%,#6D4AFF 45%,#4A2FD0 100%);display:flex;flex-direction:column;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;bottom:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero small{font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.75;font-weight:600}
.hero h2{font:italic 600 34px/1.05 "Cormorant Garamond",serif;margin:6px 0 2px}
.hero p{margin:0;opacity:.85;font-size:13.5px}
.ring{position:relative;width:190px;height:190px;margin:auto}
.ring svg{transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .c b{font-size:56px;font-weight:800;line-height:1;letter-spacing:-2px}
.ring .c span{display:block;font-size:13px;opacity:.85;margin-top:4px}
.verdict{background:rgba(255,255,255,.14);border-radius:14px;padding:12px 14px;font-size:13.5px;font-weight:500;display:flex;gap:10px;align-items:center;z-index:1}
.verdict em{font-style:normal;font-size:22px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);gap:14px;min-height:0}
.tile{background:var(--card);border-radius:20px;padding:16px 16px 14px;display:flex;flex-direction:column;text-align:left;border:1px solid var(--line);position:relative;overflow:hidden;opacity:0;transform:translateY(10px);animation:in .5s cubic-bezier(.2,.8,.2,1) forwards}
.tile:active{transform:scale(.98)}
@keyframes in{to{opacity:1;transform:none}}
.tile .h{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.tile .h em{font-style:normal;font-size:20px}
.chip{margin-left:auto;white-space:nowrap;flex:none;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px}
.chip.ok{background:var(--oks);color:var(--ok)}.chip.no{background:var(--nos);color:var(--no)}.chip.na{background:#F1F0F6;color:var(--faint)}
.tile .big{font-size:40px;font-weight:800;letter-spacing:-1.5px;margin:auto 0 2px;line-height:1}
.tile .big small{font-size:16px;font-weight:600;color:var(--faint);letter-spacing:0}
.tile .sub{font-size:12.5px;color:var(--muted);min-height:34px}
.tile.ok{border-color:#CDEBDD}.tile.no{border-color:#F4CCD3}
.tile .bar{height:6px;border-radius:4px;background:#EEEDF4;overflow:hidden;margin-top:8px}
.tile .bar b{display:block;height:100%;width:0;border-radius:4px;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.tile.ok .bar b{background:var(--ok)}.tile.no .bar b{background:var(--no)}.tile.na .bar b{background:var(--faint)}
.tri{display:flex;gap:6px;margin:auto 0 4px}
.tri div{flex:1;background:#F7F6FB;border-radius:10px;padding:7px 4px;text-align:center}
.tri b{display:block;font-size:20px;font-weight:800}
.tri span{font-size:11px;color:var(--muted)}
.soon{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#fff;border-radius:22px;border:1px dashed var(--line);grid-column:1/-1;color:var(--muted);text-align:center}
.soon em{font-style:normal;font-size:44px}
/* sheet */
.sheet{position:fixed;inset:0;background:rgba(31,29,43,.35);display:none;align-items:center;justify-content:center;z-index:9}
.sheet.on{display:flex}
.panel{background:#fff;border-radius:24px;padding:22px;width:min(760px,92vw);max-height:86vh;display:flex;flex-direction:column;gap:14px;animation:pop .25s ease}
@keyframes pop{from{transform:scale(.96);opacity:0}}
.panel .ph{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px}
.panel .ph em{font-style:normal;font-size:24px}
.panel .ph button{margin-left:auto;width:36px;height:36px;border-radius:50%;background:#F1F0F6;font-size:18px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.cal .dw{font-size:11px;color:var(--faint);text-align:center;font-weight:600}
.dc{border-radius:12px;padding:7px 6px;min-height:56px;background:#F7F6FB;font-size:11.5px;color:var(--faint)}
.dc b{display:block;font-size:13px;color:var(--ink)}
.dc.ok{background:var(--oks);color:var(--ok)}.dc.no{background:var(--nos);color:var(--no)}
.dc.off{background:transparent;border:1px dashed var(--line)}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;gap:10px;align-items:center;background:#F7F6FB;border-radius:12px;padding:10px 12px;font-size:13.5px}
.li b{min-width:86px}
.rule{font-size:12.5px;color:var(--muted);background:var(--ps);border-radius:12px;padding:10px 12px}
/* login */
.login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:20}
.lk{background:#fff;border-radius:26px;padding:28px 30px;width:340px;text-align:center;box-shadow:0 20px 60px rgba(60,40,140,.12)}
.lk h1{font:italic 600 34px "Cormorant Garamond",serif;margin:0;color:var(--p)}
.lk p{color:var(--muted);margin:4px 0 16px;font-size:13.5px}
.dots{display:flex;gap:10px;justify-content:center;margin-bottom:16px}
.dots i{width:13px;height:13px;border-radius:50%;background:var(--line)}
.dots i.f{background:var(--p)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.keys button{height:58px;border-radius:16px;background:#F7F6FB;font-size:22px;font-weight:600}
.keys button:active{background:var(--ps)}
.err{color:var(--no);font-size:13px;min-height:18px;margin-top:10px}
.load{opacity:.45;transition:opacity .2s}
.faces{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:8px}
.face{display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:600;font-size:14px}
.face .av{width:78px;height:78px;font-size:28px}
.face:active .av{transform:scale(.95)}
.lk.wide{width:460px}
.back{font-size:13px;color:var(--muted);margin-top:12px}
.team{display:flex;gap:6px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:4px 6px}
.team button .av{width:34px;height:34px;font-size:13px;box-shadow:none;opacity:.55}
.team button.on .av{opacity:1;box-shadow:0 0 0 2px var(--p)}
@media (max-width:900px){main{grid-template-columns:1fr}.hero{display:none}.grid{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(4,1fr)}.nav b{min-width:110px}}
</style>
</head>
<body>
<div class="login" id="login"></div>
<div id="app" style="display:none">
  <div class="top">
    <div class="me"><div class="av" id="av"></div><div><b id="nm"></b><span id="lv">Soul · Level 1</span></div></div>
    <div class="sp"></div><div class="team" id="team" style="display:none"></div>
    <div class="seg" id="seg"><button data-m="day">Day</button><button data-m="week">Week</button><button data-m="month" class="on">Month</button></div>
    <div class="nav"><button id="prev">‹</button><b id="per"></b><button id="next">›</button></div>
  </div>
  <div class="tabs" id="tabs">
    <button class="tab on" data-t="std">✅ BSB Standard</button>
    <button class="tab" data-t="xm">⭐ Extra mile <i>next</i></button>
    <button class="tab" data-t="path">✨ Soul Path <i>next</i></button>
  </div>
  <main id="main"></main>
</div>
<div class="sheet" id="sheet"><div class="panel" id="panel"></div></div>
<script>
var B='https://qwumncqcyurojhuyazuj.supabase.co/rest/v1/',K='sb_publishable_7Oa5ZKlo09avfl-ZwZ876w_dgVwlO4R';
function rpc(f,b){return fetch(B+'rpc/'+f,{method:'POST',headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'},body:JSON.stringify(b||{})}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})}
var AV={Michelle:'avatars/michelle.webp',Dania:'avatars/dania.webp',Anukis:'avatars/anukis.webp',Sana:'avatars/sana.webp',Riya:'avatars/riya.webp',Joana:'avatars/joana.webp',Aluana:'avatars/aluana.webp',Ligia:'avatars/ligia.webp'};
var S={who:null,code:null,mode:'month',anchor:null,tab:'std',data:null},PIN='';
var MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],DW=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
function today(){var d=new Date(new Date().toLocaleString('en-US',{timeZone:'Europe/London'}));d.setHours(0,0,0,0);return d}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function pd(s){var a=s.split('-');return new Date(+a[0],a[1]-1,+a[2])}
function fd(s){var d=pd(s);return d.getDate()+' '+MN[d.getMonth()]}
function range(){var a=new Date(S.anchor),f,t;
  if(S.mode==='day'){f=new Date(a);t=new Date(a)}
  else if(S.mode==='week'){var w=(a.getDay()+6)%7;f=new Date(a);f.setDate(a.getDate()-w);t=new Date(f);t.setDate(f.getDate()+6)}
  else{f=new Date(a.getFullYear(),a.getMonth(),1);t=new Date(a.getFullYear(),a.getMonth()+1,0)}
  return [f,t]}
function label(){var r=range();if(S.mode==='day')return DW[(r[0].getDay()+6)%7]+' '+r[0].getDate()+' '+MN[r[0].getMonth()];
  if(S.mode==='week')return r[0].getDate()+' '+MN[r[0].getMonth()]+' to '+r[1].getDate()+' '+MN[r[1].getMonth()];
  return ['January','February','March','April','May','June','July','August','September','October','November','December'][r[0].getMonth()]+' '+r[0].getFullYear()}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

/* ---------- login: tap your face, then your Connecteam code ---------- */
var PEOPLE=[],PICK=null;
function avHtml(n){return '<div class="av">'+(AV[n]?'<img src="'+AV[n]+'" onerror="this.remove()">':'')+'<span>'+n[0]+'</span></div>'}
function loadPeople(){fetch(B+'bsb_sp_people_pub?select=person,role,level&active=eq.true&order=sort',{headers:{apikey:K,Authorization:'Bearer '+K}}).then(function(r){return r.json()}).then(function(r){PEOPLE=r||[];renderLogin()}).catch(function(){renderLogin('No internet')})}
function renderLogin(msg){var L=document.getElementById('login');
  if(!PICK){var list=PEOPLE.filter(function(p){return p.role==='therapist'||p.role==='admin'});
    L.innerHTML='<div class="lk wide"><h1>Soul Path</h1><p>Tap your face</p><div class="faces">'+list.map(function(p){return '<button class="face" onclick="pick(\''+p.person+'\')">'+avHtml(p.person)+p.person+'</button>'}).join('')+'</div><div class="err">'+(msg||'')+'</div></div>';return}
  L.innerHTML='<div class="lk"><div class="face" style="margin-bottom:6px">'+avHtml(PICK)+PICK+'</div><p>Your Connecteam code</p><div class="dots">'+[0,1,2,3].map(function(i){return '<i class="'+(i<PIN.length?'f':'')+'"></i>'}).join('')+'</div><div class="keys">'+
  [1,2,3,4,5,6,7,8,9,'✓',0,'⌫'].map(function(k){return '<button onclick="key(\''+k+'\')">'+k+'</button>'}).join('')+'</div><div class="err">'+(msg||'')+'</div><button class="back" onclick="pick(null)">‹ Not me</button></div>'}
function pick(n){PICK=n;PIN='';renderLogin()}
function key(k){if(k==='⌫'){PIN=PIN.slice(0,-1);return renderLogin()}
  if(k!=='✓'){if(PIN.length>=6)return;PIN+=k;renderLogin()}
  var force=k==='✓'||PIN.length===6;
  if(PIN.length===4||force){var tried=PIN;rpc('bsb_sp_login',{p_code:PIN}).then(function(r){
    var ok=r.length&&(r[0].person===PICK||r[0].role==='admin');
    if(!ok){if(!force&&!r.length&&tried===PIN&&PIN.length<6)return;PIN='';return renderLogin('Wrong code')}
    S.admin=r[0].role==='admin';S.code=tried;PIN='';
    S.who=S.admin?(PICK===r[0].person?firstGirl():PICK):PICK;start()}).catch(function(){PIN='';renderLogin('No internet')})}}
function firstGirl(){var g=PEOPLE.filter(function(p){return p.role==='therapist'})[0];return g?g.person:'Dania'}
function lvl(n){var p=PEOPLE.filter(function(x){return x.person===n})[0],L=['Soul','Soul+','Senior Soul','Soul Educator','Soul Lead'],v=(p&&p.level)||1;return L[v-1]+' · Level '+v}
function setWho(n){S.who=n;document.getElementById('nm').textContent=n;document.getElementById('lv').textContent=lvl(n);
  var av=document.getElementById('av');av.innerHTML=avHtml(n).replace(/^<div class="av">|<\/div>$/g,'');
  if(S.admin)document.getElementById('team').innerHTML=PEOPLE.filter(function(p){return p.role==='therapist'}).map(function(p){return '<button class="'+(p.person===n?'on':'')+'" onclick="setWho(\''+p.person+'\');load()" title="'+p.person+'">'+avHtml(p.person)+'</button>'}).join('')}
function start(){document.getElementById('login').style.display='none';document.getElementById('app').style.display='flex';
  if(S.admin)document.getElementById('team').style.display='flex';
  setWho(S.who);S.anchor=today();load()}

/* ---------- data ---------- */
function load(){document.getElementById('per').textContent=label();
  document.getElementById('next').disabled=range()[1]>=today();
  var r=range();document.getElementById('main').classList.add('load');
  rpc('soul_standard',{p_code:S.code,p_person:S.who,p_from:ymd(r[0]),p_to:ymd(r[1])}).then(function(d){S.data=d;render()}).catch(function(){S.data=null;render()})}

/* ---------- the 7 standards ---------- */
function calc(d){
  var days=(d&&d.days)||[],W=days.filter(function(x){return x.worked}),L=d?d.lunch_max:30;
  var late=W.filter(function(x){return (x.late_min||0)>0});
  var lunch=W.filter(function(x){return x.lunch_min!=null&&x.lunch_min>L});
  var abs=days.filter(function(x){return x.absent&&!x.on_leave});
  var lookBad=W.filter(function(x){return !x.look_marked||x.look_ok===false});
  var tm=W.filter(function(x){return x.t_morning>0}).length,td=W.filter(function(x){return x.t_day>0}).length,tc=W.filter(function(x){return x.t_close>0}).length;
  var taskBad=W.filter(function(x){return !(x.t_morning>0&&x.t_day>0&&x.t_close>0)});
  var comp=(d&&d.complaints)||[],rv=(d&&d.reviews)||{n:0,n5:0},std=+(d&&d.five_star_std)||97,p5=rv.n?Math.round(100*rv.n5/rv.n):null;
  var n=W.length;
  return [
   {k:'time',ic:'⏰',t:'On time',ok:n?late.length===0:null,big:n?(n-late.length):'–',of:n?'/'+n:'',sub:late.length?late.length+(late.length>1?' days':' day')+' late':(n?'Every day on time':'No work days'),pct:n?(n-late.length)/n:0,bad:late,fmt:function(x){return x.late_min+' min late'}},
   {k:'lunch',ic:'🍽️',t:'Lunch '+L+' min',ok:n?lunch.length===0:null,big:n?(n-lunch.length):'–',of:n?'/'+n:'',sub:lunch.length?lunch.length+(lunch.length>1?' days':' day')+' over '+L+' min':(n?'Always within '+L+' min':'No work days'),pct:n?(n-lunch.length)/n:0,bad:lunch,fmt:function(x){return x.lunch_min+' min · '+(x.lunch_min-L)+' over'}},
   {k:'abs',ic:'📅',t:'Absences',ok:abs.length===0,big:abs.length,of:'',sub:abs.length?'Not registered as leave':'Never missed a day',pct:abs.length?0:1,bad:abs,fmt:function(){return 'Absent'}},
   {k:'look',ic:'💄',t:'Look',ok:n?lookBad.length===0:null,big:n?(n-lookBad.length):'–',of:n?'/'+n:'',sub:lookBad.length?lookBad.length+(lookBad.length>1?' days':' day')+' not confirmed':(n?'Perfect every day':'No work days'),pct:n?(n-lookBad.length)/n:0,bad:lookBad,fmt:function(x){return x.look_ok===false?'Not to standard'+(x.look_note?': '+x.look_note:''):'Not confirmed'}},
   {k:'tasks',ic:'☑️',t:'Tasks',ok:n?taskBad.length===0:null,tri:[tm,td,tc],n:n,sub:taskBad.length?taskBad.length+(taskBad.length>1?' days':' day')+' with a gap':(n?'Every part, every day':'No work days'),pct:n?(n-taskBad.length)/n:0,bad:taskBad,fmt:function(x){return [x.t_morning?'':'Morning',x.t_day?'':'Day',x.t_close?'':'Close'].filter(Boolean).join(' · ')+' missing'}},
   {k:'comp',ic:'🙅',t:'Complaints',ok:comp.length===0,big:comp.length,of:'',sub:comp.length?'Open the details':'Zero complaints',pct:comp.length?0:1,list:comp},
   {k:'stars',ic:'⭐',t:'5 stars',ok:p5==null?null:p5>=std,big:p5==null?'–':p5,of:p5==null?'':'%',sub:p5==null?'No reviews yet':'BSB standard '+std+'%',pct:p5==null?0:p5/100,rv:rv,std:std}
  ]}
function render(){
  document.getElementById('main').classList.remove('load');
  var M=document.getElementById('main');
  if(S.tab!=='std'){M.innerHTML='<div class="soon"><em>'+(S.tab==='xm'?'⭐':'✨')+'</em><b style="font-size:20px;color:var(--ink)">'+(S.tab==='xm'?'Extra mile':'Soul Path')+'</b>Coming next</div>';return}
  var C=calc(S.data),scored=C.filter(function(c){return c.ok!==null}),met=scored.filter(function(c){return c.ok}).length,tot=scored.length;
  var all=tot&&met===tot,R=82,CF=2*Math.PI*R;
  var h='<div class="hero"><small>This is your job</small><h2>BSB Standard</h2><p>'+label()+'</p>'+
   '<div class="ring"><svg width="190" height="190"><circle cx="95" cy="95" r="'+R+'" stroke="rgba(255,255,255,.18)" stroke-width="14" fill="none"/>'+
   '<circle id="arc" cx="95" cy="95" r="'+R+'" stroke="#fff" stroke-width="14" fill="none" stroke-linecap="round" stroke-dasharray="'+CF+'" stroke-dashoffset="'+CF+'" style="transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)"/></svg>'+
   '<div class="c"><div><b id="cnt">0</b><span>of '+tot+' standards</span></div></div></div>'+
   '<div class="verdict"><em>'+(all?'💜':'🎯')+'</em><span>'+(all?'Standard met. This is the BSB level.':(tot-met)+' to fix. Tap a card to see the days.')+'</span></div></div><div class="grid">';
  C.forEach(function(c,i){var st=c.ok===null?'na':(c.ok?'ok':'no');
    h+='<button class="tile '+st+'" style="animation-delay:'+(i*60)+'ms" onclick="openT(\''+c.k+'\')"><div class="h"><em>'+c.ic+'</em>'+c.t+'<span class="chip '+st+'">'+(c.ok===null?'–':c.ok?'✓ Met':'Fix')+'</span></div>';
    if(c.tri)h+='<div class="tri">'+['Morning','Day','Close'].map(function(l,j){return '<div><b>'+c.tri[j]+'<small style="font-size:12px;color:var(--faint)">/'+c.n+'</small></b><span>'+l+'</span></div>'}).join('')+'</div>';
    else h+='<div class="big" data-v="'+c.big+'">'+c.big+'<small>'+c.of+'</small></div>';
    h+='<div class="sub">'+esc(c.sub)+'</div><div class="bar"><b data-w="'+Math.round(c.pct*100)+'"></b></div></button>'});
  h+='<div class="tile" style="animation-delay:420ms;background:var(--ps);border-color:transparent"><div class="h"><em>💜</em>The rule</div><div class="sub" style="margin-top:auto;font-size:13.5px;color:var(--ink);min-height:0"><b>The Standard is your job.</b><br>The Extra mile is your growth.</div></div></div>';
  M.innerHTML=h;S.C=C;
  requestAnimationFrame(function(){setTimeout(function(){
    var a=document.getElementById('arc');if(a)a.style.strokeDashoffset=CF*(1-(tot?met/tot:0));
    document.querySelectorAll('.bar b').forEach(function(b){b.style.width=b.getAttribute('data-w')+'%'});
    var el=document.getElementById('cnt'),i=0,st=setInterval(function(){if(i>=met){clearInterval(st);el.textContent=met;return}el.textContent=++i},120);
  },60)})}

/* ---------- detail sheet ---------- */
function openT(k){var c=S.C.filter(function(x){return x.k===k})[0],h='<div class="ph"><em>'+c.ic+'</em>'+c.t+'<button onclick="closeT()">✕</button></div>';
  if(k==='comp'){h+=c.list.length?'<div class="list">'+c.list.map(function(x){return '<div class="li"><b>'+fd(x.incident_date)+'</b>'+esc(x.what||'Complaint')+'<span style="margin-left:auto;color:var(--muted)">'+esc(x.status||'')+'</span></div>'}).join('')+'</div>':'<div class="rule">💜 Zero complaints. Keep it this way.</div>'}
  else if(k==='stars'){h+='<div class="list"><div class="li"><b>Your reviews</b>'+c.rv.n+'</div><div class="li"><b>5 stars</b>'+c.rv.n5+'</div><div class="li"><b>BSB standard</b>'+c.std+'% of reviews with 5 stars</div></div><div class="rule">🏆 BSB is Top Rated on Treatwell. Your level is the level that won the award.</div>'}
  else{var r=range(),days=(S.data&&S.data.days)||[],bad={};c.bad.forEach(function(x){bad[x.d]=x});
    var f=r[0],pad=(f.getDay()+6)%7;h+='<div class="cal">'+DW.map(function(w){return '<div class="dw">'+w+'</div>'}).join('');
    for(var i=0;i<pad;i++)h+='<div></div>';
    days.forEach(function(x){var b=bad[x.d],w=x.worked||(k==='abs'&&x.absent);
      h+='<div class="dc '+(b?'no':(w?'ok':'off'))+'"><b>'+pd(x.d).getDate()+'</b>'+(b?esc(c.fmt(x)):(w?'✓':''))+'</div>'});
    h+='</div>';
    var rules={time:'⏰ Arrive by your start time, every day.',lunch:'🍽️ Lunch is '+(S.data?S.data.lunch_max:30)+' minutes. Every minute over comes out of client time.',abs:'📅 Leave only counts when it is registered in Connecteam.',look:'💄 Tap the lipstick when you arrive. Joana checks it.',tasks:'☑️ Morning, Day and Close tasks, every day you work.'};
    h+='<div class="rule">'+rules[k]+'</div>'}
  document.getElementById('panel').innerHTML=h;document.getElementById('sheet').classList.add('on')}
function closeT(){document.getElementById('sheet').classList.remove('on')}
document.getElementById('sheet').onclick=function(e){if(e.target.id==='sheet')closeT()};

/* ---------- controls ---------- */
document.getElementById('seg').onclick=function(e){var m=e.target.getAttribute('data-m');if(!m)return;S.mode=m;
  [].forEach.call(this.children,function(b){b.classList.toggle('on',b.getAttribute('data-m')===m)});load()};
function step(n){var a=new Date(S.anchor);if(S.mode==='day')a.setDate(a.getDate()+n);else if(S.mode==='week')a.setDate(a.getDate()+7*n);else a.setMonth(a.getMonth()+n,1);
  if(a>today())a=today();S.anchor=a;load()}
document.getElementById('prev').onclick=function(){step(-1)};document.getElementById('next').onclick=function(){step(1)};
document.getElementById('tabs').onclick=function(e){var b=e.target.closest('.tab');if(!b)return;S.tab=b.getAttribute('data-t');
  [].forEach.call(this.children,function(x){x.classList.toggle('on',x===b)});render()};
loadPeople();
</script>
</body>
</html>
